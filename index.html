<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Macadam World — Avatar 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --pink:#FF6EB4;--mint:#3DDBB8;--yellow:#FFD747;
  --lav:#B388FF;--sky:#5BC8F5;--peach:#FF9E7A;
  --dark:#12082A;
}
html,body{min-height:100vh;font-family:'Nunito',sans-serif;background:var(--dark);overflow-x:hidden;}
.bg{position:fixed;inset:0;z-index:0;
background:
radial-gradient(ellipse at 15% 20%,#FF6EB440 0%,transparent 45%),
radial-gradient(ellipse at 85% 15%,#B388FF40 0%,transparent 45%),
radial-gradient(ellipse at 10% 80%,#3DDBB830 0%,transparent 45%),
radial-gradient(ellipse at 90% 80%,#FFD74730 0%,transparent 45%),
#12082A;}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
.star{position:absolute;border-radius:50%;background:white;animation:twinkle var(--d,3s) ease-in-out infinite var(--del,0s);}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(1);}50%{opacity:.8;transform:scale(1.5);}}
.app{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:24px 16px 40px;}
.logo-tag{display:inline-block;background:var(--yellow);color:var(--dark);font-size:.65rem;font-weight:900;letter-spacing:3px;text-transform:uppercase;padding:4px 12px;border-radius:20px;margin-bottom:10px;}
.logo-title{font-family:'Baloo 2',cursive;font-size:clamp(1.6rem,6vw,2.8rem);font-weight:800;line-height:1;color:white;letter-spacing:-1px;text-align:center;margin-bottom:6px;}
.logo-sub{font-size:.8rem;color:rgba(255,255,255,.35);font-weight:700;letter-spacing:1px;margin-bottom:28px;}
.avatar-card{
  width:100%;max-width:360px;
  background:rgba(255,255,255,.05);
  border:1.5px solid rgba(255,255,255,.1);
  border-radius:28px;padding:24px 20px;
  display:flex;flex-direction:column;align-items:center;gap:16px;
  box-shadow:0 24px 60px rgba(0,0,0,.4);
}
.viewer-wrap{
  width:100%;aspect-ratio:9/14;
  background:linear-gradient(160deg,#1a0838 0%,#0d1535 50%,#0a1f2e 100%);
  border-radius:24px;
  box-shadow:
    0 0 0 2px rgba(255,110,180,.6),
    0 0 24px rgba(255,110,180,.25),
    0 0 50px rgba(179,136,255,.15),
    inset 0 0 40px rgba(0,0,0,.5);
  overflow:hidden;
  position:relative;display:flex;align-items:center;justify-content:center;
}
.viewer-wrap::before{
  content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 15% 5%,rgba(255,110,180,.18) 0%,transparent 45%),
    radial-gradient(ellipse at 85% 95%,rgba(179,136,255,.18) 0%,transparent 45%),
    radial-gradient(ellipse at 80% 5%,rgba(61,219,184,.1) 0%,transparent 40%);
}
.viewer-wrap::after{
  content:'✦ MACADAM WORLD ✦';
  position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  font-family:'Baloo 2',cursive;font-size:.55rem;font-weight:800;
  letter-spacing:3px;color:rgba(255,255,255,.2);z-index:2;pointer-events:none;
  white-space:nowrap;
}
.viewer-placeholder{display:flex;flex-direction:column;align-items:center;gap:10px;color:rgba(255,255,255,.25);font-size:.85rem;font-weight:700;}
.viewer-placeholder .icon{font-size:3rem;opacity:.4;}
.pseudo-wrap{width:100%;}
.pseudo-label{font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,.3);display:block;margin-bottom:6px;}
.pseudo-input{
  width:100%;background:rgba(255,255,255,.07);
  border:1.5px solid rgba(255,255,255,.12);border-radius:14px;
  padding:11px 14px;font-family:'Nunito',sans-serif;font-size:16px;font-weight:700;
  color:white;outline:none;transition:all .2s;
}
.pseudo-input::placeholder{color:rgba(255,255,255,.2);}
.pseudo-input:focus{border-color:var(--pink);background:rgba(255,110,180,.08);}
.btn-create{
  width:100%;background:linear-gradient(135deg,var(--pink),var(--lav));
  border:none;border-radius:14px;padding:14px;
  font-family:'Baloo 2',cursive;font-size:1.05rem;font-weight:700;
  color:white;cursor:pointer;
  box-shadow:0 6px 20px rgba(255,110,180,.4);
  transition:transform .15s,box-shadow .15s;
}
.btn-create:active{transform:scale(.97);}
.btn-save{
  width:100%;background:rgba(61,219,184,.15);
  border:1.5px solid var(--mint);border-radius:14px;padding:12px;
  font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:800;
  color:var(--mint);cursor:pointer;transition:all .2s;display:none;
}
.btn-save.visible{display:block;}
.avatar-badge{
  display:none;align-items:center;gap:8px;
  background:rgba(61,219,184,.12);border:1px solid rgba(61,219,184,.3);
  border-radius:12px;padding:8px 14px;width:100%;
}
.avatar-badge.visible{display:flex;}
.avatar-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--mint);flex-shrink:0;animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(1.3);}}
.avatar-badge span{font-size:.78rem;font-weight:800;color:var(--mint);}

/* MODAL */
.modal-overlay{
position:fixed;inset:0;z-index:100;
background:rgba(0,0,0,.95);
display:flex;flex-direction:column;
opacity:0;pointer-events:none;transition:opacity .3s;
}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-header{
display:flex;align-items:center;justify-content:space-between;
padding:12px 16px;
background:rgba(255,255,255,.04);
border-bottom:1px solid rgba(255,255,255,.08);
flex-shrink:0;
}
.modal-title{font-size:.85rem;font-weight:800;color:rgba(255,255,255,.6);letter-spacing:1px;}
.btn-close{
background:rgba(255,255,255,.1);border:none;border-radius:10px;
width:36px;height:36px;cursor:pointer;font-size:1.1rem;color:white;
display:flex;align-items:center;justify-content:center;
}
#avaturn-sdk-container{flex:1;width:100%;overflow:hidden;}
#avaturn-sdk-container iframe{width:100%!important;height:100%!important;border:none!important;}

.toast{
position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
background:var(–mint);color:var(–dark);
padding:10px 22px;border-radius:14px;font-size:.88rem;font-weight:800;
box-shadow:0 8px 24px rgba(61,219,184,.4);
transition:transform .35s cubic-bezier(.22,1,.36,1);z-index:999;pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>

</head>

<!-- MODAL AVATURN -->

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-header">
    <span class="modal-title">✦ CRÉATEUR D'AVATAR</span>
    <button class="btn-close" onclick="closeAvaturn()">✕</button>

<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

<script type="module">
import { AvaturnSDK } from 'https://cdn.jsdelivr.net/npm/@avaturn/sdk/dist/index.js';

// ÉTOILES
const starsEl = document.getElementById('stars');
for(let i=0;i<60;i++){
  const s=document.createElement('div');s.className='star';
  const sz=Math.random()*2.5+.8;
  s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--del:-${Math.random()*5}s;`;
  starsEl.appendChild(s);
}

// UUID par appareil
function getUserId(){
  let uid=localStorage.getItem('macadam_user_id');
  if(!uid){uid=crypto.randomUUID();localStorage.setItem('macadam_user_id',uid);}
  return uid;
}
function storageKey(){return 'macadam_avatar_'+getUserId();}

let avatarGlbUrl=null;
let sdk=null;

// OUVRIR AVATURN
async function openAvaturn(){
  document.getElementById('modal-overlay').classList.add('open');
  const container=document.getElementById('avaturn-sdk-container');
  container.innerHTML='';
  try{
    sdk=new AvaturnSDK();
    await sdk.init(container,{url:'https://demo.avaturn.dev'});
    sdk.on('export',(data)=>{
      // Avaturn peut retourner l'URL sous différentes clés
      const glb=data?.url||data?.avatarUrl||data?.glbUrl||data?.modelUrl;
      if(glb){
        avatarGlbUrl=glb;
        closeAvaturn();
        showAvatar(glb);
        persistAvatar(glb,document.getElementById('pseudo').value.trim());
        showToast('🎉 Avatar créé et sauvegardé !');
        document.getElementById('btn-save').classList.add('visible');
      } else {
        // Log pour debug si l'URL n'est pas trouvée
        console.log('Export data:', JSON.stringify(data));
        showToast('❓ Export reçu — voir console');
      }
    });
  }catch(e){
    console.error(e);
    showToast('❌ Erreur — réessaie');
  }
}

// FERMER
function closeAvaturn(){
  document.getElementById('modal-overlay').classList.remove('open');
  try{if(sdk)sdk.destroy?.();}catch(e){}
  sdk=null;
  setTimeout(()=>{document.getElementById('avaturn-sdk-container').innerHTML='';},300);
}

// AFFICHER L'AVATAR
function showAvatar(glbUrl){
  const wrap=document.getElementById('viewer-wrap');
  const ph=document.getElementById('viewer-placeholder');
  if(ph)ph.remove();
  const old=wrap.querySelector('model-viewer');
  if(old)old.remove();
  const mv=document.createElement('model-viewer');
  mv.setAttribute('src',glbUrl);
  mv.setAttribute('camera-controls','');
  mv.setAttribute('auto-rotate','');
  mv.setAttribute('auto-rotate-delay','1000');
  mv.setAttribute('rotation-per-second','30deg');
  mv.setAttribute('camera-orbit','0deg 85deg 2m');
  mv.setAttribute('camera-target','0m 1m 0m');
  mv.setAttribute('field-of-view','25deg');
  mv.setAttribute('min-field-of-view','15deg');
  mv.setAttribute('max-field-of-view','40deg');
  mv.setAttribute('shadow-intensity','1.5');
  mv.setAttribute('shadow-softness','1');
  mv.setAttribute('environment-image','neutral');
  mv.setAttribute('exposure','1.1');
  mv.style.cssText='width:100%;height:100%;background:transparent;--progress-bar-color:var(--pink);position:relative;z-index:1;';
  wrap.appendChild(mv);
  document.getElementById('avatar-badge').classList.add('visible');
}

// SAUVEGARDER
function persistAvatar(glbUrl,pseudo){
  localStorage.setItem(storageKey(),JSON.stringify({glbUrl,pseudo,savedAt:Date.now()}));
  if(pseudo)document.getElementById('pseudo').value=pseudo;
}

window.saveAvatar=function(){
  const pseudo=document.getElementById('pseudo').value.trim();
  if(!pseudo){showToast('✏️ Entre ton pseudo !');return;}
  if(!avatarGlbUrl){showToast('👆 Crée d\'abord ton avatar !');return;}
  persistAvatar(avatarGlbUrl,pseudo);
  showToast('✨ Avatar sauvegardé !');
};

// TOAST
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

// CHARGER AVATAR SAUVEGARDÉ
function loadSaved(){
  try{
    const saved=JSON.parse(localStorage.getItem(storageKey())||'null');
    if(saved?.glbUrl){
      avatarGlbUrl=saved.glbUrl;
      if(saved.pseudo)document.getElementById('pseudo').value=saved.pseudo;
      showAvatar(saved.glbUrl);
      document.getElementById('btn-save').classList.add('visible');
    }
  }catch(e){}
}
loadSaved();

// Exposer globalement
window.openAvaturn=openAvaturn;
window.closeAvaturn=closeAvaturn;

// Clic overlay pour fermer
document.getElementById('modal-overlay').addEventListener('click',(e)=>{
  if(e.target===e.currentTarget)closeAvaturn();
});
</script>

</body>
