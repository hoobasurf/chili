<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Macadam World — Avatar 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --pink:#FF6EB4;--mint:#3DDBB8;--yellow:#FFD747;
  --lav:#B388FF;--sky:#5BC8F5;--peach:#FF9E7A;
  --dark:#12082A;
}
html,body{min-height:100vh;font-family:'Nunito',sans-serif;background:var(--dark);overflow-x:hidden;}

.bg{position:fixed;inset:0;z-index:0;
background:
radial-gradient(ellipse at 15% 20%,#FF6EB440 0%,transparent 45%),
radial-gradient(ellipse at 85% 15%,#B388FF40 0%,transparent 45%),
radial-gradient(ellipse at 10% 80%,#3DDBB830 0%,transparent 45%),
radial-gradient(ellipse at 90% 80%,#FFD74730 0%,transparent 45%),
#12082A;}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
.star{position:absolute;border-radius:50%;background:white;animation:twinkle var(–d,3s) ease-in-out infinite var(–del,0s);}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(1);}50%{opacity:.8;transform:scale(1.5);}}

.app{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:24px 16px 40px;}

.logo-tag{display:inline-block;background:var(–yellow);color:var(–dark);font-size:.65rem;font-weight:900;letter-spacing:3px;text-transform:uppercase;padding:4px 12px;border-radius:20px;margin-bottom:10px;}
.logo-title{font-family:‘Baloo 2’,cursive;font-size:clamp(1.6rem,6vw,2.8rem);font-weight:800;line-height:1;color:white;letter-spacing:-1px;text-align:center;margin-bottom:6px;}
.logo-sub{font-size:.8rem;color:rgba(255,255,255,.35);font-weight:700;letter-spacing:1px;margin-bottom:28px;}

.avatar-card{
width:100%;max-width:360px;
background:rgba(255,255,255,.05);
border:1.5px solid rgba(255,255,255,.1);
border-radius:28px;
padding:24px 20px;
display:flex;flex-direction:column;align-items:center;gap:16px;
box-shadow:0 24px 60px rgba(0,0,0,.4);
}

.viewer-wrap{
width:100%;aspect-ratio:3/4;max-height:340px;
background:rgba(255,255,255,.04);
border-radius:20px;
border:1.5px solid rgba(255,255,255,.08);
overflow:hidden;position:relative;
display:flex;align-items:center;justify-content:center;
}
.viewer-placeholder{
display:flex;flex-direction:column;align-items:center;gap:10px;
color:rgba(255,255,255,.25);font-size:.85rem;font-weight:700;
}
.viewer-placeholder .icon{font-size:3rem;opacity:.4;}

.pseudo-wrap{width:100%;}
.pseudo-label{font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,.3);display:block;margin-bottom:6px;}
.pseudo-input{
width:100%;background:rgba(255,255,255,.07);
border:1.5px solid rgba(255,255,255,.12);border-radius:14px;
padding:11px 14px;font-family:‘Nunito’,sans-serif;font-size:16px;font-weight:700;
color:white;outline:none;transition:all .2s;
}
.pseudo-input::placeholder{color:rgba(255,255,255,.2);}
.pseudo-input:focus{border-color:var(–pink);background:rgba(255,110,180,.08);}

.btn-create{
width:100%;background:linear-gradient(135deg,var(–pink),var(–lav));
border:none;border-radius:14px;padding:14px;
font-family:‘Baloo 2’,cursive;font-size:1.05rem;font-weight:700;
color:white;cursor:pointer;
box-shadow:0 6px 20px rgba(255,110,180,.4);
transition:transform .15s,box-shadow .15s;
}
.btn-create:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(255,110,180,.55);}
.btn-create:active{transform:scale(.97);}

.btn-save{
width:100%;background:rgba(61,219,184,.15);
border:1.5px solid var(–mint);border-radius:14px;padding:12px;
font-family:‘Nunito’,sans-serif;font-size:.95rem;font-weight:800;
color:var(–mint);cursor:pointer;transition:all .2s;
display:none;
}
.btn-save:hover{background:rgba(61,219,184,.25);}
.btn-save.visible{display:block;}

.avatar-badge{
display:none;align-items:center;gap:8px;
background:rgba(61,219,184,.12);border:1px solid rgba(61,219,184,.3);
border-radius:12px;padding:8px 14px;width:100%;
}
.avatar-badge.visible{display:flex;}
.avatar-badge .dot{width:8px;height:8px;border-radius:50%;background:var(–mint);flex-shrink:0;animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(1.3);}}
.avatar-badge span{font-size:.78rem;font-weight:800;color:var(–mint);}

.modal-overlay{
position:fixed;inset:0;z-index:100;
background:rgba(0,0,0,.85);
display:flex;align-items:center;justify-content:center;
padding:0;
opacity:0;pointer-events:none;
transition:opacity .3s;
}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-box{
width:100%;height:100%;
max-width:480px;max-height:100vh;
background:#1a1a2e;
border-radius:0;
display:flex;flex-direction:column;
overflow:hidden;position:relative;
}
@media(min-width:520px){
.modal-box{height:92vh;border-radius:24px;max-height:700px;}
}
.modal-header{
display:flex;align-items:center;justify-content:space-between;
padding:12px 16px;
background:rgba(255,255,255,.04);
border-bottom:1px solid rgba(255,255,255,.08);
flex-shrink:0;
}
.modal-title{font-size:.85rem;font-weight:800;color:rgba(255,255,255,.6);letter-spacing:1px;}
.btn-close{
background:rgba(255,255,255,.1);border:none;border-radius:10px;
width:32px;height:32px;cursor:pointer;font-size:1rem;color:white;
display:flex;align-items:center;justify-content:center;
transition:background .2s;
}
.btn-close:hover{background:rgba(255,255,255,.2);}
.modal-iframe{flex:1;border:none;width:100%;height:100%;}

.modal-loading{
position:absolute;inset:0;
display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:12px;background:#1a1a2e;z-index:2;
font-size:.8rem;color:rgba(255,255,255,.4);font-weight:700;
}
.spinner{width:36px;height:36px;border:3px solid rgba(255,110,180,.2);border-top-color:var(–pink);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.toast{
position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
background:var(–mint);color:var(–dark);
padding:10px 22px;border-radius:14px;font-size:.88rem;font-weight:800;
box-shadow:0 8px 24px rgba(61,219,184,.4);
transition:transform .35s cubic-bezier(.22,1,.36,1);z-index:999;pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>

</head>

  </div>

<!-- MODAL READY PLAYER ME -->

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">READY PLAYER ME</span>
      <button class="btn-close" onclick="closeRPM()">✕</button>
    </div>
    <div class="modal-loading" id="modal-loading">
      <div class="spinner"></div>
      <span>Chargement du créateur…</span>
    </div>
    <iframe
      id="rpm-iframe"
      class="modal-iframe"
      src=""
      allow="camera *; microphone *"
      style="display:none;"
    ></iframe>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

<script>
// ===== ÉTOILES =====
const starsEl = document.getElementById('stars');
for(let i=0;i<60;i++){
  const s=document.createElement('div');s.className='star';
  const sz=Math.random()*2.5+.8;
  s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--del:-${Math.random()*5}s;`;
  starsEl.appendChild(s);
}

// ===== CLÉ LOCALE UNIQUE PAR APPAREIL =====
// Chaque visiteur a un user_id généré une fois et gardé en localStorage
function getUserId() {
  let uid = localStorage.getItem('macadam_user_id');
  if (!uid) {
    uid = crypto.randomUUID();
    localStorage.setItem('macadam_user_id', uid);
  }
  return uid;
}

// Clé de stockage propre à cet utilisateur
function storageKey() {
  return 'macadam_avatar_' + getUserId();
}

// ===== RPM =====
const RPM_URL = 'https://demo.readyplayer.me/avatar?frameApi';
let avatarGlbUrl = null;

function openRPM() {
  const overlay = document.getElementById('modal-overlay');
  const iframe  = document.getElementById('rpm-iframe');
  const loading = document.getElementById('modal-loading');

  overlay.classList.add('open');
  loading.style.display = 'flex';
  iframe.style.display  = 'none';
  iframe.src = RPM_URL;

  // Safari/iOS : onload peu fiable sur iframe cross-origin
  // On cache le spinner après 3s max dans tous les cas
  function revealIframe() {
    loading.style.display = 'none';
    iframe.style.display  = 'block';
    iframe.contentWindow?.postMessage(
      JSON.stringify({ target:'readyplayerme', type:'subscribe', eventName:'v1.**' }),
      '*'
    );
  }

  iframe.onload = revealIframe;
  setTimeout(revealIframe, 3000); // fallback Safari
}

function closeRPM() {
  const overlay = document.getElementById('modal-overlay');
  const iframe  = document.getElementById('rpm-iframe');
  overlay.classList.remove('open');
  setTimeout(() => { iframe.src = ''; }, 300);
}

// Message RPM → avatar exporté
window.addEventListener('message', (event) => {
  if (typeof event.data !== 'string') return;
  let data;
  try { data = JSON.parse(event.data); } catch(e) { return; }

  if (data.source === 'readyplayerme') {
    if (data.eventName === 'v1.frame.ready') {
      const iframe = document.getElementById('rpm-iframe');
      iframe.contentWindow.postMessage(
        JSON.stringify({ target:'readyplayerme', type:'subscribe', eventName:'v1.**' }),
        '*'
      );
    }
    if (data.eventName === 'v1.avatar.exported') {
      const glbUrl = data.data?.url;
      if (glbUrl) {
        avatarGlbUrl = glbUrl;
        closeRPM();
        showAvatar(glbUrl);
        // Sauvegarde auto dès la création
        persistAvatar(glbUrl, document.getElementById('pseudo').value.trim());
        showToast('🎉 Avatar créé et sauvegardé !');
        document.getElementById('btn-save').classList.add('visible');
      }
    }
  }
});

function showAvatar(glbUrl) {
  const wrap        = document.getElementById('viewer-wrap');
  const placeholder = document.getElementById('viewer-placeholder');
  const badge       = document.getElementById('avatar-badge');

  if (placeholder) placeholder.remove();
  const old = wrap.querySelector('model-viewer');
  if (old) old.remove();

  const mv = document.createElement('model-viewer');
  mv.setAttribute('src', glbUrl);
  mv.setAttribute('camera-controls', '');
  mv.setAttribute('auto-rotate', '');
  mv.setAttribute('auto-rotate-delay', '1000');
  mv.setAttribute('rotation-per-second', '30deg');
  mv.setAttribute('camera-orbit', '0deg 80deg 2.5m');
  mv.setAttribute('min-camera-orbit', 'auto 0deg auto');
  mv.setAttribute('max-camera-orbit', 'auto 180deg auto');
  mv.setAttribute('shadow-intensity', '1');
  mv.setAttribute('environment-image', 'neutral');
  mv.setAttribute('exposure', '1');
  mv.style.cssText = 'width:100%;height:100%;background:transparent;--progress-bar-color:var(--pink);';
  wrap.appendChild(mv);

  badge.classList.add('visible');
}

function persistAvatar(glbUrl, pseudo) {
  localStorage.setItem(storageKey(), JSON.stringify({
    glbUrl,
    pseudo,
    savedAt: Date.now()
  }));
  // Met aussi à jour le pseudo affiché
  if (pseudo) document.getElementById('pseudo').value = pseudo;
}

function saveAvatar() {
  const pseudo = document.getElementById('pseudo').value.trim();
  if (!pseudo)        { showToast('✏️ Entre ton pseudo !');          return; }
  if (!avatarGlbUrl)  { showToast('👆 Crée d\'abord ton avatar !');  return; }
  persistAvatar(avatarGlbUrl, pseudo);
  showToast('✨ Avatar sauvegardé !');
}

// ===== TOAST =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ===== CHARGER L'AVATAR AU RETOUR =====
function loadSaved() {
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey()) || 'null');
    if (saved && saved.glbUrl) {
      avatarGlbUrl = saved.glbUrl;
      if (saved.pseudo) document.getElementById('pseudo').value = saved.pseudo;
      showAvatar(saved.glbUrl);
      document.getElementById('btn-save').classList.add('visible');
    }
  } catch(e) {}
}

loadSaved();

// Fermer modal en cliquant l'overlay
document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeRPM();
});
</script>
