<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Macadam World — Place Pastel</title>

<!-- A-Frame -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.5.0/aframe.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --pink:#FF6EB4;--mint:#3DDBB8;--yellow:#FFD747;
  --lav:#B388FF;--sky:#5BC8F5;--dark:#12082A;
}
html,body{
  width:100%;height:100%;overflow:hidden;
  font-family:'Nunito',sans-serif;
  background:#0e0620;
  user-select:none;-webkit-user-select:none;
}

/* ===== HUD ===== */
#hud{
  position:fixed;inset:0;z-index:10;
  pointer-events:none;
}

/* TOP BAR */
.hud-top{
  position:absolute;top:0;left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;
  background:linear-gradient(180deg,rgba(18,8,42,.8) 0%,transparent 100%);
}
.hud-logo{
  font-family:'Baloo 2',cursive;
  font-size:1.1rem;font-weight:800;color:white;
  letter-spacing:-0.5px;
  text-shadow:0 2px 8px rgba(0,0,0,.5);
}
.hud-logo span{color:var(--pink);}
.hud-location{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.1);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.15);
  border-radius:20px;padding:5px 12px;
  pointer-events:all;
}
.hud-location span{font-size:.75rem;font-weight:800;color:white;}
.loc-dot{width:7px;height:7px;border-radius:50%;background:var(--mint);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(61,219,184,.6);}50%{box-shadow:0 0 0 5px rgba(61,219,184,0);}}

.hud-avatar-info{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.12);
  border-radius:20px;padding:5px 12px 5px 6px;
}
.hud-avatar-pic{
  width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,var(--pink),var(--lav));
  display:flex;align-items:center;justify-content:center;
  font-size:.8rem;font-weight:900;color:white;
  border:2px solid rgba(255,255,255,.2);
  overflow:hidden;
}
.hud-avatar-pic img{width:100%;height:100%;object-fit:cover;}
.hud-pseudo{font-size:.75rem;font-weight:800;color:white;}

/* CHAT */
.hud-chat{
  position:absolute;bottom:100px;left:12px;right:12px;
  max-width:320px;
  pointer-events:all;
}
.chat-messages{
  max-height:120px;overflow-y:auto;
  display:flex;flex-direction:column;gap:4px;
  margin-bottom:6px;
  scrollbar-width:none;
}
.chat-messages::-webkit-scrollbar{display:none;}
.chat-msg{
  background:rgba(18,8,42,.7);
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.08);
  border-radius:10px;padding:5px 10px;
  font-size:.72rem;color:white;
  animation:fadeIn .3s ease;
  line-height:1.4;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.chat-msg .name{font-weight:900;color:var(--pink);margin-right:4px;}
.chat-input-wrap{
  display:flex;gap:6px;
}
.chat-input{
  flex:1;background:rgba(18,8,42,.8);
  backdrop-filter:blur(10px);
  border:1.5px solid rgba(255,255,255,.15);border-radius:12px;
  padding:8px 12px;font-size:.8rem;font-weight:700;color:white;outline:none;
  transition:border-color .2s;
}
.chat-input::placeholder{color:rgba(255,255,255,.25);}
.chat-input:focus{border-color:var(--pink);}
.chat-send{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--pink),var(--lav));
  border:none;color:white;cursor:pointer;font-size:1rem;
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s;
  pointer-events:all;
}
.chat-send:active{transform:scale(.92);}

/* JOYSTICK */
#joystick-zone{
  position:absolute;
  bottom:20px;right:20px;
  width:120px;height:120px;
  pointer-events:all;
}
.joystick-base{
  width:110px;height:110px;
  border-radius:50%;
  background:rgba(255,255,255,.06);
  border:2px solid rgba(255,255,255,.12);
  backdrop-filter:blur(8px);
  position:relative;
  display:flex;align-items:center;justify-content:center;
}
.joystick-knob{
  width:44px;height:44px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--pink),var(--lav));
  box-shadow:0 4px 16px rgba(255,110,180,.4);
  position:absolute;
  transform:translate(0,0);
  transition:box-shadow .1s;
  cursor:pointer;
}

/* BOUTON ACTION */
#btn-action{
  position:absolute;
  bottom:36px;right:150px;
  width:52px;height:52px;
  border-radius:50%;
  background:rgba(61,219,184,.15);
  border:2px solid var(--mint);
  color:var(--mint);font-size:1.2rem;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;pointer-events:all;
  transition:all .15s;
  backdrop-filter:blur(8px);
}
#btn-action:active{transform:scale(.9);background:rgba(61,219,184,.3);}

/* INDICATEUR DE CHARGEMENT */
#loading-screen{
  position:fixed;inset:0;z-index:100;
  background:#0e0620;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:16px;
  transition:opacity .5s;
}
#loading-screen.hidden{opacity:0;pointer-events:none;}
.loading-logo{
  font-family:'Baloo 2',cursive;
  font-size:2.5rem;font-weight:800;
  color:white;letter-spacing:-1px;
}
.loading-logo .c1{color:var(--pink);}.loading-logo .c2{color:var(--yellow);}
.loading-logo .c3{color:var(--mint);}.loading-logo .c4{color:var(--sky);}
.loading-bar-wrap{
  width:200px;height:4px;
  background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;
}
.loading-bar{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--pink),var(--lav));
  border-radius:2px;
  transition:width .3s;
}
.loading-txt{font-size:.78rem;color:rgba(255,255,255,.4);font-weight:700;}

/* TOAST */
.toast{
  position:fixed;bottom:160px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:rgba(18,8,42,.9);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(12px);
  color:white;padding:8px 18px;
  border-radius:20px;font-size:.78rem;font-weight:800;
  opacity:0;transition:all .3s;z-index:50;pointer-events:none;
  white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Bulle de dialogue au-dessus du perso */
.speech-bubble{
  position:fixed;z-index:20;
  background:white;color:#12082A;
  border-radius:12px;padding:6px 12px;
  font-size:.75rem;font-weight:800;
  pointer-events:none;
  box-shadow:0 4px 16px rgba(0,0,0,.3);
  max-width:160px;text-align:center;
  transform:translateX(-50%);
  opacity:0;transition:opacity .3s;
}
.speech-bubble::after{
  content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:white;
  border-bottom:none;
}

@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800;900&display=swap');
</style>

</head>

<div id="loading-screen">

<a-sky color="#c8e8ff"></a-sky>

<a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
<a-light type="directional" color="#fff8e8" intensity="1.2"

shadow-camera-left="-30" shadow-camera-right="30"
shadow-camera-top="30" shadow-camera-bottom="-30"
shadow-mapsize-width="2048" shadow-mapsize-height="2048">
</a-light>
<a-light type="hemisphere" color="#c8e8ff" ground-color="#a8e0a0" intensity="0.4"></a-light>

<a-plane id="ground"
position="0 0 0" rotation="-90 0 0"
width="60" height="60"
color="#F0E8D8"
shadow="receive:true"
material="roughness:0.9;metalness:0">
</a-plane>

  <a-entity id="tiles">

    <a-cylinder position="0 0.02 0" radius="4" height="0.01"
      color="#F8E8D8" material="roughness:1"></a-cylinder>

```
<!-- Lignes de la place -->
<a-plane position="0 0.02 0" rotation="-90 0 0" width="60" height="0.4"

<a-plane position="0 0.02 0" rotation="-90 90 0" width="60" height="0.4"
  color="#D8C8B8" material="roughness:1"></a-plane>
```

  </a-entity>

    <a-sphere position="0 5.2 0" radius="0.3" color="#FFE87A"

    <a-light type="point" position="0 5 0" color="#FFE8A0" intensity="0.8" distance="8"></a-light>

  <a-entity id="lamp4" position="-4 0 -4">

<a-entity position="15 12 -20"

<!-- HUD -->

<div id="hud">

  <div class="hud-top">
    <div class="hud-logo">✦ <span>Macadam</span> World</div>

      <div class="loc-dot"></div>
      <span>Place Pastel</span>
    </div>
    <div class="hud-avatar-info">
      <div class="hud-avatar-pic" id="hud-pic">?</div>
      <span class="hud-pseudo" id="hud-pseudo">Joueur</span>
    </div>
  </div>

  <!-- CHAT -->

  <div class="hud-chat">
    <div class="chat-messages" id="chat-messages"></div>

</div>

<!-- BULLE DIALOGUE -->

<div class="speech-bubble" id="speech-bubble"></div>

<!-- TOAST -->

<div class="toast" id="toast"></div>

<script>
// ========== PROFIL ==========
function loadProfile() {
  try {
    // Récupère le profil de la page index
    const uid = localStorage.getItem('macadam_user_id') || 'player_' + Math.random().toString(36).slice(2,7);
    localStorage.setItem('macadam_user_id', uid);
    const saved = JSON.parse(localStorage.getItem('macadam_avatar_' + uid) || 'null');
    return {
      pseudo: saved?.pseudo || localStorage.getItem('macadam_pseudo') || 'Joueur',
      glbUrl: saved?.glbUrl || null,
      uid
    };
  } catch(e) { return { pseudo: 'Joueur', glbUrl: null, uid: 'p1' }; }
}

const profile = loadProfile();

// Afficher pseudo dans HUD
document.getElementById('hud-pseudo').textContent = profile.pseudo;
const initials = profile.pseudo.slice(0,2).toUpperCase();
document.getElementById('hud-pic').textContent = initials;

// ========== CHARGER AVATAR GLB ==========
function loadAvatarGLB(url) {
  const avatarEl = document.getElementById('avatar-model');
  avatarEl.innerHTML = '';
  const glbEl = document.createElement('a-entity');
  glbEl.setAttribute('gltf-model', url);
  glbEl.setAttribute('scale', '1 1 1');
  glbEl.setAttribute('animation-mixer', 'clip:idle;loop:repeat;crossFadeDuration:0.3');
  avatarEl.appendChild(glbEl);
  showToast('✨ Avatar chargé !');
}

// ========== AVATAR FALLBACK (si pas de GLB) ==========
function loadFallbackAvatar() {
  const avatarEl = document.getElementById('avatar-model');
  avatarEl.innerHTML = '';

  // Perso cartoon simple en primitives A-Frame
  const body = `
    <a-entity>
      <!-- Corps -->
      <a-cylinder position="0 0.9 0" radius="0.22" height="0.7" color="#FF9EBB"
        material="roughness:0.8" shadow="cast:true"></a-cylinder>
      <!-- Tête -->
      <a-sphere position="0 1.65 0" radius="0.28" color="#FFDFC4"
        material="roughness:0.8" shadow="cast:true"></a-sphere>
      <!-- Yeux -->
      <a-sphere position="0.1 1.68 0.26" radius="0.05" color="#1A1A2E"></a-sphere>
      <a-sphere position="-0.1 1.68 0.26" radius="0.05" color="#1A1A2E"></a-sphere>
      <a-sphere position="0.11 1.695 0.275" radius="0.018" color="white"></a-sphere>
      <a-sphere position="-0.09 1.695 0.275" radius="0.018" color="white"></a-sphere>
      <!-- Joues -->
      <a-sphere position="0.22 1.63 0.2" radius="0.06" color="rgba(255,160,180,0.5)"
        material="opacity:0.5;transparent:true"></a-sphere>
      <a-sphere position="-0.22 1.63 0.2" radius="0.06" color="rgba(255,160,180,0.5)"
        material="opacity:0.5;transparent:true"></a-sphere>
      <!-- Bouche -->
      <a-torus position="0 1.58 0.27" radius="0.06" radius-tubular="0.01"
        rotation="0 0 0" arc="180" color="#CC4488"></a-torus>
      <!-- Cheveux -->
      <a-sphere position="0 1.88 0" radius="0.28" color="#3D1800"
        material="roughness:0.9"></a-sphere>
      <a-sphere position="0 1.72 -0.2" radius="0.22" color="#3D1800"
        material="roughness:0.9"></a-sphere>
      <!-- Jambes -->
      <a-cylinder position="0.1 0.35 0" radius="0.1" height="0.7" color="#D4C5F9"
        shadow="cast:true"></a-cylinder>
      <a-cylinder position="-0.1 0.35 0" radius="0.1" height="0.7" color="#D4C5F9"
        shadow="cast:true"></a-cylinder>
      <!-- Chaussures -->
      <a-sphere position="0.1 0.04 0.06" radius="0.12" color="#AA88FF"
        material="roughness:0.7" shadow="cast:true"></a-sphere>
      <a-sphere position="-0.1 0.04 0.06" radius="0.12" color="#AA88FF"
        material="roughness:0.7" shadow="cast:true"></a-sphere>
      <!-- Bras -->
      <a-cylinder position="0.32 0.95 0" radius="0.08" height="0.5"
        rotation="0 0 -20" color="#FF9EBB" shadow="cast:true"
        id="arm-right"></a-cylinder>
      <a-cylinder position="-0.32 0.95 0" radius="0.08" height="0.5"
        rotation="0 0 20" color="#FF9EBB" shadow="cast:true"
        id="arm-left"></a-cylinder>
      <!-- Mains -->
      <a-sphere position="0.42 0.74 0" radius="0.1" color="#FFDFC4"
        shadow="cast:true"></a-sphere>
      <a-sphere position="-0.42 0.74 0" radius="0.1" color="#FFDFC4"
        shadow="cast:true"></a-sphere>
    </a-entity>
  `;
  avatarEl.innerHTML = body;
}

// Initialiser avatar
if (profile.glbUrl) {
  loadAvatarGLB(profile.glbUrl);
} else {
  loadFallbackAvatar();
}

// ========== SCÈNE PRÊTE ==========
const scene = document.getElementById('scene');
let sceneReady = false;

function hideLoading() {
  const ls = document.getElementById('loading-screen');
  ls.classList.add('hidden');
  setTimeout(() => ls.style.display = 'none', 600);
}

// Progress bar loading
let progress = 0;
const bar = document.getElementById('loading-bar');
const txt = document.getElementById('loading-txt');
const messages = ['Chargement de Place Pastel…', 'Plantation des arbres…', 'Remplissage de la fontaine…', 'Presque prêt…'];
let msgIdx = 0;

const progressInterval = setInterval(() => {
  progress += Math.random() * 18;
  if (progress >= 100) { progress = 100; clearInterval(progressInterval); }
  bar.style.width = progress + '%';
  if (msgIdx < messages.length - 1 && progress > (msgIdx + 1) * 25) {
    msgIdx++;
    txt.textContent = messages[msgIdx];
  }
}, 200);

scene.addEventListener('loaded', () => {
  sceneReady = true;
  progress = 100;
  bar.style.width = '100%';
  txt.textContent = 'Bienvenue à Place Pastel !';
  setTimeout(hideLoading, 600);
  addChatMessage('🌸 Bienvenue à Place Pastel, ' + profile.pseudo + ' !', 'Macadam');
  addChatMessage('💬 Utilise le joystick pour te déplacer', 'Système');
});
setTimeout(hideLoading, 6000); // Fallback

// ========== MOUVEMENT ==========
const player = document.getElementById('player');
const cameraRig = document.getElementById('camera-rig');
const avatarModel = document.getElementById('avatar-model');

const SPEED = 0.055;
const BOUNDARY = 22;
let playerPos = { x: 0, y: 0, z: 6 };
let playerRotY = 0;
let cameraRotY = 0;
let isMoving = false;
let isAnimWalk = false;

// ========== JOYSTICK ==========
const joystickZone = document.getElementById('joystick-zone');
const joystickBase = document.getElementById('joystick-base');
const knob = document.getElementById('joystick-knob');
const JOY_RADIUS = 42;

let joystick = { active: false, x: 0, y: 0, startX: 0, startY: 0, id: null };

function getJoyCenter() {
  const r = joystickBase.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

joystickBase.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.changedTouches[0];
  joystick.active = true;
  joystick.id = t.identifier;
  updateJoystick(t.clientX, t.clientY);
}, { passive: false });

document.addEventListener('touchmove', (e) => {
  if (!joystick.active) return;
  for (let t of e.changedTouches) {
    if (t.identifier === joystick.id) {
      e.preventDefault();
      updateJoystick(t.clientX, t.clientY);
    }
  }
}, { passive: false });

document.addEventListener('touchend', (e) => {
  for (let t of e.changedTouches) {
    if (t.identifier === joystick.id) {
      joystick.active = false;
      joystick.x = 0; joystick.y = 0;
      knob.style.transform = 'translate(0px, 0px)';
      setWalkAnim(false);
    }
  }
});

function updateJoystick(cx, cy) {
  const center = getJoyCenter();
  let dx = cx - center.x;
  let dy = cy - center.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist > JOY_RADIUS) {
    dx = dx / dist * JOY_RADIUS;
    dy = dy / dist * JOY_RADIUS;
  }
  joystick.x = dx / JOY_RADIUS;
  joystick.y = dy / JOY_RADIUS;
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
}

// ========== CLAVIER ==========
const keys = {};
document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup', e => keys[e.key] = false);

// ========== CAMERA DRAG ==========
let camDrag = { active: false, lastX: 0 };
const canvas = document.querySelector('canvas');

document.addEventListener('mousedown', e => {
  if (e.target.closest('#hud')) return;
  camDrag.active = true;
  camDrag.lastX = e.clientX;
});
document.addEventListener('mousemove', e => {
  if (!camDrag.active) return;
  const dx = e.clientX - camDrag.lastX;
  camDrag.lastX = e.clientX;
  cameraRotY -= dx * 0.4;
});
document.addEventListener('mouseup', () => camDrag.active = false);

// Touch camera rotation (2nd finger)
let camTouch = { active: false, lastX: 0, id: null };
joystickZone.addEventListener('touchstart', () => {}, { passive: true });

document.addEventListener('touchstart', e => {
  for (let t of e.touches) {
    const el = document.elementFromPoint(t.clientX, t.clientY);
    if (el && el.closest('#joystick-zone')) continue;
    if (el && el.closest('#hud')) continue;
    if (!camTouch.active) {
      camTouch.active = true;
      camTouch.id = t.identifier;
      camTouch.lastX = t.clientX;
    }
  }
}, { passive: true });

document.addEventListener('touchmove', e => {
  for (let t of e.changedTouches) {
    if (t.identifier === camTouch.id) {
      const dx = t.clientX - camTouch.lastX;
      camTouch.lastX = t.clientX;
      cameraRotY -= dx * 0.4;
    }
  }
}, { passive: true });

document.addEventListener('touchend', e => {
  for (let t of e.changedTouches) {
    if (t.identifier === camTouch.id) camTouch.active = false;
  }
});

// ========== ANIMATION WALK ==========
function setWalkAnim(walking) {
  if (walking === isAnimWalk) return;
  isAnimWalk = walking;
  // Pour GLB Avaturn — switch clip
  const glbEl = avatarModel.querySelector('[gltf-model]');
  if (glbEl) {
    glbEl.setAttribute('animation-mixer',
      walking
        ? 'clip:walk;loop:repeat;crossFadeDuration:0.3'
        : 'clip:idle;loop:repeat;crossFadeDuration:0.3');
  }
  // Pour fallback : animer les bras
  const armR = document.getElementById('arm-right');
  const armL = document.getElementById('arm-left');
  if (armR && walking) {
    armR.setAttribute('animation', 'property:rotation;from:30 0 -20;to:-30 0 -20;dur:400;loop:true;dir:alternate;easing:easeInOutSine');
    armL.setAttribute('animation', 'property:rotation;from:-30 0 20;to:30 0 20;dur:400;loop:true;dir:alternate;easing:easeInOutSine');
  } else if (armR) {
    armR.removeAttribute('animation');
    armL.removeAttribute('animation');
    armR.setAttribute('rotation', '0 0 -20');
    armL.setAttribute('rotation', '0 0 20');
  }
}

// ========== GAME LOOP ==========
let lastTime = 0;

function gameLoop(ts) {
  requestAnimationFrame(gameLoop);
  const dt = Math.min((ts - lastTime) / 16.67, 3);
  lastTime = ts;

  if (!sceneReady) return;

  // Input
  let mx = joystick.x;
  let mz = joystick.y;

  if (keys['ArrowUp'] || keys['w'] || keys['W'])    mz = -1;
  if (keys['ArrowDown'] || keys['s'] || keys['S'])   mz = 1;
  if (keys['ArrowLeft'] || keys['a'] || keys['A'])   mx = -1;
  if (keys['ArrowRight'] || keys['d'] || keys['D'])  mx = 1;
  if (keys['ArrowLeft']) cameraRotY -= 1.5 * dt;
  if (keys['ArrowRight']) cameraRotY += 1.5 * dt;

  const moving = Math.abs(mx) > 0.05 || Math.abs(mz) > 0.05;
  setWalkAnim(moving);

  if (moving) {
    // Direction relative à la caméra
    const camRad = cameraRotY * Math.PI / 180;
    const fwdX = Math.sin(camRad);
    const fwdZ = Math.cos(camRad);
    const rightX = Math.cos(camRad);
    const rightZ = -Math.sin(camRad);

    const moveX = (fwdX * (-mz) + rightX * mx) * SPEED * dt;
    const moveZ = (fwdZ * (-mz) + rightZ * mx) * SPEED * dt;

    // Boundary check
    const nx = Math.max(-BOUNDARY, Math.min(BOUNDARY, playerPos.x + moveX));
    const nz = Math.max(-BOUNDARY, Math.min(BOUNDARY, playerPos.z + moveZ));

    playerPos.x = nx;
    playerPos.z = nz;

    // Rotation du perso vers la direction de mouvement
    const angle = Math.atan2(moveX, moveZ) * 180 / Math.PI;
    playerRotY = angle;
  }

  // Appliquer positions
  player.setAttribute('position', `${playerPos.x} 0 ${playerPos.z}`);
  cameraRig.setAttribute('position', `${playerPos.x} 0 ${playerPos.z}`);

  // Rotation avatar
  document.getElementById('player-pivot').setAttribute('rotation', `0 ${playerRotY} 0`);

  // Rotation caméra TPS
  document.getElementById('camera-pivot').setAttribute('rotation', `0 ${-cameraRotY} 0`);

  // Mise à jour bulle de dialogue si visible
  updateSpeechBubble();
}

requestAnimationFrame(gameLoop);

// ========== BULLE DE DIALOGUE ==========
let bubbleTimeout = null;
const bubble = document.getElementById('speech-bubble');

function showSpeechBubble(text) {
  bubble.textContent = text;
  bubble.style.opacity = '1';
  clearTimeout(bubbleTimeout);
  bubbleTimeout = setTimeout(() => { bubble.style.opacity = '0'; }, 4000);
}

function updateSpeechBubble() {
  if (bubble.style.opacity === '0') return;
  // Projeter position 3D vers écran
  const cam = document.getElementById('main-camera').object3D;
  const camPos = new THREE.Vector3();
  cam.getWorldPosition(camPos);

  const playerWorldPos = new THREE.Vector3(playerPos.x, 1.8, playerPos.z);
  const projected = playerWorldPos.clone().project(cam.parent?.parent || cam);

  const x = (projected.x + 1) / 2 * window.innerWidth;
  const y = (1 - projected.y) / 2 * window.innerHeight;

  bubble.style.left = x + 'px';
  bubble.style.top = (y - 60) + 'px';
}

// ========== CHAT ==========
function addChatMessage(text, from) {
  const msgs = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'chat-msg';
  div.innerHTML = `<span class="name">${from}</span>${text}`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  // Limiter à 20 messages
  while (msgs.children.length > 20) msgs.removeChild(msgs.firstChild);
}

function sendChat() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  addChatMessage(msg, profile.pseudo);
  showSpeechBubble(msg);
}

document.getElementById('chat-send').addEventListener('click', sendChat);
document.getElementById('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); sendChat(); }
});

// ========== EMOTE ==========
const emotes = ['🌸', '💫', '✨', '🎉', '👋', '💕', '🌈'];
let emoteIdx = 0;
document.getElementById('btn-action').addEventListener('click', () => {
  const e = emotes[emoteIdx % emotes.length];
  emoteIdx++;
  addChatMessage(e, profile.pseudo);
  showSpeechBubble(e);
  showToast(e + ' Émote !');
});

// ========== TOAST ==========
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ========== THREE.js dispo via A-Frame ==========
// Three est accessible via AFRAME.THREE
let THREE;
scene.addEventListener('loaded', () => {
  THREE = AFRAME.THREE;
});
</script>
