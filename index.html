<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Macadam World — Avatar 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --pink:#FF6EB4;--mint:#3DDBB8;--yellow:#FFD747;
  --lav:#B388FF;--sky:#5BC8F5;--peach:#FF9E7A;
  --dark:#12082A;
}
html,body{
height:100%;width:100%;
font-family:'Nunito',sans-serif;
background:var(--dark);
overflow:hidden;
}
.bg{position:fixed;inset:0;z-index:0;background:#0e0620;overflow:hidden;}
.bg::before{content:'';position:absolute;inset:0;
background:
radial-gradient(ellipse 80% 50% at 10% 15%, #FF6EB455 0%, transparent 60%),
radial-gradient(ellipse 60% 40% at 90% 80%, #B388FF44 0%, transparent 55%),
radial-gradient(ellipse 70% 45% at 85% 10%, #3DDBB833 0%, transparent 55%),
radial-gradient(ellipse 50% 35% at 15% 85%, #FFD74733 0%, transparent 50%),
radial-gradient(ellipse 40% 30% at 50% 50%, #FF9E7A22 0%, transparent 60%);}
.bg::after{content:'';position:absolute;inset:0;
background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
background-size:40px 40px;}
.bg-shapes{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
.star{position:absolute;border-radius:50%;background:white;animation:twinkle var(--d,3s) ease-in-out infinite var(--del,0s);}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(1);}50%{opacity:.9;transform:scale(1.6);}}

.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 16px;gap:10px;}

.logo-tag{display:inline-block;background:var(–yellow);color:var(–dark);font-size:.6rem;font-weight:900;letter-spacing:2px;text-transform:uppercase;padding:3px 10px;border-radius:20px;}
.logo-title{font-family:‘Baloo 2’,cursive;font-size:clamp(1.3rem,5vw,2rem);font-weight:800;line-height:1;color:white;letter-spacing:-1px;text-align:center;}
.logo-sub{font-size:.7rem;color:rgba(255,255,255,.3);font-weight:700;letter-spacing:1px;}

.avatar-card{width:100%;max-width:340px;background:rgba(18,8,42,.7);backdrop-filter:blur(20px);border:1.5px solid rgba(255,255,255,.12);border-radius:24px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px rgba(255,110,180,.1),inset 0 1px 0 rgba(255,255,255,.08);}

.viewer-wrap{width:140px;height:200px;flex-shrink:0;background:linear-gradient(160deg,#1a0838 0%,#0d1535 60%,#0a1f2e 100%);border-radius:18px;box-shadow:0 0 0 2px rgba(255,110,180,.7),0 0 20px rgba(255,110,180,.3),0 0 40px rgba(179,136,255,.15);overflow:hidden;position:relative;align-self:center;}
.viewer-wrap::before{content:’’;position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 20% 5%,rgba(255,110,180,.2) 0%,transparent 50%),radial-gradient(ellipse at 80% 95%,rgba(179,136,255,.2) 0%,transparent 50%);}
.viewer-wrap::after{content:‘✦ MW ✦’;position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-family:‘Baloo 2’,cursive;font-size:.45rem;font-weight:800;letter-spacing:2px;color:rgba(255,255,255,.25);z-index:2;pointer-events:none;white-space:nowrap;}
.viewer-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:rgba(255,255,255,.25);font-size:.7rem;font-weight:700;}
.viewer-placeholder .icon{font-size:2rem;opacity:.4;}

.pseudo-wrap{width:100%;}
.pseudo-label{font-size:.58rem;font-weight:900;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,.3);display:block;margin-bottom:5px;}
.pseudo-input{width:100%;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);border-radius:12px;padding:9px 12px;font-family:‘Nunito’,sans-serif;font-size:16px;font-weight:700;color:white;outline:none;transition:all .2s;}
.pseudo-input::placeholder{color:rgba(255,255,255,.2);}
.pseudo-input:focus{border-color:var(–pink);background:rgba(255,110,180,.08);}

.btn-create{width:100%;background:linear-gradient(135deg,var(–pink),var(–lav));border:none;border-radius:12px;padding:12px;font-family:‘Baloo 2’,cursive;font-size:.95rem;font-weight:700;color:white;cursor:pointer;box-shadow:0 4px 16px rgba(255,110,180,.4);transition:transform .15s;}
.btn-create:active{transform:scale(.97);}

.btn-save{width:100%;background:rgba(61,219,184,.12);border:1.5px solid var(–mint);border-radius:12px;padding:10px;font-family:‘Nunito’,sans-serif;font-size:.88rem;font-weight:800;color:var(–mint);cursor:pointer;transition:all .2s;display:none;}
.btn-save.visible{display:block;}

/* Bouton Jouer — apparaît après avatar prêt */
.btn-play{width:100%;background:linear-gradient(135deg,var(–mint),var(–sky));border:none;border-radius:12px;padding:13px;font-family:‘Baloo 2’,cursive;font-size:1rem;font-weight:700;color:var(–dark);cursor:pointer;box-shadow:0 4px 16px rgba(61,219,184,.4);transition:transform .15s;display:none;animation:glow 2s ease-in-out infinite;}
.btn-play.visible{display:block;}
.btn-play:active{transform:scale(.97);}
@keyframes glow{0%,100%{box-shadow:0 4px 16px rgba(61,219,184,.4);}50%{box-shadow:0 4px 28px rgba(61,219,184,.7);}}

.avatar-badge{display:none;align-items:center;gap:6px;background:rgba(61,219,184,.1);border:1px solid rgba(61,219,184,.3);border-radius:10px;padding:6px 12px;width:100%;}
.avatar-badge.visible{display:flex;}
.avatar-badge .dot{width:7px;height:7px;border-radius:50%;background:var(–mint);flex-shrink:0;animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(1.3);}}
.avatar-badge span{font-size:.72rem;font-weight:800;color:var(–mint);}

.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.95);display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .3s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;}
.modal-title{font-size:.85rem;font-weight:800;color:rgba(255,255,255,.6);letter-spacing:1px;}
.btn-close{background:rgba(255,255,255,.1);border:none;border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:1.1rem;color:white;display:flex;align-items:center;justify-content:center;}
#avaturn-sdk-container{flex:1;width:100%;overflow:hidden;}
#avaturn-sdk-container iframe{width:100%!important;height:100%!important;border:none!important;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(–mint);color:var(–dark);padding:10px 22px;border-radius:14px;font-size:.88rem;font-weight:800;box-shadow:0 8px 24px rgba(61,219,184,.4);transition:transform .35s cubic-bezier(.22,1,.36,1);z-index:999;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);}

/* Écran de transition */
#transition-screen{position:fixed;inset:0;z-index:200;background:#0e0620;opacity:0;pointer-events:none;transition:opacity .5s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
#transition-screen.show{opacity:1;pointer-events:all;}
.transition-logo{font-family:‘Baloo 2’,cursive;font-size:2rem;font-weight:800;color:white;}
.transition-txt{font-size:.8rem;color:rgba(255,255,255,.5);font-weight:700;letter-spacing:1px;}
.transition-spinner{width:36px;height:36px;border:3px solid rgba(255,110,180,.2);border-top-color:var(–pink);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>

</head>

<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

<script type="module">
import { AvaturnSDK } from 'https://cdn.jsdelivr.net/npm/@avaturn/sdk/dist/index.js';

// ÉTOILES
const starsEl = document.getElementById('stars');
for(let i=0;i<60;i++){
  const s=document.createElement('div');s.className='star';
  const sz=Math.random()*2.5+.8;
  s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--del:-${Math.random()*5}s;`;
  starsEl.appendChild(s);
}

// UUID par appareil
function getUserId(){
  let uid=localStorage.getItem('macadam_user_id');
  if(!uid){uid=crypto.randomUUID();localStorage.setItem('macadam_user_id',uid);}
  return uid;
}
function storageKey(){return 'macadam_avatar_'+getUserId();}

let avatarGlbUrl=null;
let sdk=null;

// OUVRIR AVATURN
async function openAvaturn(){
  document.getElementById('modal-overlay').classList.add('open');
  const container=document.getElementById('avaturn-sdk-container');
  container.innerHTML='';
  try{
    sdk=new AvaturnSDK();
    await sdk.init(container,{url:'https://demo.avaturn.dev'});
    sdk.on('export',(data)=>{
      const glb=data?.url||data?.avatarUrl||data?.glbUrl||data?.modelUrl;
      if(glb){
        avatarGlbUrl=glb;
        closeAvaturn();
        showAvatar(glb);
        // Sauvegarder automatiquement avec le pseudo actuel
        const pseudo=document.getElementById('pseudo').value.trim();
        persistAvatar(glb, pseudo);
        showToast('🎉 Avatar créé !');
        document.getElementById('btn-save').classList.add('visible');
        document.getElementById('btn-play').classList.add('visible');
      } else {
        console.log('Export data:', JSON.stringify(data));
        showToast('❓ Export reçu — voir console');
      }
    });
  }catch(e){
    console.error(e);
    showToast('❌ Erreur — réessaie');
  }
}

// FERMER
function closeAvaturn(){
  document.getElementById('modal-overlay').classList.remove('open');
  try{if(sdk)sdk.destroy?.();}catch(e){}
  sdk=null;
  setTimeout(()=>{document.getElementById('avaturn-sdk-container').innerHTML='';},300);
}

// AFFICHER L'AVATAR
function showAvatar(glbUrl){
  const wrap=document.getElementById('viewer-wrap');
  const ph=document.getElementById('viewer-placeholder');
  if(ph)ph.remove();
  const old=wrap.querySelector('model-viewer');
  if(old)old.remove();
  const mv=document.createElement('model-viewer');
  mv.setAttribute('src',glbUrl);
  mv.setAttribute('camera-controls','');
  mv.setAttribute('auto-rotate','');
  mv.setAttribute('auto-rotate-delay','1000');
  mv.setAttribute('rotation-per-second','30deg');
  mv.setAttribute('camera-orbit','0deg 88deg auto');
  mv.setAttribute('field-of-view','45deg');
  mv.setAttribute('shadow-intensity','1');
  mv.setAttribute('environment-image','neutral');
  mv.setAttribute('exposure','1');
  mv.style.cssText='width:100%;height:100%;background:transparent;--progress-bar-color:var(--pink);position:relative;z-index:1;';
  wrap.appendChild(mv);
  document.getElementById('avatar-badge').classList.add('visible');
}

// SAUVEGARDER
function persistAvatar(glbUrl,pseudo){
  if(!pseudo) pseudo = document.getElementById('pseudo').value.trim();
  localStorage.setItem(storageKey(),JSON.stringify({glbUrl,pseudo,savedAt:Date.now()}));
  if(pseudo) document.getElementById('pseudo').value=pseudo;
}

// SAUVEGARDER + JOUER (bouton Sauvegarder)
window.saveAndPlay=function(){
  const pseudo=document.getElementById('pseudo').value.trim();
  if(!pseudo){showToast('✏️ Entre ton pseudo !');return;}
  if(!avatarGlbUrl){showToast('👆 Crée d\'abord ton avatar !');return;}
  persistAvatar(avatarGlbUrl,pseudo);
  showToast('✨ Sauvegardé !');
  // Afficher le bouton Jouer si pas déjà visible
  document.getElementById('btn-play').classList.add('visible');
};

// ALLER DANS LE MONDE
window.goToWorld=function(){
  const pseudo=document.getElementById('pseudo').value.trim();
  if(!pseudo){showToast('✏️ Entre ton pseudo d\'abord !');return;}
  // Sauvegarder le pseudo même si avatar pas changé
  if(avatarGlbUrl) persistAvatar(avatarGlbUrl,pseudo);
  else {
    // Sauvegarder juste le pseudo avec l'avatar existant
    const existing=JSON.parse(localStorage.getItem(storageKey())||'{}');
    if(existing.glbUrl) persistAvatar(existing.glbUrl,pseudo);
  }
  // Transition
  const ts=document.getElementById('transition-screen');
  ts.classList.add('show');
  setTimeout(()=>{ window.location.href='word-place-pastel.html'; }, 1200);
};

// TOAST
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

// CHARGER AVATAR SAUVEGARDÉ
function loadSaved(){
  try{
    const saved=JSON.parse(localStorage.getItem(storageKey())||'null');
    if(saved?.glbUrl){
      avatarGlbUrl=saved.glbUrl;
      if(saved.pseudo)document.getElementById('pseudo').value=saved.pseudo;
      showAvatar(saved.glbUrl);
      document.getElementById('btn-save').classList.add('visible');
      document.getElementById('btn-play').classList.add('visible');
    }
  }catch(e){}
}
loadSaved();

// Exposer globalement
window.openAvaturn=openAvaturn;
window.closeAvaturn=closeAvaturn;

// Clic overlay pour fermer
document.getElementById('modal-overlay').addEventListener('click',(e)=>{
  if(e.target===e.currentTarget)closeAvaturn();
});
</script>
