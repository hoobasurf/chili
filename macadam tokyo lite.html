<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Macadam World — Tokyo LITE</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--gold:#f5c842;--orange:#e85d26;--green:#2ecc71;--red:#e74c3c;--blue:#3498db;}
html,body{width:100%;height:100%;overflow:hidden;background:#8ab4d4;font-family:'M PLUS Rounded 1c',sans-serif;user-select:none;-webkit-user-select:none;}
#canvas-container{position:fixed;inset:0;}
canvas{display:block;width:100%!important;height:100%!important;}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;}
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,transparent 100%);}
.hud-logo{font-family:'Zen Kaku Gothic New',sans-serif;font-size:.95rem;font-weight:900;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5);}
.hud-logo em{color:var(--gold);font-style:normal;}
.hud-loc{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:3px 9px;}
.hud-loc span{font-size:.65rem;font-weight:700;color:#fff;}
.loc-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);}
.hud-info{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:3px 9px 3px 4px;}
.hud-pic{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--gold));display:flex;align-items:center;justify-content:center;font-size:.55rem;font-weight:900;color:#fff;}
.hud-name{font-size:.65rem;font-weight:700;color:#fff;}
/* SIDEBAR */
#sidebar-toggle{position:fixed;top:52px;right:0;z-index:60;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);border:1.5px solid rgba(245,200,66,.4);border-right:none;border-radius:10px 0 0 10px;padding:7px 8px;cursor:pointer;pointer-events:all;display:flex;flex-direction:column;gap:3px;align-items:center;-webkit-tap-highlight-color:transparent;}
#sidebar-toggle-icon{font-size:.9rem;}
#sidebar-toggle-lbl{font-size:.48rem;font-weight:900;color:var(--gold);writing-mode:vertical-rl;letter-spacing:.06em;}
#sidebar{position:fixed;top:52px;right:0;width:230px;max-height:calc(100vh - 140px);overflow-y:auto;z-index:55;transform:translateX(105%);transition:transform .28s cubic-bezier(.4,0,.2,1);pointer-events:all;scrollbar-width:none;}
#sidebar::-webkit-scrollbar{display:none;}
#sidebar.open{transform:translateX(0);}
#sidebar-inner{background:rgba(0,0,0,.88);backdrop-filter:blur(14px);border-left:2px solid rgba(245,200,66,.3);padding:8px 0;}
.sb-section{padding:4px 11px 8px;}
.sb-title{font-size:.58rem;font-weight:900;color:rgba(255,255,255,.3);letter-spacing:.12em;text-transform:uppercase;padding:5px 0 4px;border-top:1px solid rgba(255,255,255,.07);margin-top:2px;}
.sb-title:first-child{border-top:none;margin-top:0;}
/* missions */
.mc{background:rgba(255,255,255,.04);border:1px solid rgba(245,200,66,.22);border-radius:8px;padding:7px 9px;margin-bottom:4px;}
.mc.done{border-color:rgba(46,204,113,.35);opacity:.6;}
.mc-title{font-size:.65rem;font-weight:900;color:var(--gold);margin-bottom:1px;display:flex;justify-content:space-between;align-items:center;}
.mc-desc{font-size:.56rem;color:rgba(255,255,255,.55);line-height:1.25;}
.mc-bar-wrap{margin-top:3px;height:2px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;}
.mc-bar{height:100%;background:var(--gold);border-radius:2px;transition:width .4s;}
.mc-badge{background:var(--green);color:#fff;font-size:.48rem;font-weight:900;padding:1px 4px;border-radius:5px;}
/* chat */
.chat-messages{max-height:90px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin-bottom:5px;scrollbar-width:none;}
.chat-messages::-webkit-scrollbar{display:none;}
.chat-msg{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:3px 7px;font-size:.6rem;color:#fff;line-height:1.25;}
.chat-msg .nm{font-weight:900;color:var(--gold);margin-right:3px;}
.chat-row{display:flex;gap:4px;}
.chat-inp{flex:1;background:rgba(0,0,0,.4);border:1.5px solid rgba(255,255,255,.2);border-radius:8px;padding:5px 8px;font-size:14px;font-weight:700;color:#fff;outline:none;font-family:'M PLUS Rounded 1c',sans-serif;}
.chat-inp::placeholder{color:rgba(255,255,255,.3);}
.chat-inp:focus{border-color:var(--gold);}
.chat-snd{width:28px;height:28px;border-radius:7px;background:var(--orange);border:none;color:#fff;cursor:pointer;font-size:.75rem;display:flex;align-items:center;justify-content:center;pointer-events:all;flex-shrink:0;}
/* link vers version riche */
#rich-btn{position:fixed;top:52px;left:0;z-index:60;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);border:1.5px solid rgba(52,152,219,.5);border-left:none;border-radius:0 10px 10px 0;padding:6px 10px;cursor:pointer;pointer-events:all;font-size:.58rem;font-weight:900;color:#3498db;-webkit-tap-highlight-color:transparent;writing-mode:vertical-rl;letter-spacing:.06em;}
/* CONTROLES */
#joystick-zone{position:absolute;bottom:100px;right:14px;width:95px;height:95px;pointer-events:all;}
#cam-joystick-zone{position:absolute;bottom:100px;left:14px;width:95px;height:95px;pointer-events:all;}
.joy-base{width:95px;height:95px;border-radius:50%;background:rgba(0,0,0,.18);border:1.5px solid rgba(255,255,255,.18);position:relative;display:flex;align-items:center;justify-content:center;}
.joy-knob{width:38px;height:38px;border-radius:50%;position:absolute;box-shadow:0 2px 8px rgba(0,0,0,.4);}
#anim-panel{position:absolute;bottom:0;left:0;right:0;pointer-events:all;padding:4px 0 8px;background:linear-gradient(0deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,.5) 100%);border-top:1px solid rgba(255,255,255,.07);}
#anim-scroll{display:flex;gap:5px;overflow-x:auto;padding:2px 10px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
#anim-scroll::-webkit-scrollbar{display:none;}
.ab{flex-shrink:0;width:56px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.ab-icon{width:54px;height:54px;border-radius:10px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;transition:all .15s;}
.ab-icon svg{width:44px;height:44px;}
.ab.active .ab-icon{background:rgba(245,200,66,.1);border-color:var(--gold);box-shadow:0 0 8px rgba(245,200,66,.25);}
.ab:active .ab-icon{transform:scale(.88);}
.ab-lbl{font-size:.5rem;font-weight:700;color:rgba(255,255,255,.35);text-align:center;}
.ab.active .ab-lbl{color:var(--gold);}
#jump-btn{position:absolute;bottom:208px;right:20px;width:48px;height:48px;border-radius:50%;background:#2b6cb0;border:none;color:#fff;font-size:1.2rem;pointer-events:all;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}
#sjump-btn{position:absolute;bottom:208px;left:20px;width:48px;height:48px;border-radius:50%;background:var(--orange);border:none;color:#fff;font-size:1rem;pointer-events:all;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}
.toast{position:fixed;bottom:190px;left:50%;transform:translateX(-50%) translateY(12px);background:rgba(0,0,0,.85);color:var(--gold);padding:6px 13px;border-radius:14px;font-size:.68rem;font-weight:700;opacity:0;transition:all .22s;z-index:50;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.ok{background:rgba(20,80,40,.95);color:var(--green);border:1px solid var(--green);}
.toast.secret{background:rgba(10,30,80,.95);color:#88ccff;border:1px solid #88ccff;}
#speech-bubble{position:fixed;z-index:20;background:rgba(0,0,0,.85);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:3px 9px;font-size:.65rem;font-weight:700;pointer-events:none;max-width:130px;text-align:center;transform:translateX(-50%);opacity:0;transition:opacity .2s;white-space:nowrap;}
#loading-screen{position:fixed;inset:0;z-index:200;background:#8ab4d4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s;}
#loading-screen.hidden{opacity:0;pointer-events:none;}
.ll{font-family:'Zen Kaku Gothic New',sans-serif;font-size:2rem;font-weight:900;color:#1a2a40;}
.ll em{color:var(--orange);font-style:normal;}
.lk{font-size:.85rem;color:rgba(26,42,64,.55);letter-spacing:.22em;}
.lb-w{width:160px;height:3px;background:rgba(0,0,0,.1);border-radius:2px;overflow:hidden;}
.lb{height:100%;width:0%;background:linear-gradient(90deg,var(--orange),var(--gold));border-radius:2px;transition:width .18s;}
.lt{font-size:.65rem;color:rgba(26,42,64,.55);font-weight:700;}
#interact-prompt{position:fixed;top:50%;left:50%;transform:translate(-50%,55px);z-index:45;background:rgba(0,0,0,.82);border:1.5px solid var(--gold);border-radius:11px;padding:7px 16px;font-size:.72rem;font-weight:700;color:var(--gold);pointer-events:all;cursor:pointer;display:none;-webkit-tap-highlight-color:transparent;}
#interact-prompt.show{display:block;}
#sewer-overlay{position:fixed;inset:0;z-index:25;background:radial-gradient(ellipse at center,rgba(20,40,10,0) 0%,rgba(10,20,5,0) 100%);pointer-events:none;transition:all .8s;}
#sewer-overlay.active{background:radial-gradient(ellipse at center,rgba(20,60,10,.7) 0%,rgba(0,0,0,.95) 100%);}
#shrink-overlay{position:fixed;inset:0;z-index:30;pointer-events:none;border:0px solid rgba(100,200,255,.8);transition:all .5s;}
#shrink-overlay.active{border-width:10px;box-shadow:inset 0 0 50px rgba(100,200,255,.4);}
#metro-hud{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:50;background:rgba(0,0,0,.92);border:2px solid var(--gold);border-radius:16px;padding:18px 26px;min-width:260px;text-align:center;display:none;}
#metro-hud.show{display:block;}
.mh-title{font-size:1rem;font-weight:900;color:var(--gold);margin-bottom:10px;}
.mh-btn{display:block;width:100%;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.18);border-radius:9px;padding:9px 14px;color:#fff;font-size:.75rem;font-weight:700;cursor:pointer;pointer-events:all;margin-bottom:6px;font-family:'M PLUS Rounded 1c',sans-serif;text-align:left;}
.mh-btn:active{background:rgba(245,200,66,.15);border-color:var(--gold);}
.mh-close{background:rgba(231,76,60,.15);border:1.5px solid var(--red);border-radius:9px;padding:7px 18px;color:var(--red);font-size:.7rem;font-weight:700;cursor:pointer;pointer-events:all;font-family:'M PLUS Rounded 1c',sans-serif;margin-top:4px;}
#boat-hud{position:fixed;bottom:190px;left:50%;transform:translateX(-50%);z-index:40;background:rgba(0,0,0,.8);border:1.5px solid var(--blue);border-radius:12px;padding:7px 16px;display:none;pointer-events:all;gap:10px;align-items:center;}
#boat-hud.show{display:flex;}
.boat-info{font-size:.68rem;font-weight:700;color:var(--blue);}
.boat-exit{background:rgba(231,76,60,.2);border:1.5px solid var(--red);border-radius:8px;padding:4px 11px;color:var(--red);font-size:.65rem;font-weight:700;cursor:pointer;font-family:'M PLUS Rounded 1c',sans-serif;}
#markers{position:fixed;inset:0;z-index:15;pointer-events:none;}
.mk{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;opacity:0;transition:opacity .3s;}
.mk.on{opacity:1;}
.mk-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;animation:mkB 1.2s ease-in-out infinite;}
.mk-lbl{font-size:.5rem;font-weight:900;color:#fff;background:rgba(0,0,0,.7);padding:1px 5px;border-radius:7px;white-space:nowrap;}
@keyframes mkB{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="sewer-overlay"></div>
<div id="shrink-overlay"></div>

<div id="loading-screen">
  <div class="ll">TOKYO<em>東京</em></div>
  <div class="lk">MACADAM WORLD — LITE</div>
  <div class="lb-w"><div class="lb" id="lb"></div></div>
  <div class="lt" id="lt">Chargement…</div>
</div>

<!-- SIDEBAR TOGGLE -->

<div id="sidebar-toggle" onclick="toggleSB()">
  <div id="sidebar-toggle-icon">📋</div>
  <div id="sidebar-toggle-lbl">MENU</div>
</div>
<div id="sidebar">
  <div id="sidebar-inner">
    <div class="sb-section">
      <div class="sb-title">🎯 Missions</div>
      <div id="mission-hud"></div>
    </div>
    <div class="sb-section">
      <div class="sb-title">💬 Chat</div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-row">
        <input class="chat-inp" id="chat-input" type="text" placeholder="Dis quelque chose…" maxlength="80" autocomplete="off"/>
        <button class="chat-snd" id="chat-send">➤</button>
      </div>
    </div>
    <div class="sb-section">
      <div class="sb-title">🌍 Version</div>
      <a href="macadam_tokyo_rich.html" style="display:block;background:rgba(52,152,219,.15);border:1.5px solid #3498db;border-radius:8px;padding:8px 10px;color:#3498db;font-size:.65rem;font-weight:900;text-decoration:none;text-align:center;">🚀 Passer en mode RICHE<br><span style="font-size:.55rem;opacity:.7;">Tour Eiffel • Alfa • Statues GLB</span></a>
    </div>
  </div>
</div>

<!-- METRO -->

<div id="metro-hud">
  <div class="mh-title">🚇 Métro de Tokyo</div>
  <div id="metro-stations"></div>
  <button class="mh-close" id="metro-close">✕ Fermer</button>
</div>
<!-- BATEAU -->
<div id="boat-hud">
  <span class="boat-info" id="boat-info">⚓ Vitesse: 0</span>
  <button class="boat-exit" id="boat-exit">Quitter</button>
</div>
<div id="interact-prompt">⬆ Interagir</div>

<div id="hud">
  <div class="hud-top">
    <div class="hud-logo">⬡ <em>Macadam</em> World</div>
    <div class="hud-loc"><div class="loc-dot"></div><span id="zone-label">東京 Shinjuku</span></div>
    <div class="hud-info"><div class="hud-pic" id="hud-pic">?</div><span class="hud-name" id="hud-pseudo">Joueur</span></div>
  </div>
  <div id="cam-joystick-zone">
    <div class="joy-base" id="cam-joy-base">
      <div class="joy-knob" id="cam-joy-knob" style="background:linear-gradient(135deg,#f5c842,#e85d26);"></div>
    </div>
  </div>
  <div id="joystick-zone">
    <div class="joy-base" id="joy-base">
      <div class="joy-knob" id="joy-knob" style="background:linear-gradient(135deg,#ddd,#aaa);"></div>
    </div>
  </div>
  <button id="jump-btn">↑</button>
  <button id="sjump-btn">🚀</button>
  <div id="anim-panel"><div id="anim-scroll"></div></div>
</div>
<div id="markers"></div>
<div id="speech-bubble"></div>
<div class="toast" id="toast"></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const gltfLoader=new GLTFLoader();
const glbCache={};
const BASE='https://raw.githubusercontent.com/hoobasurf/chili/main/';
const WALK_FILE='course.glb',IDLE_FILE='attend.glb';

// ── PROFIL ──────────────────────────────────────────────
function loadProfile(){try{const uid=localStorage.getItem('macadam_uid')||('p_'+Math.random().toString(36).slice(2,8));localStorage.setItem('macadam_uid',uid);const s=JSON.parse(localStorage.getItem('macadam_avatar_'+uid)||'null');return{pseudo:s?.pseudo||'Joueur'};}catch(e){return{pseudo:'Joueur'};}}
const profile=loadProfile();
document.getElementById('hud-pseudo').textContent=profile.pseudo;
document.getElementById('hud-pic').textContent=profile.pseudo.slice(0,2).toUpperCase();

// ── LOADING ─────────────────────────────────────────────
let ldPct=0;const ldBar=document.getElementById('lb'),ldTxt=document.getElementById('lt');
const ldI=setInterval(()=>{ldPct+=Math.random()*8;if(ldPct>88){ldPct=88;clearInterval(ldI);}ldBar.style.width=ldPct+'%';},200);
function finishLoading(){clearInterval(ldI);ldBar.style.width='100%';ldTxt.textContent='Bienvenue !';setTimeout(()=>{const l=document.getElementById('loading-screen');l.classList.add('hidden');setTimeout(()=>l.style.display='none',500);},300);addChat('☀️ Bienvenue, '+profile.pseudo+' !','Système');addChat('💡 Mode LITE — fluide sur mobile !','Info');swapAvatar(IDLE_FILE,true,null);}

// ── UI ───────────────────────────────────────────────────
let toastT=null;
function showToast(msg,type=''){const t=document.getElementById('toast');t.textContent=msg;t.className='toast '+(type||'');t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3000);}
const bubEl=document.getElementById('speech-bubble');let bubT=null;
function showBubble(t){bubEl.textContent=t;bubEl.style.opacity='1';clearTimeout(bubT);bubT=setTimeout(()=>bubEl.style.opacity='0',4000);}
function addChat(text,from){const msgs=document.getElementById('chat-messages');const d=document.createElement('div');d.className='chat-msg';d.innerHTML=`<span class="nm">${from}</span>${text}`;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;while(msgs.children.length>15)msgs.removeChild(msgs.firstChild);}
function sendChat(){const inp=document.getElementById('chat-input');const m=inp.value.trim();if(!m)return;inp.value='';addChat(m,profile.pseudo);showBubble(m);}
document.getElementById('chat-send').addEventListener('click',sendChat);
document.getElementById('chat-input').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendChat();}});
function toggleSB(){const s=document.getElementById('sidebar');const l=document.getElementById('sidebar-toggle-lbl');s.classList.toggle('open');l.textContent=s.classList.contains('open')?'FERMER':'MENU';}
window.toggleSB=toggleSB;
document.addEventListener('touchstart',e=>{const sb=document.getElementById('sidebar');const tog=document.getElementById('sidebar-toggle');if(sb.classList.contains('open')&&!sb.contains(e.target)&&!tog.contains(e.target)){sb.classList.remove('open');document.getElementById('sidebar-toggle-lbl').textContent='MENU';}},{passive:true});

// ── RENDERER ─────────────────────────────────────────────
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(1); // Toujours 1 sur mobile
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=false; // Pas d'ombres en mode lite
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById('canvas-container').appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8ab4d4);scene.fog=new THREE.FogExp2(0x9ec2dc,0.004);
const camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,400);
window.addEventListener('resize',()=>{renderer.setSize(window.innerWidth,window.innerHeight);camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();});

// ── LUMIÈRES (simples) ───────────────────────────────────
scene.add(new THREE.HemisphereLight(0x87CEEB,0xc8b89a,1.3));
const sun=new THREE.DirectionalLight(0xfff5e0,2.0);sun.position.set(60,120,40);scene.add(sun);

// ── TEXTURES MINIMALES ────────────────────────────────────
function procTex(fn,size=128){const cv=document.createElement('canvas');cv.width=cv.height=size;const ctx=cv.getContext('2d');fn(ctx,size);const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
const asphTex=procTex((ctx,s)=>{ctx.fillStyle='#2a2a2a';ctx.fillRect(0,0,s,s);for(let i=0;i<800;i++){const g=18+Math.random()*22|0;ctx.fillStyle=`rgb(${g},${g},${g})`;ctx.fillRect(Math.random()*s|0,Math.random()*s|0,1,1);}});asphTex.repeat.set(10,10);
const concTex=procTex((ctx,s)=>{ctx.fillStyle='#999088';ctx.fillRect(0,0,s,s);});concTex.repeat.set(6,6);
const grassTex=procTex((ctx,s)=>{ctx.fillStyle='#4a7838';ctx.fillRect(0,0,s,s);for(let i=0;i<1000;i++){ctx.fillStyle=`rgb(${20+Math.random()*20|0},${85+Math.random()*25|0},${15+Math.random()*15|0})`;ctx.fillRect(Math.random()*s|0,Math.random()*s|0,1,2);}});grassTex.repeat.set(10,10);
const waterTex=procTex((ctx,s)=>{ctx.fillStyle='#0a3a5a';ctx.fillRect(0,0,s,s);for(let i=0;i<600;i++){ctx.fillStyle=`rgba(80,160,210,${0.1+Math.random()*0.2})`;ctx.fillRect(Math.random()*s|0,Math.random()*s|0,Math.random()*5|0,1);}},256);waterTex.repeat.set(6,6);

const metroState={idx:0,prog:0,speed:20,wait:0,atSt:null};
function updateTrain(dt){
  if(metroState.wait>0){metroState.wait-=dt;return;}
  const a=METRO_TRACK[metroState.idx],b=METRO_TRACK[(metroState.idx+1)%METRO_TRACK.length];
  const dx=b.x-a.x,dz=b.z-a.z,sLen=Math.sqrt(dx*dx+dz*dz);
  metroState.prog+=metroState.speed*dt;
  if(metroState.prog>=sLen){
    metroState.idx=(metroState.idx+1)%(METRO_TRACK.length-1);metroState.prog=0;
    const np=METRO_TRACK[metroState.idx];
    const st=METRO_STATIONS.find(s=>Math.abs(s.x-np.x)<2&&Math.abs(s.z-np.z)<2);
    if(st){metroState.wait=3.5;metroState.atSt=st.id;}return;
  }
  const t=metroState.prog/sLen;
  trainGroup.position.set(a.x+dx*t,METRO_Y+.55,a.z+dz*t);
  trainGroup.rotation.y=Math.atan2(dx,dz);
}

}

// MARKERS
const mrkDefs=[{id:'m1',ico:'🪜',lbl:'Grimpe',col:'#f5c842'},{id:'m2',ico:'💧',lbl:'Secret',col:'#4488ff'},{id:'m3',ico:'🔮',lbl:'Magie',col:'#88ccff'},{id:'m4',ico:'🐀',lbl:'Égouts',col:'#80ff40'},{id:'m5',ico:'🚇',lbl:'Métro',col:'#2266cc'},{id:'m6',ico:'⛵',lbl:'Bateau',col:'#3498db'},{id:'m7',ico:'🗼',lbl:'Tour',col:'#f5c000'}];
const mkrEls={};const mkDiv=document.getElementById('markers');
mrkDefs.forEach(d=>{const el=document.createElement('div');el.className='mk';el.innerHTML=`<div class="mk-icon" style="background:rgba(0,0,0,.7);border:2px solid ${d.col}">${d.ico}</div><span class="mk-lbl" style="color:${d.col}">${d.lbl}</span>`;mkDiv.appendChild(el);mkrEls[d.id]=el;});
const MKR_POS={m1:new THREE.Vector3(44.4,1,-18.5),m2:new THREE.Vector3(-45,1.5,45),m3:new THREE.Vector3(60,1.5,-80),m4:new THREE.Vector3(-90,1.5,-70),m5:new THREE.Vector3(-60,METRO_Y,-30),m6:new THREE.Vector3(135,4,-28),m7:new THREE.Vector3(0,60,-160)};
function updateMarkers(){Object.entries(MKR_POS).forEach(([id,pos3])=>{const el=mkrEls[id];if(!el)return;const v=pos3.clone().project(camera);const behind=v.z>1;const x=(v.x+1)/2*window.innerWidth;const y=(1-v.y)/2*window.innerHeight;const dist=pos3.distanceTo(pp);if(!behind&&dist<110&&dist>3){el.classList.add('on');el.style.left=x+'px';el.style.top=y+'px';}else el.classList.remove('on');});}

// ── BOUCLE ────────────────────────────────────────────────
const SPEED=6,BOUND=WORLD-3;
const pp=new THREE.Vector3(0,0,8);
let pRot=0,cameraYaw=Math.PI;
const clock=new THREE.Clock();let time=0;
const blob=new THREE.Mesh(new THREE.CircleGeometry(.45,10),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.18,depthWrite:false}));blob.rotation.x=-Math.PI/2;blob.position.y=.01;scene.add(blob);
const bubElm=document.getElementById('speech-bubble');

// Lazy load voitures GLB après 5 secondes
setTimeout(loadGLBCarsLazy,5000);

finishLoading();renderMissions();

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.07);time+=dt;
  if(avatarMixer)avatarMixer.update(dt);
  updateTrain(dt);updateCars(dt);
  if(inBoat){updateBoat(dt);setWalk(false);}
  // Animations simples
  arrow1.rotation.y=time*2;arrow1.position.y=1.1+.18*Math.sin(time*2);
  arrow2.rotation.y=time*1.5;arrow2.position.y=1.4+.2*Math.sin(time*1.8);
  if(!treasCol)treas.rotation.y=time;
  puddle.material.opacity=.55+.15*Math.sin(time*2);
  [b1,b2,playerBoat].forEach((b,i)=>{if(!inBoat||b!==playerBoat){b.rotation.z=Math.sin(time*.6+i)*.028;b.position.y=-1.2+Math.sin(time*.7+i)*.1;}});

  // INPUT
  let mx=joy.x,mz=-joy.y;
  if(keys['ArrowUp']||keys['w']||keys['W'])mz=1;if(keys['ArrowDown']||keys['s']||keys['S'])mz=-1;
  if(keys['ArrowLeft']||keys['a']||keys['A'])mx=-1;if(keys['ArrowRight']||keys['d']||keys['D'])mx=1;
  if(keys[' ']&&onGround&&!inBoat)doJump();
  if(camJoy.active&&Math.abs(camJoy.x)>.04&&!inBoat)cameraYaw-=camJoy.x*2.1*dt;
  if(keys['q']||keys['Q'])cameraYaw+=1.7*dt;if(keys['e']||keys['E'])cameraYaw-=1.7*dt;
  const moving=Math.abs(mx)>.05||Math.abs(mz)>.05;
  if(moving&&emoteTimer){clearTimeout(emoteTimer);emoteTimer=null;}

  // INTERACTIONS PROXIMITÉ
  if(!inBoat&&!inMetro){
    const nearSt=METRO_STATIONS.find(s=>Math.sqrt((pp.x-s.x)**2+(pp.z-s.z)**2)<5);
    const dBoat=Math.sqrt((pp.x-bX)**2+(pp.z-bZ)**2);
    if(nearSt&&Math.abs(pp.y-METRO_Y)<3){setInteract('🚇 Prendre le métro à '+nearSt.name,()=>{openMetroMenu(nearSt.id);clearInteract();});}
    else if(dBoat<9&&pp.y<3){setInteract('⛵ Monter sur le bateau',()=>{inBoat=true;document.getElementById('boat-hud').classList.add('show');clearInteract();showToast('⛵ Tu pilotes le bateau !','ok');completeMission('boat','Capitaine du port !');});}
    else clearInteract();
  }

  // PHYSIQUE
  if(!inBoat){
    // Échelle
    const dLad=Math.sqrt((pp.x-(LBX+.4))**2+(pp.z-(LBZ+5.5))**2);
    if(dLad<1.4&&!isOnLadder&&mz>.25){isOnLadder=true;ladTopY=LH;showToast('🪜 Monte avec ↑');}
    if(isOnLadder){pp.x=LBX+.4;pp.z=LBZ+5.5;onGround=false;jumpVel=0;if(mz>.18)pp.y=Math.min(pp.y+4*dt,LH+.18);else if(mz<-.18)pp.y=Math.max(pp.y-4*dt,0);if(pp.y<=.08){isOnLadder=false;pp.y=0;onGround=true;}if(pp.y>=LH-.4){isOnLadder=false;onGround=true;pp.x=LBX;pp.z=LBZ;pp.y=LH+.18;completeMission('ladder','Sommet du gratte-ciel atteint !');updMissionP('ladder',1);}setWalk(false);}
    else if(!isInSewer){
      if(moving){const sc=Math.sin(cameraYaw),cc=Math.cos(cameraYaw);const spd=isShrunk?SPEED*.38:SPEED;const dx=(sc*(-mz)+cc*mx)*spd*dt,dz=(cc*(-mz)-sc*mx)*spd*dt;let nx=pp.x+dx,nz=pp.z+dz;if(!isShrunk){const r=resCol(nx,nz,pp.y);nx=r.x;nz=r.z;}pp.x=Math.max(-BOUND,Math.min(BOUND,nx));pp.z=Math.max(-BOUND,Math.min(BOUND,nz));pRot=Math.atan2(dx,dz);const tY=pRot+Math.PI;let diff=tY-cameraYaw;while(diff>Math.PI)diff-=2*Math.PI;while(diff<-Math.PI)diff+=2*Math.PI;cameraYaw+=diff*Math.min(4*dt,1);}
      if(!onGround){jumpVel-=GR*dt;pp.y+=jumpVel*dt;if(pp.y<=0){pp.y=0;jumpVel=0;onGround=true;}}
      if(onGround&&!isOnLadder)setWalk(moving);
    }else{
      if(moving){const sc=Math.sin(cameraYaw),cc=Math.cos(cameraYaw);const dx=(sc*(-mz)+cc*mx)*SPEED*.65*dt,dz=(cc*(-mz)-sc*mx)*SPEED*.65*dt;pp.x=Math.max(-BOUND,Math.min(BOUND,pp.x+dx));pp.z=Math.max(-BOUND,Math.min(BOUND,pp.z+dz));pRot=Math.atan2(dx,dz);const tY=pRot+Math.PI;let diff=tY-cameraYaw;while(diff>Math.PI)diff-=2*Math.PI;while(diff<-Math.PI)diff+=2*Math.PI;cameraYaw+=diff*Math.min(4*dt,1);}
      pp.y=sewerFloorY+.08;onGround=true;jumpVel=0;setWalk(moving);
      sewerCoins.forEach(c=>{if(!c.col){const d=Math.sqrt((pp.x-c.mesh.position.x)**2+(pp.z-c.mesh.position.z)**2);if(d<1.1){c.col=true;c.mesh.visible=false;sewerCols++;showToast(`💚 Capsule ${sewerCols}/5 !`,'ok');updMissionP('sewer',sewerCols);if(sewerCols>=5)completeMission('sewer','Tous les collectibles !');}}});
      if(Math.sqrt((pp.x-EX)**2+(pp.z-EZ)**2)<2.5)exitSewer();
    }
    // Zones
    const dPud=Math.sqrt((pp.x-(-45))**2+(pp.z-45)**2);
    if(dPud<2.4&&!isInSewer&&onGround&&!missions.find(x=>x.id==='puddle')?.done){const m=missions.find(x=>x.id==='puddle');m.done=true;m.p=1;enterSewer();pp.x=EX;pp.z=EZ;pp.y=sewerFloorY+.08;showToast('🌊 Aspiré dans les égouts !','secret');renderMissions();}
    const inWall=Math.abs(pp.x-60)<4.5&&Math.abs(pp.z-(-80))<.7;
    if(inWall&&!isShrunk)enterShrink();
    if(!treasCol&&isShrunk&&Math.sqrt((pp.x-52)**2+(pp.z-(-80))**2)<1.4){treasCol=true;treas.visible=false;showToast('💎 Trésor secret !','ok');}
    if(isShrunk&&Math.abs(pp.x-60)>22){isShrunk=false;document.getElementById('shrink-overlay').classList.remove('active');document.getElementById('zone-label').textContent='東京 Shinjuku';}
    const dSew=Math.sqrt((pp.x-EX)**2+(pp.z-EZ)**2);
    if(dSew<2&&!isInSewer&&onGround){enterSewer();pp.y=sewerFloorY+.08;}
    // Coin tunnel
    const dCoin1=Math.sqrt((pp.x-(-30))**2+(pp.z-45)**2);
    if(dCoin1<1.4&&isInSewer&&coin1.visible){coin1.visible=false;showToast('🪙 Pièce du tunnel !','ok');}
    if(isInSewer&&Math.sqrt((pp.x-(-15))**2+(pp.z-45)**2)<2){exitSewer();pp.y=.08;}
  }

  // AVATAR
  avatarGroup.scale.setScalar(isShrunk?.33:1);
  if(!inBoat){avatarGroup.position.set(pp.x,pp.y,pp.z);avatarGroup.rotation.y=pRot;}
  else{avatarGroup.position.set(bX,4.5,bZ);avatarGroup.rotation.y=bRot;}
  blob.position.set(pp.x,isInSewer?sewerFloorY+.01:.01,pp.z);

  // CAMÉRA
  const cd=inBoat?18:isShrunk?2.8:isInSewer?3.8:8;
  const ch=inBoat?8:isShrunk?.9:isInSewer?1.4:2.5;
  const cl=inBoat?3.5:isShrunk?.4:isInSewer?.4:1.2;
  camera.position.set(pp.x+Math.sin(cameraYaw)*cd,pp.y+ch,pp.z+Math.cos(cameraYaw)*cd);
  camera.lookAt(pp.x,pp.y+cl,pp.z);

  // BULLE
  if(bubElm.style.opacity!=='0'){const v=new THREE.Vector3(pp.x,pp.y+2.2,pp.z).project(camera);bubElm.style.left=((v.x+1)/2*window.innerWidth)+'px';bubElm.style.top=((1-v.y)/2*window.innerHeight-42)+'px';}

  updateMarkers();
  renderer.render(scene,camera);
}
animate();
</script>
