<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Macadam World — Tokyo</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --gold:#f5c842;--orange:#e85d26;--green:#2ecc71;
  --glass:rgba(8,12,24,0.55);--glass-border:rgba(255,255,255,0.13);
  --glass-strong:rgba(8,12,24,0.78);
}
html,body{width:100%;height:100%;overflow:hidden;background:#1a2a4a;font-family:'M PLUS Rounded 1c',sans-serif;user-select:none;-webkit-user-select:none;}
#canvas-container{position:fixed;inset:0;}
canvas{display:block;width:100%!important;height:100%!important;}

/* === HUD === */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;}
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:linear-gradient(180deg,rgba(0,0,0,.6) 0%,transparent 100%);}
.hud-logo{font-family:‘Zen Kaku Gothic New’,sans-serif;font-size:.9rem;font-weight:900;color:#fff;letter-spacing:.05em;text-shadow:0 0 20px rgba(245,200,66,.4);}
.hud-logo em{color:var(–gold);font-style:normal;}
.hud-loc{display:flex;align-items:center;gap:5px;background:var(–glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(–glass-border);border-radius:16px;padding:4px 10px;}
.hud-loc span{font-size:.65rem;font-weight:700;color:#fff;}
.loc-dot{width:6px;height:6px;border-radius:50%;background:var(–gold);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hud-info{display:flex;align-items:center;gap:6px;background:var(–glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(–glass-border);border-radius:16px;padding:4px 10px 4px 4px;}
.hud-pic{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(–orange),var(–gold));display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:900;color:#fff;}
.hud-name{font-size:.65rem;font-weight:700;color:#fff;}

/* === MINIMAP === */
#minimap{position:absolute;top:52px;left:10px;width:120px;height:120px;border-radius:12px;background:var(–glass);border:1.5px solid var(–glass-border);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);overflow:hidden;pointer-events:all;cursor:pointer;transition:all .3s;}
#minimap.expanded{width:320px;height:320px;border-radius:16px;z-index:50;}
#minimap canvas{width:100%;height:100%;}
.minimap-label{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:.45rem;font-weight:700;color:rgba(255,255,255,.5);}
#minimap-tp-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:none;background:rgba(0,0,0,.7);color:var(–gold);font-size:.6rem;font-weight:700;padding:4px 8px;border-radius:8px;pointer-events:none;white-space:nowrap;}
#minimap.expanded #minimap-tp-hint{display:block;}

/* === SIDEBAR MISSIONS === */
#mission-toggle{position:absolute;top:52px;right:10px;width:36px;height:36px;border-radius:50%;background:var(–glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1.5px solid rgba(245,200,66,.5);display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:900;color:var(–gold);cursor:pointer;pointer-events:all;z-index:20;transition:all .2s;}
#mission-toggle:active{transform:scale(.88);}
#mission-badge{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(–orange);font-size:.5rem;font-weight:900;color:#fff;display:flex;align-items:center;justify-content:center;}
#mission-sidebar{position:absolute;top:52px;right:10px;width:200px;max-height:70vh;background:var(–glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1.5px solid var(–glass-border);border-radius:14px;overflow:hidden;pointer-events:all;z-index:19;transform:translateX(220px);transition:transform .3s ease;display:flex;flex-direction:column;}
#mission-sidebar.open{transform:translateX(0);}
.mission-header{padding:8px 12px;border-bottom:1px solid var(–glass-border);display:flex;align-items:center;justify-content:space-between;}
.mission-header span{font-size:.72rem;font-weight:900;color:var(–gold);}
.mission-close{font-size:.8rem;color:rgba(255,255,255,.5);cursor:pointer;padding:2px 4px;}
.mission-list{overflow-y:auto;flex:1;scrollbar-width:none;}
.mission-list::-webkit-scrollbar{display:none;}
.mission-item{padding:6px 10px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05);transition:background .15s;}
.mission-item:hover{background:rgba(245,200,66,.08);}
.mission-item.active-m{background:rgba(245,200,66,.12);}
.mission-title{font-size:.62rem;font-weight:700;color:#fff;}
.mission-desc{font-size:.52rem;color:rgba(255,255,255,.45);margin-top:1px;}
.mission-item .badge{display:inline-block;font-size:.45rem;font-weight:900;padding:1px 5px;border-radius:6px;margin-bottom:2px;}
.badge-new{background:var(–orange);color:#fff;}
.badge-active{background:var(–gold);color:#1a1a00;}
.badge-done{background:#2ecc71;color:#fff;}

/* === CHAT === */
.hud-chat{position:absolute;bottom:170px;left:12px;width:220px;pointer-events:all;}
.chat-messages{max-height:80px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;margin-bottom:4px;scrollbar-width:none;}
.chat-messages::-webkit-scrollbar{display:none;}
.chat-msg{background:var(–glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(–glass-border);border-radius:14px;padding:4px 10px;font-size:.62rem;color:#fff;line-height:1.3;}
.chat-msg .name{font-weight:900;color:var(–gold);margin-right:4px;}
.chat-input-wrap{display:flex;gap:5px;}
.chat-input{flex:1;background:var(–glass);border:1.5px solid var(–glass-border);border-radius:20px;padding:7px 13px;font-size:14px;font-weight:700;color:#fff;outline:none;font-family:‘M PLUS Rounded 1c’,sans-serif;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
.chat-input::placeholder{color:rgba(255,255,255,.35);}
.chat-input:focus{border-color:var(–gold);}
.chat-send{width:36px;height:36px;border-radius:50%;background:var(–orange);border:none;color:#fff;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;pointer-events:all;flex-shrink:0;}

/* === ANIM PANEL === */
#anim-panel{position:absolute;bottom:0;left:0;right:0;pointer-events:all;padding:4px 0 env(safe-area-inset-bottom,8px);background:var(–glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(–glass-border);height:80px;}
#anim-scroll{display:flex;gap:5px;overflow-x:auto;padding:2px 10px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
#anim-scroll::-webkit-scrollbar{display:none;}
.anim-btn{flex-shrink:0;width:56px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.anim-icon{width:54px;height:54px;border-radius:10px;background:rgba(255,255,255,.04);border:1.5px solid var(–glass-border);display:flex;align-items:center;justify-content:center;transition:all .15s;}
.anim-icon svg{width:44px;height:44px;}
.anim-btn.active .anim-icon{background:rgba(245,200,66,.1);border-color:var(–gold);}
.anim-btn:active .anim-icon{transform:scale(.88);}
.anim-label{font-size:.48rem;font-weight:700;color:rgba(255,255,255,.4);text-align:center;}
.anim-btn.active .anim-label{color:var(–gold);}

/* === JOYSTICKS === */
#cam-joystick-zone{position:absolute;bottom:90px;left:10px;width:96px;height:96px;pointer-events:all;}
#joystick-zone{position:absolute;bottom:90px;right:10px;width:96px;height:96px;pointer-events:all;}
.joy-base{width:96px;height:96px;border-radius:50%;background:var(–glass);border:1.5px solid var(–glass-border);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);position:relative;display:flex;align-items:center;justify-content:center;}
.joy-knob{width:38px;height:38px;border-radius:50%;position:absolute;box-shadow:0 2px 10px rgba(0,0,0,.5);}
#super-jump-btn{position:absolute;bottom:196px;left:27px;width:46px;height:46px;border-radius:50%;background:rgba(232,93,38,.85);backdrop-filter:blur(8px);border:1.5px solid rgba(255,120,60,.4);color:#fff;font-size:.95rem;pointer-events:all;cursor:pointer;box-shadow:0 2px 12px rgba(232,93,38,.4);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;z-index:12;}
#jump-btn{position:absolute;bottom:196px;right:27px;width:46px;height:46px;border-radius:50%;background:rgba(43,108,176,.85);backdrop-filter:blur(8px);border:1.5px solid rgba(80,140,220,.4);color:#fff;font-size:1.2rem;pointer-events:all;cursor:pointer;box-shadow:0 2px 12px rgba(43,108,176,.4);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;z-index:12;}

/* === TOAST === */
.toast{position:fixed;bottom:188px;left:50%;transform:translateX(-50%) translateY(14px);background:var(–glass-strong);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(–gold);padding:6px 14px;border:1px solid rgba(245,200,66,.3);border-radius:16px;font-size:.68rem;font-weight:700;opacity:0;transition:all .25s;z-index:50;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* === LOADING === */
#loading-screen{position:fixed;inset:0;z-index:200;background:linear-gradient(135deg,#080e1e,#0f1e38);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .6s;}
#loading-screen.hidden{opacity:0;pointer-events:none;}
.load-logo{font-family:‘Zen Kaku Gothic New’,sans-serif;font-size:2.8rem;font-weight:900;color:#fff;letter-spacing:.06em;text-shadow:0 0 40px rgba(245,200,66,.5);}
.load-logo em{color:var(–gold);font-style:normal;}
.load-sub{font-size:.8rem;color:rgba(255,255,255,.4);letter-spacing:.3em;font-weight:700;}
.load-bar-wrap{width:200px;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;}
.load-bar{height:100%;width:0%;background:linear-gradient(90deg,var(–orange),var(–gold));border-radius:2px;transition:width .2s;}
.load-txt{font-size:.68rem;color:rgba(255,255,255,.5);font-weight:700;}

/* === MISSION POPUP === */
#mission-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.85);background:var(–glass-strong);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1.5px solid rgba(245,200,66,.4);border-radius:18px;padding:18px 22px;z-index:100;pointer-events:all;min-width:240px;opacity:0;transition:all .3s;display:none;}
#mission-popup.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
.mp-title{font-family:‘Zen Kaku Gothic New’,sans-serif;font-size:1rem;font-weight:900;color:var(–gold);margin-bottom:6px;}
.mp-desc{font-size:.72rem;color:rgba(255,255,255,.8);line-height:1.5;margin-bottom:8px;}
.mp-tp{font-size:.65rem;color:rgba(100,200,255,.8);margin-bottom:12px;cursor:pointer;text-decoration:underline;}
.mp-btn{background:var(–orange);color:#fff;border:none;border-radius:20px;padding:7px 18px;font-size:.72rem;font-weight:700;cursor:pointer;font-family:‘M PLUS Rounded 1c’,sans-serif;margin-right:8px;}
.mp-close{background:rgba(255,255,255,.1);color:#fff;border:none;border-radius:20px;padding:7px 14px;font-size:.72rem;font-weight:700;cursor:pointer;font-family:‘M PLUS Rounded 1c’,sans-serif;}

/* === VEHICLE ENTER HINT === */
#vehicle-hint{position:fixed;bottom:250px;left:50%;transform:translateX(-50%);background:var(–glass-strong);backdrop-filter:blur(16px);border:1px solid var(–glass-border);border-radius:12px;padding:5px 14px;font-size:.68rem;font-weight:700;color:#fff;display:none;z-index:30;pointer-events:none;}
</style>

</head>
<body>
<div id="canvas-container"></div>

<div id="loading-screen">
  <div class="load-logo">TOKYO <em>東京</em></div>
  <div class="load-sub">MACADAM WORLD</div>
  <div class="load-bar-wrap"><div class="load-bar" id="load-bar"></div></div>
  <div class="load-txt" id="load-txt">Génération du monde…</div>
</div>

<div id="hud">
  <div class="hud-top">
    <div class="hud-logo">⬡ <em>Macadam</em> World</div>
    <div class="hud-loc"><div class="loc-dot"></div><span id="zone-name">東京 Shinjuku</span></div>
    <div class="hud-info"><div class="hud-pic" id="hud-pic">?</div><span class="hud-name" id="hud-pseudo">Joueur</span></div>
  </div>

  <div id="minimap">
    <canvas id="minimap-canvas" width="320" height="320"></canvas>
    <div class="minimap-label" id="minimap-label">▲ NORD — clic pour agrandir</div>
    <div id="minimap-tp-hint">Clic → Téléporter</div>
  </div>

  <!-- Mission toggle button -->

  <div id="mission-toggle" style="pointer-events:all;">
    !
    <div id="mission-badge">0</div>
  </div>

  <!-- Mission sidebar -->

  <div id="mission-sidebar">
    <div class="mission-header">
      <span>🎯 MISSIONS</span>
      <span class="mission-close" id="mission-close">✕</span>
    </div>
    <div class="mission-list" id="mission-list"></div>
  </div>

  <div class="hud-chat">
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-wrap">
      <input class="chat-input" id="chat-input" type="text" placeholder="Dis quelque chose…" maxlength="80" autocomplete="off"/>
      <button class="chat-send" id="chat-send">▶</button>
    </div>
  </div>

  <div id="cam-joystick-zone">
    <div class="joy-base" id="cam-joy-base">
      <div class="joy-knob" id="cam-joy-knob" style="background:linear-gradient(135deg,#f5c842,#e85d26);"></div>
    </div>
  </div>
  <button id="super-jump-btn">🚀</button>
  <button id="jump-btn">↑</button>
  <div id="joystick-zone">
    <div class="joy-base" id="joy-base">
      <div class="joy-knob" id="joy-knob" style="background:linear-gradient(135deg,#dddddd,#aaaaaa);"></div>
    </div>
  </div>

  <div id="anim-panel"><div id="anim-scroll"></div></div>
</div>

<div class="toast" id="toast"></div>
<div id="vehicle-hint"></div>

<div id="mission-popup">
  <div class="mp-title" id="mp-title"></div>
  <div class="mp-desc" id="mp-desc"></div>
  <div class="mp-tp" id="mp-tp-btn"></div>
  <button class="mp-btn" id="mp-accept">Accepter !</button>
  <button class="mp-close" id="mp-close-btn">Fermer</button>
</div>

<script src="https://unpkg.com/three@0.134.0/build/three.min.js"></script>

<script>
(function(){
  var s=document.createElement('script');
  s.src='https://unpkg.com/three@0.134.0/examples/js/loaders/GLTFLoader.js';
  s.onload=function(){ startGame(); };
  s.onerror=function(){
    THREE.GLTFLoader=function(){};
    THREE.GLTFLoader.prototype.load=function(u,ok,p,err){ if(err)err(new Error('no loader')); };
    startGame();
  };
  document.head.appendChild(s);
})();
</script>

<script>
function startGame(){

const BASE='https://raw.githubusercontent.com/hoobasurf/chili/main/';
const WALK_FILE='course.glb';
const IDLE_FILE='attend.glb';

// ===================== MISSIONS =====================
const MISSIONS=[
  {id:'m1',title:'Explorateur urbain',desc:'Explore les 4 quartiers',badge:'new',done:false,progress:0,total:4,tp:{x:0,z:0}},
  {id:'m2',title:'Bouche d\'égout',desc:'Descends dans les souterrains',badge:'new',done:false,progress:0,total:1,tp:{x:15,z:15}},
  {id:'m3',title:'Central Park',desc:'Atteins le Central Park',badge:'new',done:false,progress:0,total:1,tp:{x:20,z:-60}},
  {id:'m4',title:'Tour Eiffel',desc:'Touche la Tour Eiffel',badge:'new',done:false,progress:0,total:1,tp:{x:-100,z:100}},
  {id:'m5',title:'Noctambule',desc:'Visite un izakaya',badge:'new',done:false,progress:0,total:1,tp:{x:60,z:60}},
  {id:'m6',title:'Métro Express',desc:'Monte dans le métro',badge:'new',done:false,progress:0,total:1,tp:{x:0,z:-40}},
  {id:'m7',title:'Photographe',desc:'Danse devant 3 bâtiments',badge:'new',done:false,progress:0,total:3,tp:{x:40,z:20}},
  {id:'m8',title:'Marin',desc:'Monte sur un bateau',badge:'new',done:false,progress:0,total:1,tp:{x:80,z:-100}},
];
let activeMission=null;
let pendingMissions=MISSIONS.length;

function renderMissions(){
  const list=document.getElementById('mission-list');
  list.innerHTML='';
  let pending=0;
  MISSIONS.forEach(m=>{
    if(!m.done)pending++;
    const d=document.createElement('div');
    d.className='mission-item'+(activeMission===m.id?' active-m':'');
    d.innerHTML=`<span class="badge badge-${m.done?'done':m.badge}">${m.done?'✓':m.badge==='active'?'►':'!'}</span><div class="mission-title">${m.title}</div><div class="mission-desc">${m.done?'Terminée ✓':`${m.progress}/${m.total} — ${m.desc}`}</div>`;
    d.addEventListener('click',()=>showMissionPopup(m));
    list.appendChild(d);
  });
  document.getElementById('mission-badge').textContent=pending;
}

function showMissionPopup(m){
  const popup=document.getElementById('mission-popup');
  document.getElementById('mp-title').textContent=m.title;
  document.getElementById('mp-desc').textContent=m.desc+(m.done?' (Terminée !)':'');
  const tpBtn=document.getElementById('mp-tp-btn');
  tpBtn.textContent=`📍 Téléporter vers cette mission`;
  tpBtn.onclick=()=>{
    teleportTo(m.tp.x,m.tp.z);
    popup.classList.remove('show');
    setTimeout(()=>popup.style.display='none',300);
    showToast('🚀 Téléportation : '+m.title);
  };
  popup.style.display='block';
  requestAnimationFrame(()=>popup.classList.add('show'));
  document.getElementById('mp-accept').onclick=()=>{
    activeMission=m.id;m.badge='active';
    renderMissions();
    popup.classList.remove('show');
    setTimeout(()=>popup.style.display='none',300);
    showToast('Mission : '+m.title);
  };
  document.getElementById('mp-close-btn').onclick=()=>{
    popup.classList.remove('show');
    setTimeout(()=>popup.style.display='none',300);
  };
}
renderMissions();

// Mission toggle
const mToggle=document.getElementById('mission-toggle');
const mSidebar=document.getElementById('mission-sidebar');
mToggle.addEventListener('click',()=>mSidebar.classList.toggle('open'));
document.getElementById('mission-close').addEventListener('click',()=>mSidebar.classList.remove('open'));

function teleportTo(x,z){
  playerState.x=x;playerState.z=z;playerState.y=2;playerState.vy=0;
}

// ===================== PROFILE =====================
function loadProfile(){
  try{
    const uid=localStorage.getItem('macadam_uid')||('p_'+Math.random().toString(36).slice(2,8));
    localStorage.setItem('macadam_uid',uid);
    const s=JSON.parse(localStorage.getItem('macadam_av_'+uid)||'null');
    return{pseudo:s?.pseudo||'Joueur'};
  }catch(e){return{pseudo:'Joueur'};}
}
const profile=loadProfile();
document.getElementById('hud-pseudo').textContent=profile.pseudo;
document.getElementById('hud-pic').textContent=profile.pseudo.slice(0,2).toUpperCase();

// ===================== LOADING =====================
let ldPct=0,ldDone=false;
const ldBar=document.getElementById('load-bar'),ldTxt=document.getElementById('load-txt');
const ldMsgs=['Génération des rues…','Construction des gratte-ciel…','Pose du béton…','Lancement du métro…','Amarrage des bateaux…','Presque prêt…'];
let ldIdx=0;
const ldInt=setInterval(()=>{
  ldPct+=Math.random()*4;
  if(ldPct>88){ldPct=88;clearInterval(ldInt);}
  ldBar.style.width=ldPct+'%';
  const idx=Math.min(Math.floor(ldPct/16),ldMsgs.length-1);
  if(idx>ldIdx){ldIdx=idx;ldTxt.textContent=ldMsgs[ldIdx];}
},200);
function finishLoading(){
  if(ldDone)return;ldDone=true;clearInterval(ldInt);
  ldBar.style.width='100%';ldTxt.textContent='Bienvenue à Tokyo !';
  setTimeout(()=>{
    const l=document.getElementById('loading-screen');
    l.classList.add('hidden');
    setTimeout(()=>l.style.display='none',700);
  },700);
  addChat('☀️ Bienvenue à Tokyo, '+profile.pseudo+' !','Système');
  addChat('🗺️ ! → Missions | 🚇 Metro | ⛵ Bateau','Info');
  addChat('🎮 Joystick G = Caméra, Joystick D = Mouvement','Info');
}
setTimeout(()=>finishLoading(),3500);

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
function addChat(text,from){
  const msgs=document.getElementById('chat-messages');
  const d=document.createElement('div');d.className='chat-msg';
  d.innerHTML=`<span class="name">${from}</span>${text}`;
  msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;
  while(msgs.children.length>20)msgs.removeChild(msgs.firstChild);
}
function sendChat(){const inp=document.getElementById('chat-input');const m=inp.value.trim();if(!m)return;inp.value='';addChat(m,profile.pseudo);}
document.getElementById('chat-send').addEventListener('click',sendChat);
document.getElementById('chat-input').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendChat();}});

// ===================== RENDERER =====================
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;

function procTex(fn,size){
  size=size||256;
  const cv=document.createElement('canvas');cv.width=cv.height=size;
  const ctx=cv.getContext('2d');fn(ctx,size);
  const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}

const asphaltTex=procTex((ctx,s)=>{
  ctx.fillStyle='#1c1c1c';ctx.fillRect(0,0,s,s);
  for(let i=0;i<8000;i++){const g=14+(Math.random()*22|0);ctx.fillStyle=`rgb(${g},${g},${g})`;ctx.fillRect(Math.random()*s|0,Math.random()*s|0,1+(Math.random()<0.1?1:0),1);}

  ctx.strokeStyle='rgba(80,80,80,0.3)';ctx.lineWidth=0.5;

// Panneau signe
function makeSignTex(col,txt,sub){
  return procTex((ctx,s)=>{
    const g=ctx.createLinearGradient(0,0,0,s);
    g.addColorStop(0,col);g.addColorStop(1,shadeColor(col,-30));
    ctx.fillStyle=g;ctx.fillRect(0,0,s,s);
    ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=4;
    ctx.fillStyle='rgba(255,255,255,0.92)';
    ctx.font=`bold ${s*0.26}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(txt,s/2,s*0.42);
    if(sub){ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font=`bold ${s*0.1}px sans-serif`;ctx.fillText(sub,s/2,s*0.72);}
    ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=3;ctx.strokeRect(3,3,s-6,s-6);
  });
}
function shadeColor(hex,pct){
  let r=parseInt(hex.slice(1,3),16),g2=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  r=Math.max(0,Math.min(255,r+pct));g2=Math.max(0,Math.min(255,g2+pct));b=Math.max(0,Math.min(255,b+pct));
  return`#${r.toString(16).padStart(2,'0')}${g2.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}

const colliders=[];
function addCol(cx,cz,hw,hd,mH){colliders.push({minX:cx-hw,maxX:cx+hw,minZ:cz-hd,maxZ:cz+hd,mH:mH||200});}
const sewerColliders=[];

const PR=0.55;
function resolveCollisions(nx,nz,py,cols){
  for(let i=0;i<cols.length;i++){
    const c=cols[i];
    if(py>=(c.mH||200))continue;
    const px=Math.max(c.minX,Math.min(c.maxX,nx));
    const pz=Math.max(c.minZ,Math.min(c.maxZ,nz));
    const dx=nx-px,dz=nz-pz,d=Math.sqrt(dx*dx+dz*dz);
    if(d<PR){nx+=d<0.001?PR:(dx/d)*(PR-d);nz+=d<0.001?0:(dz/d)*(PR-d);}
  }
  return{x:nx,z:nz};
}

const leafPalette=[0x2d5a1e,0x3a6a22,0x254d18,0x4a7828,0x3d6830,0x5a8a30,0x1e4418,0x486020];
function makeTree(x,z,variant){
  variant=variant||0;
  const h=3.5+Math.random()*2.5;
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.1+(variant%3)*0.04,0.18,h,8),matBark);
  trunk.castShadow=true;trunk.position.set(x,h/2,z);scene.add(trunk);
  const leafMat=new THREE.MeshStandardMaterial({color:leafPalette[variant%leafPalette.length],roughness:0.95});
  const r=1.3+Math.random()*0.9;
  if(variant%3===0){// Sphérique
    const leaf=new THREE.Mesh(new THREE.SphereGeometry(r,8,6),leafMat);leaf.castShadow=true;leaf.position.set(x,h+r*0.5,z);scene.add(leaf);
    const leaf2=new THREE.Mesh(new THREE.SphereGeometry(r*0.7,7,5),leafMat);leaf2.castShadow=true;leaf2.position.set(x+r*0.45,h+r*0.3,z+r*0.2);scene.add(leaf2);
  }else if(variant%3===1){// Cône
    const leaf=new THREE.Mesh(new THREE.ConeGeometry(r*1.1,r*2.2,8),leafMat);leaf.castShadow=true;leaf.position.set(x,h+r*0.9,z);scene.add(leaf);
  }else{// Étalé
    for(let i=0;i<3;i++){
      const lr=new THREE.Mesh(new THREE.SphereGeometry(r*0.75,7,5),leafMat);lr.castShadow=true;
      lr.position.set(x+Math.cos(i*2.1)*r*0.7,h+r*0.3+i*0.4,z+Math.sin(i*2.1)*r*0.7);
      scene.add(lr);
    }
  }
  addCol(x,z,0.28,0.28);
}

function makeBuilding(x,z,w,h,d,styleIdx,roofStyle){
  styleIdx=styleIdx||0;
  const wallMat=styleIdx===99?matGlass:buildingWallMats[styleIdx%buildingWallMats.length].clone();

  const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),wallMat);
  body.castShadow=true;body.receiveShadow=true;body.position.set(x,h/2,z);scene.add(body);
  // Windows overlay
  if(styleIdx!==99){
    const wCols=Math.max(1,Math.floor(w/3.5));
    const wRows=Math.max(1,Math.floor(h/4));
    const winMat=new THREE.MeshStandardMaterial({color:0x4488aa,roughness:0.05,metalness:0.7,emissive:new THREE.Color(0x112233),emissiveIntensity:0.3});
    for(let r=0;r<wRows;r++)for(let c=0;c<wCols;c++){
      const wx=-w/2+1.5+c*(w-2)/(Math.max(wCols-1,1)||1);

  const signMat=new THREE.MeshStandardMaterial({map:signTextures[Math.abs(Math.round(x*0.3+z*0.7))%signTextures.length],roughness:0.5});
  const sw2=Math.min(w*0.55,4.5),sh=sw2*1.1;

function fillBlock(bx,bz,type){
  if(type==='park'){fillCentralPark(bx,bz);return;}
  if(type==='skyscraper'){
    makeSkyscraper(bx,bz,20+Math.random()*10,40+Math.random()*40,20+Math.random()*10);
    for(let i=0;i<4;i++)makeBush(bx+(Math.random()-.5)*28,bz+(Math.random()-.5)*28);
    return;
  }
  if(type==='hospital'){makeHospital(bx,bz);return;}
  if(type==='police'){makePoliceStation(bx,bz);return;}
  if(type==='fire'){makeFireStation(bx,bz);return;}
  if(type==='buildings'){
    const h=8+Math.random()*16;
    const roofS=Math.floor(Math.random()*3);
    makeBuilding(bx,bz,20+Math.random()*10,h,20+Math.random()*10,Math.floor(Math.random()*5),roofS);

    }
    return;
  }
  if(type==='shops'){
    for(let i=0;i<3;i++)for(let j=0;j<2;j++){
      makeBuilding(bx-10+i*10,bz-6+j*13,9,4+Math.random()*3,8,Math.floor(Math.random()*4),j===0?1:0);
    }
    return;
  }

    makeBuilding(bx+11,bz+10,9,5+Math.random()*4,8,Math.floor(Math.random()*4),2);

  if(type==='garden'){
    makeGrassPatch(bx,bz,32,32);

    for(let i=0;i<6;i++)makeBush(bx+(Math.random()-.5)*22,bz+(Math.random()-.5)*22);
    return;
  }
}

// ===================== MÉTRO AÉRIEN =====================
const metroTrain={group:null,t:0,speed:0.0018,onBoard:false};
function makeMetroSystem(){
  const trackMat=new THREE.MeshStandardMaterial({color:0x555555,roughness:0.5,metalness:0.6});
  const pillarMat=new THREE.MeshStandardMaterial({color:0x888888,roughness:0.5,metalness:0.4});
  // Points de la ligne de métro
  const metroPath=[
    {x:-130,z:-40},{x:-80,z:-40},{x:-40,z:-40},{x:0,z:-40},
    {x:40,z:-40},{x:80,z:-40},{x:130,z:-40}
  ];
  const metroY=12; // hauteur des rails
  // Rails + piliers
  for(let i=0;i<metroPath.length-1;i++){
    const A=metroPath[i],B=metroPath[i+1];
    const dx=B.x-A.x,dz=B.z-A.z;
    const len=Math.sqrt(dx*dx+dz*dz);
    const cx2=(A.x+B.x)/2,cz2=(A.z+B.z)/2;
    // Rail gauche
    const railL=new THREE.Mesh(new THREE.BoxGeometry(len,0.2,0.25),trackMat);
    railL.position.set(cx2,metroY,cz2-1);railL.rotation.y=Math.atan2(dz,dx);scene.add(railL);
    // Rail droit
    const railR=railL.clone();railR.position.set(cx2,metroY,cz2+1);scene.add(railR);
    // Traverse
    const steps=Math.floor(len/4);
    for(let s=0;s<=steps;s++){
      const t=s/steps;
      const tx=A.x+dx*t,tz=A.z+dz*t;
      const tie=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.1,2.5),trackMat);
      tie.position.set(tx,metroY-0.15,tz);scene.add(tie);
    }
    // Piliers tous les 20m
    for(let s=0;s<=len;s+=20){
      const t=s/len;
      const tx=A.x+dx*t,tz=A.z+dz*t;
      const pillar=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.6,metroY,8),pillarMat);
      pillar.position.set(tx,metroY/2,tz);pillar.castShadow=true;scene.add(pillar);
      addCol(tx,tz,0.7,0.7);
    }
  }
  // Stations
  const stations=[metroPath[0],metroPath[3],metroPath[6]];
  stations.forEach(st=>{
    const stationMat=new THREE.MeshStandardMaterial({color:0xdddddd,roughness:0.7});
    const platform=new THREE.Mesh(new THREE.BoxGeometry(18,0.5,5),stationMat);
    platform.position.set(st.x,metroY+0.25,st.z);scene.add(platform);
    const roof=new THREE.Mesh(new THREE.BoxGeometry(20,0.3,7),new THREE.MeshStandardMaterial({color:0x336699,roughness:0.5,metalness:0.4,transparent:true,opacity:0.7}));
    roof.position.set(st.x,metroY+4,st.z);scene.add(roof);
    // Escaliers
    for(let step=0;step<8;step++){
      const s=new THREE.Mesh(new THREE.BoxGeometry(3,0.2,1),stationMat);
      s.position.set(st.x+7,step*1.5,st.z);scene.add(s);
    }
  });
  // Train
  const trainGroup=new THREE.Group();
  const carMat=new THREE.MeshStandardMaterial({color:0xddeeee,roughness:0.3,metalness:0.5});
  const stripeM=new THREE.MeshStandardMaterial({color:0x2244aa,roughness:0.5});
  for(let car=0;car<3;car++){
    const body2=new THREE.Mesh(new THREE.BoxGeometry(12,3,3),carMat);body2.position.set(car*13,0,0);body2.castShadow=true;trainGroup.add(body2);
    const stripe=new THREE.Mesh(new THREE.BoxGeometry(12,0.6,3.01),stripeM);stripe.position.set(car*13,0.8,0);trainGroup.add(stripe);
    const windshield=new THREE.Mesh(new THREE.BoxGeometry(0.1,2,2.4),new THREE.MeshStandardMaterial({color:0x88aacc,roughness:0.05,transparent:true,opacity:0.6}));
    windshield.position.set(car*13+(car===0?-6:6),0.2,0);trainGroup.add(windshield);
  }
  trainGroup.position.set(metroPath[0].x,metroY+2,metroPath[0].z);
  scene.add(trainGroup);
  metroTrain.group=trainGroup;
  metroTrain.path=metroPath;
  metroTrain.pathLength=metroPath.length;
}
makeMetroSystem();

function makeBridge(x1,z1,x2,z2){
  const dx=x2-x1,dz=z2-z1;
  const len=Math.sqrt(dx*dx+dz*dz);
  const cx2=(x1+x2)/2,cz2=(z1+z2)/2;
  const angle=Math.atan2(dz,dx);
  const bridgeMat=new THREE.MeshStandardMaterial({color:0x888888,roughness:0.6,metalness:0.5});
  const deck=new THREE.Mesh(new THREE.BoxGeometry(len,0.5,12),bridgeMat);
  deck.position.set(cx2,0.25,cz2);deck.rotation.y=-angle;deck.castShadow=true;deck.receiveShadow=true;scene.add(deck);
  // Garde-fous
  [-5,5].forEach(side=>{
    const rail=new THREE.Mesh(new THREE.BoxGeometry(len,1.2,0.2),matRailing);
    rail.position.set(cx2,0.8,cz2+side);rail.rotation.y=-angle;scene.add(rail);
  });
  // Pylônes
  [0.2,0.8].forEach(t=>{
    const px=x1+dx*t,pz=z1+dz*t;
    const pylon=new THREE.Mesh(new THREE.BoxGeometry(1.5,14,1.5),bridgeMat);
    pylon.position.set(px,7,pz);pylon.castShadow=true;scene.add(pylon);
    const cable=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,len*0.4,4),matRailing);
    cable.position.set(px,10,pz);cable.rotation.z=Math.PI/5;scene.add(cable);
    addCol(px,pz,1,1);
  });
}

function makeCar(type){
  const col=type==='police'?SPECIAL_COLORS.police:type==='fire'?SPECIAL_COLORS.fire:type==='taxi'?SPECIAL_COLORS.taxi:CAR_COLORS[Math.floor(Math.random()*CAR_COLORS.length)];
  const carMat=new THREE.MeshStandardMaterial({color:col,roughness:0.12,metalness:0.9});
  const glassMat2=new THREE.MeshStandardMaterial({color:0x90b8d0,roughness:0.04,metalness:0.5,transparent:true,opacity:0.6});
  const g=new THREE.Group();
  const bodyW=type==='fire'?2.2:2.0,bodyL=type==='fire'?5.5:type==='police'?4.6:4.4;
  const body=new THREE.Mesh(new THREE.BoxGeometry(bodyW,0.65,bodyL),carMat);body.position.set(0,0.52,0);body.castShadow=true;g.add(body);
  const cab=new THREE.Mesh(new THREE.BoxGeometry(bodyW*0.85,0.52,bodyL*0.55),carMat);cab.position.set(0,1.08,0.15);cab.castShadow=true;g.add(cab);
  const ws=new THREE.Mesh(new THREE.BoxGeometry(bodyW*0.82,0.44,0.06),glassMat2);ws.position.set(0,1.06,bodyL*0.28);g.add(ws);
  if(type==='police'){
    const bar=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.2,0.5),new THREE.MeshStandardMaterial({color:0x4488ff,emissive:new THREE.Color(0x2244cc),emissiveIntensity:0.8,roughness:0.2}));
    bar.position.set(0,1.6,0.15);g.add(bar);
  }
  if(type==='fire'){
    const ladder=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.2,4.5),new THREE.MeshStandardMaterial({color:0x888888,metalness:0.7}));
    ladder.position.set(0,1.5,0);g.add(ladder);
  }
  const wheelMat2=new THREE.MeshStandardMaterial({color:0x111111,roughness:0.9});
  const wheelMeshes=[];
  [[-1.05,0.32,1.4],[1.05,0.32,1.4],[-1.05,0.32,-1.4],[1.05,0.32,-1.4]].forEach(wp=>{

  g.userData.vehicleType='car';
  return{group:g,wheelMeshes};
}

function spawnCar(routeIdx,type){
  const route=carRoutes[routeIdx];
  const {group,wheelMeshes}=makeCar(type||'normal');
  const t=Math.random();
  const s=route[0],e=route[route.length-1];
  group.position.set(s.x+(e.x-s.x)*t,0,s.z+(e.z-s.z)*t);
  const dx=e.x-s.x,dz=e.z-s.z;
  group.rotation.y=Math.atan2(dx,dz);
  scene.add(group);
  movingCars.push({group,route,t,speed:8+Math.random()*6,wheels:wheelMeshes,len:Math.sqrt(dx*dx+dz*dz)});
}

function loadAnim(file,cb){
  if(!file){cb({scene:new THREE.Group(),animations:[]});return;}
  if(animCache[file]){cb(animCache[file]);return;}
  try{loader.load(BASE+file,glb=>{animCache[file]=glb;cb(glb);},null,err=>{cb({scene:new THREE.Group(),animations:[]});});}
  catch(e){cb({scene:new THREE.Group(),animations:[]});}
}
function playAnim(file){
  loadAnim(file,glb=>{
    if(glb.animations?.length>0&&playerModel&&!playerModel.userData.isProcedural){
      playerMixer=new THREE.AnimationMixer(playerModel);
      if(currentAction)currentAction.stop();
      currentAction=playerMixer.clipAction(glb.animations[0]);currentAction.play();
    }
  });
}

  if(!playerModel)return;

const joyState={x:0,z:0,active:false,id:-1};
const camJoyState={x:0,y:0,active:false,id:-1};
const joyBase=document.getElementById('joy-base'),joyKnob=document.getElementById('joy-knob');
const camJoyBase=document.getElementById('cam-joy-base'),camJoyKnob=document.getElementById('cam-joy-knob');
const JR=42;

function joyInput(e,base,knob,state,isCam){
  e.preventDefault();
  const touches=e.changedTouches;
  for(let i=0;i<touches.length;i++){
    const t=touches[i];
    if(e.type==='touchstart'){
      const r=base.getBoundingClientRect();
      const dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2);
      if(Math.sqrt(dx*dx+dy*dy)<r.width/2){state.active=true;state.id=t.identifier;}
    }
    if(state.active&&t.identifier===state.id){
      const r=base.getBoundingClientRect();
      let dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2);
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist>JR){dx*=JR/dist;dy*=JR/dist;}
      knob.style.transform=`translate(${dx}px,${dy}px)`;
      if(isCam){state.x=dx/JR;state.y=dy/JR;}
      else{state.x=dx/JR;state.z=dy/JR;}
    }
    if((e.type==='touchend'||e.type==='touchcancel')&&t.identifier===state.id){
      state.active=false;state.id=-1;state.x=0;state.z=0;state.y=0;
      knob.style.transform='translate(0,0)';
    }
  }
}
['touchstart','touchmove','touchend','touchcancel'].forEach(ev=>{
  joyBase.addEventListener(ev,e=>joyInput(e,joyBase,joyKnob,joyState,false),{passive:false});
  camJoyBase.addEventListener(ev,e=>joyInput(e,camJoyBase,camJoyKnob,camJoyState,true),{passive:false});
});

let minimapExpanded=false;
document.getElementById('minimap').addEventListener('click',e=>{
  if(minimapExpanded){
    // Téléportation : calculer coord monde depuis clic
    const rect=e.currentTarget.getBoundingClientRect();
    const mx=e.clientX-rect.left,my=e.clientY-rect.top;
    const MM=minimapExpanded?320:120;
    const MM_SCALE=MM/380;
    const wx=(mx-MM/2)/MM_SCALE+playerState.x;
    const wz=(my-MM/2)/MM_SCALE+playerState.z;
    teleportTo(wx,wz);
    showToast(`📍 Téléportation (${wx.toFixed(0)}, ${wz.toFixed(0)})`);
  }else{
    minimapExpanded=true;
    e.currentTarget.classList.add('expanded');
    document.getElementById('minimap-label').textContent='Clic = Téléporter — clic hors = fermer';
  }
});
document.addEventListener('click',e=>{
  if(minimapExpanded&&!e.target.closest('#minimap')){
    minimapExpanded=false;
    document.getElementById('minimap').classList.remove('expanded');
    document.getElementById('minimap-label').textContent='▲ NORD — clic pour agrandir';
  }
});

function drawMinimap(){
  const MM=minimapExpanded?320:120;
  mmCanvas.width=MM;mmCanvas.height=MM;
  const MM_SCALE=MM/380;
  mmCtx.fillStyle='#0a1018';mmCtx.fillRect(0,0,MM,MM);
  const cx=MM/2-playerState.x*MM_SCALE;
  const cz=MM/2-playerState.z*MM_SCALE;
  // Routes
  mmCtx.strokeStyle='#2a3040';mmCtx.lineWidth=minimapExpanded?6:3;
  [-120,-80,-40,0,40,80,120].forEach(ax=>{
    mmCtx.beginPath();mmCtx.moveTo(0,cz+ax*MM_SCALE);mmCtx.lineTo(MM,cz+ax*MM_SCALE);mmCtx.stroke();
    mmCtx.beginPath();mmCtx.moveTo(cx+ax*MM_SCALE,0);mmCtx.lineTo(cx+ax*MM_SCALE,MM);mmCtx.stroke();
  });
  // Mer
  mmCtx.fillStyle='#1a3a5a';
  mmCtx.fillRect(0,cz-220*MM_SCALE,MM,(220-120)*MM_SCALE);
  // Parc
  mmCtx.fillStyle='#1a4a10';
  mmCtx.fillRect(cx+4*MM_SCALE,cz-80*MM_SCALE,20*MM_SCALE,20*MM_SCALE);
  // Tour Eiffel
  mmCtx.fillStyle='#8a7050';
  mmCtx.beginPath();mmCtx.arc(cx-100*MM_SCALE,cz+100*MM_SCALE,4*MM_SCALE,0,Math.PI*2);mmCtx.fill();
  if(minimapExpanded){mmCtx.fillStyle='rgba(255,255,255,0.6)';mmCtx.font='9px sans-serif';mmCtx.fillText('🗼',cx-100*MM_SCALE-5,cz+100*MM_SCALE+4);}
  // Missions
  MISSIONS.forEach(m=>{
    if(m.done)return;
    mmCtx.fillStyle=activeMission===m.id?'#f5c842':'#ff6633';
    mmCtx.beginPath();mmCtx.arc(cx+m.tp.x*MM_SCALE,cz+m.tp.z*MM_SCALE,minimapExpanded?5:3,0,Math.PI*2);mmCtx.fill();
    if(minimapExpanded){mmCtx.fillStyle='rgba(255,255,255,0.7)';mmCtx.font='8px sans-serif';mmCtx.fillText('!',cx+m.tp.x*MM_SCALE-2,cz+m.tp.z*MM_SCALE+3);}
  });
  // NPC
  mmCtx.fillStyle='#4488ff';
  npcs.slice(0,15).forEach(n=>{
    const nx=cx+n.group.position.x*MM_SCALE,nz=cz+n.group.position.z*MM_SCALE;
    if(nx>0&&nx<MM&&nz>0&&nz<MM){mmCtx.beginPath();mmCtx.arc(nx,nz,1.5,0,Math.PI*2);mmCtx.fill();}
  });
  // Cars
  mmCtx.fillStyle='#ff4422';
  movingCars.forEach(c=>{
    const vx=cx+c.group.position.x*MM_SCALE,vz=cz+c.group.position.z*MM_SCALE;
    if(vx>0&&vx<MM&&vz>0&&vz<MM)mmCtx.fillRect(vx-1.5,vz-1.5,3,3);
  });
  // Joueur
  mmCtx.fillStyle='#f5c842';
  mmCtx.beginPath();mmCtx.arc(MM/2,MM/2,5,0,Math.PI*2);mmCtx.fill();
  mmCtx.strokeStyle='#f5c842';mmCtx.lineWidth=2;
  mmCtx.beginPath();mmCtx.moveTo(MM/2,MM/2);
  mmCtx.lineTo(MM/2+Math.sin(playerState.angle)*10,MM/2-Math.cos(playerState.angle)*10);
  mmCtx.stroke();
}

// ===================== GAMEPLAY =====================
const clock=new THREE.Clock();
const GRAVITY=18,PLAYER_SPEED=8,PLAYER_RUN_SPEED=15,NPC_WANDER=20;
let sewerTransitioning=false,lastZone='';

function updateMovingCars(dt){
  movingCars.forEach(car=>{
    car.t+=(car.speed*dt)/car.len;
    if(car.t>1)car.t-=1;
    const s=car.route[0],e=car.route[car.route.length-1];
    car.group.position.x=s.x+(e.x-s.x)*car.t;
    car.group.position.z=s.z+(e.z-s.z)*car.t;
    car.wheels.forEach(w=>w.rotation.x+=car.speed*dt*2);
  });
}

function updateMetroTrain(dt){
  if(!metroTrain.group||!metroTrain.path)return;
  metroTrain.t+=metroTrain.speed;
  if(metroTrain.t>=1)metroTrain.t=0;
  const path=metroTrain.path;
  const seg=(path.length-1)*metroTrain.t;
  const segIdx=Math.min(Math.floor(seg),path.length-2);
  const segT=seg-segIdx;
  const A=path[segIdx],B=path[segIdx+1];
  const tx=A.x+(B.x-A.x)*segT;
  const tz=A.z+(B.z-A.z)*segT;
  metroTrain.group.position.set(tx,13,tz);
  metroTrain.group.rotation.y=Math.atan2(B.x-A.x,B.z-A.z);
  // Si joueur sur le métro, on le suit
  if(playerState.onMetro){
    playerState.x=tx;playerState.z=tz;playerState.y=15.5;
  }
}

function updateBoats(dt){
  boats.forEach(b=>{
    b.t+=dt*b.speed;
    b.group.position.x=b.baseX+Math.sin(b.t)*b.amplitude*b.dir;
    b.group.position.y=-0.5+Math.sin(b.t*2)*0.15;
    b.group.rotation.y=Math.cos(b.t*0.5)*0.08;
    b.group.rotation.z=Math.sin(b.t)*0.03;
  });
}

function updateNPCs(dt){
  npcs.forEach(npc=>{
    npc.turnTimer-=dt;
    if(npc.turnTimer<0){
      npc.turnTimer=1.5+Math.random()*3;
      const a=Math.random()*Math.PI*2,sp=0.5+Math.random()*1.0;
      npc.vx=Math.cos(a)*sp*0.016;npc.vz=Math.sin(a)*sp*0.016;
    }
    const nx=npc.group.position.x+npc.vx,nz=npc.group.position.z+npc.vz;
    const dx=nx-npc.startX,dz=nz-npc.startZ;
    if(Math.sqrt(dx*dx+dz*dz)>NPC_WANDER){npc.vx*=-1;npc.vz*=-1;}
    else{npc.group.position.x=nx;npc.group.position.z=nz;}
    npc.group.rotation.y=Math.atan2(npc.vx,npc.vz);
    npc.phase+=dt*4;
    const sw=Math.sin(npc.phase)*0.28;
    npc.legL.rotation.x=sw;npc.legR.rotation.x=-sw;
    npc.armL.rotation.x=-sw*0.6;npc.armR.rotation.x=sw*0.6;
  });
}

function updatePlayer(dt){
  // Joystick caméra gauche
  if(camJoyState.active){
    camState.targetYaw+=camJoyState.x*dt*2.4;
    camState.targetPitch=Math.max(0.1,Math.min(0.88,camState.targetPitch+camJoyState.y*dt*1.3));
    camState.autoFollow=false;
  }
  camState.yaw+=(camState.targetYaw-camState.yaw)*0.12;
  camState.pitch+=(camState.targetPitch-camState.pitch)*0.1;

  // Joystick droite = mouvement
  let dx=0,dz=0;
  const run=keys['ShiftLeft']||keys['ShiftRight'];
  const spd=run?PLAYER_RUN_SPEED:PLAYER_SPEED;
  if(joyState.active){dx+=joyState.x;dz+=joyState.z;}
  if(keys['ArrowUp']||keys['KeyW'])dz-=1;
  if(keys['ArrowDown']||keys['KeyS'])dz+=1;
  if(keys['ArrowLeft']||keys['KeyA'])dx-=1;
  if(keys['ArrowRight']||keys['KeyD'])dx+=1;
  if(keys['Space']&&playerState.onGround&&!playerState.inVehicle){playerState.vy=7.5;playerState.onGround=false;}

  // Convertir input joystick en direction monde (relative à la caméra)
  const cos=Math.cos(camState.yaw),sin=Math.sin(camState.yaw);
  const wx=dx*cos+dz*sin;
  const wz=-dx*sin+dz*cos;
  const len=Math.sqrt(wx*wx+wz*wz);
  let moved=false;

  if(len>0.01&&!playerState.inVehicle&&!playerState.onMetro){
    const nx=wx/len,nz=wz/len;
    const speed=spd*Math.min(len,1)*dt;
    const npx=playerState.x+nx*speed,npz=playerState.z+nz*speed;
    const cols=playerState.inSewer?sewerColliders:colliders;
    const res=resolveCollisions(npx,npz,playerState.y,cols);
    playerState.x=res.x;playerState.z=res.z;
    playerState.angle=Math.atan2(nx,nz);
    // Caméra suit le joueur automatiquement (douce)
    if(camState.autoFollow||!camJoyState.active){
      camState.targetYaw=playerState.angle;
      camState.autoFollow=true;
    }
    moved=true;
  }

  // Réactivation auto-follow quand plus de mouvement caméra joystick
  if(!camJoyState.active)camState.autoFollow=true;

  // Gravité
  if(!playerState.inVehicle&&!playerState.onMetro){
    const floorY=playerState.inSewer?SEWER_Y:0;
    playerState.vy-=GRAVITY*dt;
    playerState.y+=playerState.vy*dt;
    if(playerState.y<=floorY){playerState.y=floorY;playerState.vy=0;playerState.onGround=true;}
  }

  // Interaction souterrain
  const distToHole=Math.sqrt((playerState.x-sewerHole.x)**2+(playerState.z-sewerHole.z)**2);
  if(distToHole<2.2&&!playerState.inSewer){
    showVehicleHint('[ E ] Descendre dans l\'égout');
    if(keys['KeyE']&&!sewerTransitioning){
      sewerTransitioning=true;
      showToast('⬇ Descente…');
      setTimeout(()=>{playerState.inSewer=true;playerState.y=SEWER_Y;playerState.vy=0;playerState.x=sewerHole.x;playerState.z=sewerHole.z;sewerTransitioning=false;scene.fog=new THREE.Fog(0x061206,8,40);scene.background=new THREE.Color(0x050e05);document.getElementById('zone-name').textContent='🐀 Souterrain';addChat('🐀 Tu es dans les souterrains !','Système');checkMission('m2');},600);
    }
  }else if(distToHole<2.5&&playerState.inSewer){
    showVehicleHint('[ E ] Remonter');
    if(keys['KeyE']&&!sewerTransitioning){
      sewerTransitioning=true;
      showToast('⬆ Remontée…');
      setTimeout(()=>{playerState.inSewer=false;playerState.y=0.5;playerState.vy=3;playerState.x=sewerHole.x;playerState.z=sewerHole.z;sewerTransitioning=false;scene.fog=new THREE.Fog(0x9ec2dc,140,380);scene.background=new THREE.Color(0x6a9cc8);document.getElementById('zone-name').textContent='東京 Shinjuku';},600);
    }
  }

  // Interaction métro
  if(metroTrain.group&&!playerState.inSewer){
    const mtPos=metroTrain.group.position;
    const distToMetro=Math.sqrt((playerState.x-mtPos.x)**2+(playerState.z-mtPos.z)**2);
    if(distToMetro<8&&!playerState.onMetro&&playerState.y>8){
      showVehicleHint('[ E ] Monter dans le métro');
      if(keys['KeyE']){playerState.onMetro=true;showToast('🚇 Dans le métro !');addChat('🚇 Tu es monté dans le métro !','Système');checkMission('m6');}
    }else if(playerState.onMetro){
      showVehicleHint('[ E ] Descendre du métro');
      if(keys['KeyE']){playerState.onMetro=false;playerState.y=metroTrain.group.position.y-5;playerState.vy=-2;showToast('🚇 Descendu du métro');}
    }
  }

  // Interaction bateaux
  if(!playerState.inSewer&&!playerState.onMetro){
    let nearBoat=null;
    boats.forEach((b,i)=>{
      const bp=b.group.position;
      const dist=Math.sqrt((playerState.x-bp.x)**2+(playerState.z-bp.z)**2);
      if(dist<12)nearBoat=i;
    });
    if(nearBoat!==null&&playerState.onBoat===null){
      showVehicleHint('[ E ] Monter sur le bateau');
      if(keys['KeyE']){playerState.onBoat=nearBoat;showToast('⛵ Sur le bateau !');addChat('⛵ Tu navigues !','Système');checkMission('m8');}
    }else if(playerState.onBoat!==null){
      const b=boats[playerState.onBoat];
      playerState.x=b.group.position.x;playerState.z=b.group.position.z;playerState.y=b.group.position.y+3;
      showVehicleHint('[ E ] Descendre du bateau');
      if(keys['KeyE']){playerState.onBoat=null;playerState.y=1;playerState.vy=1;showToast('⛵ Descendu du bateau');}
    }
  }

  updateZone();

  // Anim auto
  if(moved&&playerState.onGround&&playerState.currentAnim==='idle'){
    playerState.currentAnim='walk';
    document.querySelectorAll('.anim-btn').forEach((b,i)=>b.classList.toggle('active',i===1));
    playAnim(WALK_FILE);
  }
  if(!moved&&playerState.onGround&&playerState.currentAnim==='walk'){
    playerState.currentAnim='idle';
    document.querySelectorAll('.anim-btn').forEach((b,i)=>b.classList.toggle('active',i===0));
    playAnim(IDLE_FILE);
  }
}

let vehicleHintTimer=0;
function showVehicleHint(msg){
  const h=document.getElementById('vehicle-hint');
  h.textContent=msg;h.style.display='block';
  vehicleHintTimer=60;
}
function tickVehicleHint(){
  if(vehicleHintTimer>0){vehicleHintTimer--;if(vehicleHintTimer===0)document.getElementById('vehicle-hint').style.display='none';}
}

function updateZone(){
  const x=playerState.x,z=playerState.z;
  let zone='東京 Shinjuku';
  if(x>40&&z<0)zone='東京 Shibuya';
  else if(x<-40&&z>0)zone='東京 Akihabara';
  else if(x>40&&z>40)zone='東京 Harajuku';
  else if(x>0&&z<-60)zone='🌳 Central Park';
  else if(z<-120)zone='⛵ Port de Tokyo';
  else if(x<-80&&z>80)zone='🗼 Tour Eiffel';
  if(zone!==lastZone){
    lastZone=zone;
    document.getElementById('zone-name').textContent=zone;
    if(zone==='🌳 Central Park')checkMission('m3');
    if(zone==='🗼 Tour Eiffel')checkMission('m4');
    advanceMission('m1');
  }
}
function checkMission(id){
  const m=MISSIONS.find(m=>m.id===id);
  if(m&&!m.done){m.done=true;m.badge='done';m.progress=m.total;renderMissions();showToast('🏆 Mission accomplie : '+m.title+' !');}
}
function advanceMission(id){
  const m=MISSIONS.find(m=>m.id===id);
  if(m&&!m.done){m.progress=Math.min(m.progress+1,m.total);if(m.progress>=m.total)checkMission(id);else renderMissions();}
}

// ===================== CAMERA =====================
function updateCamera(){
  const tp=new THREE.Vector3(playerState.x,playerState.y+1.5,playerState.z);
  const cd=playerState.inSewer?4:playerState.onMetro?6:camState.dist;
  const cp=new THREE.Vector3(
    tp.x-Math.sin(camState.yaw)*Math.cos(camState.pitch)*cd,
    tp.y+Math.sin(camState.pitch)*cd,
    tp.z-Math.cos(camState.yaw)*Math.cos(camState.pitch)*cd
  );
  camera.position.lerp(cp,0.1);
  camera.lookAt(tp);
}

// ===================== LOOP =====================
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  updatePlayer(dt);
  updateMovingCars(dt);
  updateMetroTrain(dt);
  updateBoats(dt);
  updateNPCs(dt);
  updatePlayerVisuals();
  updateCamera();
  tickVehicleHint();
  if(playerMixer)playerMixer.update(dt);
  drawMinimap();
  renderer.render(scene,camera);
}
animate();

} // fin startGame()
</script>
