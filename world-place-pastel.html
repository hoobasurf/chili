#anim-panel{position:absolute;bottom:0;left:0;right:0;pointer-events:all;padding:5px 0 8px;background:linear-gradient(0deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.5) 100%);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.08);}

<script>
// â”€â”€ PROFIL â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function loadProfile(){
  try{
    const uid=localStorage.getItem('macadam_uid')||('p_'+Math.random().toString(36).slice(2,8));
    localStorage.setItem('macadam_uid',uid);
    const s=JSON.parse(localStorage.getItem('macadam_av_'+uid)||'null');
    return{pseudo:s?.pseudo||'Joueur'};
  }catch(e){return{pseudo:'Joueur'};}
}
const profile=loadProfile();
document.getElementById('hud-name').textContent=profile.pseudo;
document.getElementById('hud-pic').textContent=profile.pseudo.slice(0,2).toUpperCase();

// â”€â”€ LOADING BAR â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
let ldPct=0;
const ldFill=document.getElementById('ld-fill');
const ldTxt=document.getElementById('ld-txt');
const ldMsgs=['Chargement des texturesâ€¦','Construction de Tokyoâ€¦','Pose du bÃ©tonâ€¦','Presque prÃªtâ€¦'];
let ldIdx=0;
const ldInt=setInterval(()=>{
  ldPct+=Math.random()*7;if(ldPct>82){ldPct=82;clearInterval(ldInt);}
  ldFill.style.width=ldPct+'%';
  const idx=Math.min(Math.floor(ldPct/21),ldMsgs.length-1);
  if(idx>ldIdx){ldIdx=idx;ldTxt.textContent=ldMsgs[ldIdx];}
},220);
function finishLoading(){
  clearInterval(ldInt);ldFill.style.width='100%';ldTxt.textContent='Bienvenue Ã  Tokyo !';
  setTimeout(()=>{const l=document.getElementById('loading');l.classList.add('out');setTimeout(()=>l.style.display='none',600);},350);
  addChat('â˜€ï¸ Bienvenue Ã  Tokyo, '+profile.pseudo+' !','SystÃ¨me');
  addChat('ðŸ•¹ï¸ Joystick droit = marcher | gauche = camÃ©ra','Info');
}

// â”€â”€ TOAST â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2500);}

// â”€â”€ CHAT â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const bubbleEl=document.getElementById('sbubble');let bubTimer=null;
function showBubble(t){bubbleEl.textContent=t;bubbleEl.style.opacity='1';clearTimeout(bubTimer);bubTimer=setTimeout(()=>bubbleEl.style.opacity='0',4500);}
function addChat(text,from){
  const msgs=document.getElementById('chat-msgs');
  const d=document.createElement('div');d.className='cmsg';
  d.innerHTML=`<span class="cn">${from}</span>${text}`;
  msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;
  while(msgs.children.length>20)msgs.removeChild(msgs.firstChild);
}
function sendChat(){const inp=document.getElementById('cinput');const m=inp.value.trim();if(!m)return;inp.value='';addChat(m,profile.pseudo);showBubble(m);}
document.getElementById('csend').addEventListener('click',sendChat);
document.getElementById('cinput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendChat();}});

// â”€â”€ THREE.JS SETUP â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8ab4d4);
scene.fog=new THREE.Fog(0x9ec2dc,80,220);

const camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,300);
camera.position.set(0,3.5,10);

window.addEventListener('resize',()=>{
  renderer.setSize(window.innerWidth,window.innerHeight);
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
});

// â”€â”€ TEXTURE LOADER â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const loader=new THREE.TextureLoader();
function tex(url,rep=1){
  const t=loader.load(url);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(rep,rep);
  t.encoding=THREE.sRGBEncoding;
  return t;
}
// AmbientCG textures (public domain, no CORS)
const BASE='https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/';
const ACGI='https://ambientcg.com/get?file=';
// Fallback procedural textures via canvas
function procTex(fn,size=256){
  const c2=document.createElement('canvas');c2.width=c2.height=size;
  const ctx=c2.getContext('2d');fn(ctx,size);
  const t=new THREE.CanvasTexture(c2);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  return t;
}

// ASPHALTE
const asphaltTex=procTex((ctx,s)=>{
  ctx.fillStyle='#2a2a2a';ctx.fillRect(0,0,s,s);
  for(let i=0;i<2000;i++){
    const x=Math.random()*s,y=Math.random()*s,r=Math.random()*1.5;
    const g=Math.floor(Math.random()*30+25);
    ctx.fillStyle=`rgb(${g},${g},${g})`;
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }
  // petites lignes/craquelures
  ctx.strokeStyle='rgba(60,60,60,0.4)';ctx.lineWidth=0.5;
  for(let i=0;i<30;i++){
    ctx.beginPath();ctx.moveTo(Math.random()*s,Math.random()*s);
    ctx.lineTo(Math.random()*s,Math.random()*s);ctx.stroke();
  }
});
asphaltTex.repeat.set(8,8);

// BÃ‰TON (trottoir)
const concreteTex=procTex((ctx,s)=>{
  ctx.fillStyle='#9a9590';ctx.fillRect(0,0,s,s);
  for(let i=0;i<3000;i++){
    const x=Math.random()*s,y=Math.random()*s;
    const g=Math.floor(Math.random()*20+140);
    ctx.fillStyle=`rgb(${g},${g-5},${g-10})`;
    ctx.fillRect(x,y,1,1);
  }
  // joints dalles
  ctx.strokeStyle='rgba(120,115,108,0.6)';ctx.lineWidth=1;
  for(let x=0;x<s;x+=64){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,s);ctx.stroke();}
  for(let y=0;y<s;y+=64){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(s,y);ctx.stroke();}
});
concreteTex.repeat.set(6,6);

// BRIQUES (bÃ¢timents)
function makeBrickTex(base='#c87050',mortar='#8a7a70'){
  return procTex((ctx,s)=>{
    ctx.fillStyle=mortar;ctx.fillRect(0,0,s,s);
    const BW=32,BH=16;
    for(let row=0;row*BH<s+BH;row++){
      const offset=(row%2)*BW/2;
      for(let col=-1;col*BW<s+BW;col++){
        const x=col*BW+offset,y=row*BH;
        // variation couleur brique
        const r=parseInt(base.slice(1,3),16)+Math.floor(Math.random()*20-10);
        const g=parseInt(base.slice(3,5),16)+Math.floor(Math.random()*20-10);
        const b=parseInt(base.slice(5,7),16)+Math.floor(Math.random()*15-7);
        ctx.fillStyle=`rgb(${Math.max(0,Math.min(255,r))},${Math.max(0,Math.min(255,g))},${Math.max(0,Math.min(255,b))})`;
        ctx.fillRect(x+1,y+1,BW-2,BH-2);
      }
    }
  },256);
}
const brickTex=makeBrickTex('#b87060','#8a7a70');
const brickTex2=makeBrickTex('#9a9090','#787070');
const brickTex3=makeBrickTex('#d4c090','#b0a080');

// BÃ‰TON BÃ‚TIMENT (lisse)
const buildConcreteTex=procTex((ctx,s)=>{
  ctx.fillStyle='#b0aaa0';ctx.fillRect(0,0,s,s);
  for(let i=0;i<4000;i++){
    const x=Math.random()*s,y=Math.random()*s;
    const v=Math.floor(Math.random()*15);
    ctx.fillStyle=`rgba(${160+v},${155+v},${148+v},0.5)`;
    ctx.fillRect(x,y,1+(Math.random()*2|0),1);
  }
  ctx.strokeStyle='rgba(100,95,88,0.25)';ctx.lineWidth=1;
  for(let y=0;y<s;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(s,y);ctx.stroke();}
});

// HERBE
const grassTex=procTex((ctx,s)=>{
  ctx.fillStyle='#4a7a38';ctx.fillRect(0,0,s,s);
  for(let i=0;i<4000;i++){
    const x=Math.random()*s,y=Math.random()*s;
    const g=Math.floor(Math.random()*30+100);
    ctx.fillStyle=`rgb(${30+Math.random()*30|0},${g},${20+Math.random()*20|0})`;
    ctx.fillRect(x,y,1+(Math.random()*2|0),1+(Math.random()*3|0));
  }
});
grassTex.repeat.set(10,10);

// TOIT
const roofTex=procTex((ctx,s)=>{
  ctx.fillStyle='#3a3530';ctx.fillRect(0,0,s,s);
  for(let y=0;y<s;y+=8){
    ctx.fillStyle=y%16===0?'#2e2a26':'#3f3a34';
    ctx.fillRect(0,y,s,7);
  }
  for(let i=0;i<500;i++){
    ctx.fillStyle='rgba(80,75,68,0.4)';
    ctx.fillRect(Math.random()*s,Math.random()*s,1,1);
  }
});

// VERRE (fenÃªtres)
function makeWindowTex(){
  return procTex((ctx,s)=>{
    ctx.fillStyle='#1a2535';ctx.fillRect(0,0,s,s);
    const cols=4,rows=6,pw=s/cols,ph=s/rows;
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const lit=Math.random()<0.7;
        if(lit){
          const types=['#c8d8e8','#d0dce8','#e8e0c0','#d8c8a8'];
          ctx.fillStyle=types[Math.floor(Math.random()*types.length)];
          ctx.fillRect(c*pw+2,r*ph+2,pw-4,ph-4);
          // reflet
          ctx.fillStyle='rgba(255,255,255,0.15)';
          ctx.fillRect(c*pw+3,r*ph+3,pw*0.3,ph*0.25);
        } else {
          ctx.fillStyle='#0d1520';
          ctx.fillRect(c*pw+2,r*ph+2,pw-4,ph-4);
        }
      }
    }
  },256);
}
const winTex1=makeWindowTex();
const winTex2=makeWindowTex();
const winTex3=makeWindowTex();
const winTexes=[winTex1,winTex2,winTex3];
winTexes.forEach(t=>{t.repeat.set(1,1);});

// PANNEAU JAPONAIS (procÃ©dural)
function makeSignTex(color,text,sub){
  return procTex((ctx,s)=>{
    ctx.fillStyle=color;ctx.fillRect(0,0,s,s);
    // bande blanche en haut
    ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(0,0,s,s*0.12);
    // texte japonais
    ctx.fillStyle='rgba(255,255,255,0.9)';
    ctx.font=`bold ${s*0.28}px serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,s/2,s*0.45);
    if(sub){
      ctx.fillStyle='rgba(255,255,255,0.6)';
      ctx.font=`bold ${s*0.12}px sans-serif`;
      ctx.fillText(sub,s/2,s*0.75);
    }
    // bordure
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=3;
    ctx.strokeRect(4,4,s-8,s-8);
  },256);
}

// â”€â”€ COLLIDERS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const colliders=[];
function addCol(cx,cz,hw,hd,maxH=100){colliders.push({minX:cx-hw,maxX:cx+hw,minZ:cz-hd,maxZ:cz+hd,maxH});}
const PR=0.5;
function resolveCol(nx,nz,py){
  for(const c of colliders){
    if(py>=c.maxH) continue;
    const px=Math.max(c.minX,Math.min(c.maxX,nx));
    const pz=Math.max(c.minZ,Math.min(c.maxZ,nz));
    const dx=nx-px,dz=nz-pz;
    const d=Math.sqrt(dx*dx+dz*dz);
    if(d<PR){
      if(d<0.001){nx+=PR;}
      else{const push=PR-d;nx+=(dx/d)*push;nz+=(dz/d)*push;}
    }
  }
  return{x:nx,z:nz};
}

// â”€â”€ BÃ‚TIMENTS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function building(x,z,w,h,d,style=0){
  const wallMat=style===0?matBrick(x%3):style===1?matBuildConcrete('#ccc8c0'):matBuildConcrete('#bec0c4');
  // Corps
  const b=mesh(new THREE.BoxGeometry(w,h,d),wallMat);
  b.position.set(x,h/2,z);scene.add(b);
  // Toit plat avec rebord
  const roofMesh=mesh(new THREE.BoxGeometry(w+0.2,0.4,d+0.2),matRoof);
  roofMesh.position.set(x,h+0.2,z);scene.add(roofMesh);
  // Toit lÃ©gÃ¨rement bombÃ©
  const roofT=mesh(new THREE.BoxGeometry(w-0.2,0.2,d-0.2),matRoof);
  roofT.position.set(x,h+0.45,z);scene.add(roofT);

  // FenÃªtres (faÃ§ades N et S)
  const wCols=Math.max(1,Math.floor(w/2.5));
  const wRows=Math.max(1,Math.floor(h/3.5));
  const wm=matWindow(Math.abs(x+z)%3);
  const wm2=matWindow((Math.abs(x+z)+1)%3);
  for(let r=0;r<wRows;r++){
    for(let c=0;c<wCols;c++){
      const wx=-w/2+0.9+c*(w-0.8)/(Math.max(wCols-1,1));
      const wy=1.4+r*3.4;
      const win1=mesh(new THREE.BoxGeometry(0.8,1.2,0.06),wm,false,false);
      win1.position.set(x+wx,wy,z+d/2+0.04);scene.add(win1);
      const win2=mesh(new THREE.BoxGeometry(0.8,1.2,0.06),wm2,false,false);
      win2.position.set(x+wx,wy,z-d/2-0.04);scene.add(win2);
    }
  }
  // FenÃªtres cÃ´tÃ©s E/W
  const dCols=Math.max(1,Math.floor(d/2.5));
  const wm3=matWindow((Math.abs(x*z))%3);
  for(let r=0;r<wRows;r++){
    for(let c=0;c<dCols;c++){
      const wz=-d/2+0.9+c*(d-0.8)/(Math.max(dCols-1,1));
      const wy=1.4+r*3.4;
      const win3=mesh(new THREE.BoxGeometry(0.06,1.2,0.8),wm3,false,false);
      win3.position.set(x+w/2+0.04,wy,z+wz);scene.add(win3);
      const win4=win3.clone();win4.position.set(x-w/2-0.04,wy,z+wz);scene.add(win4);
    }
  }

  // Panneau japonais sur faÃ§ade
  const signIdx=Math.abs(Math.round(x*z))%signTexes.length;
  const signMat=new THREE.MeshStandardMaterial({map:signTexes[signIdx],roughness:0.6,metalness:0.1,emissive:new THREE.Color(0x111111)});
  const sw=Math.min(w*0.55,4);const sh=sw*1.4;
  const sign=mesh(new THREE.BoxGeometry(sw,sh,0.12),signMat,false,false);
  sign.position.set(x,h*0.35,z+d/2+0.1);scene.add(sign);

  // Antenne
  const antMat=new THREE.MeshStandardMaterial({color:0x5a6070,roughness:0.5,metalness:0.6});
  const ant=mesh(new THREE.CylinderGeometry(0.06,0.08,3.5,6),antMat);
  ant.position.set(x+w/4,h+2.15,z+d/4);scene.add(ant);
  const antTop=mesh(new THREE.SphereGeometry(0.12,6,4),new THREE.MeshStandardMaterial({color:0xcc2222,roughness:0.4,emissive:new THREE.Color(0x330000)}));
  antTop.position.set(x+w/4,h+4.1,z+d/4);scene.add(antTop);

  addCol(x,z,w/2+0.15,d/2+0.15);
}

// GLB loader
let currentGLB=null,lastWalking=false,emoteTimer=null;
let THREE_GLTFLoader=null;

// Injecter le GLTFLoader dynamiquement
const gltfScript=document.createElement('script');
gltfScript.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/GLTFLoader.min.js';
gltfScript.onload=()=>{
  THREE_GLTFLoader=new THREE.GLTFLoader();
  loadGLB('attend.glb',true,null);
};
document.head.appendChild(gltfScript);

const mixers=[];
function loadGLB(file,loop,onDone){
  if(!THREE_GLTFLoader){return;}
  const url=BASE_URL+file;
  THREE_GLTFLoader.load(url,gltf=>{
    // retirer ancien
    if(currentGLB){avatarGroup.remove(currentGLB);currentGLB=null;}
    capsule.visible=false;
    // retirer mixers
    mixers.length=0;

    const model=gltf.scene;
    avatarGroup.add(model);currentGLB=model;

    // Centrer + scaler
    const box2=new THREE.Box3().setFromObject(model);
    const sz=box2.getSize(new THREE.Vector3());
    const sc=1.75/Math.max(sz.y,0.01);
    model.scale.setScalar(sc);
    model.position.y=-box2.min.y*sc;

    // Ombres
    model.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true;}});

    // Animations
    if(gltf.animations&&gltf.animations.length>0){
      const mixer=new THREE.AnimationMixer(model);
      mixers.push(mixer);
      const clip=gltf.animations[0];
      const action=mixer.clipAction(clip);
      action.setLoop(loop?THREE.LoopRepeat:THREE.LoopOnce,Infinity);
      action.clampWhenFinished=!loop;
      action.play();
      if(onDone) onDone(clip.duration*1000);
    } else if(onDone) onDone(2000);
  },undefined,()=>{capsule.visible=true;});
}

function setWalk(walking){
  if(walking===lastWalking) return;lastWalking=walking;
  clearTimeout(emoteTimer);emoteTimer=null;
  loadGLB(walking?'marche%20discrete.glb':'attend.glb',true,null);
}
function playEmote(file,label){
  clearTimeout(emoteTimer);emoteTimer=null;lastWalking=false;
  loadGLB(file,false,dur=>{
    showToast('â–¶ '+label);
    emoteTimer=setTimeout(()=>{emoteTimer=null;lastWalking=false;loadGLB('attend.glb',true,null);},dur+400);
  });
}

const animScroll=document.getElementById('anim-scroll');
let activeBtn=null;
ANIMS.forEach((anim,i)=>{
  const svgStr=SVG[anim.svg]||SVG.idle;
  const btn=document.createElement('div');btn.className='anim-btn';
  if(i===0)btn.classList.add('active');
  btn.innerHTML=`<div class="anim-icon"><svg viewBox="0 0 56 72" xmlns="http://www.w3.org/2000/svg">${svgStr}</svg></div><span class="anim-label">${anim.label}</span>`;
  btn.addEventListener('click',()=>{
    if(activeBtn)activeBtn.classList.remove('active');
    btn.classList.add('active');activeBtn=btn;
    if(anim.file==='attend.glb'){clearTimeout(emoteTimer);emoteTimer=null;lastWalking=false;loadGLB('attend.glb',true,null);showToast('ðŸ§ '+anim.label);}
    else if(anim.file==='marche%20discrete.glb'){clearTimeout(emoteTimer);emoteTimer=null;lastWalking=true;loadGLB('marche%20discrete.glb',true,null);showToast('ðŸš¶ '+anim.label);}
    else{lastWalking=false;playEmote(anim.file,anim.label);}
  });
  animScroll.appendChild(btn);
  if(i===0)activeBtn=btn;
});

// â”€â”€ JOYSTICKS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const joyBase=document.getElementById('joy-base'),joyKnob=document.getElementById('joy-knob');
const JR=38;const joy={active:false,x:0,y:0,id:null};
function getJC(){const r=joyBase.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
function updateJoy(cx,cy){const c=getJC();let dx=cx-c.x,dy=cy-c.y;const d=Math.sqrt(dx*dx+dy*dy);if(d>JR){dx=dx/d*JR;dy=dy/d*JR;}joy.x=dx/JR;joy.y=dy/JR;joyKnob.style.transform=`translate(${dx}px,${dy}px)`;}
joyBase.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];joy.active=true;joy.id=t.identifier;updateJoy(t.clientX,t.clientY);},{passive:false});
document.addEventListener('touchmove',e=>{if(!joy.active)return;for(const t of e.changedTouches)if(t.identifier===joy.id){e.preventDefault();updateJoy(t.clientX,t.clientY);}},{passive:false});
document.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===joy.id){joy.active=false;joy.x=0;joy.y=0;joyKnob.style.transform='translate(0,0)';}});

const camBase=document.getElementById('camjoy-base'),camKnob=document.getElementById('camjoy-knob');
const camJoy={active:false,x:0,id:null};
function getCamC(){const r=camBase.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
function updateCamJoy(cx,cy){const c=getCamC();let dx=cx-c.x,dy=cy-c.y;const d=Math.sqrt(dx*dx+dy*dy);if(d>JR){dx=dx/d*JR;dy=dy/d*JR;}camJoy.x=dx/JR;camKnob.style.transform=`translate(${dx}px,${dy}px)`;}
camBase.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];camJoy.active=true;camJoy.id=t.identifier;updateCamJoy(t.clientX,t.clientY);},{passive:false});
document.addEventListener('touchmove',e=>{if(!camJoy.active)return;for(const t of e.changedTouches)if(t.identifier===camJoy.id){e.preventDefault();updateCamJoy(t.clientX,t.clientY);}},{passive:false});
document.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===camJoy.id){camJoy.active=false;camJoy.x=0;camKnob.style.transform='translate(0,0)';}});

let mDrag={active:false,lx:0};
canvas.addEventListener('mousedown',e=>{mDrag.active=true;mDrag.lx=e.clientX;});
document.addEventListener('mousemove',e=>{if(!mDrag.active)return;cYaw-=(e.clientX-mDrag.lx)*0.005;mDrag.lx=e.clientX;});
document.addEventListener('mouseup',()=>mDrag.active=false);
const keys={};
document.addEventListener('keydown',e=>keys[e.key]=true);
document.addEventListener('keyup',e=>keys[e.key]=false);

// â”€â”€ SAUT â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const JV=8,JVS=19,GR=26;
let jVel=0,onGround=true,jtCount=0,jtTimer=null;
function doJump(){
  if(!onGround)return;
  jtCount++;clearTimeout(jtTimer);
  if(jtCount>=2){jtCount=0;jVel=JVS;onGround=false;showToast('ðŸš€ SUPER SAUT !');}
  else{jtTimer=setTimeout(()=>{if(jtCount===1&&onGround){jVel=JV;onGround=false;}jtCount=0;},280);}
}
document.getElementById('jump-btn').addEventListener('touchstart',e=>{e.preventDefault();doJump();},{passive:false});
document.getElementById('jump-btn').addEventListener('click',doJump);
document.getElementById('superjump-btn').addEventListener('touchstart',e=>{
  e.preventDefault();if(!onGround)return;jtCount=0;clearTimeout(jtTimer);jVel=JVS;onGround=false;showToast('ðŸš€ SUPER SAUT !');
},{passive:false});
document.getElementById('superjump-btn').addEventListener('click',()=>{
  if(!onGround)return;jtCount=0;clearTimeout(jtTimer);jVel=JVS;onGround=false;showToast('ðŸš€ SUPER SAUT !');
});

// â”€â”€ BOUCLE PRINCIPALE â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const SPEED=5.5,BOUND=54;
const pp={x:0,y:0,z:6};
let pRotY=0,cYaw=Math.PI;
const CD=7,CH=2.4,CLY=1.1,CL=4;
const clock=new THREE.Clock();

function updateBubble(){
  if(bubbleEl.style.opacity==='0') return;
  // Projeter position avatar en 2D
  const v=new THREE.Vector3(pp.x,pp.y+2.4,pp.z);
  v.project(camera);
  const hw=window.innerWidth/2,hh=window.innerHeight/2;
  const sx=v.x*hw+hw,sy=-v.y*hh+hh;
  bubbleEl.style.left=sx+'px';bubbleEl.style.top=(sy-44)+'px';
}

finishLoading();

renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),0.08);

  // Update mixers GLB
  mixers.forEach(m=>m.update(dt));

  // Input
  let mx=joy.x,mz=-joy.y;
  if(keys['ArrowUp']||keys['w']||keys['W'])mz=1;
  if(keys['ArrowDown']||keys['s']||keys['S'])mz=-1;
  if(keys['ArrowLeft']||keys['a']||keys['A'])mx=-1;
  if(keys['ArrowRight']||keys['d']||keys['D'])mx=1;
  if(keys[' ']&&onGround)doJump();
  if(camJoy.active&&Math.abs(camJoy.x)>0.04)cYaw-=camJoy.x*2.2*dt;
  if(keys['q']||keys['Q'])cYaw+=1.8*dt;
  if(keys['e']||keys['E'])cYaw-=1.8*dt;

  const moving=Math.abs(mx)>0.05||Math.abs(mz)>0.05;
  if(moving&&emoteTimer){clearTimeout(emoteTimer);emoteTimer=null;}
  if(onGround)setWalk(moving);

  if(moving){
    const sc=Math.sin(cYaw),cc=Math.cos(cYaw);
    const dx=(sc*(-mz)+cc*mx)*SPEED*dt;
    const dz=(cc*(-mz)-sc*mx)*SPEED*dt;
    let nx=pp.x+dx,nz=pp.z+dz;
    const r=resolveCol(nx,nz,pp.y);nx=r.x;nz=r.z;
    pp.x=Math.max(-BOUND,Math.min(BOUND,nx));
    pp.z=Math.max(-BOUND,Math.min(BOUND,nz));
    pRotY=Math.atan2(dx,dz);
    const tY=pRotY+Math.PI;let diff=tY-cYaw;
    while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;
    cYaw+=diff*Math.min(CL*dt,1.0);
  }

  if(!onGround){
    jVel-=GR*dt;pp.y+=jVel*dt;
    if(pp.y<=0){pp.y=0;jVel=0;onGround=true;setWalk(moving);}
  }

  avatarGroup.position.set(pp.x,pp.y,pp.z);
  avatarGroup.rotation.y=pRotY;
  blobShadow.position.set(pp.x,0.012,pp.z);

  // CamÃ©ra
  const camX=pp.x+Math.sin(cYaw)*CD;
  const camZ=pp.z+Math.cos(cYaw)*CD;
  camera.position.set(camX,pp.y+CH,camZ);
  camera.lookAt(pp.x,pp.y+CLY,pp.z);

  updateBubble();
  renderer.render(scene,camera);
});
  setTimeout(finishLoading, 2500);
</script>
