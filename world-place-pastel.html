<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Macadam World — Tokyo</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--gold:#f5c842;--orange:#e85d26;}
html,body{width:100%;height:100%;overflow:hidden;background:#b0c8e8;font-family:'M PLUS Rounded 1c',sans-serif;user-select:none;-webkit-user-select:none;}
#canvas-container{position:fixed;inset:0;}
canvas{display:block;width:100%!important;height:100%!important;}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;}
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,transparent 100%);}
.hud-logo{font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:900;color:#fff;letter-spacing:.05em;text-shadow:0 1px 6px rgba(0,0,0,.5);}
.hud-logo em{color:var(--gold);font-style:normal;}
.hud-loc{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:4px 10px;}
.hud-loc span{font-size:.68rem;font-weight:700;color:#fff;}
.loc-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);}
.hud-info{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:4px 10px 4px 4px;}
.hud-pic{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--gold));display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:900;color:#fff;}
.hud-name{font-size:.68rem;font-weight:700;color:#fff;}
.hud-chat{position:absolute;bottom:180px;left:12px;max-width:270px;pointer-events:all;}
.chat-messages{max-height:80px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;margin-bottom:5px;scrollbar-width:none;}
.chat-messages::-webkit-scrollbar{display:none;}
.chat-msg{background:rgba(0,0,0,.5);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:4px 9px;font-size:.68rem;color:#fff;line-height:1.35;}
.chat-msg .name{font-weight:900;color:var(--gold);margin-right:4px;}
.chat-input-wrap{display:flex;gap:5px;}
.chat-input{flex:1;background:rgba(0,0,0,.45);border:1.5px solid rgba(255,255,255,.25);border-radius:10px;padding:7px 11px;font-size:16px;font-weight:700;color:#fff;outline:none;font-family:'M PLUS Rounded 1c',sans-serif;}
.chat-input::placeholder{color:rgba(255,255,255,.35);}
.chat-input:focus{border-color:var(--gold);}
.chat-send{width:34px;height:34px;border-radius:9px;background:var(--orange);border:none;color:#fff;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;pointer-events:all;}
#anim-panel{position:absolute;bottom:0;left:0;right:0;pointer-events:all;padding:5px 0 9px;background:linear-gradient(0deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.55) 100%);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.08);}
#anim-scroll{display:flex;gap:6px;overflow-x:auto;padding:3px 12px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
#anim-scroll::-webkit-scrollbar{display:none;}
.anim-btn{flex-shrink:0;width:62px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.anim-icon{width:60px;height:60px;border-radius:11px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;transition:all .15s;}
.anim-icon svg{width:48px;height:48px;}
.anim-btn.active .anim-icon{background:rgba(245,200,66,.12);border-color:var(--gold);box-shadow:0 0 10px rgba(245,200,66,.3);}
.anim-btn:active .anim-icon{transform:scale(.9);}
.anim-label{font-size:.52rem;font-weight:700;color:rgba(255,255,255,.4);text-align:center;line-height:1.1;}
.anim-btn.active .anim-label{color:var(--gold);}
#joystick-zone{position:absolute;bottom:106px;right:16px;width:100px;height:100px;pointer-events:all;}
#cam-joystick-zone{position:absolute;bottom:106px;left:16px;width:100px;height:100px;pointer-events:all;}
.joy-base{width:100px;height:100px;border-radius:50%;background:rgba(0,0,0,.2);border:1.5px solid rgba(255,255,255,.2);backdrop-filter:blur(6px);position:relative;display:flex;align-items:center;justify-content:center;}
.joy-knob{width:40px;height:40px;border-radius:50%;position:absolute;box-shadow:0 2px 10px rgba(0,0,0,.4);}
#jump-btn{position:absolute;bottom:220px;right:22px;width:52px;height:52px;border-radius:50%;background:#2b6cb0;border:none;color:#fff;font-size:1.3rem;pointer-events:all;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}
#super-jump-btn{position:absolute;bottom:220px;left:22px;width:52px;height:52px;border-radius:50%;background:var(--orange);border:none;color:#fff;font-size:1.1rem;pointer-events:all;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}
.toast{position:fixed;bottom:200px;left:50%;transform:translateX(-50%) translateY(14px);background:rgba(0,0,0,.85);color:var(--gold);padding:7px 15px;border-radius:16px;font-size:.72rem;font-weight:700;opacity:0;transition:all .25s;z-index:50;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#speech-bubble{position:fixed;z-index:20;background:rgba(0,0,0,.85);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:9px;padding:4px 10px;font-size:.68rem;font-weight:700;pointer-events:none;max-width:140px;text-align:center;transform:translateX(-50%);opacity:0;transition:opacity .25s;white-space:nowrap;}
#speech-bubble::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:rgba(255,255,255,.2);border-bottom:none;}
#loading-screen{position:fixed;inset:0;z-index:200;background:#b0c8e8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s;}
#loading-screen.hidden{opacity:0;pointer-events:none;}
.load-logo{font-family:'Zen Kaku Gothic New',sans-serif;font-size:2.2rem;font-weight:900;color:#1a2a40;letter-spacing:.06em;}
.load-logo em{color:var(--orange);font-style:normal;}
.load-kanji{font-size:.9rem;color:rgba(26,42,64,.6);letter-spacing:.25em;}
.load-bar-wrap{width:180px;height:3px;background:rgba(0,0,0,.12);border-radius:2px;overflow:hidden;}
.load-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--orange),var(--gold));border-radius:2px;transition:width .2s;}
.load-txt{font-size:.68rem;color:rgba(26,42,64,.6);font-weight:700;}
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="loading-screen">
  <div class="load-logo">TOKYO<em>東京</em></div>
  <div class="load-kanji">MACADAM WORLD</div>
  <div class="load-bar-wrap"><div class="load-bar" id="load-bar"></div></div>
  <div class="load-txt" id="load-txt">Chargement…</div>
</div>
<div id="hud">
  <div class="hud-top">
    <div class="hud-logo">⬡ <em>Macadam</em> World</div>
    <div class="hud-loc"><div class="loc-dot"></div><span>東京 Shinjuku</span></div>
    <div class="hud-info"><div class="hud-pic" id="hud-pic">?</div><span class="hud-name" id="hud-pseudo">Joueur</span></div>
  </div>
  <div class="hud-chat">
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-wrap">
      <input class="chat-input" id="chat-input" type="text" placeholder="Dis quelque chose…" maxlength="80" autocomplete="off"/>
      <button class="chat-send" id="chat-send">➤</button>
    </div>
  </div>
  <div id="cam-joystick-zone">
    <div class="joy-base" id="cam-joy-base">
      <div class="joy-knob" id="cam-joy-knob" style="background:linear-gradient(135deg,#f5c842,#e85d26);"></div>
    </div>
  </div>
  <div id="joystick-zone">
    <div class="joy-base" id="joy-base">
      <div class="joy-knob" id="joy-knob" style="background:linear-gradient(135deg,#dddddd,#aaaaaa);"></div>
    </div>
  </div>
  <button id="jump-btn">↑</button>
  <button id="super-jump-btn">🚀</button>
  <div id="anim-panel"><div id="anim-scroll"></div></div>
</div>
<div id="speech-bubble"></div>
<div class="toast" id="toast"></div>

</script>

function procTex(fn,size=256){
  const cv=document.createElement('canvas');cv.width=cv.height=size;
  const ctx=cv.getContext('2d');fn(ctx,size);
  const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
const asphaltTex=procTex((ctx,s)=>{
  ctx.fillStyle='#282828';ctx.fillRect(0,0,s,s);
  for(let i=0;i<2500;i++){const g=20+Math.random()*25|0;ctx.fillStyle=`rgb(${g},${g},${g})`;ctx.fillRect(Math.random()*s|0,Math.random()*s|0,1+(Math.random()*1.5|0),1);}
});
asphaltTex.repeat.set(8,8);
const concreteTex=procTex((ctx,s)=>{
  ctx.fillStyle='#989088';ctx.fillRect(0,0,s,s);
  for(let i=0;i<3000;i++){const g=130+Math.random()*20|0;ctx.fillStyle=`rgba(${g},${g-4},${g-8},0.6)`;ctx.fillRect(Math.random()*s|0,Math.random()*s|0,1,1);}
  ctx.strokeStyle='rgba(110,105,98,0.5)';ctx.lineWidth=1;
  for(let x=0;x<s;x+=64){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,s);ctx.stroke();}
  for(let y=0;y<s;y+=64){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(s,y);ctx.stroke();}
});
concreteTex.repeat.set(6,6);
const grassTex=procTex((ctx,s)=>{
  ctx.fillStyle='#4a7838';ctx.fillRect(0,0,s,s);
  for(let i=0;i<4000;i++){const g=95+Math.random()*30|0;ctx.fillStyle=`rgb(${25+Math.random()*25|0},${g},${18+Math.random()*18|0})`;ctx.fillRect(Math.random()*s|0,Math.random()*s|0,1+(Math.random()*2|0),1+(Math.random()*3|0));}
});
grassTex.repeat.set(10,10);
function makeBrick(br='#c07050',mo='#8a7a70'){
  return procTex((ctx,s)=>{
    ctx.fillStyle=mo;ctx.fillRect(0,0,s,s);
    const BW=32,BH=16;
    for(let row=0;row*BH<s+BH;row++){
      const off=(row%2)*BW/2;
      for(let col=-1;col*BW<s+BW;col++){
        const rr=parseInt(br.slice(1,3),16)+(Math.random()*22-11|0);
        const rg=parseInt(br.slice(3,5),16)+(Math.random()*22-11|0);
        const rb2=parseInt(br.slice(5,7),16)+(Math.random()*14-7|0);
        ctx.fillStyle=`rgb(${Math.max(0,Math.min(255,rr))},${Math.max(0,Math.min(255,rg))},${Math.max(0,Math.min(255,rb2))})`;
        ctx.fillRect(col*BW+off+1,row*BH+1,BW-2,BH-2);
      }
    }
  },256);
}

});
function makeWin(){
  return procTex((ctx,s)=>{
    ctx.fillStyle='#1a2535';ctx.fillRect(0,0,s,s);
    const cols=4,rows=5,pw=s/cols,ph=s/rows;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const lit=Math.random()<0.72;
      ctx.fillStyle=lit?['#c8d8e8','#d0dce8','#e8e0c0','#d8c8a8'][Math.floor(Math.random()*4)]:'#0d1520';
      ctx.fillRect(c*pw+2,r*ph+2,pw-4,ph-4);
      if(lit){ctx.fillStyle='rgba(255,255,255,0.12)';ctx.fillRect(c*pw+3,r*ph+3,pw*0.28,ph*0.22);}
    }
  },256);
}

}

const colliders=[];
function addCol(cx,cz,hw,hd,mH=100){colliders.push({minX:cx-hw,maxX:cx+hw,minZ:cz-hd,maxZ:cz+hd,mH});}
const PR=0.55;
function resCol(nx,nz,py){
  for(const c of colliders){
    if(py>=c.mH)continue;
    const px=Math.max(c.minX,Math.min(c.maxX,nx)),pz=Math.max(c.minZ,Math.min(c.maxZ,nz));
    const dx=nx-px,dz=nz-pz,d=Math.sqrt(dx*dx+dz*dz);
    if(d<PR){if(d<0.001){nx+=PR;}else{const p=PR-d;nx+=(dx/d)*p;nz+=(dz/d)*p;}}
  }
  return{x:nx,z:nz};
}

const avatarGroup=new THREE.Group();avatarGroup.position.set(0,0,6);scene.add(avatarGroup);
let avatarMixer=null,emoteTimer=null,lastWalking=false;
const gltfLoader=new GLTFLoader();
const glbCache={};

function loadGLB(url,cb){
  if(glbCache[url]){cb(glbCache[url]);return;}
  gltfLoader.load(url,gltf=>{glbCache[url]=gltf;cb(gltf);},undefined,()=>{});
}
function swapAvatar(file,loop,onDone){
  const url=BASE+file;
  loadGLB(url,gltf=>{
    while(avatarGroup.children.length)avatarGroup.remove(avatarGroup.children[0]);
    if(avatarMixer){avatarMixer.stopAllAction();avatarMixer=null;}
    const model=gltf.scene;
    model.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true;}});
    const bb=new THREE.Box3().setFromObject(model);
    const sz=new THREE.Vector3();bb.getSize(sz);
    if(sz.y>0)model.scale.setScalar(1.75/sz.y);
    const bb2=new THREE.Box3().setFromObject(model);model.position.y=-bb2.min.y;
    avatarGroup.add(model);
    if(gltf.animations&&gltf.animations.length){
      avatarMixer=new THREE.AnimationMixer(model);
      const action=avatarMixer.clipAction(gltf.animations[0]);
      action.setLoop(loop?THREE.LoopRepeat:THREE.LoopOnce,loop?Infinity:1);
      action.clampWhenFinished=!loop;action.play();
      if(onDone)onDone(gltf.animations[0].duration);
    }
  });
}

// Droit = déplacement (joy-base / joy-knob)
const joyBase=document.getElementById('joy-base');
const joyKnob=document.getElementById('joy-knob');
const JR=40;
const joy={active:false,x:0,y:0,id:null};
function getJC(){const r=joyBase.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
function updateJoy(cx,cy){
  const c=getJC();let dx=cx-c.x,dy=cy-c.y;
  const d=Math.sqrt(dx*dx+dy*dy);if(d>JR){dx=dx/d*JR;dy=dy/d*JR;}
  joy.x=dx/JR;joy.y=dy/JR;
  joyKnob.style.transform=`translate(${dx}px,${dy}px)`;
}
joyBase.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];joy.active=true;joy.id=t.identifier;updateJoy(t.clientX,t.clientY);},{passive:false});
document.addEventListener('touchmove',e=>{if(!joy.active)return;for(const t of e.changedTouches)if(t.identifier===joy.id){e.preventDefault();updateJoy(t.clientX,t.clientY);}},{passive:false});
document.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===joy.id){joy.active=false;joy.x=0;joy.y=0;joyKnob.style.transform='translate(0,0)';}});

  const dt=Math.min(clock.getDelta(),0.08);
  if(avatarMixer)avatarMixer.update(dt);

  let mx=joy.x,mz=-joy.y;
  if(keys['ArrowUp']  ||keys['w']||keys['W'])mz= 1;
  if(keys['ArrowDown']||keys['s']||keys['S'])mz=-1;
  if(keys['ArrowLeft']||keys['a']||keys['A'])mx=-1;
  if(keys['ArrowRight']||keys['d']||keys['D'])mx= 1;
  if(keys[' ']&&onGround)doJump();
  if(camJoy.active&&Math.abs(camJoy.x)>0.04)cameraYaw-=camJoy.x*2.2*dt;
  if(keys['q']||keys['Q'])cameraYaw+=1.8*dt;
  if(keys['e']||keys['E'])cameraYaw-=1.8*dt;

  const moving=Math.abs(mx)>0.05||Math.abs(mz)>0.05;
  if(moving&&emoteTimer){clearTimeout(emoteTimer);emoteTimer=null;}
  if(onGround)setWalkSwap(moving);

  if(moving){
    const sc=Math.sin(cameraYaw),cc=Math.cos(cameraYaw);
    const dx=(sc*(-mz)+cc*mx)*SPEED*dt;
    const dz=(cc*(-mz)-sc*mx)*SPEED*dt;
    let nx=pp.x+dx,nz=pp.z+dz;
    const res=resCol(nx,nz,pp.y);nx=res.x;nz=res.z;
    pp.x=Math.max(-BOUND,Math.min(BOUND,nx));
    pp.z=Math.max(-BOUND,Math.min(BOUND,nz));
    pRot=Math.atan2(dx,dz);
    const tY=pRot+Math.PI;let diff=tY-cameraYaw;
    while(diff>Math.PI)diff-=2*Math.PI;while(diff<-Math.PI)diff+=2*Math.PI;
    cameraYaw+=diff*Math.min(CL*dt,1.0);
  }

  if(!onGround){
    jumpVel-=GR*dt;pp.y+=jumpVel*dt;
    if(pp.y<=0){pp.y=0;jumpVel=0;onGround=true;setWalkSwap(moving);}
  }

  avatarGroup.position.set(pp.x,pp.y,pp.z);
  avatarGroup.rotation.y=pRot;
  blob.position.x=pp.x;blob.position.z=pp.z;

  camera.position.set(pp.x+Math.sin(cameraYaw)*CD,pp.y+CH,pp.z+Math.cos(cameraYaw)*CD);
  camera.lookAt(pp.x,pp.y+CLY,pp.z);

  updateBubble();
  renderer.render(scene,camera);
}
animate();
</script>
