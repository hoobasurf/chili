<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test WebGL triangle brut</title>
</head>
<body style="margin:0;background:#b0c8e8;">
<canvas id="glcanvas"></canvas>
<script>
const canvas=document.getElementById('glcanvas');
canvas.width=innerWidth;canvas.height=innerHeight;
const gl=canvas.getContext('webgl');
if(!gl){document.body.innerHTML='❌ Impossible de créer le contexte WebGL';throw new Error('WebGL non disponible');}

// shaders simples
const vsSrc=`attribute vec4 a;void main(){gl_Position=a;}`;
const fsSrc=`void main(){gl_FragColor=vec4(1.0,0.3,0.2,1.0);}`;
function compile(type,src){
  const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){throw gl.getShaderInfoLog(s);}return s;
}
const vs=compile(gl.VERTEX_SHADER,vsSrc);
const fs=compile(gl.FRAGMENT_SHADER,fsSrc);
const pr=gl.createProgram();gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);
gl.useProgram(pr);

// géométrie triangle
const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,1,0,-1,-1,0,1,-1,0]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'a');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,3,gl.FLOAT,false,0,0);

// affichage
function draw(){gl.clearColor(0.7,0.8,1,1);gl.clear(gl.COLOR_BUFFER_BIT);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(draw);}
draw();
</script>
</body>
</html>
