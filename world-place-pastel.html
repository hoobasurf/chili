<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Macadam World — Tokyo</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--gold:#f5c842;--orange:#e85d26;--green:#2ecc71;--red:#e74c3c;--blue:#3498db;--purple:#9b59b6;}
html,body{width:100%;height:100%;overflow:hidden;background:#b0c8e8;font-family:'M PLUS Rounded 1c',sans-serif;user-select:none;-webkit-user-select:none;}
#canvas-container{position:fixed;inset:0;}
canvas{display:block;width:100%!important;height:100%!important;}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;}
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,transparent 100%);}
.hud-logo{font-family:'Zen Kaku Gothic New',sans-serif;font-size:.9rem;font-weight:900;color:#fff;letter-spacing:.05em;text-shadow:0 1px 6px rgba(0,0,0,.5);}
.hud-logo em{color:var(--gold);font-style:normal;}
.hud-loc{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.38);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:4px 10px;}
.hud-loc span{font-size:.65rem;font-weight:700;color:#fff;}
.loc-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);}
.hud-info{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.38);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:4px 10px 4px 4px;}
.hud-pic{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--gold));display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:900;color:#fff;}
.hud-name{font-size:.65rem;font-weight:700;color:#fff;}
#minimap{position:absolute;top:50px;left:12px;width:120px;height:120px;background:rgba(0,0,0,.6);border:1.5px solid rgba(255,255,255,.2);border-radius:10px;backdrop-filter:blur(10px);pointer-events:all;overflow:visible;z-index:15;}
#minimap-canvas{width:120px;height:120px;display:block;border-radius:9px;}
#teleport-cooldown{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:.48rem;color:rgba(255,255,255,.6);font-weight:700;white-space:nowrap;}
.tp-popup{position:absolute;left:126px;top:0;background:rgba(0,0,0,.85);border:1px solid var(--gold);border-radius:10px;padding:6px 10px;min-width:130px;pointer-events:all;z-index:20;}
.tp-popup-title{font-size:.6rem;font-weight:900;color:var(--gold);margin-bottom:5px;}
.tp-popup-btn{display:block;width:100%;background:var(--gold);color:#000;font-size:.58rem;font-weight:900;border:none;border-radius:7px;padding:4px 8px;cursor:pointer;font-family:'M PLUS Rounded 1c',sans-serif;text-align:center;}
.tp-popup-btn:disabled{background:rgba(255,255,255,.2);color:rgba(255,255,255,.4);cursor:not-allowed;}
#mission-toggle{position:absolute;top:50px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);border:2px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:all;font-size:.95rem;z-index:20;}
.excl{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:#e74c3c;border:2px solid #050814;display:none;}
.excl.show{display:block;}
#mission-hud{position:absolute;top:50px;right:56px;width:210px;pointer-events:all;transform:translateX(130%);transition:transform .3s cubic-bezier(.22,1,.36,1);z-index:19;}
#mission-hud.open{transform:translateX(0);}
.mission-card{background:rgba(0,0,0,.45);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:8px 10px;margin-bottom:5px;}
.mission-card.done{border-color:rgba(46,204,113,.3);opacity:.55;}
.mission-card.active{border-color:rgba(245,200,66,.35);box-shadow:0 0 12px rgba(245,200,66,.1);}
.mission-title{font-size:.65rem;font-weight:900;color:var(--gold);margin-bottom:2px;}
.mission-desc{font-size:.56rem;color:rgba(255,255,255,.65);line-height:1.3;}
.mission-progress{margin-top:4px;height:2px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;}
.mission-bar{height:100%;background:var(--gold);border-radius:2px;transition:width .4s;}
.mission-badge{display:inline-block;background:rgba(46,204,113,.8);color:#fff;font-size:.48rem;font-weight:900;padding:1px 5px;border-radius:6px;margin-left:4px;}
.hud-chat{position:absolute;bottom:170px;left:12px;width:220px;pointer-events:all;}
.chat-messages{max-height:75px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;margin-bottom:4px;scrollbar-width:none;}
.chat-messages::-webkit-scrollbar{display:none;}
.chat-msg{background:rgba(0,0,0,.5);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:4px 10px;font-size:.62rem;color:#fff;line-height:1.3;display:inline-block;max-width:100%;}
.chat-msg .name{font-weight:900;color:var(--gold);margin-right:4px;}
.chat-input-wrap{display:flex;gap:5px;align-items:center;}
.chat-input{flex:1;background:rgba(0,0,0,.5);backdrop-filter:blur(12px);border:1.5px solid rgba(255,255,255,.2);border-radius:20px;padding:7px 13px;font-size:14px;font-weight:700;color:white;outline:none;font-family:'M PLUS Rounded 1c',sans-serif;}
.chat-input::placeholder{color:rgba(255,255,255,.35);}
.chat-input:focus{border-color:var(--gold);}
.chat-send{width:36px;height:36px;border-radius:50%;background:var(--orange);border:none;color:#fff;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;pointer-events:all;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.4);}
#anim-panel{position:absolute;bottom:0;left:0;right:0;pointer-events:all;padding:4px 0 8px;background:linear-gradient(0deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,.5) 100%);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.08);height:82px;}
#anim-scroll{display:flex;gap:5px;overflow-x:auto;padding:2px 10px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
#anim-scroll::-webkit-scrollbar{display:none;}
.anim-btn{flex-shrink:0;width:56px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.anim-icon{width:54px;height:54px;border-radius:10px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;transition:all .15s;}
.anim-icon svg{width:44px;height:44px;}
.anim-btn.active .anim-icon{background:rgba(245,200,66,.12);border-color:var(--gold);box-shadow:0 0 10px rgba(245,200,66,.25);}
.anim-btn:active .anim-icon{transform:scale(.88);}
.anim-label{font-size:.48rem;font-weight:700;color:rgba(255,255,255,.4);text-align:center;line-height:1.1;}
.anim-btn.active .anim-label{color:var(--gold);}
#joystick-zone{position:absolute;bottom:90px;right:12px;width:96px;height:96px;pointer-events:all;}
#cam-joystick-zone{position:absolute;bottom:90px;left:12px;width:96px;height:96px;pointer-events:all;}
.joy-base{width:96px;height:96px;border-radius:50%;background:rgba(0,0,0,.22);border:1.5px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);position:relative;display:flex;align-items:center;justify-content:center;}
.joy-knob{width:38px;height:38px;border-radius:50%;position:absolute;box-shadow:0 2px 10px rgba(0,0,0,.4);}
#jump-btn{position:absolute;bottom:138px;right:52px;width:46px;height:46px;border-radius:50%;background:#2b6cb0;border:none;color:#fff;font-size:1.2rem;pointer-events:all;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;z-index:12;}
#super-jump-btn{position:absolute;bottom:138px;left:52px;width:46px;height:46px;border-radius:50%;background:var(--orange);border:none;color:#fff;font-size:.95rem;pointer-events:all;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;z-index:12;}
#shrink-overlay{position:fixed;inset:0;z-index:30;pointer-events:none;transition:all .5s;border:0px solid rgba(100,200,255,.8);box-shadow:inset 0 0 0px rgba(100,200,255,.4);}
#shrink-overlay.active{border-width:12px;box-shadow:inset 0 0 60px rgba(100,200,255,.4);}
#sewer-overlay{position:fixed;inset:0;z-index:25;background:radial-gradient(ellipse at center,rgba(20,40,10,.0) 0%,rgba(10,20,5,.0) 100%);pointer-events:none;transition:all .8s;}
#sewer-overlay.active{background:radial-gradient(ellipse at center,rgba(20,60,10,.7) 0%,rgba(0,0,0,.95) 100%);}
.shrunk-label{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2rem;font-weight:900;color:rgba(100,200,255,.9);text-shadow:0 0 30px rgba(100,200,255,.8);pointer-events:none;z-index:40;opacity:0;transition:opacity .5s;}
.shrunk-label.show{opacity:1;}
#jetpack-hud{position:fixed;top:50%;right:60px;transform:translateY(-50%);z-index:20;pointer-events:none;display:none;}
#jetpack-hud.show{display:flex;flex-direction:column;align-items:center;gap:4px;}
.jp-label{font-size:.6rem;font-weight:900;color:#ff8800;text-shadow:0 0 10px #ff4400;}
.jp-bar-wrap{width:12px;height:80px;background:rgba(0,0,0,.5);border:1px solid rgba(255,136,0,.4);border-radius:6px;overflow:hidden;display:flex;flex-direction:column-reverse;}
.jp-bar{width:100%;background:linear-gradient(180deg,#ff8800,#ff4400);border-radius:6px;transition:height .1s;}
.toast{position:fixed;bottom:190px;left:50%;transform:translateX(-50%) translateY(14px);background:rgba(0,0,0,.88);color:var(--gold);padding:6px 14px;border-radius:16px;font-size:.68rem;font-weight:700;opacity:0;transition:all .25s;z-index:50;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.mission{background:rgba(20,80,40,.95);color:var(--green);border:1px solid var(--green);}
.toast.secret{background:rgba(10,30,80,.95);color:#88ccff;border:1px solid #88ccff;}
.toast.jetpack{background:rgba(80,40,10,.95);color:#ff8800;border:1px solid #ff8800;}
#markers{position:fixed;inset:0;z-index:15;pointer-events:none;}
.marker{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;opacity:0;transition:opacity .3s;}
.marker.visible{opacity:1;}
.marker-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;animation:markerBounce 1.2s ease-in-out infinite;}
.marker-label{font-size:.5rem;font-weight:900;color:#fff;background:rgba(0,0,0,.7);padding:1px 5px;border-radius:6px;white-space:nowrap;}
@keyframes markerBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
#loading-screen{position:fixed;inset:0;z-index:200;background:#b0c8e8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s;}
#loading-screen.hidden{opacity:0;pointer-events:none;}
.load-logo{font-family:'Zen Kaku Gothic New',sans-serif;font-size:2.2rem;font-weight:900;color:#1a2a40;letter-spacing:.06em;}
.load-logo em{color:var(--orange);font-style:normal;}
.load-kanji{font-size:.9rem;color:rgba(26,42,64,.6);letter-spacing:.25em;}
.load-bar-wrap{width:180px;height:3px;background:rgba(0,0,0,.12);border-radius:2px;overflow:hidden;}
.load-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--orange),var(--gold));border-radius:2px;transition:width .2s;}
.load-txt{font-size:.68rem;color:rgba(26,42,64,.6);font-weight:700;}
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="sewer-overlay"></div>
<div id="shrink-overlay"></div>
<div class="shrunk-label" id="shrunk-label">🔬 MICRO-MODE</div>

<div id="jetpack-hud">
  <div class="jp-label">🚀</div>
  <div class="jp-bar-wrap"><div class="jp-bar" id="jp-bar" style="height:100%"></div></div>
</div>

<div id="loading-screen">
  <div class="load-logo">TOKYO<em>東京</em></div>
  <div class="load-kanji">MACADAM WORLD</div>
  <div class="load-bar-wrap"><div class="load-bar" id="load-bar"></div></div>
  <div class="load-txt" id="load-txt">Chargement…</div>
</div>

<div id="hud">
  <div class="hud-top">
    <div class="hud-logo">⬡ <em>Macadam</em> World</div>
    <div class="hud-loc"><div class="loc-dot"></div><span id="zone-label">東京 Shinjuku</span></div>
    <div class="hud-info"><div class="hud-pic" id="hud-pic">?</div><span class="hud-name" id="hud-pseudo">Joueur</span></div>
  </div>
  <div id="minimap">
    <canvas id="minimap-canvas" width="240" height="240"></canvas>
    <div id="teleport-cooldown"></div>
    <div id="tp-popup" style="display:none;" class="tp-popup">
      <div class="tp-popup-title" id="tp-popup-title">Destination</div>
      <button class="tp-popup-btn" id="tp-popup-btn">⚡ Téléporter</button>
    </div>
  </div>
  <button id="mission-toggle" style="pointer-events:all;">🎯<div class="excl" id="mission-excl"></div></button>
  <div id="mission-hud"></div>
  <div class="hud-chat">
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-wrap">
      <input class="chat-input" id="chat-input" type="text" placeholder="Dis quelque chose…" maxlength="80" autocomplete="off"/>
      <button class="chat-send" id="chat-send">▶</button>
    </div>
  </div>
  <div id="cam-joystick-zone"><div class="joy-base" id="cam-joy-base"><div class="joy-knob" id="cam-joy-knob" style="background:linear-gradient(135deg,#f5c842,#e85d26);"></div></div></div>
  <button id="super-jump-btn">🚀</button>
  <button id="jump-btn">↑</button>
  <div id="joystick-zone"><div class="joy-base" id="joy-base"><div class="joy-knob" id="joy-knob" style="background:linear-gradient(135deg,#dddddd,#aaaaaa);"></div></div></div>
  <div id="anim-panel"><div id="anim-scroll"></div></div>
</div>
<div id="markers"></div>
<div class="toast" id="toast"></div>

<script type="importmap">

function procTex(fn,size=512){
  const cv=document.createElement('canvas');cv.width=cv.height=size;
  const ctx=cv.getContext('2d');fn(ctx,size);
  const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}

function makeBrickTex(br,jo){
  return procTex((ctx,s)=>{
    ctx.fillStyle=jo;ctx.fillRect(0,0,s,s);
    const BW=48,BH=22;
    for(let row=0;row*BH<s+BH;row++){
      const off=(row%2)*BW/2;
      for(let col=-1;col*BW<s+BW;col++){
        const rr=parseInt(br.slice(1,3),16),rg=parseInt(br.slice(3,5),16),rb2=parseInt(br.slice(5,7),16);
        const vr=Math.random()*30-15,vg=Math.random()*20-10,vb=Math.random()*20-10;
        ctx.fillStyle=`rgb(${Math.max(30,Math.min(230,rr+vr))},${Math.max(20,Math.min(180,rg+vg))},${Math.max(20,Math.min(160,rb2+vb))})`;
        ctx.fillRect(col*BW+off+2,row*BH+2,BW-4,BH-4);
        // Variante de surface
        const sg=ctx.createLinearGradient(col*BW+off,row*BH,col*BW+off+BW,row*BH+BH);
        sg.addColorStop(0,'rgba(255,255,255,0.05)');sg.addColorStop(0.5,'rgba(0,0,0,0.05)');sg.addColorStop(1,'rgba(0,0,0,0.1)');
        ctx.fillStyle=sg;ctx.fillRect(col*BW+off+2,row*BH+2,BW-4,BH-4);
      }
    }
    // Humidité/saleté
    for(let i=0;i<40;i++){
      const mx=Math.random()*s,my=Math.random()*s;
      const mg=ctx.createRadialGradient(mx,my,0,mx,my,15+Math.random()*20);
      mg.addColorStop(0,'rgba(20,15,10,0.3)');mg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=mg;ctx.fillRect(0,0,s,s);
    }
  },512);
}

function makeWinTex(){
  return procTex((ctx,s)=>{
    ctx.fillStyle='#12202e';ctx.fillRect(0,0,s,s);
    const cols=4,rows=6,pw=s/cols,ph=s/rows;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const lit=Math.random()<0.75;
      const baseColors=['#c2d5e5','#d8e0e8','#e2d8b5','#d0c5a0'];
      ctx.fillStyle=lit?baseColors[Math.floor(Math.random()*baseColors.length)]:'#0a1520';
      ctx.fillRect(c*pw+3,r*ph+3,pw-6,ph-6);
      if(lit){
        // Reflet coin
        ctx.fillStyle='rgba(255,255,255,0.22)';
        ctx.fillRect(c*pw+4,r*ph+4,pw*0.3,ph*0.2);
        // Gradient intérieur
        const wg=ctx.createLinearGradient(c*pw,r*ph,c*pw+pw,r*ph+ph);
        wg.addColorStop(0,'rgba(255,255,255,0.08)');wg.addColorStop(1,'rgba(0,0,0,0.15)');
        ctx.fillStyle=wg;ctx.fillRect(c*pw+3,r*ph+3,pw-6,ph-6);
      }
      // Cadre fenêtre
      ctx.strokeStyle='rgba(80,80,80,0.8)';ctx.lineWidth=1.5;ctx.strokeRect(c*pw+3,r*ph+3,pw-6,ph-6);
    }
  },512);
}

    ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=4;

}

// ── COLLIDERS UNIFIÉS ──────────────────────────────────
// Tous les colliders : boîtes AABBs et cylindres
const boxColliders=[];  // {minX,maxX,minZ,maxZ,minY,maxY}
const cylinderColliders=[];  // {x,z,r,maxH}
const dynamicColliders=[]; // voitures/vélos en mouvement {mesh,hw,hd,h}

const PR=0.55; // rayon joueur

function addBox(cx,cz,hw,hd,maxH=200,minY=0){
  boxColliders.push({minX:cx-hw,maxX:cx+hw,minZ:cz-hd,maxZ:cz+hd,maxY:maxH,minY});
}
function addCyl(x,z,r,maxH=200){
  cylinderColliders.push({x,z,r,maxH});
}

// Résolution collisions statiques
function resolveCollisions(nx,nz,py){
  // Boîtes
  for(const c of boxColliders){
    if(py>=c.maxY||py<c.minY)continue;
    const px=Math.max(c.minX,Math.min(c.maxX,nx));
    const pz=Math.max(c.minZ,Math.min(c.maxZ,nz));
    const dx=nx-px,dz=nz-pz,d=Math.sqrt(dx*dx+dz*dz);
    if(d<PR){if(d<0.001){nx+=PR;}else{const p=PR-d;nx+=(dx/d)*p;nz+=(dz/d)*p;}}
  }
  // Cylindres
  for(const c of cylinderColliders){
    if(py>=c.maxH)continue;
    const dx=nx-c.x,dz=nz-c.z,d=Math.sqrt(dx*dx+dz*dz);
    const minDist=PR+c.r;
    if(d<minDist){if(d<0.001){nx+=minDist;}else{const p=(minDist-d)/d;nx+=dx*p;nz+=dz*p;}}
  }
  // Dynamiques (voitures/vélos)
  for(const c of dynamicColliders){
    const cx=c.mesh.position.x,cz=c.mesh.position.z;
    const cosA=Math.cos(-c.mesh.rotation.y),sinA=Math.sin(-c.mesh.rotation.y);
    const lx=(nx-cx)*cosA-(nz-cz)*sinA;
    const lz=(nx-cx)*sinA+(nz-cz)*cosA;
    const clampX=Math.max(-c.hw,Math.min(c.hw,lx));
    const clampZ=Math.max(-c.hd,Math.min(c.hd,lz));
    const dlx=lx-clampX,dlz=lz-clampZ;
    const d=Math.sqrt(dlx*dlx+dlz*dlz);
    if(d<PR&&c.mesh.position.y<py+c.h){
      if(d<0.001){
        const wx=cosA*PR-sinA*0,wz=sinA*PR+cosA*0;
        nx+=wx;nz+=wz;
      }else{
        const p=PR-d;
        const wx=cosA*(dlx/d)*p-sinA*(dlz/d)*p;
        const wz=sinA*(dlx/d)*p+cosA*(dlz/d)*p;
        nx+=wx;nz+=wz;
      }
    }
  }
  return{x:nx,z:nz};
}

// Résolution ÉGOUT (boîtes)
const sewerBoxColliders=[];
function resolveSewerCollisions(nx,nz,py){
  for(const c of sewerBoxColliders){
    const px=Math.max(c.minX,Math.min(c.maxX,nx));
    const pz=Math.max(c.minZ,Math.min(c.maxZ,nz));
    const dx=nx-px,dz=nz-pz,d=Math.sqrt(dx*dx+dz*dz);
    if(d<PR){if(d<0.001){nx+=PR;}else{const p=PR-d;nx+=(dx/d)*p;nz+=(dz/d)*p;}}
  }
  return{x:nx,z:nz};
}

function makeRealisticCar(startX,startZ,axis,dir,route,colorIdx){

  const wfrontM=glassMat.clone();

    const lens=new THREE.Mesh(new THREE.CylinderGeometry(0.19,0.19,0.05,12),lightMat);lens.rotation.x=Math.PI/2;lens.position.set(sx,0.65,2.24);g.add(lens);
    // Chrome autour

  });

  // Feux arrière
  [-0.65,0.65].forEach(sx=>{
    const rearL=new THREE.Mesh(new THREE.BoxGeometry(0.35,0.14,0.06),rearLightMat);rearL.position.set(sx,0.68,-2.2);g.add(rearL);

  });

  // Calandre avant
  const grille=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.35,0.08),plasticMat);grille.position.set(0,0.38,2.22);g.add(grille);
  const chrBump=new THREE.Mesh(new THREE.BoxGeometry(1.85,0.12,0.1),chromeMat);chrBump.position.set(0,0.22,2.2);g.add(chrBump);
  const chrBump2=new THREE.Mesh(new THREE.BoxGeometry(1.85,0.12,0.1),chromeMat);chrBump2.position.set(0,0.22,-2.2);g.add(chrBump2);

  g.position.set(startX,0,startZ);

  return carObj;
}

function makeRealisticBike(startX,startZ,axis,dir,route){
  const g=new THREE.Group();scene.add(g);

  const frameColor=new THREE.Color(clothColors[Math.floor(Math.random()*clothColors.length)]);
  const frameMat=new THREE.MeshStandardMaterial({color:frameColor,roughness:0.3,metalness:0.7,map:bikeMetalTex});
  const tireMat3=new THREE.MeshStandardMaterial({color:0x111111,roughness:0.95});
  const chromeMat=new THREE.MeshStandardMaterial({color:0xcccccc,roughness:0.1,metalness:0.95});
  const skinColors=['#f4c896','#e8a86c','#c8804a','#5c3a1e'];
  const skinMat=new THREE.MeshStandardMaterial({color:new THREE.Color(skinColors[Math.floor(Math.random()*skinColors.length)]),roughness:0.7});

  // Roues
  [0.65,-0.65].forEach(z=>{
    const wheelGroup=new THREE.Group();wheelGroup.position.set(0,0.38,z);g.add(wheelGroup);
    // Pneu
    const torus=new THREE.Mesh(new THREE.TorusGeometry(0.35,0.06,8,16),tireMat3);torus.rotation.y=Math.PI/2;wheelGroup.add(torus);
    // Jante
    const rim=new THREE.Mesh(new THREE.TorusGeometry(0.28,0.025,6,12),chromeMat);rim.rotation.y=Math.PI/2;wheelGroup.add(rim);
    // Rayons
    for(let r=0;r<8;r++){
      const ang=r*Math.PI/4;
      const spoke=new THREE.Mesh(new THREE.CylinderGeometry(0.008,0.008,0.56,4),chromeMat);spoke.rotation.z=Math.PI/2;spoke.rotation.y=ang;wheelGroup.add(spoke);
    }
    const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.08,8),chromeMat);hub.rotation.z=Math.PI/2;wheelGroup.add(hub);
  });

  // Cadre - triangles
  // Tube supérieur
  const tubeTop=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,1.36,8),frameMat);tubeTop.rotation.z=Math.PI/2;tubeTop.position.set(0,0.78,0);g.add(tubeTop);
  // Tube inférieur diagonal
  const tubeBotGeo=new THREE.CylinderGeometry(0.025,0.025,1.4,8);
  const tubeBot=new THREE.Mesh(tubeBotGeo,frameMat);tubeBot.rotation.z=Math.atan2(0.35,0.63);tubeBot.position.set(0,0.57,0.05);g.add(tubeBot);
  // Selle
  const seatPost=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,0.35,8),chromeMat);seatPost.position.set(0,0.88,-0.55);g.add(seatPost);
  const saddle=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.06,0.35),frameMat);saddle.position.set(0,1.07,-0.5);g.add(saddle);
  saddle.scale.z=1;

  // Guidon
  const handlePost=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,0.3,8),chromeMat);handlePost.position.set(0,0.88,0.62);g.add(handlePost);
  const handleBar=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.44,8),chromeMat);handleBar.rotation.z=Math.PI/2;handleBar.position.set(0,1.02,0.65);g.add(handleBar);
  [-0.2,0.2].forEach(hx=>{
    const grip=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,0.1,8),new THREE.MeshStandardMaterial({color:0x222222,roughness:0.9}));grip.rotation.z=Math.PI/2;grip.position.set(hx,1.02,0.65);g.add(grip);
  });

  // Cycliste réaliste
  const cycSkin=skinMat;
  const cycCloth=CLOTH_MATS[Math.floor(Math.random()*CLOTH_MATS.length)];
  const cycHair=HAIR_MATS[Math.floor(Math.random()*HAIR_MATS.length)];
  const helmMat=new THREE.MeshStandardMaterial({color:new THREE.Color(clothColors[Math.floor(Math.random()*clothColors.length)]),roughness:0.5});

  // Corps cycliste (penché)
  const cycBody=new THREE.Mesh(new THREE.BoxGeometry(0.32,0.45,0.2),cycCloth);cycBody.position.set(0,1.1,0);cycBody.rotation.x=-0.3;g.add(cycBody);
  // Jambes pédalant
  const cycLegL=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.38,0.12),cycCloth);cycLegL.position.set(-0.1,0.78,0.1);g.add(cycLegL);
  const cycLegR=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.38,0.12),cycCloth);cycLegR.position.set(0.1,0.78,0.1);g.add(cycLegR);
  // Bras sur guidon
  const cycArmL=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.08,0.3),cycCloth);cycArmL.position.set(-0.15,1.05,0.42);g.add(cycArmL);
  const cycArmR=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.08,0.3),cycCloth);cycArmR.position.set(0.15,1.05,0.42);g.add(cycArmR);
  // Tête
  const cycHead=new THREE.Mesh(new THREE.SphereGeometry(0.15,8,6),cycSkin);cycHead.position.set(0,1.37,0.5);g.add(cycHead);
  // Casque
  const helm=new THREE.Mesh(new THREE.SphereGeometry(0.17,8,6),helmMat);helm.position.set(0,1.45,0.5);helm.scale.y=0.7;g.add(helm);
  const helmVisor=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.06,0.1),new THREE.MeshStandardMaterial({color:0x222222,roughness:0.2,metalness:0.5}));helmVisor.position.set(0,1.35,0.59);g.add(helmVisor);
  // Yeux
  const eyMat=new THREE.MeshStandardMaterial({color:0x111111,roughness:0.2});
  [-0.055,0.055].forEach(ex=>{const eye=new THREE.Mesh(new THREE.SphereGeometry(0.024,5,4),eyMat);eye.position.set(ex,1.37,0.64);g.add(eye);});

  if(axis==='x')g.rotation.y=dir>0?-Math.PI/2:Math.PI/2;
  else g.rotation.y=dir>0?0:Math.PI;

  g.position.set(startX,0,startZ);
  const bikeObj={mesh:g,axis,dir,route,speed:3.5+Math.random()*2.5,hw:0.22,hd:0.75,h:1.5,cycLegL,cycLegR,wheels:g.children.slice(0,2),phase:Math.random()*Math.PI*2};
  movingVehicles.push(bikeObj);
  dynamicColliders.push(bikeObj);
  return bikeObj;
}

    card.innerHTML=`<div class="mission-title">${m.title}${m.done?'<span class="mission-badge">✓</span>':''}</div><div class="mission-desc">${m.desc}</div>${!m.done?`<div class="mission-progress"><div class="mission-bar" style="width:${(m.progress/m.total)*100}%"></div></div>`:''}`;

  });
  const pk=worldToMM(-30,-30),pk2=worldToMM(30,30);mmCtx.fillStyle='rgba(46,140,60,.35)';mmCtx.fillRect(pk.x,pk.y,pk2.x-pk.x,pk2.y-pk.y);
  TELEPORT_POINTS.forEach(tp=>{
    const pos=worldToMM(tp.x,tp.z);

const gltfLoader=new GLTFLoader();const glbCache={};
function loadGLB(url,cb){if(glbCache[url]){cb(glbCache[url]);return;}gltfLoader.load(url,gltf=>{glbCache[url]=gltf;cb(gltf);},undefined,err=>console.error('GLB fail:',url,err));}
function swapAvatar(file,loop,onDone){
  const url=BASE+file;
  loadGLB(url,gltf=>{
    while(avatarGroup.children.length)avatarGroup.remove(avatarGroup.children[0]);
    if(avatarMixer){avatarMixer.stopAllAction();avatarMixer=null;}
    const model=gltf.scene;model.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true;}});
    const bb=new THREE.Box3().setFromObject(model);const sz=new THREE.Vector3();bb.getSize(sz);
    if(sz.y>0)model.scale.setScalar(1.75/sz.y);
    const bb2=new THREE.Box3().setFromObject(model);model.position.y=-bb2.min.y;
    avatarGroup.add(model);
    if(gltf.animations&&gltf.animations.length){
      avatarMixer=new THREE.AnimationMixer(model);
      const action=avatarMixer.clipAction(gltf.animations[0]);
      action.setLoop(loop?THREE.LoopRepeat:THREE.LoopOnce,loop?Infinity:1);
      action.clampWhenFinished=!loop;action.play();
      if(onDone)onDone(gltf.animations[0].duration);
    }
  });
}

// ── BOUCLE PRINCIPALE ───────────────────────────────────
const SPEED=6,BOUND=WORLD-4;
const pp=new THREE.Vector3(0,0,8);
let pRot=0,cameraYaw=Math.PI;
const CD=8,CH=2.6,CLY=1.2,CL=4;
const clock=new THREE.Clock();
let time=0;

finishLoading();renderMissions();

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.08);
  time+=dt;
  if(avatarMixer)avatarMixer.update(dt);

  // ── Animations des zones ────────────────────────────
  if(puddleZone){
    puddleZone.ring1.material.opacity=0.2+0.2*Math.sin(time*2);
    puddleZone.ring2.material.opacity=0.2+0.3*Math.sin(time*2.5+1);
    puddleZone.ring1.scale.setScalar(1+0.06*Math.sin(time*1.5));
    puddleZone.ring2.scale.setScalar(1+0.08*Math.sin(time*2+0.5));
    puddleZone.arrow.rotation.y=time*2;puddleZone.arrow.position.y=1.2+0.2*Math.sin(time*2);
  }
  if(window._sewerArrow){window._sewerArrow.rotation.y=time*1.5;window._sewerArrow.position.y=1.5+0.25*Math.sin(time*1.8);}
  if(window._jpGroup&&!jetpackCollected){window._jpGroup.rotation.y=time;window._jpGroup.position.y=SEWER_FLOOR_Y+1.5+0.2*Math.sin(time*2);}
  if(wallPassZone&&!wallPassZone.treasureCollected)wallPassZone.treasure.rotation.y=time;
  sewerCoinMeshes.forEach(c=>{if(!c.collected){c.mesh.rotation.z=time*2;c.mesh.position.y=SEWER_FLOOR_Y+1+0.1*Math.sin(time*3+c.mesh.position.x);}});

  // ── VÉHICULES - Déplacement et collisions ───────────
  movingVehicles.forEach(v=>{
    if(v.axis==='x'){
      v.mesh.position.x+=v.dir*v.speed*dt;
      if(v.mesh.position.x>152)v.mesh.position.x=-152;
      if(v.mesh.position.x<-152)v.mesh.position.x=152;
    }else{
      v.mesh.position.z+=v.dir*v.speed*dt;
      if(v.mesh.position.z>152)v.mesh.position.z=-152;
      if(v.mesh.position.z<-152)v.mesh.position.z=152;
    }
    // Rotation roues vélo
    if(v.cycLegL!==undefined){
      v.phase=(v.phase||0)+v.speed*dt*1.5;
      v.cycLegL.position.z=0.12*Math.sin(v.phase);
      v.cycLegL.position.y=0.78+0.04*Math.cos(v.phase);
      v.cycLegR.position.z=-0.12*Math.sin(v.phase);
      v.cycLegR.position.y=0.78-0.04*Math.cos(v.phase);
    }
  });

  // ── PIÉTONS - Déplacement animé ─────────────────────
  pedObjects.forEach(p=>{
    p.legPhase+=p.speed*dt*2;
    if(p.axis==='x'){
      p.mesh.position.x+=p.dir*p.speed*dt;
      if(p.mesh.position.x>145)p.mesh.position.x=-145;
      if(p.mesh.position.x<-145)p.mesh.position.x=145;
    }else{
      p.mesh.position.z+=p.dir*p.speed*dt;
      if(p.mesh.position.z>145)p.mesh.position.z=-145;
      if(p.mesh.position.z<-145)p.mesh.position.z=145;
    }
    // Animation jambes réaliste
    const lAng=Math.sin(p.legPhase)*0.35;
    const rAng=-Math.sin(p.legPhase)*0.35;
    p.legL.rotation.x=lAng;p.legR.rotation.x=rAng;
    p.armLU.rotation.x=rAng*0.6;p.armRU.rotation.x=lAng*0.6;
    p.footL.position.z=Math.sin(p.legPhase)*0.06;
    p.footR.position.z=-Math.sin(p.legPhase)*0.06;
    // Mise à jour collider dynamique
    p.hw=0.22;p.hd=0.22;p.h=1.8;
  });

  // ── INPUT ──────────────────────────────────────────
  let mx=joy.x,mz=-joy.y;
  if(keys['ArrowUp']||keys['w']||keys['W'])mz=1;
  if(keys['ArrowDown']||keys['s']||keys['S'])mz=-1;
  if(keys['ArrowLeft']||keys['a']||keys['A'])mx=-1;
  if(keys['ArrowRight']||keys['d']||keys['D'])mx=1;
  if(keys[' ']&&onGround)doJump();
  if(camJoy.active&&Math.abs(camJoy.x)>0.04)cameraYaw-=camJoy.x*2.2*dt;
  if(keys['q']||keys['Q'])cameraYaw+=1.8*dt;
  if(keys['e']||keys['E'])cameraYaw-=1.8*dt;

  // JetPack (maintenir O ou bouton)
  if(keys['o']||keys['O']){if(hasJetpack&&jetpackFuel>0){jumpVel=Math.max(jumpVel,JETPACK_POWER);onGround=false;jetpackFuel=Math.max(0,jetpackFuel-JETPACK_DRAIN*dt);updateJetpackUI();}}
  else if(hasJetpack&&jetpackFuel<100){jetpackFuel=Math.min(100,jetpackFuel+JETPACK_REGEN*dt);updateJetpackUI();}

  const moving=Math.abs(mx)>0.05||Math.abs(mz)>0.05;
  if(moving&&emoteTimer){clearTimeout(emoteTimer);emoteTimer=null;}
  if(onGround&&!isOnLadder)setWalkSwap(moving);

  // ── PHYSIQUE ÉCHELLE ────────────────────────────────
  if(ladderZone){
    const distLadder=Math.sqrt((pp.x-ladderZone.x)**2+(pp.z-ladderZone.z)**2);
    if(distLadder<1.5&&!isOnLadder&&mz>0.3){
      isOnLadder=true;showToast('🪜 Accroché ! Monte avec ↑');addChat('Tu commences à grimper…','Info');
    }
    if(isOnLadder){
      pp.x=ladderZone.x;pp.z=ladderZone.z;onGround=false;jumpVel=0;
      if(mz>0.2)pp.y=Math.min(pp.y+4*dt,ladderZone.topY+0.2);
      else if(mz<-0.2)pp.y=Math.max(pp.y-4*dt,0);
      if(pp.y<=0.1){isOnLadder=false;pp.y=0;onGround=true;}
      if(pp.y>=ladderZone.topY-0.5){
        isOnLadder=false;onGround=true;pp.x=ladderZone.platX;pp.z=ladderZone.platZ;pp.y=ladderZone.topY+0.2;
        showToast('🏆 Sommet atteint !','mission');completeMission('ladder','Tu as grimpé jusqu\'au toit !');updateMissionProgress('ladder',1);
      }
      setWalkSwap(false);
    }
  }

  // ── MOUVEMENT VILLE ────────────────────────────────
  if(!isOnLadder&&!isInSewer){
    if(moving){
      const sc=Math.sin(cameraYaw),cc=Math.cos(cameraYaw);
      const spd=isShrunk?SPEED*0.4:SPEED;
      const dx=(sc*(-mz)+cc*mx)*spd*dt,dz=(cc*(-mz)-sc*mx)*spd*dt;
      let nx=pp.x+dx,nz=pp.z+dz;
      if(!isShrunk){const res=resolveCollisions(nx,nz,pp.y);nx=res.x;nz=res.z;}
      pp.x=Math.max(-BOUND,Math.min(BOUND,nx));pp.z=Math.max(-BOUND,Math.min(BOUND,nz));
      pRot=Math.atan2(dx,dz);
      const tY=pRot+Math.PI;let diff=tY-cameraYaw;
      while(diff>Math.PI)diff-=2*Math.PI;while(diff<-Math.PI)diff+=2*Math.PI;
      cameraYaw+=diff*Math.min(CL*dt,1.0);
    }
    if(!onGround){jumpVel-=GR*dt;pp.y+=jumpVel*dt;if(pp.y<=0){pp.y=0;jumpVel=0;onGround=true;setWalkSwap(moving);}}
  }

  // ── MOUVEMENT ÉGOUT ───────────────────────────────
  if(isInSewer){
    if(moving){
      const sc=Math.sin(cameraYaw),cc=Math.cos(cameraYaw);
      const dx=(sc*(-mz)+cc*mx)*SPEED*0.7*dt,dz=(cc*(-mz)-sc*mx)*SPEED*0.7*dt;
      let nx=pp.x+dx,nz=pp.z+dz;
      const res=resolveSewerCollisions(nx,nz,pp.y);nx=res.x;nz=res.z;
      pp.x=Math.max(-BOUND,Math.min(BOUND,nx));pp.z=Math.max(-BOUND,Math.min(BOUND,nz));
      pRot=Math.atan2(dx,dz);
      const tY=pRot+Math.PI;let diff=tY-cameraYaw;
      while(diff>Math.PI)diff-=2*Math.PI;while(diff<-Math.PI)diff+=2*Math.PI;
      cameraYaw+=diff*Math.min(CL*dt,1.0);
    }
    pp.y=SEWER_FLOOR_Y+0.1;onGround=true;jumpVel=0;setWalkSwap(moving);

    // Collecte capsules
    sewerCoinMeshes.forEach(c=>{
      if(!c.collected){
        const d=Math.sqrt((pp.x-c.mesh.position.x)**2+(pp.z-c.mesh.position.z)**2);
        if(d<1.5){
          c.collected=true;c.mesh.visible=false;sewerCoinsCollected++;
          showToast(`💚 Capsule ${sewerCoinsCollected}/10 !`,'mission');
          updateMissionProgress('sewer',sewerCoinsCollected);
          if(sewerCoinsCollected>=10)completeMission('sewer','Toutes les capsules collectées !');
          addChat(`Capsule ${sewerCoinsCollected}/10 récupérée !`,'Égout');
        }
      }
    });

    // Collecte JetPack
    if(!jetpackCollected&&window._jpGroup){
      const djp=Math.sqrt((pp.x-window._jpGroup.position.x)**2+(pp.z-window._jpGroup.position.z)**2);
      if(djp<2){
        jetpackCollected=true;hasJetpack=true;window._jpGroup.visible=false;
        showToast('🚀 JETPACK RÉCUPÉRÉ ! Appuie sur O ou 🚀 pour voler !','jetpack');
        addChat('🚀🚀 JetPack équipé ! Tu peux maintenant voler !','Système');
        completeMission('jetpack','JetPack trouvé dans les égouts !');updateMissionProgress('jetpack',1);
        updateJetpackUI();
        // Lumière sur le joueur
        const jpLight=new THREE.PointLight(0xff8800,1.5,8);avatarGroup.add(jpLight);
        jpLight.position.y=1;
      }
    }

    // Sortie égout (retour à l'entrée)
    const distEntry=Math.sqrt((pp.x-SW_OX)**2+(pp.z-SW_OZ)**2);
    if(distEntry<3){exitSewer();pp.y=0.5;}
  }

  // ── ZONES DE MISSION VILLE ──────────────────────────
  if(puddleZone){
    const dPud=Math.sqrt((pp.x-puddleZone.x)**2+(pp.z-puddleZone.z)**2);
    if(dPud<puddleZone.r&&!isInSewer&&onGround&&!missions.find(x=>x.id==='puddle')?.done){
      const m=missions.find(x=>x.id==='puddle');if(m)m.done=true;
      enterSewer();pp.x=SW_OX;pp.z=SW_OZ+5;pp.y=SEWER_FLOOR_Y+0.1;
      showToast('🌊 Aspiré dans les égouts !','secret');addChat('💧 La flaque t\'a aspiré !','Système');renderMissions();
    }
  }
  if(wallPassZone){
    const inZone=Math.abs(pp.x-wallPassZone.x)<wallPassZone.halfW+1&&Math.abs(pp.z-wallPassZone.z)<wallPassZone.halfD+0.8;
    if(inZone&&!isShrunk)enterShrink();
    if(!wallPassZone.treasureCollected){
      const dT=Math.sqrt((pp.x-(wallPassZone.x-8))**2+(pp.z-wallPassZone.z)**2);
      if(dT<1.5&&isShrunk){wallPassZone.treasureCollected=true;wallPassZone.treasure.visible=false;showToast('💎 Trésor secret !','mission');addChat('💎 Trésor rare trouvé !','Système');}
    }
    if(isShrunk&&Math.abs(pp.x-wallPassZone.x)>20)exitShrink();
  }
  // Entrée égout par la grille
  const distSewer=Math.sqrt((pp.x-SW_OX)**2+(pp.z-SW_OZ)**2);
  if(distSewer<2&&!isInSewer&&onGround){enterSewer();pp.y=SEWER_FLOOR_Y+0.1;}

  // ── AVATAR & CAMÉRA ────────────────────────────────
  const scale=isShrunk?0.35:1;
  avatarGroup.scale.setScalar(scale);
  avatarGroup.position.set(pp.x,pp.y,pp.z);
  avatarGroup.rotation.y=pRot;
  blob.position.x=pp.x;blob.position.z=pp.z;blob.position.y=isInSewer?SEWER_FLOOR_Y+0.02:0.012;

  const camDist=isShrunk?3:isInSewer?3.5:CD;
  const camH=isShrunk?1:isInSewer?2.2:CH;
  const camLookY=isShrunk?0.5:isInSewer?1.0:CLY;
  camera.position.set(pp.x+Math.sin(cameraYaw)*camDist,pp.y+camH,pp.z+Math.cos(cameraYaw)*camDist);
  camera.lookAt(pp.x,pp.y+camLookY,pp.z);

  updateMarkers();drawMinimap();
  renderer.render(scene,camera);
}

document.getElementById('mission-toggle').addEventListener('click',()=>{document.getElementById('mission-hud').classList.toggle('open');});
animate();
</script>
