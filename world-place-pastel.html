<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Macadam World — Tokyo</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--gold:#f5c842;--orange:#e85d26;--green:#2ecc71;--ui-bg:rgba(10,15,25,0.82);}
html,body{width:100%;height:100%;overflow:hidden;background:#8ab4d4;font-family:'M PLUS Rounded 1c',sans-serif;user-select:none;-webkit-user-select:none;}
#canvas-container{position:fixed;inset:0;}
canvas{display:block;width:100%!important;height:100%!important;}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;}
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,transparent 100%);}
.hud-logo{font-family:'Zen Kaku Gothic New',sans-serif;font-size:.9rem;font-weight:900;color:#fff;letter-spacing:.05em;}
.hud-logo em{color:var(--gold);font-style:normal;}
.hud-loc{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.38);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:4px 10px;}
.hud-loc span{font-size:.65rem;font-weight:700;color:#fff;}
.loc-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hud-info{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.38);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:4px 10px 4px 4px;}
.hud-pic{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--gold));display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:900;color:#fff;}
.hud-name{font-size:.65rem;font-weight:700;color:#fff;}
#minimap{position:absolute;top:52px;left:10px;width:120px;height:120px;border-radius:12px;background:var(--ui-bg);border:1.5px solid rgba(255,255,255,.18);overflow:hidden;pointer-events:none;}
#minimap canvas{width:120px;height:120px;}
.minimap-label{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:.45rem;font-weight:700;color:rgba(255,255,255,.5);}
#mission-panel{position:absolute;top:52px;right:10px;width:170px;pointer-events:all;}
.mission-header{background:var(--ui-bg);backdrop-filter:blur(8px);border:1.5px solid rgba(245,200,66,.3);border-radius:10px 10px 0 0;padding:5px 10px;display:flex;align-items:center;gap:6px;}
.mission-header span{font-size:.65rem;font-weight:900;color:var(--gold);}
.mission-list{background:rgba(5,10,20,.88);backdrop-filter:blur(8px);border:1.5px solid rgba(255,255,255,.1);border-top:none;border-radius:0 0 10px 10px;padding:4px 0;}
.mission-item{padding:5px 10px;cursor:pointer;transition:background .15s;}
.mission-item:hover{background:rgba(245,200,66,.08);}
.mission-item.active{background:rgba(245,200,66,.12);}
.mission-title{font-size:.62rem;font-weight:700;color:#fff;}
.mission-desc{font-size:.52rem;color:rgba(255,255,255,.45);margin-top:1px;}
.mission-item .badge{display:inline-block;font-size:.45rem;font-weight:900;padding:1px 5px;border-radius:6px;margin-bottom:2px;}
.badge-new{background:var(--orange);color:#fff;}
.badge-active{background:var(--gold);color:#1a1a00;}
.badge-done{background:#2ecc71;color:#fff;}
.hud-chat{position:absolute;bottom:170px;left:12px;width:220px;pointer-events:all;}
.chat-messages{max-height:75px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;margin-bottom:4px;scrollbar-width:none;}
.chat-messages::-webkit-scrollbar{display:none;}
.chat-msg{background:rgba(0,0,0,.5);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:4px 10px;font-size:.62rem;color:#fff;line-height:1.3;}
.chat-msg .name{font-weight:900;color:var(--gold);margin-right:4px;}
.chat-input-wrap{display:flex;gap:5px;}
.chat-input{flex:1;background:rgba(0,0,0,.5);border:1.5px solid rgba(255,255,255,.2);border-radius:20px;padding:7px 13px;font-size:14px;font-weight:700;color:#fff;outline:none;font-family:'M PLUS Rounded 1c',sans-serif;}
.chat-input::placeholder{color:rgba(255,255,255,.35);}
.chat-input:focus{border-color:var(--gold);}
.chat-send{width:36px;height:36px;border-radius:50%;background:var(--orange);border:none;color:#fff;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;pointer-events:all;flex-shrink:0;}
#anim-panel{position:absolute;bottom:0;left:0;right:0;pointer-events:all;padding:4px 0 8px;background:linear-gradient(0deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,.5) 100%);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.08);height:80px;}
#anim-scroll{display:flex;gap:5px;overflow-x:auto;padding:2px 10px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
#anim-scroll::-webkit-scrollbar{display:none;}
.anim-btn{flex-shrink:0;width:56px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.anim-icon{width:54px;height:54px;border-radius:10px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;transition:all .15s;}
.anim-icon svg{width:44px;height:44px;}
.anim-btn.active .anim-icon{background:rgba(245,200,66,.12);border-color:var(--gold);}
.anim-btn:active .anim-icon{transform:scale(.88);}
.anim-label{font-size:.48rem;font-weight:700;color:rgba(255,255,255,.4);text-align:center;}
.anim-btn.active .anim-label{color:var(--gold);}

/* === JOYSTICK GAUCHE (camera) — coin bas gauche === */
#cam-joystick-zone{position:absolute;bottom:90px;left:10px;width:96px;height:96px;pointer-events:all;}
/* === JOYSTICK DROIT (mouvement) — coin bas droit === */
#joystick-zone{position:absolute;bottom:90px;right:10px;width:96px;height:96px;pointer-events:all;}
.joy-base{width:96px;height:96px;border-radius:50%;background:rgba(0,0,0,.22);border:1.5px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);position:relative;display:flex;align-items:center;justify-content:center;}
.joy-knob{width:38px;height:38px;border-radius:50%;position:absolute;box-shadow:0 2px 10px rgba(0,0,0,.4);}

/* === BOUTON SUPER-JUMP — centré au-dessus du joystick gauche === */
#super-jump-btn{
position:absolute;
bottom:196px;        /* 90 + 96 + 10 */
left:27px;           /* 10 + (96-46)/2 = 35 → ~27 pour centrer visuellement */
width:46px;height:46px;border-radius:50%;
background:var(–orange);border:none;color:#fff;font-size:.95rem;
pointer-events:all;cursor:pointer;
box-shadow:0 2px 12px rgba(0,0,0,.4);
display:flex;align-items:center;justify-content:center;
-webkit-tap-highlight-color:transparent;z-index:12;
}
/* === BOUTON JUMP — centré au-dessus du joystick droit === */
#jump-btn{
position:absolute;
bottom:196px;
right:27px;
width:46px;height:46px;border-radius:50%;
background:#2b6cb0;border:none;color:#fff;font-size:1.2rem;
pointer-events:all;cursor:pointer;
box-shadow:0 2px 12px rgba(0,0,0,.4);
display:flex;align-items:center;justify-content:center;
-webkit-tap-highlight-color:transparent;z-index:12;
}

.toast{position:fixed;bottom:188px;left:50%;transform:translateX(-50%) translateY(14px);background:rgba(0,0,0,.88);color:var(–gold);padding:6px 14px;border-radius:16px;font-size:.68rem;font-weight:700;opacity:0;transition:all .25s;z-index:50;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#loading-screen{position:fixed;inset:0;z-index:200;background:linear-gradient(135deg,#0a1428,#1a2840);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s;}
#loading-screen.hidden{opacity:0;pointer-events:none;}
.load-logo{font-family:‘Zen Kaku Gothic New’,sans-serif;font-size:2.8rem;font-weight:900;color:#fff;letter-spacing:.06em;text-shadow:0 0 40px rgba(245,200,66,.4);}
.load-logo em{color:var(–gold);font-style:normal;}
.load-sub{font-size:.8rem;color:rgba(255,255,255,.4);letter-spacing:.3em;font-weight:700;}
.load-bar-wrap{width:200px;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;}
.load-bar{height:100%;width:0%;background:linear-gradient(90deg,var(–orange),var(–gold));border-radius:2px;transition:width .2s;}
.load-txt{font-size:.68rem;color:rgba(255,255,255,.5);font-weight:700;}
#mission-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.8);background:var(–ui-bg);border:2px solid var(–gold);border-radius:16px;padding:18px 22px;z-index:100;pointer-events:all;min-width:240px;opacity:0;transition:all .3s;display:none;}
#mission-popup.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
.mp-title{font-family:‘Zen Kaku Gothic New’,sans-serif;font-size:1rem;font-weight:900;color:var(–gold);margin-bottom:6px;}
.mp-desc{font-size:.72rem;color:rgba(255,255,255,.8);line-height:1.5;margin-bottom:12px;}
.mp-btn{background:var(–orange);color:#fff;border:none;border-radius:20px;padding:7px 18px;font-size:.72rem;font-weight:700;cursor:pointer;font-family:‘M PLUS Rounded 1c’,sans-serif;}
</style>

</head>
<body>
<div id="canvas-container"></div>
<div id="loading-screen">
  <div class="load-logo">TOKYO <em>東京</em></div>
  <div class="load-sub">MACADAM WORLD</div>
  <div class="load-bar-wrap"><div class="load-bar" id="load-bar"></div></div>
  <div class="load-txt" id="load-txt">Génération du monde…</div>
</div>
<div id="hud">
  <div class="hud-top">
    <div class="hud-logo">⬡ <em>Macadam</em> World</div>
    <div class="hud-loc"><div class="loc-dot"></div><span id="zone-name">東京 Shinjuku</span></div>
    <div class="hud-info"><div class="hud-pic" id="hud-pic">?</div><span class="hud-name" id="hud-pseudo">Joueur</span></div>
  </div>
  <div id="minimap">
    <canvas id="minimap-canvas" width="120" height="120"></canvas>
    <div class="minimap-label">▲ NORD</div>
  </div>
  <div id="mission-panel">
    <div class="mission-header">🎯 <span>MISSIONS</span></div>
    <div class="mission-list" id="mission-list"></div>
  </div>
  <div class="hud-chat">
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-wrap">
      <input class="chat-input" id="chat-input" type="text" placeholder="Dis quelque chose…" maxlength="80" autocomplete="off"/>
      <button class="chat-send" id="chat-send">▶</button>
    </div>
  </div>
  <div id="cam-joystick-zone"><div class="joy-base" id="cam-joy-base"><div class="joy-knob" id="cam-joy-knob" style="background:linear-gradient(135deg,#f5c842,#e85d26);"></div></div></div>
  <button id="super-jump-btn">🚀</button>
  <button id="jump-btn">↑</button>
  <div id="joystick-zone"><div class="joy-base" id="joy-base"><div class="joy-knob" id="joy-knob" style="background:linear-gradient(135deg,#dddddd,#aaaaaa);"></div></div></div>
  <div id="anim-panel"><div id="anim-scroll"></div></div>
</div>
<div class="toast" id="toast"></div>
<div id="mission-popup">
  <div class="mp-title" id="mp-title"></div>
  <div class="mp-desc" id="mp-desc"></div>
  <button class="mp-btn" id="mp-accept">Accepter !</button>
</div>

<!-- Three.js via unpkg — plus fiable sur Safari iOS que jsDelivr -->

<script src="https://unpkg.com/three@0.134.0/build/three.min.js"></script>

<script>
// Charge GLTFLoader dynamiquement — si ça plante, on continue sans
(function(){
  var s=document.createElement('script');
  s.src='https://unpkg.com/three@0.134.0/examples/js/loaders/GLTFLoader.js';
  s.onload=function(){ startGame(); };
  s.onerror=function(){
    console.warn('GLTFLoader CDN indisponible');
    // Fallback minimal
    THREE.GLTFLoader=function(){};
    THREE.GLTFLoader.prototype.load=function(u,ok,p,err){ if(err)err(new Error('no loader')); };
    startGame();
  };
  document.head.appendChild(s);
})();
</script>

<script>
function startGame(){

const BASE='https://raw.githubusercontent.com/hoobasurf/chili/main/';
const WALK_FILE='course.glb';
const IDLE_FILE='attend.glb';

const MISSIONS=[
  {id:'m1',title:'Explorateur urbain',desc:'Explore les 4 quartiers de Tokyo',badge:'new',done:false,progress:0,total:4},
  {id:'m2',title:'Bouche d\'égout',desc:'Descends dans les souterrains',badge:'new',done:false,progress:0,total:1},
  {id:'m3',title:'Central Park',desc:'Atteins le Central Park',badge:'new',done:false,progress:0,total:1},
  {id:'m4',title:'Noctambule',desc:'Visite un izakaya',badge:'new',done:false,progress:0,total:1},
  {id:'m5',title:'Photographe',desc:'Danse devant 3 bâtiments',badge:'new',done:false,progress:0,total:3},
];
let activeMission=null;
function renderMissions(){const list=document.getElementById('mission-list');list.innerHTML='';MISSIONS.forEach(m=>{const d=document.createElement('div');d.className='mission-item'+(activeMission===m.id?' active':'');d.innerHTML=`<span class="badge badge-${m.done?'done':m.badge}">${m.done?'✓':m.badge==='active'?'►':'!'}</span><div class="mission-title">${m.title}</div><div class="mission-desc">${m.done?'Terminée ✓':`${m.progress}/${m.total} — ${m.desc}`}</div>`;d.addEventListener('click',()=>showMissionPopup(m));list.appendChild(d);});}
function showMissionPopup(m){const popup=document.getElementById('mission-popup');document.getElementById('mp-title').textContent=m.title;document.getElementById('mp-desc').textContent=m.desc+(m.done?' (Terminée !)':'');popup.style.display='block';requestAnimationFrame(()=>popup.classList.add('show'));document.getElementById('mp-accept').onclick=()=>{activeMission=m.id;m.badge='active';renderMissions();popup.classList.remove('show');setTimeout(()=>popup.style.display='none',300);showToast('Mission : '+m.title);};}
renderMissions();

function loadProfile(){try{const uid=localStorage.getItem('macadam_uid')||('p_'+Math.random().toString(36).slice(2,8));localStorage.setItem('macadam_uid',uid);const s=JSON.parse(localStorage.getItem('macadam_av_'+uid)||'null');return{pseudo:s?.pseudo||'Joueur'};}catch(e){return{pseudo:'Joueur'};}}
const profile=loadProfile();
document.getElementById('hud-pseudo').textContent=profile.pseudo;
document.getElementById('hud-pic').textContent=profile.pseudo.slice(0,2).toUpperCase();

let ldPct=0,ldDone=false;
const ldBar=document.getElementById('load-bar'),ldTxt=document.getElementById('load-txt');
const ldMsgs=['Génération des rues…','Construction des quartiers…','Pose du béton…','Placement des véhicules…','Presque prêt…'];
let ldIdx=0;
const ldInt=setInterval(()=>{ldPct+=Math.random()*5;if(ldPct>88){ldPct=88;clearInterval(ldInt);}ldBar.style.width=ldPct+'%';const idx=Math.min(Math.floor(ldPct/20),ldMsgs.length-1);if(idx>ldIdx){ldIdx=idx;ldTxt.textContent=ldMsgs[ldIdx];}},220);
function finishLoading(){if(ldDone)return;ldDone=true;clearInterval(ldInt);ldBar.style.width='100%';ldTxt.textContent='Bienvenue à Tokyo !';setTimeout(()=>{const l=document.getElementById('loading-screen');l.classList.add('hidden');setTimeout(()=>l.style.display='none',600);},600);addChat('☀️ Bienvenue à Tokyo, '+profile.pseudo+' !','Système');addChat('🗺️ Consulte tes missions en haut à droite !','Info');addChat('🐀 Cherche la bouche d\'égout !','Info');}
setTimeout(()=>finishLoading(),3000);

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
function addChat(text,from){const msgs=document.getElementById('chat-messages');const d=document.createElement('div');d.className='chat-msg';d.innerHTML=`<span class="name">${from}</span>${text}`;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;while(msgs.children.length>20)msgs.removeChild(msgs.firstChild);}
function sendChat(){const inp=document.getElementById('chat-input');const m=inp.value.trim();if(!m)return;inp.value='';addChat(m,profile.pseudo);}
document.getElementById('chat-send').addEventListener('click',sendChat);
document.getElementById('chat-input').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendChat();}});

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.outputEncoding=THREE.sRGBEncoding;
document.getElementById('canvas-container').appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8ab4d4);
scene.fog=new THREE.Fog(0x9ec2dc,120,300);
const camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,350);
window.addEventListener('resize',()=>{renderer.setSize(window.innerWidth,window.innerHeight);camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();});

scene.add(new THREE.HemisphereLight(0x87CEEB,0xc8b89a,1.1));
const sun=new THREE.DirectionalLight(0xfff5e0,2.2);
sun.position.set(60,120,40);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-150;sun.shadow.camera.bottom=-150;sun.shadow.camera.right=150;sun.shadow.camera.top=150;sun.shadow.camera.far=400;sun.shadow.bias=-0.001;scene.add(sun);
const fillLight=new THREE.DirectionalLight(0xc8d8f0,0.55);fillLight.position.set(-30,50,-50);scene.add(fillLight);

function procTex(fn,size){size=size||256;const cv=document.createElement('canvas');cv.width=cv.height=size;const ctx=cv.getContext('2d');fn(ctx,size);const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
const asphaltTex=procTex(function(ctx,s){ctx.fillStyle='#1e1e1e';ctx.fillRect(0,0,s,s);for(var i=0;i<4000;i++){var g=20+(Math.random()*18|0);ctx.fillStyle='rgb('+g+','+g+','+g+')';ctx.fillRect(Math.random()*s|0,Math.random()*s|0,1,1);}});asphaltTex.repeat.set(12,12);
const sidewalkTex=procTex(function(ctx,s){ctx.fillStyle='#a8a09a';ctx.fillRect(0,0,s,s);var tile=32;for(var r=0;r*tile<s;r++)for(var c=0;c*tile<s;c++){var v=155+(Math.random()*20|0);ctx.fillStyle='rgb('+v+','+(v-4)+','+(v-8)+')';ctx.fillRect(c*tile+1,r*tile+1,tile-2,tile-2);}});sidewalkTex.repeat.set(4,4);
const grassTex=procTex(function(ctx,s){ctx.fillStyle='#2a5a1c';ctx.fillRect(0,0,s,s);for(var i=0;i<6000;i++){var g=60+(Math.random()*40|0);ctx.fillStyle='rgb('+(18+(Math.random()*20|0))+','+g+','+(10+(Math.random()*15|0))+')';ctx.fillRect(Math.random()*s|0,Math.random()*s|0,1,1+(Math.random()*3|0));}});grassTex.repeat.set(8,8);
const concreteTex=procTex(function(ctx,s){ctx.fillStyle='#969090';ctx.fillRect(0,0,s,s);for(var i=0;i<3000;i++){var g=130+(Math.random()*20|0);ctx.fillStyle='rgba('+g+','+(g-3)+','+(g-6)+',0.55)';ctx.fillRect(Math.random()*s|0,Math.random()*s|0,1,1);}});concreteTex.repeat.set(6,6);
function makeBrickTex(r,g,b){return procTex(function(ctx,s){ctx.fillStyle='rgb('+(r-18)+','+(g-14)+','+(b-10)+')';ctx.fillRect(0,0,s,s);var BW=38,BH=16;for(var row=0;row*BH<s+BH;row++){var off=(row%2)*BW/2;for(var col=-1;col*BW<s+BW;col++){var dv=(Math.random()*24-12)|0;ctx.fillStyle='rgb('+Math.max(20,Math.min(220,r+dv))+','+Math.max(15,Math.min(180,g+dv))+','+Math.max(10,Math.min(160,b+dv))+')';ctx.fillRect(col*BW+off+1,row*BH+1,BW-2,BH-2);}}});}
const bricks=[makeBrickTex(176,112,96),makeBrickTex(154,144,136),makeBrickTex(200,184,136),makeBrickTex(138,110,110)];
const roofTex=procTex(function(ctx,s){ctx.fillStyle='#262218';ctx.fillRect(0,0,s,s);for(var y=0;y<s;y+=7){ctx.fillStyle=y%14===0?'#201e15':'#2e2820';ctx.fillRect(0,y,s,6);}});
function makeWinTex(){return procTex(function(ctx,s){ctx.fillStyle='#10202e';ctx.fillRect(0,0,s,s);var cols=4,rows=5,pw=s/cols,ph=s/rows;var wc=['#c0d5e5','#d8e0e8','#e0d8b0'];for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){var lit=Math.random()<0.7;ctx.fillStyle=lit?wc[Math.floor(Math.random()*3)]:'#08151f';ctx.fillRect(c*pw+3,r*ph+3,pw-6,ph-6);}});}
const winTextures=[makeWinTex(),makeWinTex(),makeWinTex()];
function makeSignTex(col,txt,sub){return procTex(function(ctx,s){ctx.fillStyle=col;ctx.fillRect(0,0,s,s);ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold '+(s*0.24)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,s/2,s*0.44);if(sub){ctx.fillStyle='rgba(255,255,255,0.48)';ctx.font='bold '+(s*0.1)+'px sans-serif';ctx.fillText(sub,s/2,s*0.73);}ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=3;ctx.strokeRect(4,4,s-8,s-8);});}

const SVG={idle:'<circle cx="28" cy="9" r="6" fill="none" stroke="'+C+'" stroke-width="2.5"/><line x1="28" y1="15" x2="28" y2="46" stroke="'+C+'" stroke-width="3" stroke-linecap="round"/><line x1="28" y1="24" x2="16" y2="36" stroke="'+C+'" stroke-width="3" stroke-linecap="round"/><line x1="28" y1="24" x2="40" y2="36" stroke="'+C+'" stroke-width="3" stroke-linecap="round"/><line x1="26" y1="46" x2="20" y2="66" stroke="'+C+'" stroke-width="3" stroke-linecap="round"/><line x1="30" y1="46" x2="36" y2="66" stroke="'+C+'" stroke-width="3" stroke-linecap="round"/>',run:'<circle cx="32" cy="7" r="6" fill="none" stroke="'+C+'" stroke-width="2.5"/><path d="M31 13 Q28 26 26 42" stroke="'+C+'" stroke-width="3" fill="none" stroke-linecap="round"/>',walk:'<circle cx="28" cy="8" r="6" fill="none" stroke="'+C+'" stroke-width="2.5"/><path d="M28 14 Q26 28 25 44" stroke="'+C+'" stroke-width="3" fill="none" stroke-linecap="round"/>',dance:'<circle cx="28" cy="9" r="6" fill="none" stroke="'+C+'" stroke-width="2.5"/><path d="M28 15 Q32 28 30 44" stroke="'+C+'" stroke-width="3" fill="none" stroke-linecap="round"/>',punch:'<circle cx="26" cy="9" r="6" fill="none" stroke="'+C+'" stroke-width="2.5"/><line x1="26" y1="15" x2="24" y2="44" stroke="'+C+'" stroke-width="3" stroke-linecap="round"/><line x1="25" y1="22" x2="52" y2="16" stroke="'+C+'" stroke-width="3.5" stroke-linecap="round"/>',kick:'<circle cx="28" cy="9" r="6" fill="none" stroke="'+C+'" stroke-width="2.5"/><line x1="28" y1="15" x2="26" y2="42" stroke="'+C+'" stroke-width="3" stroke-linecap="round"/>',jump:'<circle cx="28" cy="6" r="6" fill="none" stroke="'+C+'" stroke-width="2.5"/><line x1="28" y1="12" x2="28" y2="38" stroke="'+C+'" stroke-width="3" stroke-linecap="round"/>',victory:'<circle cx="28" cy="9" r="6" fill="none" stroke="'+C+'" stroke-width="2.5"/><line x1="28" y1="15" x2="28" y2="46" stroke="'+C+'" stroke-width="3" stroke-linecap="round"/>',flip:'<circle cx="38" cy="12" r="6" fill="none" stroke="'+C+'" stroke-width="2.5"/>',dodge:'<circle cx="38" cy="13" r="6" fill="none" stroke="'+C+'" stroke-width="2.5"/>',crouch:'<circle cx="28" cy="16" r="6" fill="none" stroke="'+C+'" stroke-width="2.5"/>',wave:'<circle cx="28" cy="9" r="6" fill="none" stroke="'+C+'" stroke-width="2.5"/>',flex:'<circle cx="28" cy="8" r="6" fill="none" stroke="'+C+'" stroke-width="2.5"/>'};
var animScroll=document.getElementById('anim-scroll');
ANIMS.forEach(function(a,i){var btn=document.createElement('div');btn.className='anim-btn'+(i===0?' active':'');btn.innerHTML='<div class="anim-icon"><svg viewBox="0 0 44 72">'+(SVG[a.svg]||SVG.idle)+'</svg></div><div class="anim-label">'+a.label+'</div>';btn.addEventListener('click',function(){document.querySelectorAll('.anim-btn').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');playAnim(a.file);if(a.file===WALK_FILE)playerState.currentAnim='walk';else if(a.file===IDLE_FILE)playerState.currentAnim='idle';else playerState.currentAnim=a.file;});animScroll.appendChild(btn);});

var loader=new THREE.GLTFLoader();
var playerMixer=null,playerModel=null,currentAction=null;
var animCache={};
var playerState={x:0,z:5,y:0,vy:0,onGround:true,speed:0,angle:0,currentAnim:'idle',inSewer:false};
var camState={dist:7,yaw:0,pitch:0.42,targetYaw:0,targetPitch:0.42};

function makeProceduralPlayer(){var g=new THREE.Group();var skinMat=new THREE.MeshStandardMaterial({color:0xffe0c8,roughness:0.8});var clothMat=new THREE.MeshStandardMaterial({color:0x223366,roughness:0.85});var head=new THREE.Mesh(new THREE.SphereGeometry(0.2,12,10),skinMat);head.position.set(0,1.8,0);head.castShadow=true;g.add(head);var torso=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.55,0.25),clothMat);torso.position.set(0,1.3,0);torso.castShadow=true;g.add(torso);var legL=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.55,0.16),clothMat);legL.position.set(-0.12,0.82,0);g.add(legL);var legR=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.55,0.16),clothMat);legR.position.set(0.12,0.82,0);g.add(legR);var armL=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.42,0.12),clothMat);armL.position.set(-0.28,1.28,0);g.add(armL);var armR=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.42,0.12),clothMat);armR.position.set(0.28,1.28,0);g.add(armR);scene.add(g);return g;}

function loadAnim(file,cb){if(!file||file===''){cb({scene:new THREE.Group(),animations:[]});return;}if(animCache[file]){cb(animCache[file]);return;}try{loader.load(BASE+file,function(glb){animCache[file]=glb;cb(glb);},null,function(err){console.warn('GLB non trouvé:',file);cb({scene:new THREE.Group(),animations:[]});});}catch(e){cb({scene:new THREE.Group(),animations:[]});}}
function playAnim(file){loadAnim(file,function(glb){if(glb.animations&&glb.animations.length>0&&playerModel&&!playerModel.userData.isProcedural){playerMixer=new THREE.AnimationMixer(playerModel);if(currentAction)currentAction.stop();currentAction=playerMixer.clipAction(glb.animations[0]);currentAction.play();}});}
function updatePlayerVisuals(){if(!playerModel)return;playerModel.position.set(playerState.x,playerState.y,playerState.z);playerModel.rotation.y=playerState.angle;}

playerModel=makeProceduralPlayer();
playerModel.userData.isProcedural=true;
loadAnim(IDLE_FILE,function(glb){if(glb.animations&&glb.animations.length>0){scene.remove(playerModel);playerModel=glb.scene;playerModel.traverse(function(c){if(c.isMesh){c.castShadow=true;c.receiveShadow=true;}});scene.add(playerModel);playerMixer=new THREE.AnimationMixer(playerModel);currentAction=playerMixer.clipAction(glb.animations[0]);currentAction.play();updatePlayerVisuals();}});

var joyState={x:0,z:0,active:false,id:-1};
var camJoyState={x:0,y:0,active:false,id:-1};
var joyBase=document.getElementById('joy-base'),joyKnob=document.getElementById('joy-knob');
var camJoyBase=document.getElementById('cam-joy-base'),camJoyKnob=document.getElementById('cam-joy-knob');
var JR=42;
function joyInput(e,base,knob,state,isCam){e.preventDefault();var touches=e.changedTouches;for(var i=0;i<touches.length;i++){var t=touches[i];if(e.type==='touchstart'){var r=base.getBoundingClientRect();var cx=r.left+r.width/2,cy=r.top+r.height/2;var dx=t.clientX-cx,dy=t.clientY-cy;if(Math.sqrt(dx*dx+dy*dy)<r.width/2){state.active=true;state.id=t.identifier;}}if(state.active&&t.identifier===state.id){var r2=base.getBoundingClientRect();var cx2=r2.left+r2.width/2,cy2=r2.top+r2.height/2;var dx2=t.clientX-cx2,dy2=t.clientY-cy2;var dist=Math.sqrt(dx2*dx2+dy2*dy2);if(dist>JR){dx2*=JR/dist;dy2*=JR/dist;}knob.style.transform='translate('+dx2+'px,'+dy2+'px)';if(isCam){state.x=dx2/JR;state.y=dy2/JR;}else{state.x=dx2/JR;state.z=dy2/JR;}}if((e.type==='touchend'||e.type==='touchcancel')&&t.identifier===state.id){state.active=false;state.id=-1;state.x=0;state.z=0;state.y=0;knob.style.transform='translate(0,0)';}}}
['touchstart','touchmove','touchend','touchcancel'].forEach(function(ev){joyBase.addEventListener(ev,function(e){joyInput(e,joyBase,joyKnob,joyState,false);},{passive:false});camJoyBase.addEventListener(ev,function(e){joyInput(e,camJoyBase,camJoyKnob,camJoyState,true);},{passive:false});});
document.getElementById('jump-btn').addEventListener('touchstart',function(e){e.preventDefault();if(playerState.onGround){playerState.vy=7.5;playerState.onGround=false;}},{passive:false});
document.getElementById('super-jump-btn').addEventListener('touchstart',function(e){e.preventDefault();if(playerState.onGround){playerState.vy=14;playerState.onGround=false;}},{passive:false});
document.getElementById('jump-btn').addEventListener('click',function(){if(playerState.onGround){playerState.vy=7.5;playerState.onGround=false;}});
document.getElementById('super-jump-btn').addEventListener('click',function(){if(playerState.onGround){playerState.vy=14;playerState.onGround=false;}});

var keys={};
document.addEventListener('keydown',function(e){keys[e.code]=true;});
document.addEventListener('keyup',function(e){keys[e.code]=false;});

var mmCanvas=document.getElementById('minimap-canvas');
var mmCtx=mmCanvas.getContext('2d');
var MM=120,MM_SCALE=MM/280;
function drawMinimap(){mmCtx.fillStyle='#0a1018';mmCtx.fillRect(0,0,MM,MM);var cx=MM/2-playerState.x*MM_SCALE,cz=MM/2-playerState.z*MM_SCALE;mmCtx.strokeStyle='#2a2a2a';mmCtx.lineWidth=4;[-120,-80,-40,0,40,80,120].forEach(function(ax){mmCtx.beginPath();mmCtx.moveTo(0,cz+ax*MM_SCALE);mmCtx.lineTo(MM,cz+ax*MM_SCALE);mmCtx.stroke();mmCtx.beginPath();mmCtx.moveTo(cx+ax*MM_SCALE,0);mmCtx.lineTo(cx+ax*MM_SCALE,MM);mmCtx.stroke();});mmCtx.fillStyle='#1a4a10';mmCtx.fillRect(cx+20*MM_SCALE-8,cz-60*MM_SCALE-8,16,16);mmCtx.fillStyle='#f5c842';mmCtx.beginPath();mmCtx.arc(MM/2,MM/2,4,0,Math.PI*2);mmCtx.fill();mmCtx.strokeStyle='#f5c842';mmCtx.lineWidth=1.5;mmCtx.beginPath();mmCtx.moveTo(MM/2,MM/2);mmCtx.lineTo(MM/2+Math.sin(playerState.angle)*8,MM/2-Math.cos(playerState.angle)*8);mmCtx.stroke();mmCtx.fillStyle='#4488ff';npcs.slice(0,12).forEach(function(n){var nx=cx+n.group.position.x*MM_SCALE,nz2=cz+n.group.position.z*MM_SCALE;if(nx>0&&nx<MM&&nz2>0&&nz2<MM){mmCtx.beginPath();mmCtx.arc(nx,nz2,2,0,Math.PI*2);mmCtx.fill();}});mmCtx.fillStyle='#ff4422';movingCars.forEach(function(c){var vx=cx+c.group.position.x*MM_SCALE,vz=cz+c.group.position.z*MM_SCALE;if(vx>0&&vx<MM&&vz>0&&vz<MM)mmCtx.fillRect(vx-1.5,vz-1.5,3,3);});mmCtx.fillStyle='#88cc44';mmCtx.beginPath();mmCtx.arc(cx+sewerHole.x*MM_SCALE,cz+sewerHole.z*MM_SCALE,3,0,Math.PI*2);mmCtx.fill();}

var clock=new THREE.Clock();
var GRAVITY=18,PLAYER_SPEED=8,PLAYER_RUN_SPEED=14,NPC_WANDER=18;
var sewerTransitioning=false,lastZone='';

function updateMovingCars(dt){movingCars.forEach(function(car){car.t+=(car.speed*dt)/car.len;if(car.t>1)car.t-=1;var s=car.route[0],e=car.route[car.route.length-1];car.group.position.x=s.x+(e.x-s.x)*car.t;car.group.position.z=s.z+(e.z-s.z)*car.t;car.wheels.forEach(function(w){w.rotation.x+=car.speed*dt*2;});});}
function updateNPCs(dt){npcs.forEach(function(npc){npc.turnTimer-=dt;if(npc.turnTimer<0){npc.turnTimer=1.5+Math.random()*3;var a=Math.random()*Math.PI*2;var sp=0.5+Math.random()*1.0;npc.vx=Math.cos(a)*sp*0.016;npc.vz=Math.sin(a)*sp*0.016;}var nx=npc.group.position.x+npc.vx,nz=npc.group.position.z+npc.vz;var dx=nx-npc.startX,dz=nz-npc.startZ;if(Math.sqrt(dx*dx+dz*dz)>NPC_WANDER){npc.vx=-npc.vx;npc.vz=-npc.vz;}else{npc.group.position.x=nx;npc.group.position.z=nz;}npc.group.rotation.y=Math.atan2(npc.vx,npc.vz);npc.phase+=dt*4;var sw=Math.sin(npc.phase)*0.25;npc.legL.rotation.x=sw;npc.legR.rotation.x=-sw;npc.armL.rotation.x=-sw*0.6;npc.armR.rotation.x=sw*0.6;});}

function updatePlayer(dt){
  var dx=0,dz=0;
  var run=keys['ShiftLeft']||keys['ShiftRight'];
  var spd=run?PLAYER_RUN_SPEED:PLAYER_SPEED;
  if(joyState.active){dx+=joyState.x;dz+=joyState.z;}
  if(keys['ArrowUp']||keys['KeyW'])dz-=1;if(keys['ArrowDown']||keys['KeyS'])dz+=1;
  if(keys['ArrowLeft']||keys['KeyA'])dx-=1;if(keys['ArrowRight']||keys['KeyD'])dx+=1;
  if(keys['Space']&&playerState.onGround){playerState.vy=7.5;playerState.onGround=false;}
  if(camJoyState.active){camState.targetYaw+=camJoyState.x*dt*2.2;camState.targetPitch=Math.max(0.12,Math.min(0.9,camState.targetPitch+camJoyState.y*dt*1.2));}
  camState.yaw+=(camState.targetYaw-camState.yaw)*0.15;camState.pitch+=(camState.targetPitch-camState.pitch)*0.1;
  var cos=Math.cos(camState.yaw),sin=Math.sin(camState.yaw);
  var wx=dx*cos+dz*sin,wz=-dx*sin+dz*cos;
  var len=Math.sqrt(wx*wx+wz*wz);
  var moved=false;
  if(len>0.01){var nx=wx/len,nz=wz/len;var speed=spd*Math.min(len,1)*dt;var npx=playerState.x+nx*speed,npz=playerState.z+nz*speed;var cols=playerState.inSewer?sewerColliders:colliders;var res=resolveCollisions(npx,npz,playerState.y,cols);playerState.x=res.x;playerState.z=res.z;playerState.angle=Math.atan2(nx,nz);moved=true;}
  var floorY=playerState.inSewer?SEWER_Y:0;
  playerState.vy-=GRAVITY*dt;playerState.y+=playerState.vy*dt;
  if(playerState.y<=floorY){playerState.y=floorY;playerState.vy=0;playerState.onGround=true;}
  var distToHole=Math.sqrt(Math.pow(playerState.x-sewerHole.x,2)+Math.pow(playerState.z-sewerHole.z,2));
  if(!sewerTransitioning){
    if(!playerState.inSewer&&distToHole<1.8&&keys['KeyE']){sewerTransitioning=true;showToast('⬇ Descente dans les souterrains…');setTimeout(function(){playerState.inSewer=true;playerState.y=SEWER_Y;playerState.vy=0;playerState.x=sewerHole.x;playerState.z=sewerHole.z;sewerTransitioning=false;scene.fog=new THREE.Fog(0x061206,8,40);scene.background=new THREE.Color(0x050e05);document.getElementById('zone-name').textContent='🐀 Souterrain';addChat('🐀 Tu es dans les souterrains !','Système');checkMission('m2');},800);}
    if(playerState.inSewer&&distToHole<2.5&&keys['KeyE']){sewerTransitioning=true;showToast('⬆ Remontée en surface…');setTimeout(function(){playerState.inSewer=false;playerState.y=0.2;playerState.vy=2;playerState.x=sewerHole.x;playerState.z=sewerHole.z;sewerTransitioning=false;scene.fog=new THREE.Fog(0x9ec2dc,120,300);scene.background=new THREE.Color(0x8ab4d4);document.getElementById('zone-name').textContent='東京 Shinjuku';},600);}
  }
  if(distToHole<2&&!playerState.inSewer)showToast('[ E ] Descendre dans l\'égout');
  updateZone();
  if(moved&&playerState.onGround&&playerState.currentAnim==='idle'){playerState.currentAnim='walk';document.querySelectorAll('.anim-btn').forEach(function(b,i){b.classList.toggle('active',i===1);});playAnim(WALK_FILE);}
  if(!moved&&playerState.onGround&&playerState.currentAnim==='walk'){playerState.currentAnim='idle';document.querySelectorAll('.anim-btn').forEach(function(b,i){b.classList.toggle('active',i===0);});playAnim(IDLE_FILE);}
}
function updateZone(){var x=playerState.x,z=playerState.z;var zone='東京 Shinjuku';if(x>40&&z<0)zone='東京 Shibuya';else if(x<-40&&z>0)zone='東京 Akihabara';else if(x>40&&z>40)zone='東京 Harajuku';else if(x>0&&z<-60)zone='🌳 Central Park';if(zone!==lastZone){lastZone=zone;document.getElementById('zone-name').textContent=zone;if(zone==='🌳 Central Park')checkMission('m3');advanceMission('m1');}}
function checkMission(id){var m=MISSIONS.find(function(m){return m.id===id;});if(m&&!m.done){m.done=true;m.badge='done';m.progress=m.total;renderMissions();showToast('🏆 Mission : '+m.title+' !');}}
function advanceMission(id){var m=MISSIONS.find(function(m){return m.id===id;});if(m&&!m.done){m.progress=Math.min(m.progress+1,m.total);if(m.progress>=m.total)checkMission(id);else renderMissions();}}
function updateCamera(){var tp=new THREE.Vector3(playerState.x,playerState.y+1.5,playerState.z);var cd=playerState.inSewer?4:camState.dist;var cp=new THREE.Vector3(tp.x-Math.sin(camState.yaw)*Math.cos(camState.pitch)*cd,tp.y+Math.sin(camState.pitch)*cd,tp.z-Math.cos(camState.yaw)*Math.cos(camState.pitch)*cd);camera.position.lerp(cp,0.12);camera.lookAt(tp);}

function animate(){requestAnimationFrame(animate);var dt=Math.min(clock.getDelta(),0.05);updatePlayer(dt);updateMovingCars(dt);updateNPCs(dt);updatePlayerVisuals();updateCamera();if(playerMixer)playerMixer.update(dt);drawMinimap();renderer.render(scene,camera);}
animate();

} // fin startGame()
</script>
