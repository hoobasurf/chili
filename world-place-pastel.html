<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Macadam World — Place Pastel</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.0/aframe.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--pink:#FF6EB4;--mint:#3DDBB8;--yellow:#FFD747;--lav:#B388FF;--sky:#5BC8F5;--dark:#12082A;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Nunito',sans-serif;background:#0e0620;user-select:none;-webkit-user-select:none;}

#hud{position:fixed;inset:0;z-index:10;pointer-events:none;}
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(180deg,rgba(18,8,42,.8) 0%,transparent 100%);}
.hud-logo{font-family:‘Baloo 2’,cursive;font-size:1.1rem;font-weight:800;color:white;letter-spacing:-0.5px;text-shadow:0 2px 8px rgba(0,0,0,.5);}
.hud-logo span{color:var(–pink);}
.hud-location{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:5px 12px;pointer-events:all;}
.hud-location span{font-size:.75rem;font-weight:800;color:white;}
.loc-dot{width:7px;height:7px;border-radius:50%;background:var(–mint);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(61,219,184,.6);}50%{box-shadow:0 0 0 5px rgba(61,219,184,0);}}
.hud-avatar-info{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:5px 12px 5px 6px;}
.hud-avatar-pic{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(–pink),var(–lav));display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:900;color:white;border:2px solid rgba(255,255,255,.2);overflow:hidden;}
.hud-pseudo{font-size:.75rem;font-weight:800;color:white;}

.hud-chat{position:absolute;bottom:100px;left:12px;right:12px;max-width:320px;pointer-events:all;}
.chat-messages{max-height:120px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;margin-bottom:6px;scrollbar-width:none;}
.chat-messages::-webkit-scrollbar{display:none;}
.chat-msg{background:rgba(18,8,42,.7);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:5px 10px;font-size:.72rem;color:white;animation:fadeIn .3s ease;line-height:1.4;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.chat-msg .name{font-weight:900;color:var(–pink);margin-right:4px;}
.chat-input-wrap{display:flex;gap:6px;}
.chat-input{flex:1;background:rgba(18,8,42,.8);backdrop-filter:blur(10px);border:1.5px solid rgba(255,255,255,.15);border-radius:12px;padding:8px 12px;font-size:16px;font-weight:700;color:white;outline:none;transition:border-color .2s;}
.chat-input::placeholder{color:rgba(255,255,255,.25);}
.chat-input:focus{border-color:var(–pink);}
.chat-send{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(–pink),var(–lav));border:none;color:white;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:transform .15s;pointer-events:all;}
.chat-send:active{transform:scale(.92);}

#joystick-zone{position:absolute;bottom:20px;right:20px;width:120px;height:120px;pointer-events:all;}
.joystick-base{width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12);backdrop-filter:blur(8px);position:relative;display:flex;align-items:center;justify-content:center;}
.joystick-knob{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(–pink),var(–lav));box-shadow:0 4px 16px rgba(255,110,180,.4);position:absolute;transform:translate(0,0);cursor:pointer;}

#btn-action{position:absolute;bottom:36px;right:150px;width:52px;height:52px;border-radius:50%;background:rgba(61,219,184,.15);border:2px solid var(–mint);color:var(–mint);font-size:1.2rem;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:all;transition:all .15s;backdrop-filter:blur(8px);}
#btn-action:active{transform:scale(.9);background:rgba(61,219,184,.3);}

#loading-screen{position:fixed;inset:0;z-index:100;background:#0e0620;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s;}
#loading-screen.hidden{opacity:0;pointer-events:none;}
.loading-logo{font-family:‘Baloo 2’,cursive;font-size:2.5rem;font-weight:800;color:white;letter-spacing:-1px;}
.loading-logo .c1{color:var(–pink);}.loading-logo .c2{color:var(–yellow);}.loading-logo .c3{color:var(–mint);}.loading-logo .c4{color:var(–sky);}
.loading-bar-wrap{width:200px;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;}
.loading-bar{height:100%;width:0%;background:linear-gradient(90deg,var(–pink),var(–lav));border-radius:2px;transition:width .3s;}
.loading-txt{font-size:.78rem;color:rgba(255,255,255,.4);font-weight:700;}

.toast{position:fixed;bottom:160px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(18,8,42,.9);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(12px);color:white;padding:8px 18px;border-radius:20px;font-size:.78rem;font-weight:800;opacity:0;transition:all .3s;z-index:50;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.speech-bubble{position:fixed;z-index:20;background:white;color:#12082A;border-radius:12px;padding:6px 12px;font-size:.75rem;font-weight:800;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:160px;text-align:center;transform:translateX(-50%);opacity:0;transition:opacity .3s;}
.speech-bubble::after{content:’’;position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:white;border-bottom:none;}

@import url(‘https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800;900&display=swap’);
</style>

</head>
<body>

<div id="loading-screen">
  <div class="loading-logo">
    <span class="c1">M</span><span class="c2">A</span><span class="c3">C</span><span class="c4">A</span><span class="c1">D</span><span class="c2">A</span><span class="c3">M</span>
  </div>
  <div class="loading-bar-wrap"><div class="loading-bar" id="loading-bar"></div></div>
  <div class="loading-txt" id="loading-txt">Chargement de Place Pastel…</div>
</div>

<a-scene
id="scene"
renderer="antialias:false;colorManagement:false;physicallyCorrectLights:false;maxCanvasWidth:960;maxCanvasHeight:960;logarithmicDepthBuffer:false"
loading-screen="enabled:false"
vr-mode-ui="enabled:false"
device-orientation-permission-ui="enabled:false">

<a-assets timeout="5000"></a-assets>

<a-sky color="#c8e8ff"></a-sky>

<a-light type="ambient" color="#ffffff" intensity="1.0"></a-light>
<a-light type="directional" color="#fff8e8" intensity="0.8" position="10 20 10"></a-light>

  <!-- SOL -->

<a-plane position="0 0 0" rotation="-90 0 0" width="60" height="60" color="#F0E8D8" material="roughness:0.9;metalness:0"></a-plane>
<a-cylinder position="0 0.01 0" radius="8" height="0.01" color="#E8D8C8"></a-cylinder>
<a-cylinder position="0 0.02 0" radius="4" height="0.01" color="#F8E8D8"></a-cylinder>
<a-plane position="0 0.02 0" rotation="-90 0 0" width="60" height="0.4" color="#D8C8B8"></a-plane>
<a-plane position="0 0.02 0" rotation="-90 90 0" width="60" height="0.4" color="#D8C8B8"></a-plane>

  <a-entity position="0 0 0">
    <a-cylinder position="0 0.3 0" radius="2.5" height="0.6" color="#D4C4F0" material="roughness:0.5;metalness:0.1"></a-cylinder>

    <a-cylinder position="0 1.5 0" radius="0.2" height="2.0" color="#C8B8E8"></a-cylinder>
    <a-cylinder position="0 2.6 0" radius="0.8" height="0.15" color="#D4C4F0"></a-cylinder>
    <a-cylinder position="0 2.72 0" radius="0.65" height="0.05" color="#A8D8FF" material="roughness:0;metalness:0.5;opacity:0.8" transparent="true" animation="property:object3D.rotation.y;from:0;to:360;dur:8000;loop:true;easing:linear"></a-cylinder>
    <a-sphere position="0 3.1 0.5" radius="0.08" color="#C8E8FF" material="opacity:0.7" transparent="true" animation="property:position;from:0 3.1 0.5;to:0 2.7 0.5;dur:800;loop:true;dir:alternate"></a-sphere>
    <a-sphere position="0.5 3.0 0" radius="0.07" color="#C8E8FF" material="opacity:0.7" transparent="true" animation="property:position;from:0.5 3.0 0;to:0.5 2.65 0;dur:700;loop:true;dir:alternate"></a-sphere>
  </a-entity>

  <!-- BÂTIMENTS -->

  <a-entity position="-18 0 -12">
    <a-box position="0 4 0" width="8" height="8" depth="6" color="#A8E6CF"></a-box>
    <a-cylinder position="0 8.5 0" radius="4.5" height="1" color="#7DD4B2"></a-cylinder>
    <a-plane position="1.5 5 3.01" width="1.5" height="2" color="#FFE87A"></a-plane>
    <a-plane position="-1.5 5 3.01" width="1.5" height="2" color="#FFE87A"></a-plane>
    <a-box position="0 2.2 3.8" width="5" height="0.15" depth="1.5" rotation="10 0 0" color="#FF9EBB"></a-box>
  </a-entity>
  <a-entity position="18 0 -12">
    <a-box position="0 4.5 0" width="7" height="9" depth="6" color="#D4C5F9"></a-box>
    <a-cone position="0 9.5 0" radius-bottom="4" height="3" color="#B8A8F0"></a-cone>
    <a-box position="0 2.2 3.8" width="5" height="0.15" depth="1.5" rotation="10 0 0" color="#C9B8F0"></a-box>
  </a-entity>
  <a-entity position="-12 0 -22">
    <a-box position="0 3 0" width="5" height="6" depth="5" color="#FFBFA8"></a-box>
    <a-box position="0 6.5 0" width="5.5" height="1" depth="5.5" color="#F0A898"></a-box>
  </a-entity>
  <a-entity position="12 0 -22">
    <a-box position="0 4 0" width="6" height="8" depth="5" color="#B8E8D8"></a-box>
    <a-cylinder position="0 8.5 0" radius="3.2" height="1.2" color="#88D0B8"></a-cylinder>
  </a-entity>

  <!-- ARBRES -->

  <a-entity position="-6 0 -8">
    <a-cylinder position="0 1 0" radius="0.2" height="2" color="#8B6914"></a-cylinder>
    <a-sphere position="0 2.8 0" radius="1.8" color="#5CC87A"></a-sphere>
    <a-sphere position="-0.8 2.2 0" radius="1.2" color="#5CC87A"></a-sphere>
    <a-sphere position="0.8 2.2 0" radius="1.3" color="#7DD87A"></a-sphere>
  </a-entity>
  <a-entity position="6 0 -8">
    <a-cylinder position="0 1 0" radius="0.2" height="2" color="#7A5A10"></a-cylinder>
    <a-sphere position="0 2.8 0" radius="1.6" color="#48B868"></a-sphere>
    <a-sphere position="-0.7 2.3 0" radius="1.1" color="#5CC87A"></a-sphere>
    <a-sphere position="0.7 2.3 0" radius="1.2" color="#5CC87A"></a-sphere>
  </a-entity>
  <a-entity position="-14 0 -4">
    <a-cylinder position="0 1.2 0" radius="0.25" height="2.4" color="#8B6914"></a-cylinder>
    <a-sphere position="0 3.2 0" radius="2.2" color="#5CC87A"></a-sphere>
  </a-entity>
  <a-entity position="14 0 -4">
    <a-cylinder position="0 1.1 0" radius="0.22" height="2.2" color="#7A5A10"></a-cylinder>
    <a-sphere position="0 3 0" radius="2" color="#5CC87A"></a-sphere>
  </a-entity>

  <!-- FLEURS -->

<a-sphere position="3.5 0.2 0" radius="0.2" color="#FF9EBB"></a-sphere>
<a-sphere position="-3.5 0.2 0" radius="0.2" color="#FFD6EC"></a-sphere>
<a-sphere position="0 0.2 3.5" radius="0.2" color="#C5B5FF"></a-sphere>
<a-sphere position="0 0.2 -3.5" radius="0.2" color="#FF9EBB"></a-sphere>

  <!-- BANCS -->

  <a-entity position="5 0 0">
    <a-box position="0 0.5 0" width="2.5" height="0.15" depth="0.6" color="#C8A878"></a-box>
    <a-box position="-1 0.3 0" width="0.15" height="0.6" depth="0.5" color="#A88858"></a-box>
    <a-box position="1 0.3 0" width="0.15" height="0.6" depth="0.5" color="#A88858"></a-box>
  </a-entity>
  <a-entity position="-5 0 0">
    <a-box position="0 0.5 0" width="2.5" height="0.15" depth="0.6" color="#C8A878"></a-box>
    <a-box position="-1 0.3 0" width="0.15" height="0.6" depth="0.5" color="#A88858"></a-box>
    <a-box position="1 0.3 0" width="0.15" height="0.6" depth="0.5" color="#A88858"></a-box>
  </a-entity>

  <!-- LAMPADAIRES -->

  <a-entity position="4 0 4">
    <a-cylinder position="0 2.5 0" radius="0.08" height="5" color="#C0A8F0"></a-cylinder>
    <a-sphere position="0 5.2 0" radius="0.3" color="#FFE87A" material="emissive:#FFE87A;emissiveIntensity:0.8"></a-sphere>
  </a-entity>
  <a-entity position="-4 0 4">
    <a-cylinder position="0 2.5 0" radius="0.08" height="5" color="#C0A8F0"></a-cylinder>
    <a-sphere position="0 5.2 0" radius="0.3" color="#FFE87A" material="emissive:#FFE87A;emissiveIntensity:0.8"></a-sphere>
  </a-entity>
  <a-entity position="4 0 -4">
    <a-cylinder position="0 2.5 0" radius="0.08" height="5" color="#C0A8F0"></a-cylinder>
    <a-sphere position="0 5.2 0" radius="0.3" color="#FFE87A" material="emissive:#FFE87A;emissiveIntensity:0.8"></a-sphere>
  </a-entity>
  <a-entity position="-4 0 -4">
    <a-cylinder position="0 2.5 0" radius="0.08" height="5" color="#C0A8F0"></a-cylinder>
    <a-sphere position="0 5.2 0" radius="0.3" color="#FFE87A" material="emissive:#FFE87A;emissiveIntensity:0.8"></a-sphere>
  </a-entity>

  <!-- NUAGES -->

  <a-entity animation="property:position;from:15 12 -20;to:-15 12 -20;dur:60000;loop:true;easing:linear">
    <a-sphere position="0 0 0" radius="2" color="white" material="opacity:0.85" transparent="true"></a-sphere>
    <a-sphere position="2 0.3 0" radius="1.5" color="white" material="opacity:0.85" transparent="true"></a-sphere>
    <a-sphere position="-2 0.2 0" radius="1.4" color="white" material="opacity:0.85" transparent="true"></a-sphere>
  </a-entity>

  <!-- AVATAR JOUEUR -->

  <a-entity id="player" position="0 0 6">
    <a-entity id="player-pivot">
      <a-entity id="avatar-model" position="0 0 0" scale="1 1 1" rotation="0 180 0"></a-entity>
      <a-circle position="0 0.02 0" radius="0.4" rotation="-90 0 0" color="#000000" material="opacity:0.15;transparent:true"></a-circle>
    </a-entity>

  <!-- CAMÉRA TPS -->

  <a-entity id="camera-rig" position="0 0 6">
    <a-entity id="camera-pivot" position="0 0 0">
      <a-camera id="main-camera" position="0 2.2 4.5" look-controls="enabled:false" wasd-controls="enabled:false" fov="65" near="0.1" far="200"></a-camera>
    </a-entity>
  </a-entity>

</a-scene>

<!-- HUD -->

<div id="hud">
  <div class="hud-top">
    <div class="hud-logo">✦ <span>Macadam</span> World</div>
    <div class="hud-location"><div class="loc-dot"></div><span>Place Pastel</span></div>
    <div class="hud-avatar-info">
      <div class="hud-avatar-pic" id="hud-pic">?</div>
      <span class="hud-pseudo" id="hud-pseudo">Joueur</span>
    </div>
  </div>
  <div class="hud-chat">
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-wrap">
      <input class="chat-input" id="chat-input" type="text" placeholder="Dis quelque chose…" maxlength="80" autocomplete="off"/>
      <button class="chat-send" id="chat-send">➤</button>
    </div>
  </div>
  <div id="btn-action">🌸</div>
  <div id="joystick-zone">
    <div class="joystick-base" id="joystick-base">
      <div class="joystick-knob" id="joystick-knob"></div>
    </div>
  </div>
</div>

<div class="speech-bubble" id="speech-bubble"></div>
<div class="toast" id="toast"></div>

<script>
// ========== PROFIL ==========
function loadProfile() {
  try {
    const uid = localStorage.getItem('macadam_user_id') || 'player_' + Math.random().toString(36).slice(2,7);
    localStorage.setItem('macadam_user_id', uid);
    const saved = JSON.parse(localStorage.getItem('macadam_avatar_' + uid) || 'null');
    return { pseudo: saved?.pseudo || 'Joueur', glbUrl: saved?.glbUrl || null, uid };
  } catch(e) { return { pseudo: 'Joueur', glbUrl: null, uid: 'p1' }; }
}
const profile = loadProfile();
document.getElementById('hud-pseudo').textContent = profile.pseudo;
document.getElementById('hud-pic').textContent = profile.pseudo.slice(0,2).toUpperCase();

// ========== AVATAR ==========
function loadAvatarGLB(url) {
  const avatarEl = document.getElementById('avatar-model');
  avatarEl.innerHTML = '';
  const glbEl = document.createElement('a-entity');
  glbEl.setAttribute('gltf-model', url);
  glbEl.setAttribute('scale', '1 1 1');
  glbEl.setAttribute('animation-mixer', 'clip:idle;loop:repeat;crossFadeDuration:0.3');
  avatarEl.appendChild(glbEl);
  showToast('✨ Avatar chargé !');
}

function loadFallbackAvatar() {
  const avatarEl = document.getElementById('avatar-model');
  avatarEl.innerHTML = `<a-entity>
    <a-cylinder position="0 0.9 0" radius="0.22" height="0.7" color="#FF9EBB"></a-cylinder>
    <a-sphere position="0 1.65 0" radius="0.28" color="#FFDFC4"></a-sphere>
    <a-sphere position="0.1 1.68 0.26" radius="0.05" color="#1A1A2E"></a-sphere>
    <a-sphere position="-0.1 1.68 0.26" radius="0.05" color="#1A1A2E"></a-sphere>
    <a-sphere position="0 1.88 0" radius="0.28" color="#3D1800"></a-sphere>
    <a-cylinder position="0.1 0.35 0" radius="0.1" height="0.7" color="#D4C5F9"></a-cylinder>
    <a-cylinder position="-0.1 0.35 0" radius="0.1" height="0.7" color="#D4C5F9"></a-cylinder>
    <a-sphere position="0.1 0.04 0.06" radius="0.12" color="#AA88FF"></a-sphere>
    <a-sphere position="-0.1 0.04 0.06" radius="0.12" color="#AA88FF"></a-sphere>
    <a-cylinder id="arm-right" position="0.32 0.95 0" radius="0.08" height="0.5" rotation="0 0 -20" color="#FF9EBB"></a-cylinder>
    <a-cylinder id="arm-left" position="-0.32 0.95 0" radius="0.08" height="0.5" rotation="0 0 20" color="#FF9EBB"></a-cylinder>
    <a-sphere position="0.42 0.74 0" radius="0.1" color="#FFDFC4"></a-sphere>
    <a-sphere position="-0.42 0.74 0" radius="0.1" color="#FFDFC4"></a-sphere>
  </a-entity>`;
}

if (profile.glbUrl) loadAvatarGLB(profile.glbUrl);
else loadFallbackAvatar();

// ========== LOADING — FIX SAFARI iOS ==========
const scene = document.getElementById('scene');
let sceneReady = false;
let THREE = null;

function hideLoading() {
  const ls = document.getElementById('loading-screen');
  ls.classList.add('hidden');
  setTimeout(() => ls.style.display = 'none', 600);
}

let progress = 0;
const bar = document.getElementById('loading-bar');
const txt = document.getElementById('loading-txt');
const messages = ['Chargement de Place Pastel…', 'Plantation des arbres…', 'Remplissage de la fontaine…', 'Presque prêt…'];
let msgIdx = 0;

const progressInterval = setInterval(() => {
  progress += Math.random() * 18;
  if (progress >= 95) { progress = 95; clearInterval(progressInterval); }
  bar.style.width = progress + '%';
  if (msgIdx < messages.length - 1 && progress > (msgIdx + 1) * 25) {
    msgIdx++;
    txt.textContent = messages[msgIdx];
  }
}, 200);

// ★ FIX SAFARI iOS : fonction appelée UNE SEULE FOIS
let _readyFired = false;
function onSceneReady() {
  if (_readyFired) return;
  _readyFired = true;
  clearInterval(progressInterval);
  sceneReady = true;
  if (typeof AFRAME !== 'undefined') THREE = AFRAME.THREE;
  progress = 100;
  bar.style.width = '100%';
  txt.textContent = 'Bienvenue à Place Pastel !';
  setTimeout(hideLoading, 400);
  addChatMessage('🌸 Bienvenue à Place Pastel, ' + profile.pseudo + ' !', 'Macadam');
  addChatMessage('💬 Utilise le joystick pour te déplacer', 'Système');
}

scene.addEventListener('loaded', onSceneReady);
// ★ Fallback Safari iOS — force après 3 secondes max
setTimeout(onSceneReady, 1500);

// ========== MOUVEMENT ==========
const player = document.getElementById('player');
const cameraRig = document.getElementById('camera-rig');
const avatarModel = document.getElementById('avatar-model');
const SPEED = 0.055, BOUNDARY = 22;
let playerPos = { x: 0, y: 0, z: 6 };
let playerRotY = 0, cameraRotY = 0, isAnimWalk = false;

// ========== JOYSTICK ==========
const joystickBase = document.getElementById('joystick-base');
const knob = document.getElementById('joystick-knob');
const JOY_RADIUS = 42;
let joystick = { active: false, x: 0, y: 0, id: null };

function getJoyCenter() {
  const r = joystickBase.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}
joystickBase.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.changedTouches[0];
  joystick.active = true; joystick.id = t.identifier;
  updateJoystick(t.clientX, t.clientY);
}, { passive: false });
document.addEventListener('touchmove', (e) => {
  if (!joystick.active) return;
  for (let t of e.changedTouches) {
    if (t.identifier === joystick.id) { e.preventDefault(); updateJoystick(t.clientX, t.clientY); }
  }
}, { passive: false });
document.addEventListener('touchend', (e) => {
  for (let t of e.changedTouches) {
    if (t.identifier === joystick.id) {
      joystick.active = false; joystick.x = 0; joystick.y = 0;
      knob.style.transform = 'translate(0px,0px)';
      setWalkAnim(false);
    }
  }
});
function updateJoystick(cx, cy) {
  const center = getJoyCenter();
  let dx = cx - center.x, dy = cy - center.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist > JOY_RADIUS) { dx = dx/dist*JOY_RADIUS; dy = dy/dist*JOY_RADIUS; }
  joystick.x = dx/JOY_RADIUS; joystick.y = dy/JOY_RADIUS;
  knob.style.transform = `translate(${dx}px,${dy}px)`;
}

// ========== CLAVIER ==========
const keys = {};
document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup', e => keys[e.key] = false);

// ========== CAMERA DRAG ==========
let camDrag = { active: false, lastX: 0 };
document.addEventListener('mousedown', e => { if (!e.target.closest('#hud')) { camDrag.active = true; camDrag.lastX = e.clientX; }});
document.addEventListener('mousemove', e => { if (!camDrag.active) return; cameraRotY -= (e.clientX - camDrag.lastX) * 0.4; camDrag.lastX = e.clientX; });
document.addEventListener('mouseup', () => camDrag.active = false);

let camTouch = { active: false, lastX: 0, id: null };
document.addEventListener('touchstart', e => {
  for (let t of e.touches) {
    const el = document.elementFromPoint(t.clientX, t.clientY);
    if (el?.closest('#joystick-zone') || el?.closest('#hud')) continue;
    if (!camTouch.active) { camTouch.active = true; camTouch.id = t.identifier; camTouch.lastX = t.clientX; }
  }
}, { passive: true });
document.addEventListener('touchmove', e => {
  for (let t of e.changedTouches) {
    if (t.identifier === camTouch.id) { cameraRotY -= (t.clientX - camTouch.lastX) * 0.4; camTouch.lastX = t.clientX; }
  }
}, { passive: true });
document.addEventListener('touchend', e => {
  for (let t of e.changedTouches) if (t.identifier === camTouch.id) camTouch.active = false;
});

// ========== WALK ANIM ==========
function setWalkAnim(walking) {
  if (walking === isAnimWalk) return;
  isAnimWalk = walking;
  const glbEl = avatarModel.querySelector('[gltf-model]');
  if (glbEl) glbEl.setAttribute('animation-mixer', walking ? 'clip:walk;loop:repeat;crossFadeDuration:0.3' : 'clip:idle;loop:repeat;crossFadeDuration:0.3');
  const armR = document.getElementById('arm-right');
  const armL = document.getElementById('arm-left');
  if (armR && walking) {
    armR.setAttribute('animation', 'property:rotation;from:30 0 -20;to:-30 0 -20;dur:400;loop:true;dir:alternate;easing:easeInOutSine');
    armL.setAttribute('animation', 'property:rotation;from:-30 0 20;to:30 0 20;dur:400;loop:true;dir:alternate;easing:easeInOutSine');
  } else if (armR) {
    armR.removeAttribute('animation'); armL.removeAttribute('animation');
    armR.setAttribute('rotation','0 0 -20'); armL.setAttribute('rotation','0 0 20');
  }
}

// ========== GAME LOOP ==========
let lastTime = 0;
function gameLoop(ts) {
  requestAnimationFrame(gameLoop);
  const dt = Math.min((ts - lastTime) / 16.67, 3);
  lastTime = ts;
  if (!sceneReady) return;

  let mx = joystick.x, mz = joystick.y;
  if (keys['ArrowUp']||keys['w']||keys['W']) mz = -1;
  if (keys['ArrowDown']||keys['s']||keys['S']) mz = 1;
  if (keys['ArrowLeft']||keys['a']||keys['A']) mx = -1;
  if (keys['ArrowRight']||keys['d']||keys['D']) mx = 1;
  if (keys['ArrowLeft']) cameraRotY -= 1.5*dt;
  if (keys['ArrowRight']) cameraRotY += 1.5*dt;

  const moving = Math.abs(mx) > 0.05 || Math.abs(mz) > 0.05;
  setWalkAnim(moving);

  if (moving) {
    const camRad = cameraRotY * Math.PI / 180;
    const moveX = (Math.sin(camRad)*(-mz) + Math.cos(camRad)*mx) * SPEED * dt;
    const moveZ = (Math.cos(camRad)*(-mz) - Math.sin(camRad)*mx) * SPEED * dt;
    playerPos.x = Math.max(-BOUNDARY, Math.min(BOUNDARY, playerPos.x + moveX));
    playerPos.z = Math.max(-BOUNDARY, Math.min(BOUNDARY, playerPos.z + moveZ));
    playerRotY = Math.atan2(moveX, moveZ) * 180 / Math.PI;
  }

  player.setAttribute('position', `${playerPos.x} 0 ${playerPos.z}`);
  cameraRig.setAttribute('position', `${playerPos.x} 0 ${playerPos.z}`);
  document.getElementById('player-pivot').setAttribute('rotation', `0 ${playerRotY} 0`);
  document.getElementById('camera-pivot').setAttribute('rotation', `0 ${-cameraRotY} 0`);
  updateSpeechBubble();
}
requestAnimationFrame(gameLoop);

// ========== BULLE ==========
let bubbleTimeout = null;
const bubble = document.getElementById('speech-bubble');
function showSpeechBubble(text) {
  bubble.textContent = text; bubble.style.opacity = '1';
  clearTimeout(bubbleTimeout);
  bubbleTimeout = setTimeout(() => bubble.style.opacity = '0', 4000);
}
function updateSpeechBubble() {
  if (bubble.style.opacity === '0' || !THREE) return;
  const cam = document.getElementById('main-camera').object3D;
  const playerWorldPos = new THREE.Vector3(playerPos.x, 1.8, playerPos.z);
  const projected = playerWorldPos.clone().project(cam.parent?.parent || cam);
  bubble.style.left = ((projected.x + 1) / 2 * window.innerWidth) + 'px';
  bubble.style.top = ((1 - projected.y) / 2 * window.innerHeight - 60) + 'px';
}

// ========== CHAT ==========
function addChatMessage(text, from) {
  const msgs = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'chat-msg';
  div.innerHTML = `<span class="name">${from}</span>${text}`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  while (msgs.children.length > 20) msgs.removeChild(msgs.firstChild);
}
function sendChat() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  addChatMessage(msg, profile.pseudo);
  showSpeechBubble(msg);
}
document.getElementById('chat-send').addEventListener('click', sendChat);
document.getElementById('chat-input').addEventListener('keydown', e => { if (e.key==='Enter') { e.preventDefault(); sendChat(); }});

// ========== EMOTE ==========
const emotes = ['🌸','💫','✨','🎉','👋','💕','🌈'];
let emoteIdx = 0;
document.getElementById('btn-action').addEventListener('click', () => {
  const e = emotes[emoteIdx++ % emotes.length];
  addChatMessage(e, profile.pseudo);
  showSpeechBubble(e);
  showToast(e + ' Émote !');
});

// ========== TOAST ==========
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
