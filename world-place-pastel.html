<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Macadam World — Tokyo</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--gold:#f5c842;--orange:#e85d26;--green:#2ecc71;--red:#e74c3c;--blue:#3498db;--purple:#9b59b6;}
html,body{width:100%;height:100%;overflow:hidden;background:#b0c8e8;font-family:'M PLUS Rounded 1c',sans-serif;user-select:none;-webkit-user-select:none;}
#canvas-container{position:fixed;inset:0;}
canvas{display:block;width:100%!important;height:100%!important;}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;}
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,transparent 100%);}
.hud-logo{font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:900;color:#fff;letter-spacing:.05em;text-shadow:0 1px 6px rgba(0,0,0,.5);}
.hud-logo em{color:var(--gold);font-style:normal;}
.hud-loc{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:4px 10px;}
.hud-loc span{font-size:.68rem;font-weight:700;color:#fff;}
.loc-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);}
.hud-info{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:4px 10px 4px 4px;}
.hud-pic{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--gold));display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:900;color:#fff;}
.hud-name{font-size:.68rem;font-weight:700;color:#fff;}
#sidebar-toggle{position:fixed;top:56px;right:0;z-index:60;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);border:1.5px solid rgba(245,200,66,.4);border-right:none;border-radius:12px 0 0 12px;padding:8px 10px;cursor:pointer;pointer-events:all;display:flex;flex-direction:column;gap:4px;align-items:center;}
#sidebar-toggle span{font-size:.55rem;font-weight:900;color:var(--gold);writing-mode:vertical-rl;letter-spacing:.08em;}
#sidebar{position:fixed;top:56px;right:0;width:240px;max-height:calc(100vh - 160px);overflow-y:auto;z-index:55;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);pointer-events:all;scrollbar-width:none;}
#sidebar::-webkit-scrollbar{display:none;}
#sidebar.open{transform:translateX(0);}
#sidebar-inner{background:rgba(0,0,0,.82);backdrop-filter:blur(12px);border-left:2px solid rgba(245,200,66,.3);padding:10px 0 10px;}
.sidebar-section{padding:0 12px 8px;}
.sidebar-section-title{font-size:.6rem;font-weight:900;color:rgba(255,255,255,.35);letter-spacing:.12em;text-transform:uppercase;padding:6px 0 4px;border-top:1px solid rgba(255,255,255,.08);margin-top:4px;}
.sidebar-section-title:first-child{border-top:none;margin-top:0;}
.mission-card{background:rgba(255,255,255,.04);border:1px solid rgba(245,200,66,.25);border-radius:9px;padding:8px 10px;margin-bottom:5px;transition:all .3s;}
.mission-card.done{border-color:rgba(46,204,113,.4);opacity:.6;}
.mission-title{font-size:.68rem;font-weight:900;color:var(--gold);margin-bottom:2px;display:flex;align-items:center;justify-content:space-between;}
.mission-desc{font-size:.58rem;color:rgba(255,255,255,.6);line-height:1.3;}
.mission-progress{margin-top:4px;height:2px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden;}
.mission-bar{height:100%;background:var(--gold);border-radius:2px;transition:width .4s;}
.mission-badge{background:var(--green);color:#fff;font-size:.5rem;font-weight:900;padding:1px 5px;border-radius:6px;}
#sidebar-chat{padding:0 12px;}
.chat-messages{max-height:100px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;margin-bottom:6px;scrollbar-width:none;}
.chat-messages::-webkit-scrollbar{display:none;}
.chat-msg{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:7px;padding:3px 8px;font-size:.62rem;color:#fff;line-height:1.3;}
.chat-msg .name{font-weight:900;color:var(--gold);margin-right:4px;}
.chat-input-wrap{display:flex;gap:4px;}
.chat-input{flex:1;background:rgba(0,0,0,.4);border:1.5px solid rgba(255,255,255,.2);border-radius:8px;padding:6px 9px;font-size:14px;font-weight:700;color:#fff;outline:none;font-family:'M PLUS Rounded 1c',sans-serif;}
.chat-input::placeholder{color:rgba(255,255,255,.3);}
.chat-input:focus{border-color:var(--gold);}
.chat-send{width:30px;height:30px;border-radius:8px;background:var(--orange);border:none;color:#fff;cursor:pointer;font-size:.8rem;display:flex;align-items:center;justify-content:center;pointer-events:all;}
#shrink-overlay{position:fixed;inset:0;z-index:30;pointer-events:none;transition:all .5s;border:0px solid rgba(100,200,255,.8);box-shadow:inset 0 0 0px rgba(100,200,255,.4);}
#shrink-overlay.active{border-width:12px;box-shadow:inset 0 0 60px rgba(100,200,255,.4);}
#sewer-overlay{position:fixed;inset:0;z-index:25;background:radial-gradient(ellipse at center,rgba(20,40,10,.0) 0%,rgba(10,20,5,.0) 100%);pointer-events:none;transition:all .8s;}
#sewer-overlay.active{background:radial-gradient(ellipse at center,rgba(20,60,10,.7) 0%,rgba(0,0,0,.95) 100%);}
#metro-hud{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:50;background:rgba(0,0,0,.92);border:2px solid #f5c842;border-radius:18px;padding:20px 30px;min-width:280px;text-align:center;display:none;}
#metro-hud.show{display:block;}
.metro-title{font-family:'Zen Kaku Gothic New',sans-serif;font-size:1.1rem;font-weight:900;color:#f5c842;margin-bottom:12px;}
.metro-stations{display:flex;flex-direction:column;gap:8px;}
.metro-station-btn{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);border-radius:10px;padding:10px 16px;color:#fff;font-size:.8rem;font-weight:700;cursor:pointer;pointer-events:all;transition:all .2s;font-family:'M PLUS Rounded 1c',sans-serif;}
.metro-station-btn:hover,.metro-station-btn:active{background:rgba(245,200,66,.2);border-color:#f5c842;color:#f5c842;}
.metro-close{margin-top:12px;background:rgba(231,76,60,.2);border:1.5px solid var(--red);border-radius:10px;padding:8px 20px;color:var(--red);font-size:.75rem;font-weight:700;cursor:pointer;pointer-events:all;font-family:'M PLUS Rounded 1c',sans-serif;}
#boat-hud{position:fixed;bottom:200px;left:50%;transform:translateX(-50%);z-index:40;background:rgba(0,0,0,.8);border:1.5px solid #3498db;border-radius:14px;padding:8px 18px;display:none;pointer-events:all;}
#boat-hud.show{display:flex;align-items:center;gap:12px;}
.boat-info{font-size:.72rem;font-weight:700;color:#3498db;}
.boat-exit-btn{background:rgba(231,76,60,.25);border:1.5px solid var(--red);border-radius:9px;padding:5px 12px;color:var(--red);font-size:.7rem;font-weight:700;cursor:pointer;font-family:'M PLUS Rounded 1c',sans-serif;}
#anim-panel{position:absolute;bottom:0;left:0;right:0;pointer-events:all;padding:5px 0 9px;background:linear-gradient(0deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.55) 100%);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.08);}
#anim-scroll{display:flex;gap:6px;overflow-x:auto;padding:3px 12px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
#anim-scroll::-webkit-scrollbar{display:none;}
.anim-btn{flex-shrink:0;width:62px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.anim-icon{width:60px;height:60px;border-radius:11px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;transition:all .15s;}
.anim-icon svg{width:48px;height:48px;}
.anim-btn.active .anim-icon{background:rgba(245,200,66,.12);border-color:var(--gold);box-shadow:0 0 10px rgba(245,200,66,.3);}
.anim-btn:active .anim-icon{transform:scale(.9);}
.anim-label{font-size:.52rem;font-weight:700;color:rgba(255,255,255,.4);text-align:center;line-height:1.1;}
.anim-btn.active .anim-label{color:var(--gold);}
#joystick-zone{position:absolute;bottom:106px;right:16px;width:100px;height:100px;pointer-events:all;}
#cam-joystick-zone{position:absolute;bottom:106px;left:16px;width:100px;height:100px;pointer-events:all;}
.joy-base{width:100px;height:100px;border-radius:50%;background:rgba(0,0,0,.2);border:1.5px solid rgba(255,255,255,.2);backdrop-filter:blur(6px);position:relative;display:flex;align-items:center;justify-content:center;}
.joy-knob{width:40px;height:40px;border-radius:50%;position:absolute;box-shadow:0 2px 10px rgba(0,0,0,.4);}
#jump-btn{position:absolute;bottom:220px;right:22px;width:52px;height:52px;border-radius:50%;background:#2b6cb0;border:none;color:#fff;font-size:1.3rem;pointer-events:all;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}
#super-jump-btn{position:absolute;bottom:220px;left:22px;width:52px;height:52px;border-radius:50%;background:var(--orange);border:none;color:#fff;font-size:1.1rem;pointer-events:all;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}
.toast{position:fixed;bottom:200px;left:50%;transform:translateX(-50%) translateY(14px);background:rgba(0,0,0,.85);color:var(--gold);padding:7px 15px;border-radius:16px;font-size:.72rem;font-weight:700;opacity:0;transition:all .25s;z-index:50;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.mission{background:rgba(20,80,40,.95);color:var(--green);border:1px solid var(--green);}
.toast.secret{background:rgba(10,30,80,.95);color:#88ccff;border:1px solid #88ccff;}
.toast.boat{background:rgba(10,40,80,.95);color:#3498db;border:1px solid #3498db;}
#speech-bubble{position:fixed;z-index:20;background:rgba(0,0,0,.85);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:9px;padding:4px 10px;font-size:.68rem;font-weight:700;pointer-events:none;max-width:140px;text-align:center;transform:translateX(-50%);opacity:0;transition:opacity .25s;white-space:nowrap;}
#loading-screen{position:fixed;inset:0;z-index:200;background:#b0c8e8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s;}
#loading-screen.hidden{opacity:0;pointer-events:none;}
.load-logo{font-family:'Zen Kaku Gothic New',sans-serif;font-size:2.2rem;font-weight:900;color:#1a2a40;letter-spacing:.06em;}
.load-logo em{color:var(--orange);font-style:normal;}
.load-kanji{font-size:.9rem;color:rgba(26,42,64,.6);letter-spacing:.25em;}
.load-bar-wrap{width:180px;height:3px;background:rgba(0,0,0,.12);border-radius:2px;overflow:hidden;}
.load-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--orange),var(--gold));border-radius:2px;transition:width .2s;}
.load-txt{font-size:.68rem;color:rgba(26,42,64,.6);font-weight:700;}
#markers{position:fixed;inset:0;z-index:15;pointer-events:none;}
.marker{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;opacity:0;transition:opacity .3s;}
.marker.visible{opacity:1;}
.marker-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;animation:markerBounce 1.2s ease-in-out infinite;}
.marker-label{font-size:.55rem;font-weight:900;color:#fff;background:rgba(0,0,0,.7);padding:1px 6px;border-radius:8px;white-space:nowrap;}
@keyframes markerBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
#interact-prompt{position:fixed;top:50%;left:50%;transform:translate(-50%,60px);z-index:45;background:rgba(0,0,0,.8);border:1.5px solid var(--gold);border-radius:12px;padding:8px 18px;font-size:.75rem;font-weight:700;color:var(--gold);pointer-events:all;cursor:pointer;display:none;-webkit-tap-highlight-color:transparent;}
#interact-prompt.show{display:block;}
/* Altitude indicator */
#altitude-hud{position:fixed;top:56px;left:14px;z-index:20;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:4px 9px;font-size:.62rem;font-weight:700;color:#fff;display:none;}
#altitude-hud.show{display:block;}
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="sewer-overlay"></div>
<div id="shrink-overlay"></div>

<div id="loading-screen">
  <div class="load-logo">TOKYO<em>東京</em></div>
  <div class="load-kanji">MACADAM WORLD</div>
  <div class="load-bar-wrap"><div class="load-bar" id="load-bar"></div></div>
  <div class="load-txt" id="load-txt">Chargement…</div>
</div>

<div id="metro-hud">
  <div class="metro-title">🚇 Métro de Tokyo</div>
  <div class="metro-stations" id="metro-stations"></div>
  <button class="metro-close" id="metro-close">✕ Fermer</button>
</div>

<div id="boat-hud">
  <span class="boat-info" id="boat-info">⚓ En mer — Vitesse: 0</span>
  <button class="boat-exit-btn" id="boat-exit">Quitter le bateau</button>
</div>

<div id="interact-prompt">⬆ Appuyer pour interagir</div>
<div id="altitude-hud">📍 Alt: <span id="altitude-val">0</span>m</div>

<div id="hud">
  <div class="hud-top">
    <div class="hud-logo">⬡ <em>Macadam</em> World</div>
    <div class="hud-loc"><div class="loc-dot"></div><span id="zone-label">東京 Shinjuku</span></div>
    <div class="hud-info"><div class="hud-pic" id="hud-pic">?</div><span class="hud-name" id="hud-pseudo">Joueur</span></div>
  </div>
  <div id="sidebar-toggle" onclick="toggleSidebar()">
    <span>📋</span>
    <span id="sidebar-toggle-label">MENU</span>
  </div>
  <div id="sidebar">
    <div id="sidebar-inner">
      <div class="sidebar-section">
        <div class="sidebar-section-title">🎯 Missions</div>
        <div id="mission-hud"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-title">💬 Chat</div>
        <div id="sidebar-chat">
          <div class="chat-messages" id="chat-messages"></div>
          <div class="chat-input-wrap">
            <input class="chat-input" id="chat-input" type="text" placeholder="Dis quelque chose…" maxlength="80" autocomplete="off"/>
            <button class="chat-send" id="chat-send">➤</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="cam-joystick-zone">
    <div class="joy-base" id="cam-joy-base">
      <div class="joy-knob" id="cam-joy-knob" style="background:linear-gradient(135deg,#f5c842,#e85d26);"></div>
    </div>
  </div>
  <div id="joystick-zone">
    <div class="joy-base" id="joy-base">
      <div class="joy-knob" id="joy-knob" style="background:linear-gradient(135deg,#dddddd,#aaaaaa);"></div>
    </div>
  </div>
  <button id="jump-btn">↑</button>
  <button id="super-jump-btn">🚀</button>
  <div id="anim-panel"><div id="anim-scroll"></div></div>
</div>

<div id="markers"></div>
<div id="speech-bubble"></div>
<div class="toast" id="toast"></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const gltfLoader = new GLTFLoader();
const glbCache = {};
const BASE = 'https://raw.githubusercontent.com/hoobasurf/chili/main/';
const WALK_FILE = 'course.glb', IDLE_FILE = 'attend.glb';

const _v3  = new THREE.Vector3();
const _box = new THREE.Box3();
const _sz  = new THREE.Vector3();

// ── PROFIL ───────────────────────────────────────────────
function loadProfile(){
  try{
    const uid = localStorage.getItem('macadam_user_id')||('p_'+Math.random().toString(36).slice(2,8));
    localStorage.setItem('macadam_user_id',uid);
    const saved=JSON.parse(localStorage.getItem('macadam_avatar_'+uid)||'null');
    return{pseudo:saved?.pseudo||'Joueur'};
  }catch(e){return{pseudo:'Joueur'};}
}
const profile=loadProfile();
document.getElementById('hud-pseudo').textContent=profile.pseudo;
document.getElementById('hud-pic').textContent=profile.pseudo.slice(0,2).toUpperCase();

// ── LOADING ──────────────────────────────────────────────
let loadPct=0;
const loadBar=document.getElementById('load-bar'),loadTxt=document.getElementById('load-txt');
const ldMsgs=['Chargement des textures…','Construction de Tokyo…','Pose du béton…','Construction du métro…','Mise à flot des bateaux…','Tour Eiffel en cours…','Presque prêt…'];
let ldIdx=0;
const ldInt=setInterval(()=>{
  loadPct+=Math.random()*5;if(loadPct>85){loadPct=85;clearInterval(ldInt);}
  loadBar.style.width=loadPct+'%';
  const idx=Math.min(Math.floor(loadPct/14),ldMsgs.length-1);
  if(idx>ldIdx){ldIdx=idx;loadTxt.textContent=ldMsgs[ldIdx];}
},180);
function finishLoading(){
  clearInterval(ldInt);loadBar.style.width='100%';loadTxt.textContent='Bienvenue à Tokyo !';
  setTimeout(()=>{const l=document.getElementById('loading-screen');l.classList.add('hidden');setTimeout(()=>l.style.display='none',600);},400);
  addChat('☀️ Bienvenue à Tokyo, '+profile.pseudo+' !','Système');
  addChat('🚇 Montez les escaliers pour accéder au Métro !','Info');
  addChat('🗼 3 étages de la Tour Eiffel à explorer !','Info');
  swapAvatar(IDLE_FILE,true,null);
}

// ── UI ───────────────────────────────────────────────────
let toastTimer=null;
function showToast(msg,type=''){
  const t=document.getElementById('toast');t.textContent=msg;
  t.className='toast '+(type||'');t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3200);
}
const bubbleEl=document.getElementById('speech-bubble');let bubTimer=null;
function showBubble(t){bubbleEl.textContent=t;bubbleEl.style.opacity='1';clearTimeout(bubTimer);bubTimer=setTimeout(()=>bubbleEl.style.opacity='0',4500);}
function addChat(text,from){
  const msgs=document.getElementById('chat-messages');const d=document.createElement('div');d.className='chat-msg';
  d.innerHTML=`<span class="name">${from}</span>${text}`;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;
  while(msgs.children.length>20)msgs.removeChild(msgs.firstChild);
}
function sendChat(){const inp=document.getElementById('chat-input');const m=inp.value.trim();if(!m)return;inp.value='';addChat(m,profile.pseudo);showBubble(m);}
document.getElementById('chat-send').addEventListener('click',sendChat);
document.getElementById('chat-input').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendChat();}});
function toggleSidebar(){
  const s=document.getElementById('sidebar');const lbl=document.getElementById('sidebar-toggle-label');
  s.classList.toggle('open');lbl.textContent=s.classList.contains('open')?'FERMER':'MENU';
}
document.addEventListener('touchstart',e=>{
  const sb=document.getElementById('sidebar'),tog=document.getElementById('sidebar-toggle');
  if(sb.classList.contains('open')&&!sb.contains(e.target)&&!tog.contains(e.target)){
    sb.classList.remove('open');document.getElementById('sidebar-toggle-label').textContent='MENU';
  }
},{passive:true});

// ── RENDERER ────────────────────────────────────────────
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(1);
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=false;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById('canvas-container').appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x7ab4d4);
scene.fog=new THREE.FogExp2(0x9ec2dc,0.002);
const camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,500);
window.addEventListener('resize',()=>{renderer.setSize(window.innerWidth,window.innerHeight);camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();});

// ── LUMIÈRES ─────────────────────────────────────────────
scene.add(new THREE.HemisphereLight(0x87CEEB,0xc8b89a,1.2));
const sun=new THREE.DirectionalLight(0xfff5e0,2.2);sun.position.set(80,150,60);scene.add(sun);
const fillLight=new THREE.DirectionalLight(0xc8d8f0,0.5);fillLight.position.set(-50,80,-80);scene.add(fillLight);

// ── TEXTURES ─────────────────────────────────────────────
function procTex(fn,size=256){
  const cv=document.createElement('canvas');cv.width=cv.height=size;const ctx=cv.getContext('2d');
  fn(ctx,size);const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}

const colliders=[];
function addCol(cx,cz,hw,hd,mH=200){colliders.push({minX:cx-hw,maxX:cx+hw,minZ:cz-hd,maxZ:cz+hd,mH});}
const PR=0.55;
function resCol(nx,nz,py){
  for(const c of colliders){
    if(py>=c.mH)continue;
    const px=Math.max(c.minX,Math.min(c.maxX,nx)),pz=Math.max(c.minZ,Math.min(c.maxZ,nz));
    const dx=nx-px,dz=nz-pz,d=Math.sqrt(dx*dx+dz*dz);
    if(d<PR){if(d<0.001){nx+=PR;}else{const p=PR-d;nx+=(dx/d)*p;nz+=(dz/d)*p;}}
  }
  return{x:nx,z:nz};
}
const platforms=[];
function addPlatform(cx,cz,hw,hd,y){
  platforms.push({minX:cx-hw,maxX:cx+hw,minZ:cz-hd,maxZ:cz+hd,y});
}
function getFloorY(x,z,curY){
  let best=0;
  for(const p of platforms){
    if(x>=p.minX&&x<=p.maxX&&z>=p.minZ&&z<=p.maxZ&&p.y<=curY+1.5&&p.y>best) best=p.y;
  }
  return best;
}

  drivingCars.forEach(dc=>{

    if(r.dir>0&&nlo>r.max)nlo=r.min;if(r.dir<0&&nlo<r.max)nlo=r.min;

  });
}

// Le joueur marche dessus grâce au système getFloorY
const rampDefs = [
// {yBottom, yTop, angle(rad), len, cx, cz, sideOffset}
{yBot:0,   yTop:55,  len:48, angle:0,       side:22, label:‘Est → Étage 1’},
{yBot:55,  yTop:110, len:36, angle:Math.PI/2,side:10, label:‘Nord → Étage 2’},
{yBot:110, yTop:165, len:28, angle:Math.PI,  side:5,  label:‘Ouest → Sommet’},
];

rampDefs.forEach(rd=>{
const steps = Math.ceil(rd.len/1.6);
for(let i=0;i<=steps;i++){
const t    = i/steps;
const y    = rd.yBot+(rd.yTop-rd.yBot)*t;
// Position le long de la direction de la rampe
const dist = (rd.side)*(1-t);   // part du bord, arrive au centre
const sx   = EX + Math.cos(rd.angle)*dist;
const sz   = EZ + Math.sin(rd.angle)*dist;
// Step plat (marche individuelle)
const step = new THREE.Mesh(new THREE.BoxGeometry(2.2,0.22,1.8),stepMat);
step.position.set(sx, y, sz);
scene.add(step);
// Chaque step = petite plateforme
addPlatform(sx, sz, 1.1, 0.9, y+0.11);
}
// Collider latéral pour garder le joueur sur la rampe
addCol(EX+Math.cos(rd.angle)*rd.side*0.5, EZ+Math.sin(rd.angle)*rd.side*0.5,
1.8, rd.len/2+2, rd.yTop+2);
});

);
gem.position.set(EX+floorDefs.indexOf(fl)*0+18, fl.y+0.6, EZ);
scene.add(gem);

const METRO_STATIONS_DEF = [

{id:‘shibuya’,  label:‘渋谷 Shibuya’,    sx:-80, sz:80,   color:0x3a1a5a},

{id:‘odaiba’,   label:‘お台場 Odaiba’,   sx:100, sz:50,   color:0x1a4a5a},
];

const STATION_DEPTH = -9;   // Y du sol de la station
const STATION_W     = 24;
const STATION_D     = 40;

// Matériaux station
const stationFloorMat   = new THREE.MeshLambertMaterial({color:0x303038});
const stationWallMat    = new THREE.MeshLambertMaterial({color:0x252530});
const stationCeilMat    = new THREE.MeshLambertMaterial({color:0x1a1a22});
const stationTileMat    = new THREE.MeshLambertMaterial({color:0xc8c0b0});
const stationRailMat    = new THREE.MeshLambertMaterial({color:0x555550});
const stationSignMat    = new THREE.MeshLambertMaterial({color:0x1144aa,emissive:new THREE.Color(0x0033aa),emissiveIntensity:0.5});

// Sortie téléportation : quand le joueur entre dans un tunnel, il ressort à la prochaine station
// On garde la liste pour le UI
const metroStationsList = [];

METRO_STATIONS_DEF.forEach(def=>{

// ── Entrée surface : escalier descendant ────────────────
const entryX = def.sx;
const entryZ = def.sz + 14;  // légèrement devant la station

// Kiosque d’entrée (boîte verte métro)
const kiosk = new THREE.Mesh(new THREE.BoxGeometry(5,3,3),
new THREE.MeshLambertMaterial({color:def.color,emissive:new THREE.Color(def.color).multiplyScalar(0.3),emissiveIntensity:0.4}));
kiosk.position.set(entryX, 1.5, entryZ);
scene.add(kiosk);
// Panneau M
const signM = new THREE.Mesh(new THREE.BoxGeometry(1.5,1.5,0.1),
new THREE.MeshLambertMaterial({color:0xffffff,emissive:new THREE.Color(0xffffff),emissiveIntensity:0.6}));
signM.position.set(entryX, 2.8, entryZ+1.55);
scene.add(signM);
addCol(entryX, entryZ, 2.5, 1.5, 3.5);

// Escaliers souterrains (12 marches, descend de y=0 à y=STATION_DEPTH+3)
const NSTEPS = 12;
for(let i=0;i<NSTEPS;i++){
const t    = i/NSTEPS;
const sy   = -(t*(Math.abs(STATION_DEPTH)-2));
const sz2  = entryZ - 1 - i*1.2;
const step = new THREE.Mesh(new THREE.BoxGeometry(3.5,0.22,1.2),stationTileMat);
step.position.set(entryX, sy, sz2);
scene.add(step);
addPlatform(entryX, sz2, 1.75, 0.6, sy+0.11);
}
// Murs d’escalier
for(let s=0;s<2;s++){
const wall=new THREE.Mesh(new THREE.BoxGeometry(0.2,Math.abs(STATION_DEPTH)+1,NSTEPS*1.2+1),stationWallMat);
wall.position.set(entryX+(s?1.85:-1.85), STATION_DEPTH/2, entryZ-NSTEPS*0.6);
scene.add(wall);
addCol(entryX+(s?1.85:-1.85), entryZ-NSTEPS*0.6, 0.3, NSTEPS*0.6+1, 1);
}

// ── Boîte principale de la station (souterraine) ────────
const stY = STATION_DEPTH;   // centre Y du sol station

// Sol
const floor=new THREE.Mesh(new THREE.BoxGeometry(STATION_W,0.3,STATION_D),stationFloorMat);
floor.position.set(def.sx, stY-0.15, def.sz);
scene.add(floor);
addPlatform(def.sx, def.sz, STATION_W/2, STATION_D/2, stY);

// Quai surélevé (côtés)
[-1,1].forEach(side=>{
const quai2=new THREE.Mesh(new THREE.BoxGeometry(5,0.4,STATION_D-2),stationTileMat);
quai2.position.set(def.sx+side*8, stY+0.2, def.sz);
scene.add(quai2);
addPlatform(def.sx+side*8, def.sz, 2.5, STATION_D/2-1, stY+0.4);
// Rambarde quai
for(let q=-1;q<=1;q+=2){
const ramp2=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.8,STATION_D-2),railMat);
ramp2.position.set(def.sx+side*10.3, stY+0.8, def.sz);
scene.add(ramp2);
}
});

// Rails (deux lignes centrales)
[-1.5,1.5].forEach(rx=>{
const rail=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.12,STATION_D),stationRailMat);
rail.position.set(def.sx+rx, stY+0.06, def.sz);
scene.add(rail);
});

// Plafond
const ceil=new THREE.Mesh(new THREE.BoxGeometry(STATION_W+0.5,0.4,STATION_D+0.5),stationCeilMat);
ceil.position.set(def.sx, stY+4.0, def.sz);
scene.add(ceil);

// Murs
[[STATION_W/2+0.2,0,0,STATION_D],[-(STATION_W/2+0.2),0,0,STATION_D],
[0,0,STATION_D/2+0.2,STATION_W],[0,0,-(STATION_D/2+0.2),STATION_W]
].forEach(([ox,oy,oz,len],i)=>{
const isZ=i<2;
const w = new THREE.Mesh(
new THREE.BoxGeometry(isZ?0.3:len,4.2,isZ?len:0.3),
stationWallMat
);
w.position.set(def.sx+ox, stY+2, def.sz+oz);
scene.add(w);
addCol(def.sx+ox, def.sz+oz,
isZ?0.5:len/2+0.5, isZ?len/2+0.5:0.5, 1);
});

// Lumières néon station
[-12,-4,4,12].forEach(lz=>{

// Panneau de station

signBoard.position.set(def.sx, stY+3.2, def.sz-STATION_D/2+0.15);

// Tunnel de connexion (cylindre) vers la prochaine station
// (visuel seulement — le joueur utilise le HUD pour choisir destination)

});

metroStationsList.push({
id:def.id, label:def.label,
entryX, entryZ,
stationX:def.sx, stationZ:def.sz, stationY:stY

});

// ── Tunnels visuels entre stations (lignes de métro) ────────────────
// Connecte Shinjuku→Shibuya, Shinjuku→Asakusa, etc. visuellement
const TUNNEL_PAIRS = [
[0,1],[0,2],[1,3]
];
TUNNEL_PAIRS.forEach(([a,b])=>{
const sa=METRO_STATIONS_DEF[a], sb=METRO_STATIONS_DEF[b];
const midX=(sa.sx+sb.sx)/2, midZ=(sa.sz+sb.sz)/2;
const dx=sb.sx-sa.sx, dz=sb.sz-sa.sz;
const len=Math.sqrt(dx*dx+dz*dz);
const angle=Math.atan2(dx,dz);
// Sol tunnel souterrain
const tFloor=new THREE.Mesh(new THREE.BoxGeometry(4,0.2,len),stationFloorMat);
tFloor.position.set(midX, STATION_DEPTH-0.1, midZ);
tFloor.rotation.y=angle;
scene.add(tFloor);
addPlatform(midX, midZ, 2, len/2, STATION_DEPTH);
// Voûte tunnel
const tCeil=new THREE.Mesh(
new THREE.CylinderGeometry(2.8,2.8,len,12,1,true),
new THREE.MeshLambertMaterial({color:0x151520,side:THREE.BackSide})
);
tCeil.rotation.x=Math.PI/2;
tCeil.rotation.y=angle;
tCeil.position.set(midX,STATION_DEPTH+1.5,midZ);
scene.add(tCeil);
// Rails tunnel
[-1.4,1.4].forEach(rx=>{
const tr=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.1,len),stationRailMat);
tr.position.set(midX+rx,STATION_DEPTH+0.05,midZ);
tr.rotation.y=angle;
scene.add(tr);
});
});

});
container.appendChild(btn);
});
}
function openMetroHUD(){
buildMetroHUD();
document.getElementById(‘metro-hud’).classList.add(‘show’);
}
function closeMetroHUD(){
document.getElementById(‘metro-hud’).classList.remove(‘show’);
}
document.getElementById(‘metro-close’).addEventListener(‘click’,closeMetroHUD);

// Trigger d’entrée métro : si le joueur s’approche d’un kiosque
function checkMetroEntry(){
const px=playerMesh.position.x, pz=playerMesh.position.z;
for(const st of metroStationsList){
const dx=px-st.entryX, dz=pz-st.entryZ;
if(Math.sqrt(dx*dx+dz*dz)<3.5){
if(!document.getElementById(‘metro-hud’).classList.contains(‘show’)){
openMetroHUD();
}
return;
}
}
}

// ── VOITURES GLB ─────────────────────────────────────────
const glbCars=[];
const GLB_CAR_ROUTES=[
  {file:'1965_alfa_romeo_giulia_sprint_gta_1600.glb',          len:4.2,axis:'x',fixedZ:-4,  min:-140,max:140, dir:1, speed:13},
  {file:'1967_alfa_romeo_giulia_sprint_zagato_sacalino.glb',   len:4.0,axis:'z',fixedX:-4,  min:-140,max:140, dir:1, speed:11},
  {file:'renault_5_tl_1974.glb',                               len:3.5,axis:'x',fixedZ:-28, min:-100,max:100, dir:1, speed:9},
];
const carGLBCache={};
function loadCarGLB(file,targetLength,cb){
  if(carGLBCache[file]){cb(carGLBCache[file].clone());return;}
  gltfLoader.load(BASE+file,gltf=>{
    const model=gltf.scene;model.traverse(n=>{if(n.isMesh){n.castShadow=false;n.receiveShadow=false;if(n.material&&n.material.isMeshStandardMaterial){const old=n.material;n.material=new THREE.MeshLambertMaterial({color:old.color,map:old.map||null,transparent:old.transparent,opacity:old.opacity});}}});
    _box.setFromObject(model);_box.getSize(_sz);const longestAxis=Math.max(_sz.x,_sz.y,_sz.z);if(longestAxis>0)model.scale.setScalar(targetLength/longestAxis);_box.setFromObject(model);model.position.y=-_box.min.y;carGLBCache[file]=model;cb(model.clone());
  },undefined,()=>{});
}
GLB_CAR_ROUTES.forEach((route,i)=>{
  loadCarGLB(route.file,route.len,model=>{
    const g=new THREE.Group();g.add(model);scene.add(g);
    const range=Math.abs(route.max-route.min);const offset=(i*53)%range;
    const laneOff=2.5;let sx,sz,rot;
    if(route.axis==='x'){sx=route.min+offset;sz=route.fixedZ-laneOff;rot=Math.PI/2;}
    else{sx=route.fixedX+laneOff;sz=route.min+offset;rot=0;}
    g.position.set(sx,0,sz);g.rotation.y=rot;glbCars.push({mesh:g,route});
  });
});
function updateGLBCars(dt){glbCars.forEach(dc=>{const r=dc.route;const lo=r.axis==='x'?dc.mesh.position.x:dc.mesh.position.z;let nlo=lo+r.dir*r.speed*dt;if(r.dir>0&&nlo>r.max)nlo=r.min;if(r.dir<0&&nlo<r.max)nlo=r.min;if(r.axis==='x'){dc.mesh.position.x=nlo;}else{dc.mesh.position.z=nlo;}});}

  const deck=new THREE.Mesh(new THREE.BoxGeometry(hull.geometry.parameters.width-0.5,0.35,hull.geometry.parameters.depth-1),deckBtMat);deck.position.y=hull.geometry.parameters.height+hull.position.y-0.1;g.add(deck);

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.08);time+=dt;
  if(avatarMixer)avatarMixer.update(dt);
  waterTex.offset.x=time*0.008;waterTex.offset.y=time*0.006;
  mooredBoats.forEach((b,i)=>{b.mesh.rotation.z=Math.sin(time*0.6+i)*0.025;b.mesh.position.y=-1.5+Math.sin(time*0.7+i)*0.1;});
  if(puddleZones.length){const pz=puddleZones[0];pz.arrow.rotation.y=time*2;pz.arrow.position.y=1.2+0.2*Math.sin(time*2);}
  if(missionZones.length){const sz2=missionZones[0];sz2.arrow.rotation.y=time*1.5;sz2.arrow.position.y=1.5+0.25*Math.sin(time*1.8);sz2.sewerCoins.forEach(c=>{if(!c.collected)c.mesh.rotation.z=time*2;});}
  if(wallPassZones.length&&!wallPassZones[0].treasureCollected)wallPassZones[0].treasure.rotation.y=time;

  // Clignotement antennes (liste propre, pas scene.children.forEach)
  blinkMeshes.forEach(b=>{b.mesh.material.emissiveIntensity=0.4+0.4*Math.sin(time*4+(b.t||0));});

  updateMetroTrain(dt);updateGLBCars(dt);updateCars(dt);
  if(inBoat){updateBoat(dt);setWalkSwap(false);}

  // Input
  let mx=joy.x,mz=-joy.y;
  if(keys['ArrowUp']||keys['w']||keys['W'])mz=1;if(keys['ArrowDown']||keys['s']||keys['S'])mz=-1;
  if(keys['ArrowLeft']||keys['a']||keys['A'])mx=-1;if(keys['ArrowRight']||keys['d']||keys['D'])mx=1;
  if(keys[' ']&&onGround&&!inBoat)doJump();
  if(camJoy.active&&Math.abs(camJoy.x)>0.04&&!inBoat)cameraYaw-=camJoy.x*2.2*dt;
  if(keys['q']||keys['Q'])cameraYaw+=1.8*dt;if(keys['e']||keys['E'])cameraYaw-=1.8*dt;
  const moving=Math.abs(mx)>0.05||Math.abs(mz)>0.05;
  if(moving&&emoteTimer){clearTimeout(emoteTimer);emoteTimer=null;}

  // Altitude HUD
  if(pp.y>5){altHud.classList.add('show');altVal.textContent=Math.round(pp.y);}else altHud.classList.remove('show');

  // Interactions proximité
  if(!inBoat&&!inMetro&&!metroMenuOpen){
    const dBoat=Math.sqrt((pp.x-boatX)**2+(pp.z-boatZ)**2);
    // Station métro : détection au pied des escaliers (au sol ou sur le quai)
    const nearStation=METRO_STATIONS.find(s=>{
      const d=Math.sqrt((pp.x-s.x)**2+(pp.z-s.z)**2);
      // Au sol près des escaliers OU sur le quai
      const onQuai=Math.abs(pp.y-METRO_ELEV)<2;
      const atBase=d<8&&pp.y<3;
      return (atBase||onQuai)&&d<9;
    });
    if(nearStation){
      setInteractPrompt('🚇 Prendre le métro — '+nearStation.name,()=>{openMetroMenu(nearStation.id);clearInteractPrompt();});
    }else if(dBoat<8&&pp.y<3){
      setInteractPrompt('⛵ Monter sur le bateau',()=>{
        inBoat=true;boatX=playerBoat.position.x;boatZ=playerBoat.position.z;boatVel=0;
        document.getElementById('boat-hud').classList.add('show');clearInteractPrompt();
        showToast('⛵ Tu pilotes le bateau!','boat');completeMission('boat','Capitaine de la baie !');
      });
    }else clearInteractPrompt();
  }

  // Physique
  if(!inBoat){
    const lz=ladderZones[0];
    const distLadder=Math.sqrt((pp.x-lz.x)**2+(pp.z-lz.z)**2);
    if(distLadder<1.5&&!isOnLadder&&mz>0.3){isOnLadder=true;ladderLX=lz.x;ladderLZ=lz.z;ladderTopY=lz.topY;showToast('🪜 Monte avec ↑');}
    if(isOnLadder){
      pp.x=ladderLX;pp.z=ladderLZ;onGround=false;jumpVel=0;
      if(mz>0.2)pp.y=Math.min(pp.y+4*dt,ladderTopY+0.2);else if(mz<-0.2)pp.y=Math.max(pp.y-4*dt,0);
      if(pp.y<=0.1){isOnLadder=false;pp.y=0;onGround=true;}
      if(pp.y>=ladderTopY-0.5){isOnLadder=false;onGround=true;pp.x=lz.platX;pp.z=lz.platZ;pp.y=ladderTopY+0.2;completeMission('ladder','Sommet du gratte-ciel!');updateMissionProgress('ladder',1);}
      setWalkSwap(false);
    }else if(!isInSewer){
      if(moving){
        const sc=Math.sin(cameraYaw),cc=Math.cos(cameraYaw);
        const spd=isShrunk?SPEED*0.4:SPEED;
        const dx=(sc*(-mz)+cc*mx)*spd*dt,dz=(cc*(-mz)-sc*mx)*spd*dt;
        let nx=pp.x+dx,nz=pp.z+dz;
        if(!isShrunk){const res=resCol(nx,nz,pp.y);nx=res.x;nz=res.z;}
        pp.x=Math.max(-BOUND,Math.min(BOUND,nx));pp.z=Math.max(-BOUND,Math.min(BOUND,nz));
        pRot=Math.atan2(dx,dz);
        const tY=pRot+Math.PI;let diff=tY-cameraYaw;
        while(diff>Math.PI)diff-=2*Math.PI;while(diff<-Math.PI)diff+=2*Math.PI;
        cameraYaw+=diff*Math.min(4*dt,1.0);
      }
      if(!onGround){jumpVel-=GR*dt;pp.y+=jumpVel*dt;if(pp.y<=0){pp.y=0;jumpVel=0;onGround=true;}}
      if(onGround&&!isOnLadder)setWalkSwap(moving);
    }else{
      if(moving){
        const sc=Math.sin(cameraYaw),cc=Math.cos(cameraYaw);
        const dx=(sc*(-mz)+cc*mx)*SPEED*0.7*dt,dz=(cc*(-mz)-sc*mx)*SPEED*0.7*dt;
        pp.x=Math.max(-BOUND,Math.min(BOUND,pp.x+dx));pp.z=Math.max(-BOUND,Math.min(BOUND,pp.z+dz));
        pRot=Math.atan2(dx,dz);const tY=pRot+Math.PI;let diff=tY-cameraYaw;
        while(diff>Math.PI)diff-=2*Math.PI;while(diff<-Math.PI)diff+=2*Math.PI;
        cameraYaw+=diff*Math.min(4*dt,1.0);
      }
      pp.y=sewerFloorY+0.1;onGround=true;jumpVel=0;setWalkSwap(moving);
      const sz2=missionZones[0];
      sz2.sewerCoins.forEach(c=>{if(!c.collected){const d2=Math.sqrt((pp.x-c.mesh.position.x)**2+(pp.z-c.mesh.position.z)**2);if(d2<1.2){c.collected=true;c.mesh.visible=false;sewerCoinsCollected++;showToast(`💚 Capsule ${sewerCoinsCollected}/5!`,'mission');updateMissionProgress('sewer',sewerCoinsCollected);if(sewerCoinsCollected>=5)completeMission('sewer','Toutes les capsules!');}}});
      if(Math.sqrt((pp.x-(-90))**2+(pp.z-(-70))**2)<2.5)exitSewer();
    }

    // Zones
    if(puddleZones.length){const pud=puddleZones[0];const dPud=Math.sqrt((pp.x-pud.x)**2+(pp.z-pud.z)**2);if(dPud<pud.r&&!isInSewer&&onGround&&!missions.find(x=>x.id==='puddle')?.done){missions.find(x=>x.id==='puddle').done=true;missions.find(x=>x.id==='puddle').progress=1;enterSewer();pp.x=-90;pp.z=-70;pp.y=sewerFloorY+0.1;showToast('🌊 Aspiré!','secret');renderMissions();}}
    if(wallPassZones.length){const wp=wallPassZones[0];const inZone=Math.abs(pp.x-wp.x)<wp.halfW+1&&Math.abs(pp.z-wp.z)<wp.halfD+0.8;if(inZone&&!isShrunk)enterShrink();if(!wp.treasureCollected){const dT=Math.sqrt((pp.x-(wp.x-8))**2+(pp.z-wp.z)**2);if(dT<1.5&&isShrunk){wp.treasureCollected=true;wp.treasure.visible=false;showToast('💎 Trésor secret!','mission');}}if(isShrunk&&Math.abs(pp.x-wp.x)>20)exitShrink();}
    if(missionZones.length){const sz2=missionZones[0];const dSewer=Math.sqrt((pp.x-sz2.entryX)**2+(pp.z-sz2.entryZ)**2);if(dSewer<2&&!isInSewer&&onGround){enterSewer();pp.y=sewerFloorY+0.1;}}
    if(sewerZones.length&&isInSewer){const sv=sewerZones[0];const dExit=Math.sqrt((pp.x-sv.exitX)**2+(pp.z-sv.exitZ)**2);if(dExit<2){exitSewer();pp.y=0.1;}if(!sv.coinCollected){const dCoin=Math.sqrt((pp.x-sv.coin.position.x)**2+(pp.z-sv.coin.position.z)**2);if(dCoin<1.5){sv.coinCollected=true;sv.coin.visible=false;showToast('🪙 Pièce du tunnel!','mission');}}}

    // ── MISSIONS TOUR EIFFEL ──
    const dEiffel=Math.sqrt((pp.x-EX)**2+(pp.z-EZ)**2);
    if(dEiffel<30){
      if(pp.y>=50&&pp.y<105)completeMission('eiffel1','1er étage de la Tour Eiffel !');
      if(pp.y>=105&&pp.y<155)completeMission('eiffel2','2e étage de la Tour Eiffel !');
      if(pp.y>=155)completeMission('eiffel3','Sommet de la Tour Eiffel !');
    }

    // ── MISSION STATUE ──
    const dStatue=Math.sqrt((pp.x-SLX)**2+(pp.z-SLZ)**2);
    if(dStatue<15&&pp.y>=SL_TOP-8)completeMission('statue','Sommet de la Statue de la Liberté !');
  }

  // Avatar
  avatarGroup.scale.setScalar(isShrunk?0.35:1);
  if(!inBoat){avatarGroup.position.set(pp.x,pp.y,pp.z);avatarGroup.rotation.y=pRot;}
  else{avatarGroup.position.set(boatX,5,boatZ);avatarGroup.rotation.y=boatRot;}
  blob.position.x=pp.x;blob.position.z=pp.z;blob.position.y=isInSewer?sewerFloorY+0.02:0.012;

  // Caméra — distance augmentée en hauteur pour voir les tours
  const camDist=inBoat?20:isShrunk?3:isInSewer?4:8;
  const camH=inBoat?10:isShrunk?1:isInSewer?1.5:2.6;
  const camLookY=inBoat?4:isShrunk?.5:isInSewer?.5:1.2;
  camera.position.set(pp.x+Math.sin(cameraYaw)*camDist,pp.y+camH,pp.z+Math.cos(cameraYaw)*camDist);
  camera.lookAt(pp.x,pp.y+camLookY,pp.z);

  // Bulle
  if(bubbleEl.style.opacity!=='0'){
    _bubV.set(pp.x,pp.y+2.3,pp.z).project(camera);
    bubbleEl.style.left=((_bubV.x+1)/2*window.innerWidth)+'px';
    bubbleEl.style.top=((1-_bubV.y)/2*window.innerHeight-44)+'px';
  }

  updateMarkers();
  renderer.render(scene,camera);
}
animate();
  // Ancien : quelque chose comme   const groundY = 0;
// Nouveau :
const groundY = getFloorY(playerMesh.position.x, playerMesh.position.z, playerMesh.position.y);
checkMetroEntry();

</script>
