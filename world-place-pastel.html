<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GLB Joystick Fix</title>

<style>
body { margin: 0; overflow: hidden; background: #000; }

/* Joystick */
#joystick {
  position: absolute;
  bottom: 40px;
  left: 40px;
  width: 120px;
  height: 120px;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
  touch-action: none;
}

#knob {
  position: absolute;
  width: 60px;
  height: 60px;
  left: 30px;
  top: 30px;
  background: rgba(255,255,255,0.5);
  border-radius: 50%;
}
</style>
</head>

<body>

<div id="joystick">
  <div id="knob"></div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.165/build/three.module.js";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.165/examples/jsm/loaders/GLTFLoader.js";

/* =====================
   CONFIG GLB (CORS FIX)
===================== */
const URL_IDLE = "https://cdn.jsdelivr.net/gh/hoobasurf/chili@main/Idle.glb";
const URL_WALK = "https://cdn.jsdelivr.net/gh/hoobasurf/chili@main/Walking.glb";

/* =====================
   SCENE
===================== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.5, 3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

/* LIGHT */
const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
scene.add(light);

/* =====================
   MODEL + ANIMATIONS
===================== */
const loader = new GLTFLoader();

let mixer;
let model;
let idleAction, walkAction;
let currentAction = null;

function playAction(action) {
  if (!action || currentAction === action) return;

  if (currentAction) currentAction.stop();

  action.reset();
  action.play();

  currentAction = action;
}

/* LOAD IDLE */
loader.load(URL_IDLE, (gltf) => {
  model = gltf.scene;
  scene.add(model);

  mixer = new THREE.AnimationMixer(model);

  idleAction = mixer.clipAction(gltf.animations[0]);
  idleAction.play();
  currentAction = idleAction;
});

/* LOAD WALK */
loader.load(URL_WALK, (gltf) => {
  if (!mixer) return;
  walkAction = mixer.clipAction(gltf.animations[0]);
});

/* =====================
   JOYSTICK
===================== */
const joystick = document.getElementById("joystick");
const knob = document.getElementById("knob");

let joy = { x: 0, y: 0 };
let dragging = false;

joystick.addEventListener("touchstart", () => dragging = true);
joystick.addEventListener("touchend", () => {
  dragging = false;
  joy.x = 0;
  joy.y = 0;
  knob.style.left = "30px";
  knob.style.top = "30px";
});

joystick.addEventListener("touchmove", (e) => {
  if (!dragging) return;

  const rect = joystick.getBoundingClientRect();
  const touch = e.touches[0];

  let x = touch.clientX - rect.left - 60;
  let y = touch.clientY - rect.top - 60;

  const dist = Math.sqrt(x*x + y*y);
  const max = 40;

  if (dist > max) {
    x = x / dist * max;
    y = y / dist * max;
  }

  knob.style.left = (x + 60 - 30) + "px";
  knob.style.top = (y + 60 - 30) + "px";

  joy.x = x / max;
  joy.y = y / max;
});

/* =====================
   LOOP
===================== */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const dt = clock.getDelta();

  if (mixer) mixer.update(dt);

  if (model) {
    /* 🔥 FIX JOYSTICK */
    const mz = joy.y; // ✔️ CORRIGÉ (plus inversé)

    const speed = 2;

    if (Math.abs(mz) > 0.1) {
      model.position.z += mz * dt * speed;

      if (walkAction) playAction(walkAction);
    } else {
      if (idleAction) playAction(idleAction);
    }
  }

  renderer.render(scene, camera);
}

animate();

/* RESIZE */
window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
