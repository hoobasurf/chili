<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Macadam World — Neon City</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--pink:#FF6EB4;--mint:#3DDBB8;--yellow:#FFD747;--lav:#B388FF;--sky:#5BC8F5;}
html,body{width:100%;height:100%;overflow:hidden;background:#050814;font-family:'Nunito',sans-serif;user-select:none;-webkit-user-select:none;}
#canvas-container{position:fixed;inset:0;}
canvas{display:block;width:100%!important;height:100%!important;}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;}
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(180deg,rgba(5,8,20,.92) 0%,transparent 100%);}
.hud-logo{font-family:'Baloo 2',cursive;font-size:1.1rem;font-weight:800;color:white;text-shadow:0 0 12px rgba(0,255,255,.6);}
.hud-logo span{color:#00ffff;}
.hud-location{display:flex;align-items:center;gap:6px;background:rgba(0,255,255,.08);backdrop-filter:blur(10px);border:1px solid rgba(0,255,255,.2);border-radius:20px;padding:5px 12px;}
.hud-location span{font-size:.75rem;font-weight:800;color:#00ffcc;}
.loc-dot{width:7px;height:7px;border-radius:50%;background:#00ffcc;flex-shrink:0;animation:pulsedot 2s infinite;}
@keyframes pulsedot{0%,100%{box-shadow:0 0 0 0 rgba(0,255,200,.6);}50%{box-shadow:0 0 0 5px rgba(0,255,200,0);}}
.hud-info{display:flex;align-items:center;gap:8px;background:rgba(255,0,170,.08);backdrop-filter:blur(10px);border:1px solid rgba(255,0,170,.2);border-radius:20px;padding:5px 12px 5px 6px;}
.hud-pic{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#ff00aa,#00ffcc);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:900;color:white;border:2px solid rgba(255,255,255,.2);}
.hud-pseudo{font-size:.75rem;font-weight:800;color:white;}
.hud-chat{position:absolute;bottom:180px;left:12px;right:12px;max-width:300px;pointer-events:all;}
.chat-messages{max-height:90px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;margin-bottom:6px;scrollbar-width:none;}
.chat-messages::-webkit-scrollbar{display:none;}
.chat-msg{background:rgba(5,8,20,.88);backdrop-filter:blur(8px);border:1px solid rgba(0,255,255,.12);border-radius:10px;padding:5px 10px;font-size:.7rem;color:white;animation:fadeup .3s ease;line-height:1.4;}
@keyframes fadeup{from{opacity:0;transform:translateY(4px);}to{opacity:1;}}
.chat-msg .name{font-weight:900;color:#ff00aa;margin-right:4px;}
.chat-input-wrap{display:flex;gap:6px;}
.chat-input{flex:1;background:rgba(5,8,20,.9);backdrop-filter:blur(10px);border:1.5px solid rgba(0,255,255,.2);border-radius:12px;padding:8px 12px;font-size:16px;font-weight:700;color:white;outline:none;font-family:'Nunito',sans-serif;}
.chat-input::placeholder{color:rgba(255,255,255,.2);}
.chat-input:focus{border-color:#00ffcc;}
.chat-send{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#ff00aa,#00ffcc);border:none;color:white;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;pointer-events:all;flex-shrink:0;}
#anim-panel{position:absolute;bottom:0;left:0;right:0;pointer-events:all;padding:6px 0 10px;background:linear-gradient(0deg,rgba(5,8,20,.97) 0%,rgba(5,8,20,.7) 100%);backdrop-filter:blur(16px);border-top:1px solid rgba(0,255,255,.08);}
#anim-scroll{display:flex;flex-direction:row;gap:7px;overflow-x:auto;padding:4px 12px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
#anim-scroll::-webkit-scrollbar{display:none;}
.anim-btn{flex-shrink:0;width:68px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;pointer-events:all;-webkit-tap-highlight-color:transparent;}
.anim-icon{width:64px;height:64px;border-radius:14px;background:rgba(0,255,255,.05);border:1.5px solid rgba(0,255,255,.12);transition:all .18s;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.anim-icon svg{width:52px;height:52px;filter:drop-shadow(0 1px 6px rgba(0,255,255,.3));}
.anim-btn.active .anim-icon{background:rgba(0,255,255,.12);border-color:#00ffcc;box-shadow:0 0 14px rgba(0,255,200,.3);}
.anim-btn:active .anim-icon{transform:scale(.9);}
.anim-label{font-size:.58rem;font-weight:800;color:rgba(255,255,255,.4);text-align:center;line-height:1.1;}
.anim-btn.active .anim-label{color:#00ffcc;}
#joystick-zone{position:absolute;bottom:106px;right:16px;width:100px;height:100px;pointer-events:all;}
.joy-base{width:100px;height:100px;border-radius:50%;background:rgba(0,255,255,.04);border:1.5px solid rgba(0,255,255,.15);backdrop-filter:blur(8px);position:relative;display:flex;align-items:center;justify-content:center;}
.joy-knob{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#ff00aa,#00ffcc);box-shadow:0 0 16px rgba(0,255,200,.5);position:absolute;}
#cam-joystick-zone{position:absolute;bottom:106px;left:16px;width:100px;height:100px;pointer-events:all;}
#jump-btn{position:absolute;bottom:220px;right:22px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#00ffcc,#0088ff);border:2px solid rgba(255,255,255,.3);color:white;font-size:1.3rem;font-weight:900;pointer-events:all;cursor:pointer;box-shadow:0 0 18px rgba(0,255,200,.5);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}
.toast{position:fixed;bottom:200px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(5,8,20,.95);border:1px solid rgba(0,255,255,.2);backdrop-filter:blur(12px);color:#00ffcc;padding:8px 18px;border-radius:20px;font-size:.78rem;font-weight:800;opacity:0;transition:all .3s;z-index:50;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#speech-bubble{position:fixed;z-index:20;background:rgba(5,8,20,.95);color:#00ffcc;border:1px solid rgba(0,255,255,.3);border-radius:12px;padding:5px 11px;font-size:.72rem;font-weight:800;pointer-events:none;box-shadow:0 0 14px rgba(0,255,200,.3);max-width:160px;text-align:center;transform:translateX(-50%);opacity:0;transition:opacity .3s;white-space:nowrap;}
#speech-bubble::after{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:rgba(0,255,255,.3);border-bottom:none;}
#loading-screen{position:fixed;inset:0;z-index:100;background:#050814;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .6s;}
#loading-screen.hidden{opacity:0;pointer-events:none;}
.load-logo{font-family:'Baloo 2',cursive;font-size:2.5rem;font-weight:800;color:white;text-shadow:0 0 20px rgba(0,255,255,.8);}
.load-bar-wrap{width:200px;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;}
.load-bar{height:100%;width:0%;background:linear-gradient(90deg,#ff00aa,#00ffcc);border-radius:2px;transition:width .25s;}
.load-txt{font-size:.76rem;color:rgba(0,255,200,.5);font-weight:700;}
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="loading-screen">
  <div class="load-logo" style="color:#00ffcc">NEON<span style="color:#ff00aa">CITY</span></div>
  <div class="load-bar-wrap"><div class="load-bar" id="load-bar"></div></div>
  <div class="load-txt" id="load-txt">Initialisation de la ville…</div>
</div>
<div id="hud">
  <div class="hud-top">
    <div class="hud-logo">⬡ <span>Macadam</span> World</div>
    <div class="hud-location"><div class="loc-dot"></div><span>Neon City</span></div>
    <div class="hud-info"><div class="hud-pic" id="hud-pic">?</div><span class="hud-pseudo" id="hud-pseudo">Joueur</span></div>
  </div>
  <div class="hud-chat">
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-wrap">
      <input class="chat-input" id="chat-input" type="text" placeholder="Dis quelque chose…" maxlength="80" autocomplete="off"/>
      <button class="chat-send" id="chat-send">➤</button>
    </div>
  </div>
  <div id="joystick-zone"><div class="joy-base" id="joy-base"><div class="joy-knob" id="joy-knob"></div></div></div>
  <div id="cam-joystick-zone"><div class="joy-base" id="cam-joy-base"><div class="joy-knob" id="cam-joy-knob" style="background:linear-gradient(135deg,#3DDBB8,#5BC8F5);box-shadow:0 0 16px rgba(61,219,184,.5);"></div></div></div>
  <button id="jump-btn">↑</button>
  <div id="anim-panel"><div id="anim-scroll"></div></div>
</div>
<div id="speech-bubble"></div>
<div class="toast" id="toast"></div>

</script>

// ===== SYSTÈME DE COLLISIONS =====
// Chaque obstacle est un AABB (axis-aligned bounding box) au sol
// Format: { minX, maxX, minZ, maxZ, height }
// height = hauteur de l'obstacle en unités world (le joueur peut sauter par-dessus si playerPos.y > height)
const colliders = [];

function addCollider(cx, cz, hw, hd, height=100) {
  // cx,cz = centre, hw=demi-largeur X, hd=demi-profondeur Z
  colliders.push({ minX: cx-hw, maxX: cx+hw, minZ: cz-hd, maxZ: cz+hd, height });
}

// Rayon de collision du joueur
const PLAYER_RADIUS = 0.55;

function resolveCollision(newX, newZ, playerY) {
  // Pour chaque collider, si le joueur est dessus (en saut suffisant) on ignore
  for(const c of colliders) {
    // Si le joueur est au-dessus de l'obstacle (en saut), pas de collision horizontale
    if(playerY >= c.height) continue;

    const px = Math.max(c.minX, Math.min(c.maxX, newX));
    const pz = Math.max(c.minZ, Math.min(c.maxZ, newZ));
    const dx = newX - px;
    const dz = newZ - pz;
    const dist = Math.sqrt(dx*dx + dz*dz);

    if(dist < PLAYER_RADIUS) {
      // Repousser le joueur hors du collider
      if(dist < 0.001) {
        // Chevauchement complet — repousser vers le centre du collider
        newX += PLAYER_RADIUS;
      } else {
        const push = PLAYER_RADIUS - dist;
        newX += (dx/dist)*push;
        newZ += (dz/dist)*push;
      }
    }
  }
  return { x: newX, z: newZ };
}

// ===== BÂTIMENTS =====
function building(x,z,w,h,d,wallCol,glowCol,label=null){
  const b=new THREE.Group();
  const wall=box(w,h,d,wallCol,0.85,0.15);wall.position.y=h/2;b.add(wall);
  const neonBot=box(w+0.1,0.18,d+0.1,glowCol,0.1,0,glowCol,1.5);neonBot.position.y=0.35;b.add(neonBot);
  const neonTop=box(w+0.1,0.18,d+0.1,glowCol,0.1,0,glowCol,1.5);neonTop.position.y=h-0.1;b.add(neonTop);
  const cols=Math.max(1,Math.floor(w/2.2));
  const rows=Math.max(1,Math.floor(h/3.2));
  const winColors=[glowCol,0xffffff,0xffffcc,glowCol];
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      if(Math.random()<0.7){
        const wc=winColors[Math.floor(Math.random()*winColors.length)];
        const win=box(0.65,1.0,0.04,wc,0.1,0,wc,0.9+Math.random()*0.8);
        win.position.set(-w/2+0.8+c*(w-0.6)/(Math.max(cols-1,1)),1.5+r*3.2,d/2+0.02);b.add(win);
        const winB=win.clone();winB.position.z=-d/2-0.02;b.add(winB);
      }
    }
  }
  if(label){
    const sign=box(w*0.6,0.7,0.12,glowCol,0.1,0,glowCol,2);sign.position.set(0,h*0.4,d/2+0.08);b.add(sign);
  }
  const ant=box(0.18,2.5,0.18,0x223344,0.5,0.3);ant.position.y=h+1.25;b.add(ant);
  const antL=sph(0.18,0xff2222,0xff0000,1.5);antL.position.y=h+2.7;b.add(antL);
  b.position.set(x,0,z);scene.add(b);
  // Collider bâtiment (infranchissable)
  addCollider(x, z, w/2+0.1, d/2+0.1, 100);
  return b;
}

const avatarGroup=new THREE.Group();avatarGroup.position.set(0,0,6);scene.add(avatarGroup);
let avatarMixer=null,currentAction=null,emoteTimer=null;
const gltfLoader=new GLTFLoader();const glbCache={};

function loadGLB(url,cb){
  if(glbCache[url]){cb(glbCache[url]);return;}
  gltfLoader.load(url,gltf=>{glbCache[url]=gltf;cb(gltf);},undefined,()=>{});
}

function swapAvatar(file,loop=true,onDone=null){
  const url=BASE+file;
  loadGLB(url,gltf=>{
    while(avatarGroup.children.length)avatarGroup.remove(avatarGroup.children[0]);
    if(avatarMixer){avatarMixer.stopAllAction();avatarMixer=null;}currentAction=null;
    const model=gltf.scene;
    model.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true;}});
    const bb=new THREE.Box3().setFromObject(model);const size=new THREE.Vector3();bb.getSize(size);
    if(size.y>0)model.scale.setScalar(1.75/size.y);
    const bb2=new THREE.Box3().setFromObject(model);model.position.y=-bb2.min.y;
    avatarGroup.add(model);
    if(gltf.animations?.length){
      avatarMixer=new THREE.AnimationMixer(model);
      const action=avatarMixer.clipAction(gltf.animations[0]);
      action.setLoop(loop?THREE.LoopRepeat:THREE.LoopOnce,loop?Infinity:1);
      action.clampWhenFinished=!loop;action.play();currentAction=action;
      if(onDone)onDone(action,gltf.animations[0].duration);
    }
  });
}

swapAvatar(IDLE_FILE,true);
loadGLB(BASE+WALK_FILE,()=>{});
loadGLB(BASE+'course.glb',()=>{});

let lastWalking=false;
function setWalkSwap(walking){
  if(walking===lastWalking)return;lastWalking=walking;
  clearTimeout(emoteTimer);emoteTimer=null;
  swapAvatar(walking?WALK_FILE:IDLE_FILE,true);
}
function playEmote(file,label){
  clearTimeout(emoteTimer);emoteTimer=null;
  swapAvatar(file,false,(action,duration)=>{
    showToast('▶ '+label);
    emoteTimer=setTimeout(()=>{emoteTimer=null;lastWalking=false;swapAvatar(IDLE_FILE,true);},duration*1000+300);
  });
}

// ===== PANNEAU ANIMATIONS =====
const animScroll=document.getElementById('anim-scroll');
let activeBtn=null;
ANIMS.forEach((anim,i)=>{
  const svgStr=SVG[anim.svg]||SVG.idle;
  const col=anim.col||'#00ffcc';
  const colored=svgStr.replace(/stroke="#00ffcc"/g,`stroke="${col}"`);
  const btn=document.createElement('div');btn.className='anim-btn';
  if(i===0)btn.classList.add('active');
  btn.innerHTML=`<div class="anim-icon" style="${i===0?`border-color:${col};box-shadow:0 0 12px ${col}44`:''}"><svg viewBox="0 0 56 72" xmlns="http://www.w3.org/2000/svg">${colored}</svg></div><span class="anim-label">${anim.label}</span>`;
  btn.addEventListener('click',()=>{
    if(activeBtn){activeBtn.classList.remove('active');activeBtn.querySelector('.anim-icon').style.cssText='';}
    btn.classList.add('active');btn.querySelector('.anim-icon').style.cssText=`border-color:${col};box-shadow:0 0 14px ${col}55`;activeBtn=btn;
    if(anim.file===IDLE_FILE){clearTimeout(emoteTimer);emoteTimer=null;lastWalking=false;swapAvatar(IDLE_FILE,true);showToast('🧍 '+anim.label);}
    else if(anim.file===WALK_FILE){clearTimeout(emoteTimer);emoteTimer=null;lastWalking=true;swapAvatar(WALK_FILE,true);showToast('🚶 '+anim.label);}
    else{lastWalking=false;playEmote(anim.file,anim.label);}
  });
  animScroll.appendChild(btn);if(i===0)activeBtn=btn;
});

// ===== JOYSTICK DROIT =====
const joyBase=document.getElementById('joy-base'),joyKnob=document.getElementById('joy-knob');
const JR=40;const joy={active:false,x:0,y:0,id:null};
function getJC(){const r=joyBase.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
function updateJoy(cx,cy){const c=getJC();let dx=cx-c.x,dy=cy-c.y;const d=Math.sqrt(dx*dx+dy*dy);if(d>JR){dx=dx/d*JR;dy=dy/d*JR;}joy.x=dx/JR;joy.y=dy/JR;joyKnob.style.transform=`translate(${dx}px,${dy}px)`;}
joyBase.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];joy.active=true;joy.id=t.identifier;updateJoy(t.clientX,t.clientY);},{passive:false});
document.addEventListener('touchmove',e=>{if(!joy.active)return;for(const t of e.changedTouches)if(t.identifier===joy.id){e.preventDefault();updateJoy(t.clientX,t.clientY);}},{passive:false});
document.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===joy.id){joy.active=false;joy.x=0;joy.y=0;joyKnob.style.transform='translate(0,0)';}});

// ===== JOYSTICK GAUCHE (caméra) =====
const camBase=document.getElementById('cam-joy-base'),camKnob=document.getElementById('cam-joy-knob');
const CAMJR=40;const camJoy={active:false,x:0,id:null};
function getCamC(){const r=camBase.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
function updateCamJoy(cx,cy){const c=getCamC();let dx=cx-c.x,dy=cy-c.y;const d=Math.sqrt(dx*dx+dy*dy);if(d>CAMJR){dx=dx/d*CAMJR;dy=dy/d*CAMJR;}camJoy.x=dx/CAMJR;camKnob.style.transform=`translate(${dx}px,${dy}px)`;}
camBase.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];camJoy.active=true;camJoy.id=t.identifier;updateCamJoy(t.clientX,t.clientY);},{passive:false});
document.addEventListener('touchmove',e=>{if(!camJoy.active)return;for(const t of e.changedTouches)if(t.identifier===camJoy.id){e.preventDefault();updateCamJoy(t.clientX,t.clientY);}},{passive:false});
document.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===camJoy.id){camJoy.active=false;camJoy.x=0;camKnob.style.transform='translate(0,0)';}});

let mDrag={active:false,lastX:0};
renderer.domElement.addEventListener('mousedown',e=>{mDrag.active=true;mDrag.lastX=e.clientX;});
document.addEventListener('mousemove',e=>{if(!mDrag.active)return;cameraYaw-=(e.clientX-mDrag.lastX)*0.005;mDrag.lastX=e.clientX;});
document.addEventListener('mouseup',()=>mDrag.active=false);
const keys={};
document.addEventListener('keydown',e=>keys[e.key]=true);
document.addEventListener('keyup',e=>keys[e.key]=false);

// ===== SAUT AMÉLIORÉ =====
// Saut simple  : ~1 étage (~2.5 unités)
// Double tap   : ~4 étages (~12 unités) — passe par-dessus les voitures
const JUMP_V_NORMAL = 8;
const JUMP_V_SUPER  = 19;   // 4 étages
const GRAVITY = 26;
let jumpVel=0, isOnGround=true;
let jumpLastTap=0;

function doJump(){
  if(!isOnGround) return;
  const now=Date.now();
  const isDouble = (now - jumpLastTap) < 350;
  jumpLastTap = now;
  if(isDouble){
    jumpVel = JUMP_V_SUPER;
    isOnGround = false;
    showToast('🚀 SUPER SAUT ! (4 étages)');
  } else {
    jumpVel = JUMP_V_NORMAL;
    isOnGround = false;
  }
}

const jumpBtn=document.getElementById('jump-btn');
jumpBtn.addEventListener('touchstart',e=>{e.preventDefault();doJump();},{passive:false});
jumpBtn.addEventListener('click',()=>doJump());

// ===== CHAT =====
const bubbleEl=document.getElementById('speech-bubble');let bubbleTimer2=null;
function showBubble(t){bubbleEl.textContent=t;bubbleEl.style.opacity='1';clearTimeout(bubbleTimer2);bubbleTimer2=setTimeout(()=>bubbleEl.style.opacity='0',4000);}
function updateBubblePos(){if(bubbleEl.style.opacity==='0')return;const pos=new THREE.Vector3(playerPos.x,playerPos.y+2.3,playerPos.z).project(camera);bubbleEl.style.left=((pos.x+1)/2*window.innerWidth)+'px';bubbleEl.style.top=((1-pos.y)/2*window.innerHeight-44)+'px';}
function addChat(text,from){const msgs=document.getElementById('chat-messages');const div=document.createElement('div');div.className='chat-msg';div.innerHTML=`<span class="name">${from}</span>${text}`;msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;while(msgs.children.length>20)msgs.removeChild(msgs.firstChild);}
function sendChat(){const inp=document.getElementById('chat-input');const msg=inp.value.trim();if(!msg)return;inp.value='';addChat(msg,profile.pseudo);showBubble(msg);}
document.getElementById('chat-send').addEventListener('click',sendChat);
document.getElementById('chat-input').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendChat();}});
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

// ===== BOUCLE PRINCIPALE =====
const SPEED=5.5,BOUNDARY=54;
const playerPos=new THREE.Vector3(0,0,6);
let playerRotY=0,cameraYaw=Math.PI;
const CAM_DIST=7,CAM_HEIGHT=2.4,CAM_LOOK_Y=1.1,CAM_LERP=4;
const clock=new THREE.Clock();
let holoAngle=0;
finishLoading();

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.08);
  if(avatarMixer)avatarMixer.update(dt);

  // Rotation hologrammes
  holoAngle+=dt*0.6;
  holoMeshes.forEach((h,i)=>{ h.rotation.y=holoAngle+(i*Math.PI*0.4); });

  let mx=joy.x,mz=-joy.y;
  if(keys['ArrowUp']  ||keys['w']||keys['W'])mz= 1;
  if(keys['ArrowDown']||keys['s']||keys['S'])mz=-1;
  if(keys['ArrowLeft']||keys['a']||keys['A'])mx=-1;
  if(keys['ArrowRight']||keys['d']||keys['D'])mx= 1;
  if(keys[' ']&&isOnGround){doJump();}
  if(camJoy.active&&Math.abs(camJoy.x)>0.04)cameraYaw-=camJoy.x*2.2*dt;
  if(keys['q']||keys['Q'])cameraYaw+=1.8*dt;
  if(keys['e']||keys['E'])cameraYaw-=1.8*dt;

  const moving=Math.abs(mx)>0.05||Math.abs(mz)>0.05;
  if(moving&&emoteTimer){clearTimeout(emoteTimer);emoteTimer=null;}
  if(isOnGround)setWalkSwap(moving);

  if(moving){
    const sinC=Math.sin(cameraYaw),cosC=Math.cos(cameraYaw);
    const dx=(sinC*(-mz)+cosC*mx)*SPEED*dt;
    const dz=(cosC*(-mz)-sinC*mx)*SPEED*dt;

    // Appliquer déplacement et résoudre les collisions
    let newX = playerPos.x + dx;
    let newZ = playerPos.z + dz;

    // Collision resolution — plusieurs passes pour coins
    const resolved = resolveCollision(newX, newZ, playerPos.y);
    newX = resolved.x;
    newZ = resolved.z;

    playerPos.x = Math.max(-BOUNDARY, Math.min(BOUNDARY, newX));
    playerPos.z = Math.max(-BOUNDARY, Math.min(BOUNDARY, newZ));
    playerRotY=Math.atan2(dx,dz);
    const tY=playerRotY+Math.PI;let diff=tY-cameraYaw;
    while(diff>Math.PI)diff-=2*Math.PI;while(diff<-Math.PI)diff+=2*Math.PI;
    cameraYaw+=diff*Math.min(CAM_LERP*dt,1.0);
  }

  // Gravité
  if(!isOnGround){
    jumpVel-=GRAVITY*dt;playerPos.y+=jumpVel*dt;
    if(playerPos.y<=0){playerPos.y=0;jumpVel=0;isOnGround=true;setWalkSwap(moving);}
  }

  avatarGroup.position.set(playerPos.x,playerPos.y,playerPos.z);
  avatarGroup.rotation.y=playerRotY;
  shadowBlob.position.x=playerPos.x;shadowBlob.position.z=playerPos.z;

  // Mise à jour lumière personnelle du joueur
  playerSpot.position.set(playerPos.x, playerPos.y + 9, playerPos.z + 1);
  playerSpot.target.position.set(playerPos.x, playerPos.y, playerPos.z);
  playerSpot.target.updateMatrixWorld();
  playerGlow.position.x = playerPos.x;
  playerGlow.position.z = playerPos.z;
  // Halo s'intensifie légèrement en saut
  playerGlowMat.opacity = isOnGround ? 0.18 : 0.08;

  camera.position.set(playerPos.x+Math.sin(cameraYaw)*CAM_DIST,playerPos.y+CAM_HEIGHT,playerPos.z+Math.cos(cameraYaw)*CAM_DIST);
  camera.lookAt(playerPos.x,playerPos.y+CAM_LOOK_Y,playerPos.z);
  updateBubblePos();
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
