<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Macadam World — Tokyo</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--gold:#f5c842;--orange:#e85d26;--green:#2ecc71;--ui-bg:rgba(10,15,25,0.82);}
html,body{width:100%;height:100%;overflow:hidden;background:#8ab4d4;font-family:'M PLUS Rounded 1c',sans-serif;user-select:none;-webkit-user-select:none;}
#canvas-container{position:fixed;inset:0;}
canvas{display:block;width:100%!important;height:100%!important;}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;}
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,transparent 100%);}
.hud-logo{font-family:'Zen Kaku Gothic New',sans-serif;font-size:.9rem;font-weight:900;color:#fff;letter-spacing:.05em;}
.hud-logo em{color:var(--gold);font-style:normal;}
.hud-loc{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.38);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:4px 10px;}
.hud-loc span{font-size:.65rem;font-weight:700;color:#fff;}
.loc-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);}
.hud-info{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.38);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:4px 10px 4px 4px;}
.hud-pic{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--gold));display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:900;color:#fff;}
.hud-name{font-size:.65rem;font-weight:700;color:#fff;}
#minimap{position:absolute;top:52px;left:10px;width:120px;height:120px;border-radius:12px;background:var(--ui-bg);border:1.5px solid rgba(255,255,255,.18);overflow:hidden;pointer-events:none;}
#minimap canvas{width:120px;height:120px;}
.minimap-label{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:.45rem;font-weight:700;color:rgba(255,255,255,.5);}
#mission-panel{position:absolute;top:52px;right:10px;width:170px;pointer-events:all;}
.mission-header{background:var(--ui-bg);backdrop-filter:blur(8px);border:1.5px solid rgba(245,200,66,.3);border-radius:10px 10px 0 0;padding:5px 10px;display:flex;align-items:center;gap:6px;}
.mission-header span{font-size:.65rem;font-weight:900;color:var(--gold);}
.mission-list{background:rgba(5,10,20,.88);backdrop-filter:blur(8px);border:1.5px solid rgba(255,255,255,.1);border-top:none;border-radius:0 0 10px 10px;padding:4px 0;}
.mission-item{padding:5px 10px;cursor:pointer;transition:background .15s;}
.mission-item:hover{background:rgba(245,200,66,.08);}
.mission-item.active{background:rgba(245,200,66,.12);}
.mission-title{font-size:.62rem;font-weight:700;color:#fff;}
.mission-desc{font-size:.52rem;color:rgba(255,255,255,.45);margin-top:1px;}
.mission-item .badge{display:inline-block;font-size:.45rem;font-weight:900;padding:1px 5px;border-radius:6px;margin-bottom:2px;}
.badge-new{background:var(--orange);color:#fff;}
.badge-active{background:var(--gold);color:#1a1a00;}
.badge-done{background:#2ecc71;color:#fff;}
.hud-chat{position:absolute;bottom:170px;left:12px;width:220px;pointer-events:all;}
.chat-messages{max-height:75px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;margin-bottom:4px;scrollbar-width:none;}
.chat-messages::-webkit-scrollbar{display:none;}
.chat-msg{background:rgba(0,0,0,.5);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:4px 10px;font-size:.62rem;color:#fff;line-height:1.3;}
.chat-msg .name{font-weight:900;color:var(--gold);margin-right:4px;}
.chat-input-wrap{display:flex;gap:5px;}
.chat-input{flex:1;background:rgba(0,0,0,.5);border:1.5px solid rgba(255,255,255,.2);border-radius:20px;padding:7px 13px;font-size:14px;font-weight:700;color:#fff;outline:none;font-family:'M PLUS Rounded 1c',sans-serif;}
.chat-input::placeholder{color:rgba(255,255,255,.35);}
.chat-input:focus{border-color:var(--gold);}
.chat-send{width:36px;height:36px;border-radius:50%;background:var(--orange);border:none;color:#fff;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;pointer-events:all;flex-shrink:0;}
#anim-panel{position:absolute;bottom:0;left:0;right:0;pointer-events:all;padding:4px 0 8px;background:linear-gradient(0deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,.5) 100%);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.08);height:80px;}
#anim-scroll{display:flex;gap:5px;overflow-x:auto;padding:2px 10px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
#anim-scroll::-webkit-scrollbar{display:none;}
.anim-btn{flex-shrink:0;width:56px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.anim-icon{width:54px;height:54px;border-radius:10px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;transition:all .15s;}
.anim-icon svg{width:44px;height:44px;}
.anim-btn.active .anim-icon{background:rgba(245,200,66,.12);border-color:var(--gold);}
.anim-btn:active .anim-icon{transform:scale(.88);}
.anim-label{font-size:.48rem;font-weight:700;color:rgba(255,255,255,.4);text-align:center;}
.anim-btn.active .anim-label{color:var(--gold);}
#joystick-zone{position:absolute;bottom:90px;right:12px;width:96px;height:96px;pointer-events:all;}
#cam-joystick-zone{position:absolute;bottom:90px;left:12px;width:96px;height:96px;pointer-events:all;}
.joy-base{width:96px;height:96px;border-radius:50%;background:rgba(0,0,0,.22);border:1.5px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);position:relative;display:flex;align-items:center;justify-content:center;}
.joy-knob{width:38px;height:38px;border-radius:50%;position:absolute;box-shadow:0 2px 10px rgba(0,0,0,.4);}
#jump-btn{position:absolute;bottom:138px;right:52px;width:46px;height:46px;border-radius:50%;background:#2b6cb0;border:none;color:#fff;font-size:1.2rem;pointer-events:all;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;z-index:12;}
#super-jump-btn{position:absolute;bottom:138px;left:52px;width:46px;height:46px;border-radius:50%;background:var(--orange);border:none;color:#fff;font-size:.95rem;pointer-events:all;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;z-index:12;}
.toast{position:fixed;bottom:188px;left:50%;transform:translateX(-50%) translateY(14px);background:rgba(0,0,0,.88);color:var(--gold);padding:6px 14px;border-radius:16px;font-size:.68rem;font-weight:700;opacity:0;transition:all .25s;z-index:50;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#loading-screen{position:fixed;inset:0;z-index:200;background:#b0c8e8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s;}
#loading-screen.hidden{opacity:0;pointer-events:none;}
.load-logo{font-family:'Zen Kaku Gothic New',sans-serif;font-size:2.2rem;font-weight:900;color:#1a2a40;letter-spacing:.06em;}
.load-logo em{color:var(--orange);font-style:normal;}
.load-kanji{font-size:.9rem;color:rgba(26,42,64,.6);letter-spacing:.25em;}
.load-bar-wrap{width:180px;height:3px;background:rgba(0,0,0,.12);border-radius:2px;overflow:hidden;}
.load-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--orange),var(--gold));border-radius:2px;transition:width .2s;}
.load-txt{font-size:.68rem;color:rgba(26,42,64,.6);font-weight:700;}
#mission-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.8);background:var(--ui-bg);border:2px solid var(--gold);border-radius:16px;padding:18px 22px;z-index:100;pointer-events:all;min-width:240px;opacity:0;transition:all .3s;display:none;}
#mission-popup.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
.mp-title{font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:900;color:var(--gold);margin-bottom:6px;}
.mp-desc{font-size:.72rem;color:rgba(255,255,255,.8);line-height:1.5;margin-bottom:12px;}
.mp-btn{background:var(--orange);color:#fff;border:none;border-radius:20px;padding:7px 18px;font-size:.72rem;font-weight:700;cursor:pointer;font-family:'M PLUS Rounded 1c',sans-serif;}
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="loading-screen">
  <div class="load-logo">TOKYO<em>東京</em></div>
  <div class="load-kanji">MACADAM WORLD</div>
  <div class="load-bar-wrap"><div class="load-bar" id="load-bar"></div></div>
  <div class="load-txt" id="load-txt">Génération du monde…</div>
</div>
<div id="hud">
  <div class="hud-top">
    <div class="hud-logo">⬡ <em>Macadam</em> World</div>
    <div class="hud-loc"><div class="loc-dot"></div><span id="zone-name">東京 Shinjuku</span></div>
    <div class="hud-info"><div class="hud-pic" id="hud-pic">?</div><span class="hud-name" id="hud-pseudo">Joueur</span></div>
  </div>
  <div id="minimap">
    <canvas id="minimap-canvas" width="120" height="120"></canvas>
    <div class="minimap-label">▲ NORD</div>
  </div>
  <div id="mission-panel">
    <div class="mission-header">🎯 <span>MISSIONS</span></div>
    <div class="mission-list" id="mission-list"></div>
  </div>
  <div class="hud-chat">
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-wrap">
      <input class="chat-input" id="chat-input" type="text" placeholder="Dis quelque chose…" maxlength="80" autocomplete="off"/>
      <button class="chat-send" id="chat-send">▶</button>
    </div>
  </div>
  <div id="cam-joystick-zone"><div class="joy-base" id="cam-joy-base"><div class="joy-knob" id="cam-joy-knob" style="background:linear-gradient(135deg,#f5c842,#e85d26);"></div></div></div>
  <button id="super-jump-btn">🚀</button>
  <button id="jump-btn">↑</button>
  <div id="joystick-zone"><div class="joy-base" id="joy-base"><div class="joy-knob" id="joy-knob" style="background:linear-gradient(135deg,#dddddd,#aaaaaa);"></div></div></div>
  <div id="anim-panel"><div id="anim-scroll"></div></div>
</div>
<div class="toast" id="toast"></div>
<div id="mission-popup">
  <div class="mp-title" id="mp-title"></div>
  <div class="mp-desc" id="mp-desc"></div>
  <button class="mp-btn" id="mp-accept">Accepter la mission !</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/loaders/GLTFLoader.js';

// ── CONFIG ────────────────────────────────────────────────
const BASE = 'https://raw.githubusercontent.com/hoobasurf/chili/main/';
const WALK_FILE = 'course.glb';
const IDLE_FILE = 'attend.glb';

const CAR_COLORS = [0x1a2540, 0xcc2222, 0xf0f0f0, 0x1a3a1a, 0xd4a020, 0x222244, 0x882222, 0xeeeeee];

// ── ANIMS PANEL ───────────────────────────────────────────
const ANIMS = [
  {label:'Attend',file:'attend.glb',svg:'idle'},{label:'Course',file:'course.glb',svg:'run'},
  {label:'Marche',file:'marche%20discrete.glb',svg:'walk'},{label:'Danse 1',file:'danse1.glb',svg:'dance1'},
  {label:'Danse 2',file:'danse2.glb',svg:'dance2'},{label:'Danse 3',file:'danse3.glb',svg:'dance3'},
  {label:'Coup poing',file:'coup%20de%20poing.glb',svg:'punch'},{label:'Saut',file:'saut%20guerrier.glb',svg:'jump'},
  {label:'King Kong',file:'king%20kong.glb',svg:'victory'},{label:'Salto',file:'salto%20avant.glb',svg:'flip'},
  {label:'Foot',file:'foot.glb',svg:'kick'},{label:'Esquive',file:'esquive.glb',svg:'dodge'},
  {label:'Pompe',file:'pompe.glb',svg:'crouch'},{label:'Maestro',file:'maestro.glb',svg:'wave'},
  {label:'Costaud',file:'costaud.glb',svg:'flex'},{label:'Enerver',file:'enerver.glb',svg:'punch'},
];
const C='#f5c842';
const SVG={
  idle:`<circle cx="28" cy="9" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><line x1="28" y1="15" x2="28" y2="46" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="28" y1="24" x2="16" y2="36" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="28" y1="24" x2="40" y2="36" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="26" y1="46" x2="20" y2="66" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="30" y1="46" x2="36" y2="66" stroke="${C}" stroke-width="3" stroke-linecap="round"/>`,
  run:`<circle cx="32" cy="7" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><path d="M31 13 Q28 26 26 42" stroke="${C}" stroke-width="3" fill="none" stroke-linecap="round"/><line x1="29" y1="19" x2="10" y2="22" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="29" y1="19" x2="48" y2="14" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="26" y1="42" x2="10" y2="56" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="26" y1="42" x2="44" y2="64" stroke="${C}" stroke-width="3" stroke-linecap="round"/>`,
  walk:`<circle cx="28" cy="8" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><path d="M28 14 Q26 28 25 44" stroke="${C}" stroke-width="3" fill="none" stroke-linecap="round"/><line x1="26" y1="22" x2="12" y2="30" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="26" y1="22" x2="40" y2="18" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="25" y1="44" x2="12" y2="62" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="25" y1="44" x2="38" y2="58" stroke="${C}" stroke-width="3" stroke-linecap="round"/>`,
  dance1:`<circle cx="28" cy="9" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><path d="M28 15 Q32 28 30 44" stroke="${C}" stroke-width="3" fill="none" stroke-linecap="round"/><line x1="29" y1="20" x2="8" y2="12" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="29" y1="20" x2="48" y2="26" stroke="${C}" stroke-width="3" stroke-linecap="round"/>`,
  dance2:`<circle cx="28" cy="9" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><path d="M28 15 Q24 28 26 44" stroke="${C}" stroke-width="3" fill="none" stroke-linecap="round"/><line x1="27" y1="22" x2="46" y2="18" stroke="${C}" stroke-width="3" stroke-linecap="round"/>`,
  dance3:`<circle cx="28" cy="9" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><line x1="28" y1="15" x2="28" y2="44" stroke="${C}" stroke-width="3" stroke-linecap="round"/><path d="M28 20 Q14 10 8 18" stroke="${C}" stroke-width="3" fill="none" stroke-linecap="round"/>`,
  punch:`<circle cx="26" cy="9" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><line x1="26" y1="15" x2="24" y2="44" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="25" y1="22" x2="52" y2="16" stroke="${C}" stroke-width="3.5" stroke-linecap="round"/>`,
  kick:`<circle cx="28" cy="9" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><line x1="28" y1="15" x2="26" y2="42" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="26" y1="42" x2="54" y2="34" stroke="${C}" stroke-width="3.5" stroke-linecap="round"/>`,
  jump:`<circle cx="28" cy="6" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><line x1="28" y1="12" x2="28" y2="38" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="28" y1="18" x2="12" y2="12" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="28" y1="18" x2="44" y2="12" stroke="${C}" stroke-width="3" stroke-linecap="round"/>`,
  victory:`<circle cx="28" cy="9" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><line x1="28" y1="15" x2="28" y2="46" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="28" y1="22" x2="10" y2="6" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="28" y1="22" x2="46" y2="6" stroke="${C}" stroke-width="3" stroke-linecap="round"/>`,
  flip:`<circle cx="38" cy="12" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><path d="M35 16 Q24 20 20 32 Q16 44 24 52 Q32 60 40 54" stroke="${C}" stroke-width="3" fill="none" stroke-linecap="round"/>`,
  dodge:`<circle cx="38" cy="13" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><path d="M36 19 Q28 32 24 46" stroke="${C}" stroke-width="3" fill="none" stroke-linecap="round"/>`,
  crouch:`<circle cx="28" cy="16" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><line x1="28" y1="22" x2="28" y2="38" stroke="${C}" stroke-width="3" stroke-linecap="round"/>`,
  wave:`<circle cx="28" cy="9" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><line x1="28" y1="15" x2="28" y2="48" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="28" y1="20" x2="48" y2="6" stroke="${C}" stroke-width="3" stroke-linecap="round"/>`,
  flex:`<circle cx="28" cy="8" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><line x1="28" y1="14" x2="28" y2="44" stroke="${C}" stroke-width="3" stroke-linecap="round"/><path d="M28 22 Q18 14 8 20" stroke="${C}" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="6" cy="20" r="5" stroke="${C}" stroke-width="2" fill="none"/>`,
};

// ── MISSIONS ──────────────────────────────────────────────
const MISSIONS = [
  {id:'m1',title:'Explorateur urbain',desc:'Explore les 4 quartiers de Tokyo',badge:'new',done:false,progress:0,total:4},
  {id:'m2',title:'Bouche d\'égout',desc:'Trouve et descends dans les souterrains',badge:'new',done:false,progress:0,total:1},
  {id:'m3',title:'Central Park',desc:'Atteins le Central Park et repose-toi',badge:'new',done:false,progress:0,total:1},
  {id:'m4',title:'Noctambule',desc:'Visite un izakaya (repère le panneau)',badge:'new',done:false,progress:0,total:1},
  {id:'m5',title:'Photographe',desc:'Danse devant 3 bâtiments différents',badge:'new',done:false,progress:0,total:3},
];
let activeMission = null;

function renderMissions(){
  const list = document.getElementById('mission-list');
  list.innerHTML = '';
  MISSIONS.forEach(m => {
    const d = document.createElement('div');
    d.className = 'mission-item' + (activeMission===m.id?' active':'');
    d.innerHTML = `<span class="badge badge-${m.done?'done':m.badge}">${m.done?'✓':m.badge==='active'?'►':'!'}</span>
    <div class="mission-title">${m.title}</div>
    <div class="mission-desc">${m.done?'Terminée ✓':`${m.progress}/${m.total} — ${m.desc}`}</div>`;
    d.addEventListener('click', () => showMissionPopup(m));
    list.appendChild(d);
  });
}
function showMissionPopup(m){
  const popup = document.getElementById('mission-popup');
  document.getElementById('mp-title').textContent = m.title;
  document.getElementById('mp-desc').textContent = m.desc + (m.done?' (Terminée !)':'');
  popup.style.display = 'block';
  requestAnimationFrame(()=>popup.classList.add('show'));
  document.getElementById('mp-accept').onclick = () => {
    activeMission = m.id; m.badge = 'active'; renderMissions();
    popup.classList.remove('show');
    setTimeout(()=>popup.style.display='none',300);
    showToast('Mission activée : ' + m.title);
  };
}
document.getElementById('mission-popup').addEventListener('click', e => {
  if(e.target === document.getElementById('mission-popup')){
    document.getElementById('mission-popup').classList.remove('show');
    setTimeout(()=>document.getElementById('mission-popup').style.display='none',300);
  }
});
renderMissions();

// ── PROFIL ────────────────────────────────────────────────
function loadProfile(){
  try{
    const uid = localStorage.getItem('macadam_user_id')||('p_'+Math.random().toString(36).slice(2,8));
    localStorage.setItem('macadam_user_id',uid);
    const s = JSON.parse(localStorage.getItem('macadam_avatar_'+uid)||'null');
    return {pseudo:s?.pseudo||'Joueur'};
  }catch(e){return {pseudo:'Joueur'};}
}
const profile = loadProfile();
document.getElementById('hud-pseudo').textContent = profile.pseudo;
document.getElementById('hud-pic').textContent = profile.pseudo.slice(0,2).toUpperCase();

// ── LOADING ───────────────────────────────────────────────
let ldPct = 0;
const ldBar = document.getElementById('load-bar'), ldTxt = document.getElementById('load-txt');
const ldMsgs = ['Génération des rues…','Construction des quartiers…','Pose du béton…','Placement des véhicules…','Presque prêt…'];
let ldIdx = 0;
let loadingDone = false;

const ldInt = setInterval(()=>{
  ldPct += Math.random()*5;
  if(ldPct>88){ldPct=88;clearInterval(ldInt);}
  ldBar.style.width = ldPct+'%';

  const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}

const colliders = [];
function addCol(cx,cz,hw,hd,mH=200){colliders.push({minX:cx-hw,maxX:cx+hw,minZ:cz-hd,maxZ:cz+hd,mH});}
const PR = 0.55;
function resolveCollisions(nx,nz,py,cols){
  for(const c of cols){
    if(py>=(c.mH||200))continue;
    const px=Math.max(c.minX,Math.min(c.maxX,nx));
    const pz=Math.max(c.minZ,Math.min(c.maxZ,nz));
    const dx=nx-px,dz=nz-pz,d=Math.sqrt(dx*dx+dz*dz);
    if(d<PR){if(d<0.001){nx+=PR;}else{const p=PR-d;nx+=(dx/d)*p;nz+=(dz/d)*p;}}
  }
  return{x:nx,z:nz};
}

function makeBuilding(x,z,w,h,d,styleIdx=0){
  const wallTex = styleIdx<4 ? bricks[styleIdx] : concBuildTex;
  const wallColor = styleIdx<4 ? 0xcccccc : (styleIdx===4?0xccc8c0:0xbec0c4);
  const wallMat = new THREE.MeshStandardMaterial({map:wallTex,roughness:0.85,color:wallColor});
  const body = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),wallMat);
  body.castShadow=true; body.receiveShadow=true; body.position.set(x,h/2,z); scene.add(body);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(w+0.2,0.4,d+0.2),matRoof);
  roof.position.set(x,h+0.2,z); scene.add(roof);
  const wCols=Math.max(1,Math.floor(w/3));
  const wRows=Math.max(1,Math.floor(h/3.8));
  const winMat = new THREE.MeshStandardMaterial({map:winTextures[Math.abs(styleIdx)%3],roughness:0.2,metalness:0.6,color:0xaaccee});
  for(let r=0;r<wRows;r++)for(let c=0;c<wCols;c++){
    const wx=-w/2+1.2+c*(w-1.4)/(Math.max(wCols-1,1));
    const wy=1.8+r*3.6;
    const wf=new THREE.Mesh(new THREE.BoxGeometry(1.0,1.4,0.06),winMat);
    wf.position.set(x+wx,wy,z+d/2+0.04); scene.add(wf);
  }
  const signMat = new THREE.MeshStandardMaterial({map:signTextures[Math.abs(Math.round(x*0.3+z*0.7))%signTextures.length],roughness:0.6});
  const sw=Math.min(w*0.6,4.5),sh=sw*1.2;
  const sign = new THREE.Mesh(new THREE.BoxGeometry(sw,sh,0.1),signMat);
  sign.position.set(x,Math.min(4.5,h*0.4),z+d/2+0.08); scene.add(sign);
  addCol(x,z,w/2+0.1,d/2+0.1);
}

// UNE SEULE déclaration de loadAnim
function loadAnim(file,cb){
  if(animCache[file]){cb(animCache[file]);return;}
  loader.load(
    BASE+file,
    (glb)=>{animCache[file]=glb;cb(glb);},
    undefined,
    (e)=>{
      console.warn('GLB fail',file,e);
      finishLoading(); // filet de sécurité
    }
  );
}

function playAnim(file){
  loadAnim(file,(glb)=>{
    if(!playerModel){
      playerModel=glb.scene;
      playerModel.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true;}});
      scene.add(playerModel);
    }
    if(playerMixer&&currentAction)currentAction.stop();
    playerMixer=new THREE.AnimationMixer(playerModel);
    if(glb.animations.length>0){
      currentAction=playerMixer.clipAction(glb.animations[0]);
      currentAction.play();
    }
  });
}

const joyState={x:0,z:0,active:false,id:-1};
const camJoyState={x:0,y:0,active:false,id:-1};
const joyBase=document.getElementById('joy-base');
const joyKnob=document.getElementById('joy-knob');
const camJoyBase=document.getElementById('cam-joy-base');
const camJoyKnob=document.getElementById('cam-joy-knob');
const JR=42;
function joyInput(e,base,knob,state,isCam){
  e.preventDefault();
  const touches=e.changedTouches;
  for(let i=0;i<touches.length;i++){
    const t=touches[i];
    if(e.type==='touchstart'){
      const r=base.getBoundingClientRect();
      const cx=r.left+r.width/2,cy=r.top+r.height/2;
      const dx=t.clientX-cx,dy=t.clientY-cy;
      if(Math.sqrt(dx*dx+dy*dy)<r.width/2){state.active=true;state.id=t.identifier;}
    }
    if(state.active&&t.identifier===state.id){
      const r=base.getBoundingClientRect();
      const cx=r.left+r.width/2,cy=r.top+r.height/2;
      let dx=t.clientX-cx,dy=t.clientY-cy;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist>JR){dx*=JR/dist;dy*=JR/dist;}
      knob.style.transform=`translate(${dx}px,${dy}px)`;
      if(isCam){state.x=dx/JR;state.y=dy/JR;}else{state.x=dx/JR;state.z=dy/JR;}
    }
    if((e.type==='touchend'||e.type==='touchcancel')&&t.identifier===state.id){
      state.active=false;state.id=-1;state.x=0;state.z=0;state.y=0;
      knob.style.transform='translate(0,0)';
    }
  }
}
['touchstart','touchmove','touchend','touchcancel'].forEach(ev=>{
  joyBase.addEventListener(ev,e=>joyInput(e,joyBase,joyKnob,joyState,false),{passive:false});
  camJoyBase.addEventListener(ev,e=>joyInput(e,camJoyBase,camJoyKnob,camJoyState,true),{passive:false});
});

function updateMovingCars(dt){
  movingCars.forEach(car=>{
    car.t+=(car.speed*dt)/car.len;if(car.t>1)car.t-=1;
    const s=car.route[0],e=car.route[car.route.length-1];
    car.group.position.x=s.x+(e.x-s.x)*car.t;car.group.position.z=s.z+(e.z-s.z)*car.t;
    car.wheels.forEach(w=>w.rotation.x+=car.speed*dt*2);
  });

function updateNPCs(dt){
  npcs.forEach(npc=>{
    if(npc.group.position.y<-0.3)return;
    npc.turnTimer-=dt;
    if(npc.turnTimer<0){
      npc.turnTimer=1.5+Math.random()*3;
      const a=Math.random()*Math.PI*2,sp=0.5+Math.random()*1.0;
      npc.vx=Math.cos(a)*sp*0.016;npc.vz=Math.sin(a)*sp*0.016;
    }
    const nx=npc.group.position.x+npc.vx,nz=npc.group.position.z+npc.vz;
    const dx=nx-npc.startX,dz=nz-npc.startZ;
    if(Math.sqrt(dx*dx+dz*dz)>NPC_WANDER_RADIUS){npc.vx=-npc.vx;npc.vz=-npc.vz;}
    else{npc.group.position.x=nx;npc.group.position.z=nz;}
    npc.group.rotation.y=Math.atan2(npc.vx,npc.vz);
    npc.phase+=dt*4;const sw=Math.sin(npc.phase)*0.25;
    npc.legL.rotation.x=sw;npc.legR.rotation.x=-sw;
    npc.armL.rotation.x=-sw*0.6;npc.armR.rotation.x=sw*0.6;
  });
}
function updatePlayer(dt){
  let dx=0,dz=0;
  const run=keys['ShiftLeft']||keys['ShiftRight'];
  const spd=run?PLAYER_RUN_SPEED:PLAYER_SPEED;
  if(joyState.active){dx+=joyState.x;dz+=joyState.z;}
  if(keys['ArrowUp']||keys['KeyW'])dz-=1;
  if(keys['ArrowDown']||keys['KeyS'])dz+=1;
  if(keys['ArrowLeft']||keys['KeyA'])dx-=1;
  if(keys['ArrowRight']||keys['KeyD'])dx+=1;
  if(keys['Space']&&playerState.onGround){playerState.vy=7.5;playerState.onGround=false;}
  if(camJoyState.active){
    camState.targetYaw+=camJoyState.x*dt*2.2;

  }
  camState.yaw+=(camState.targetYaw-camState.yaw)*0.15;
  camState.pitch+=(camState.targetPitch-camState.pitch)*0.1;
  const cos=Math.cos(camState.yaw),sin=Math.sin(camState.yaw);
  const wx=dx*cos+dz*sin,wz=-dx*sin+dz*cos;
  const len=Math.sqrt(wx*wx+wz*wz);
  let moved=false;
  if(len>0.01){
    const nx=wx/len,nz=wz/len;
    const speed=spd*Math.min(len,1)*dt;
    let npx=playerState.x+nx*speed,npz=playerState.z+nz*speed;
    const cols=playerState.inSewer?sewerColliders:colliders;
    const r=resolveCollisions(npx,npz,playerState.y,cols);
    playerState.x=r.x;playerState.z=r.z;playerState.angle=Math.atan2(nx,nz);moved=true;
  }
  const floorY=getFloorY(playerState.inSewer);
  playerState.vy-=GRAVITY*dt;playerState.y+=playerState.vy*dt;
  if(playerState.y<=floorY){playerState.y=floorY;playerState.vy=0;playerState.onGround=true;}
  const distToHole=Math.sqrt((playerState.x-sewerHole.x)**2+(playerState.z-sewerHole.z)**2);
  if(!sewerTransitioning){
    if(!playerState.inSewer&&distToHole<1.8&&keys['KeyE']){
      sewerTransitioning=true;showToast('⬇ Descente dans les souterrains…');
      setTimeout(()=>{
        playerState.inSewer=true;playerState.y=SEWER_Y;playerState.vy=0;
        playerState.x=sewerHole.x;playerState.z=sewerHole.z;sewerTransitioning=false;
        scene.fog=new THREE.Fog(0x061206,8,40);scene.background=new THREE.Color(0x050e05);
        document.getElementById('zone-name').textContent='🐀 Souterrain';
        addChat('🐀 Tu es dans les souterrains !','Système');
        checkMission('m2');
      },800);
    }
    if(playerState.inSewer&&distToHole<2.5&&keys['KeyE']){
      sewerTransitioning=true;showToast('⬆ Remontée en surface…');
      setTimeout(()=>{
        playerState.inSewer=false;playerState.y=0.2;playerState.vy=2;
        playerState.x=sewerHole.x;playerState.z=sewerHole.z;sewerTransitioning=false;
        scene.fog=new THREE.Fog(0x9ec2dc,120,300);scene.background=new THREE.Color(0x8ab4d4);
        document.getElementById('zone-name').textContent='東京 Shinjuku';
      },600);
    }
  }
  if(distToHole<2&&!playerState.inSewer)showToast('[ E ] Descendre dans l\'égout');
  if(distToHole<2&&playerState.inSewer)showToast('[ E ] Remonter en surface');
  updateZone();
  if(!playerState.inSewer){
    if(moved&&playerState.onGround&&(playerState.currentAnim==='idle'||playerState.currentAnim==='attend.glb')){
      playAnim(WALK_FILE);playerState.currentAnim='walk';
      document.querySelectorAll('.anim-btn').forEach((b,i)=>b.classList.toggle('active',i===1));
    }
    if(!moved&&playerState.onGround&&playerState.currentAnim==='walk'){
      playAnim(IDLE_FILE);playerState.currentAnim='idle';
      document.querySelectorAll('.anim-btn').forEach((b,i)=>b.classList.toggle('active',i===0));
    }
  }
}
function updateZone(){
  const x=playerState.x,z=playerState.z;
  let zone='東京 Shinjuku';
  if(x>40&&z<0)zone='東京 Shibuya';
  else if(x<-40&&z>0)zone='東京 Akihabara';
  else if(x>40&&z>40)zone='東京 Harajuku';
  else if(x>0&&z<-60)zone='🏯 Central Park';
  if(zone!==lastZone){
    lastZone=zone;
    document.getElementById('zone-name').textContent=zone;
    if(zone==='🏯 Central Park')checkMission('m3');
    advanceMission('m1');
  }
}
function checkMission(id){
  const m=MISSIONS.find(m=>m.id===id);
  if(m&&!m.done){m.done=true;m.badge='done';m.progress=m.total;renderMissions();showToast('🏆 Mission terminée : '+m.title);}
}
function advanceMission(id){
  const m=MISSIONS.find(m=>m.id===id);
  if(m&&!m.done){m.progress=Math.min(m.progress+1,m.total);if(m.progress>=m.total)checkMission(id);else renderMissions();}
}
function updateCamera(){
  const tp=new THREE.Vector3(playerState.x,playerState.y+1.5,playerState.z);
  const cd=playerState.inSewer?4:camState.dist;
  const cp=new THREE.Vector3(
    tp.x-Math.sin(camState.yaw)*Math.cos(camState.pitch)*cd,
    tp.y+Math.sin(camState.pitch)*cd,
    tp.z-Math.cos(camState.yaw)*Math.cos(camState.pitch)*cd
  );
  camera.position.lerp(cp,0.12);camera.lookAt(tp);
}
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  updatePlayer(dt);updateMovingCars(dt);updateNPCs(dt);
  updatePlayerVisuals();updateCamera();
  if(playerMixer)playerMixer.update(dt);
  drawMinimap();renderer.render(scene,camera);
}
animate();
</script>
