<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Macadam World — Place Pastel</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--pink:#FF6EB4;--mint:#3DDBB8;--yellow:#FFD747;--lav:#B388FF;--sky:#5BC8F5;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0618;font-family:'Nunito',sans-serif;user-select:none;-webkit-user-select:none;}
#canvas-container{position:fixed;inset:0;}
canvas{display:block;width:100%!important;height:100%!important;}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;}
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(180deg,rgba(18,8,42,.85) 0%,transparent 100%);}
.hud-logo{font-family:'Baloo 2',cursive;font-size:1.1rem;font-weight:800;color:white;text-shadow:0 2px 8px rgba(0,0,0,.5);}
.hud-logo span{color:var(--pink);}
.hud-location{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:5px 12px;}
.hud-location span{font-size:.75rem;font-weight:800;color:white;}
.loc-dot{width:7px;height:7px;border-radius:50%;background:var(--mint);flex-shrink:0;animation:pulsedot 2s infinite;}
@keyframes pulsedot{0%,100%{box-shadow:0 0 0 0 rgba(61,219,184,.6);}50%{box-shadow:0 0 0 5px rgba(61,219,184,0);}}
.hud-info{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:5px 12px 5px 6px;}
.hud-pic{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--lav));display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:900;color:white;border:2px solid rgba(255,255,255,.2);}
.hud-pseudo{font-size:.75rem;font-weight:800;color:white;}
.hud-chat{position:absolute;bottom:180px;left:12px;right:12px;max-width:300px;pointer-events:all;}
.chat-messages{max-height:90px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;margin-bottom:6px;scrollbar-width:none;}
.chat-messages::-webkit-scrollbar{display:none;}
.chat-msg{background:rgba(18,8,42,.78);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:5px 10px;font-size:.7rem;color:white;animation:fadeup .3s ease;line-height:1.4;}
@keyframes fadeup{from{opacity:0;transform:translateY(4px);}to{opacity:1;}}
.chat-msg .name{font-weight:900;color:var(--pink);margin-right:4px;}
.chat-input-wrap{display:flex;gap:6px;}
.chat-input{flex:1;background:rgba(18,8,42,.85);backdrop-filter:blur(10px);border:1.5px solid rgba(255,255,255,.15);border-radius:12px;padding:8px 12px;font-size:16px;font-weight:700;color:white;outline:none;font-family:'Nunito',sans-serif;}
.chat-input::placeholder{color:rgba(255,255,255,.25);}
.chat-input:focus{border-color:var(--pink);}
.chat-send{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--pink),var(--lav));border:none;color:white;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;pointer-events:all;flex-shrink:0;}

/* ── PANNEAU ANIMATIONS ── */
#anim-panel{
position:absolute;
bottom:0;left:0;right:0;
pointer-events:all;
padding:8px 0 12px;
background:linear-gradient(0deg,rgba(10,6,24,.95) 0%,rgba(10,6,24,.7) 100%);
backdrop-filter:blur(12px);
}
#anim-scroll{
display:flex;
flex-direction:row;
gap:8px;
overflow-x:auto;
padding:4px 12px 0;
scrollbar-width:none;
-webkit-overflow-scrolling:touch;
}
#anim-scroll::-webkit-scrollbar{display:none;}
.anim-btn{
flex-shrink:0;
width:72px;
display:flex;
flex-direction:column;
align-items:center;
gap:4px;
cursor:pointer;
pointer-events:all;
-webkit-tap-highlight-color:transparent;
}
.anim-btn svg{
width:64px;height:64px;
border-radius:14px;
background:rgba(255,255,255,.07);
border:2px solid rgba(255,255,255,.1);
transition:all .2s;
padding:4px;
}
.anim-btn.active svg{
background:rgba(255,110,180,.18);
border-color:var(–pink);
box-shadow:0 0 12px rgba(255,110,180,.4);
}
.anim-btn:active svg{transform:scale(.92);}
.anim-label{
font-size:.58rem;
font-weight:800;
color:rgba(255,255,255,.5);
text-align:center;
line-height:1.1;
}
.anim-btn.active .anim-label{color:var(–pink);}

/* Joysticks */
#joystick-zone{position:absolute;bottom:100px;right:16px;width:100px;height:100px;pointer-events:all;}
.joy-base{width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.14);backdrop-filter:blur(8px);position:relative;display:flex;align-items:center;justify-content:center;}
.joy-knob{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(–pink),var(–lav));box-shadow:0 4px 16px rgba(255,110,180,.45);position:absolute;}
#cam-joystick-zone{position:absolute;bottom:100px;left:16px;width:100px;height:100px;pointer-events:all;}
#jump-btn{position:absolute;bottom:215px;right:22px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#00ffcc,#0088ff);border:2px solid rgba(255,255,255,.3);color:white;font-size:1.4rem;font-weight:900;pointer-events:all;cursor:pointer;box-shadow:0 0 18px rgba(0,255,200,.5);-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;}

.toast{position:fixed;bottom:200px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(18,8,42,.92);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(12px);color:white;padding:8px 18px;border-radius:20px;font-size:.78rem;font-weight:800;opacity:0;transition:all .3s;z-index:50;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#speech-bubble{position:fixed;z-index:20;background:white;color:#12082A;border-radius:12px;padding:5px 11px;font-size:.72rem;font-weight:800;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:150px;text-align:center;transform:translateX(-50%);opacity:0;transition:opacity .3s;white-space:nowrap;}
#speech-bubble::after{content:’’;position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:white;border-bottom:none;}
#loading-screen{position:fixed;inset:0;z-index:100;background:#0e0620;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .6s;}
#loading-screen.hidden{opacity:0;pointer-events:none;}
.load-logo{font-family:‘Baloo 2’,cursive;font-size:2.5rem;font-weight:800;color:white;}
.load-logo .c1{color:var(–pink);}.load-logo .c2{color:var(–yellow);}.load-logo .c3{color:var(–mint);}.load-logo .c4{color:var(–sky);}
.load-bar-wrap{width:200px;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;}
.load-bar{height:100%;width:0%;background:linear-gradient(90deg,var(–pink),var(–lav));border-radius:2px;transition:width .25s;}
.load-txt{font-size:.76rem;color:rgba(255,255,255,.4);font-weight:700;}
</style>

</head>
<body>
<div id="canvas-container"></div>
<div id="loading-screen">
  <div class="load-logo"><span class="c1">M</span><span class="c2">A</span><span class="c3">C</span><span class="c4">A</span><span class="c1">D</span><span class="c2">A</span><span class="c3">M</span></div>
  <div class="load-bar-wrap"><div class="load-bar" id="load-bar"></div></div>
  <div class="load-txt" id="load-txt">Chargement…</div>
</div>
<div id="hud">
  <div class="hud-top">
    <div class="hud-logo">✦ <span>Macadam</span> World</div>
    <div class="hud-location"><div class="loc-dot"></div><span>Place Pastel</span></div>
    <div class="hud-info">
      <div class="hud-pic" id="hud-pic">?</div>
      <span class="hud-pseudo" id="hud-pseudo">Joueur</span>
    </div>
  </div>
  <div class="hud-chat">
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-wrap">
      <input class="chat-input" id="chat-input" type="text" placeholder="Dis quelque chose…" maxlength="80" autocomplete="off"/>
      <button class="chat-send" id="chat-send">➤</button>
    </div>
  </div>
  <div id="joystick-zone">
    <div class="joy-base" id="joy-base">
      <div class="joy-knob" id="joy-knob"></div>
    </div>
  </div>
  <div id="cam-joystick-zone"></div>
  <button id="jump-btn">⬆</button>
  <div id="anim-panel">
    <div id="anim-scroll"></div>
  </div>
</div>
<div id="speech-bubble"></div>
<div class="toast" id="toast"></div>

</script>

function loadProfile(){
  try{
    const uid=localStorage.getItem('macadam_user_id')||('p_'+Math.random().toString(36).slice(2,8));
    localStorage.setItem('macadam_user_id',uid);
    const saved=JSON.parse(localStorage.getItem('macadam_avatar_'+uid)||'null');
    return{pseudo:saved?.pseudo||'Joueur'};
  }catch(e){return{pseudo:'Joueur'};}
}

function mkBox(w,h,d,color,rough=0.7,metal=0,emissive=null){
  const mat=new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
  if(emissive){mat.emissive=new THREE.Color(emissive);mat.emissiveIntensity=0.8;}
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.castShadow=true;m.receiveShadow=true;return m;
}
function mkCyl(rt,rb,h,seg,color,rough=0.6){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),new THREE.MeshStandardMaterial({color,roughness:rough}));
  m.castShadow=true;return m;
}

const colliders=[]; // {minX,maxX,minZ,maxZ,minY,maxY}
function addCollider(x,y,z,w,h,d){
  colliders.push({minX:x-w/2,maxX:x+w/2,minZ:z-d/2,maxZ:z+d/2,minY:y,maxY:y+h,w,h,d,cx:x,cy:y,cz:z});
}

// Objets interactifs poussables/cassables
const interactables=[];
function addInteractable(mesh,x,z,w,d,type){
  mesh.position.set(x,mesh.position.y,z);
  scene.add(mesh);
  const obj={mesh,x,z,w,d,type,vx:0,vz:0,broken:false,hp:type==='crate'?1:999};
  interactables.push(obj);
  return obj;
}

const dataClouds=[];

// ===== AVATAR =====
const avatarGroup=new THREE.Group();
avatarGroup.position.set(0,0,6);
scene.add(avatarGroup);

let avatarMixer=null;
let currentAction=null;
let idleAction=null;
let walkAction=null;
let isWalking=false;
let emoteAction=null;
let emoteTimer=null;

const gltfLoader=new GLTFLoader();
const glbCache={};

function crossFadeTo(toAction,duration=0.25){
  if(!toAction||toAction===currentAction)return;
  toAction.reset();
  toAction.setEffectiveTimeScale(1);
  toAction.setEffectiveWeight(1);
  if(currentAction)currentAction.crossFadeTo(toAction,duration,true);
  else toAction.play();
  currentAction=toAction;
}

function loadGLB(url,cb){
  if(glbCache[url]){cb(glbCache[url]);return;}
  gltfLoader.load(url,gltf=>{glbCache[url]=gltf;cb(gltf);},undefined,err=>{console.warn('GLB error',url,err);});
}

// Charge et joue un GLB complet — remplace le modèle entier
function swapAvatar(url, loop=true, onDone=null){
  loadGLB(BASE+url, gltf=>{
    // Vide l'avatar actuel
    while(avatarGroup.children.length) avatarGroup.remove(avatarGroup.children[0]);
    if(avatarMixer){ avatarMixer.stopAllAction(); avatarMixer=null; }
    currentAction=null; idleAction=null; walkAction=null; emoteAction=null;

    const model=gltf.scene;
    model.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true;}});
    const bb=new THREE.Box3().setFromObject(model);
    const size=new THREE.Vector3(); bb.getSize(size);
    if(size.y>0) model.scale.setScalar(1.75/size.y);
    const bb2=new THREE.Box3().setFromObject(model);
    model.position.y=-bb2.min.y;
    avatarGroup.add(model);

    if(gltf.animations?.length){
      avatarMixer=new THREE.AnimationMixer(model);
      const action=avatarMixer.clipAction(gltf.animations[0]);
      action.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce, loop ? Infinity : 1);
      action.clampWhenFinished=!loop;
      action.play();
      currentAction=action;
      if(loop) idleAction=action;
      if(onDone) onDone(action, gltf.animations[0].duration);
    }
  });
}

// Idle de base = attend.glb
swapAvatar('attend.glb', true);
// Walk = course.glb préchargé en cache
loadGLB(BASE+'course.glb', ()=>{});

document.querySelectorAll('.anim-btn')[1]?.classList.add('active');

// Quand on avance → course.glb, quand on s'arrête → attend.glb
let lastWalking=false;
function setWalkSwap(walking){
  if(walking===lastWalking)return;
  lastWalking=walking;
  clearTimeout(emoteTimer); emoteAction=null;
  if(walking) swapAvatar('course.glb', true);
  else        swapAvatar('attend.glb', true);
}

function playEmote(url, label){
  clearTimeout(emoteTimer); emoteAction=null;
  swapAvatar(url, false, (action, duration)=>{
    emoteAction=action;
    showToast('▶ '+label);
    emoteTimer=setTimeout(()=>{
      emoteAction=null;
      swapAvatar('attend.glb', true);
    }, duration*1000+200);
  });
}

// ===== PANNEAU ANIMATIONS =====
const animScroll=document.getElementById('anim-scroll');
ANIMS.forEach((anim,i)=>{
  const svgContent=SVG[anim.type]||SVG.idle;
  const btn=document.createElement('div');
  btn.className='anim-btn';
  btn.dataset.idx=i;
  btn.innerHTML=`
    <svg viewBox="0 0 64 80" xmlns="http://www.w3.org/2000/svg">${svgContent}</svg>
    <span class="anim-label">${anim.label}</span>
  `;
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.anim-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');

    if(i===0){
      // Marche — juste activation walk manuelle
      clearTimeout(emoteTimer);emoteAction=null;
      if(walkAction){crossFadeTo(walkAction,0.25);}
      showToast('🚶 Marche');
    } else if(i===1){
      // Idle — reset vers idle
      clearTimeout(emoteTimer);emoteAction=null;
      if(idleAction){crossFadeTo(idleAction,0.3);}
      showToast('🧍 Idle');
    } else {
      playEmote(anim.file,anim.label);
    }
  });
  animScroll.appendChild(btn);
});

// ===== JOYSTICK DROIT =====
const joyBase=document.getElementById('joy-base');
const joyKnob=document.getElementById('joy-knob');
const JR=42;
const joy={active:false,x:0,y:0,id:null};
function getJoyCenter(){const r=joyBase.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
function updateJoy(cx,cy){
  const c=getJoyCenter();let dx=cx-c.x,dy=cy-c.y;
  const d=Math.sqrt(dx*dx+dy*dy);if(d>JR){dx=dx/d*JR;dy=dy/d*JR;}
  joy.x=dx/JR;joy.y=dy/JR;
  joyKnob.style.transform=`translate(${dx}px,${dy}px)`;
}
joyBase.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];joy.active=true;joy.id=t.identifier;updateJoy(t.clientX,t.clientY);},{passive:false});
document.addEventListener('touchmove',e=>{if(!joy.active)return;for(const t of e.changedTouches)if(t.identifier===joy.id){e.preventDefault();updateJoy(t.clientX,t.clientY);}},{passive:false});
document.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===joy.id){joy.active=false;joy.x=0;joy.y=0;joyKnob.style.transform='translate(0,0)';}});

// ===== JOYSTICK GAUCHE (caméra) =====
const camZone=document.getElementById('cam-joystick-zone');
const CAM_JR=55;
const camJoy={active:false,x:0,id:null};
function getCamCenter(){const r=camZone.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
function updateCamJoy(cx,cy){
  const c=getCamCenter();let dx=cx-c.x;
  if(Math.abs(dx)>CAM_JR)dx=Math.sign(dx)*CAM_JR;
  camJoy.x=dx/CAM_JR;
}
camZone.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];camJoy.active=true;camJoy.id=t.identifier;updateCamJoy(t.clientX,t.clientY);},{passive:false});
document.addEventListener('touchmove',e=>{if(!camJoy.active)return;for(const t of e.changedTouches)if(t.identifier===camJoy.id){e.preventDefault();updateCamJoy(t.clientX,t.clientY);}},{passive:false});
document.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===camJoy.id){camJoy.active=false;camJoy.x=0;}});

let mDrag={active:false,lastX:0};
renderer.domElement.addEventListener('mousedown',e=>{mDrag.active=true;mDrag.lastX=e.clientX;});
document.addEventListener('mousemove',e=>{if(!mDrag.active)return;cameraYaw-=(e.clientX-mDrag.lastX)*0.005;mDrag.lastX=e.clientX;});
document.addEventListener('mouseup',()=>mDrag.active=false);
const keys={};
document.addEventListener('keydown',e=>keys[e.key]=true);
document.addEventListener('keyup',e=>keys[e.key]=false);

// ===== CHAT =====
const bubbleEl=document.getElementById('speech-bubble');
let bubbleTimer2=null;
function showBubble(text){bubbleEl.textContent=text;bubbleEl.style.opacity='1';clearTimeout(bubbleTimer2);bubbleTimer2=setTimeout(()=>bubbleEl.style.opacity='0',4000);}
function updateBubblePos(){
  if(bubbleEl.style.opacity==='0')return;
  const pos=new THREE.Vector3(playerPos.x,playerPos.y+2.3,playerPos.z).project(camera);
  bubbleEl.style.left=((pos.x+1)/2*window.innerWidth)+'px';
  bubbleEl.style.top=((1-pos.y)/2*window.innerHeight-44)+'px';
}
function addChat(text,from){
  const msgs=document.getElementById('chat-messages');
  const div=document.createElement('div');div.className='chat-msg';
  div.innerHTML=`<span class="name">${from}</span>${text}`;
  msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;
  while(msgs.children.length>20)msgs.removeChild(msgs.firstChild);
}
function sendChat(){const inp=document.getElementById('chat-input');const msg=inp.value.trim();if(!msg)return;inp.value='';addChat(msg,profile.pseudo);showBubble(msg);}
document.getElementById('chat-send').addEventListener('click',sendChat);
document.getElementById('chat-input').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendChat();}});
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

// ===== BOUTON SAUT HUD =====
const jumpBtnEl=document.getElementById('jump-btn');
const JUMP_NORMAL=8;
const JUMP_SUPER=22;
let jumpLastTap=0;
let jumpVel=0;
let isOnGround=true;
let isJumping=false;

jumpBtnEl.addEventListener('touchstart',e=>{
  e.preventDefault();
  const now=Date.now();
  const double=now-jumpLastTap<350;
  jumpLastTap=now;
  if(isOnGround){
    jumpVel=double?JUMP_SUPER:JUMP_NORMAL;
    isOnGround=false;isJumping=true;
    if(double)showToast('🚀 SUPER SAUT !');
    playEmote('saut%20guerrier.glb','Saut guerrier');
  }
},{passive:false});
jumpBtnEl.addEventListener('click',()=>{
  const now=Date.now();const double=now-jumpLastTap<350;jumpLastTap=now;
  if(isOnGround){jumpVel=double?JUMP_SUPER:JUMP_NORMAL;isOnGround=false;isJumping=true;}
});

// ===== COLLISION HELPER =====
const PLAYER_R=0.4;
function resolveCollisions(nx,nz){
  let rx=nx,rz=nz;
  const py=playerPos.y;
  for(const c of colliders){
    // Si le joueur est au dessus du collider (peut marcher dessus) → skip
    if(py>=c.maxY-0.1)continue;
    const ox=rx-Math.max(c.minX,Math.min(c.maxX,rx));
    const oz=rz-Math.max(c.minZ,Math.min(c.maxZ,rz));
    const dist=Math.sqrt(ox*ox+oz*oz);
    if(dist<PLAYER_R){
      // Arrêt net — on ne bouge pas dans cette direction
      rx=playerPos.x;rz=playerPos.z;
      break;
    }
  }
  return{x:rx,z:rz};
}

// ===== INTERACTIONS =====
const INTERACT_R=2.0;
function checkInteractions(){
  for(const obj of interactables){
    if(obj.broken)continue;
    const dx=playerPos.x-obj.x,dz=playerPos.z-obj.z;
    const dist=Math.sqrt(dx*dx+dz*dz);
    if(dist<INTERACT_R){
      if(obj.type==='bin'||obj.type==='crate'){
        // Pousse dans la direction du joueur
        const force=2.5/Math.max(dist,0.5);
        obj.vx+=dx*force*0.08;obj.vz+=dz*force*0.08;
      }
      // Casser caisse si saut guerrier actif (on est en l'air et proche)
      if(obj.type==='crate'&&isJumping&&playerPos.y>0.8){
        breakCrate(obj);
      }
    }
  }
}

function breakCrate(obj){
  if(obj.broken)return;
  obj.broken=true;
  scene.remove(obj.mesh);
  showToast('💥 Caisse cassée !');
  // Éclats
  for(let i=0;i<8;i++){
    const shard=mkBox(0.2+Math.random()*0.3,0.2+Math.random()*0.3,0.2+Math.random()*0.3,0x8B6914);
    shard.position.set(obj.x+(Math.random()-0.5)*1.5,0.5+Math.random()*1.5,obj.z+(Math.random()-0.5)*1.5);
    shard.rotation.set(Math.random()*Math.PI,Math.random()*Math.PI,Math.random()*Math.PI);
    scene.add(shard);
    // Disparaît après 2s
    setTimeout(()=>scene.remove(shard),2000);
  }
  // Flash de lumière
  const flash=new THREE.PointLight(0xffaa00,5,6);flash.position.set(obj.x,1,obj.z);
  scene.add(flash);setTimeout(()=>scene.remove(flash),300);
}

// ===== BOUCLE =====
const SPEED=5,BOUNDARY=52;
const playerPos=new THREE.Vector3(0,0,4);
let playerRotY=0,cameraYaw=Math.PI;
const CAM_DIST=7,CAM_HEIGHT=2.2,CAM_LOOK_Y=1.2,CAM_LERP=4;
const GRAVITY=28;
const clock=new THREE.Clock();
finishLoading();

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.08);
  if(avatarMixer)avatarMixer.update(dt);

  // Nuages data
  dataClouds.forEach(c=>{c.mesh.position.x+=c.speed*dt;if(c.mesh.position.x>55)c.mesh.position.x=-55;});

  // Objets poussables — friction et déplacement
  interactables.forEach(obj=>{
    if(obj.broken)return;
    obj.vx*=0.85;obj.vz*=0.85;
    if(Math.abs(obj.vx)>0.01||Math.abs(obj.vz)>0.01){
      obj.x+=obj.vx;obj.z+=obj.vz;
      obj.x=Math.max(-50,Math.min(50,obj.x));
      obj.z=Math.max(-50,Math.min(50,obj.z));
      obj.mesh.position.set(obj.x,obj.mesh.position.y,obj.z);
    }
  });

  // Input
  let mx=joy.x,mz=-joy.y;
  if(keys['ArrowUp']  ||keys['w']||keys['W'])mz= 1;
  if(keys['ArrowDown']||keys['s']||keys['S'])mz=-1;
  if(keys['ArrowLeft']||keys['a']||keys['A'])mx=-1;
  if(keys['ArrowRight']||keys['d']||keys['D'])mx= 1;
  if(keys[' ']&&isOnGround){jumpVel=JUMP_NORMAL;isOnGround=false;isJumping=true;}
  if(camJoy.active&&Math.abs(camJoy.x)>0.05)cameraYaw-=camJoy.x*2.2*dt;
  if(keys['q']||keys['Q'])cameraYaw+=1.8*dt;
  if(keys['e']||keys['E'])cameraYaw-=1.8*dt;

  const moving=Math.abs(mx)>0.05||Math.abs(mz)>0.05;
  if(moving&&emoteAction&&isOnGround){clearTimeout(emoteTimer);emoteAction=null;}
  if(isOnGround)setWalkSwap(moving);

  // Déplacement horizontal
  if(moving){
    const sinC=Math.sin(cameraYaw),cosC=Math.cos(cameraYaw);
    const dx=(sinC*(-mz)+cosC*mx)*SPEED*dt;
    const dz=(cosC*(-mz)-sinC*mx)*SPEED*dt;
    const nx=playerPos.x+dx;
    const nz=playerPos.z+dz;
    const resolved=resolveCollisions(nx,nz);
    playerPos.x=Math.max(-BOUNDARY,Math.min(BOUNDARY,resolved.x));
    playerPos.z=Math.max(-BOUNDARY,Math.min(BOUNDARY,resolved.z));
    playerRotY=Math.atan2(dx,dz);
    const targetYaw=playerRotY+Math.PI;
    let diff=targetYaw-cameraYaw;
    while(diff> Math.PI)diff-=2*Math.PI;
    while(diff<-Math.PI)diff+=2*Math.PI;
    cameraYaw+=diff*Math.min(CAM_LERP*dt,1.0);
  }

  // Gravité et saut
  if(!isOnGround){
    jumpVel-=GRAVITY*dt;
    playerPos.y+=jumpVel*dt;
    if(playerPos.y<=0){
      playerPos.y=0;jumpVel=0;isOnGround=true;isJumping=false;
      setWalkSwap(moving);
    }
  }

  // Interactions
  checkInteractions();

  avatarGroup.position.set(playerPos.x,playerPos.y,playerPos.z);
  avatarGroup.rotation.y=playerRotY;
  camera.position.set(
    playerPos.x+Math.sin(cameraYaw)*CAM_DIST,
    playerPos.y+CAM_HEIGHT,
    playerPos.z+Math.cos(cameraYaw)*CAM_DIST
  );
  camera.lookAt(playerPos.x,playerPos.y+CAM_LOOK_Y,playerPos.z);
  updateBubblePos();
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
