<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Test WebGL</title>
</head>
<body style="margin:0;background:#b0c8e8;font-family:sans-serif">
<canvas id="c"></canvas>

<script type="module">
import * as THREE from "[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js)";

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas});
renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8ab4d4);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,100);
camera.position.z=5;
scene.add(new THREE.Mesh(
  new THREE.BoxGeometry(1,1,1),
  new THREE.MeshNormalMaterial()
));
renderer.setAnimationLoop(()=>{
  scene.children[0].rotation.x+=0.01;
  scene.children[0].rotation.y+=0.02;
  renderer.render(scene,camera);
});

// --- logger d'erreurs
window.onerror=(m,u,l,c,e)=>{
  const b=document.createElement('div');
  b.style.cssText="position:fixed;bottom:0;left:0;right:0;background:#d33;color:#fff;padding:6px;font-size:13px;font-family:monospace;z-index:9999";
  b.textContent='⚠️ '+m;document.body.appendChild(b);
};
</script>
</body>
</html>
