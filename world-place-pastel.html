<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Macadam World — Place Pastel</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0618;}
#canvas-container{position:fixed;inset:0;}
canvas{display:block;width:100%!important;height:100%!important;}
</style>
</head>

<body>
<div id="canvas-container"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById('canvas-container').appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xC8E8FF);
scene.fog=new THREE.FogExp2(0xC8E8FF,0.018);

const camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,300);
camera.position.set(0,4,10);

// lumières
scene.add(new THREE.AmbientLight(0xfff0e8,0.6));
const sun=new THREE.DirectionalLight(0xfff4d0,2.2);
sun.position.set(20,40,15);
sun.castShadow=true;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xB8E8FF,0x88C880,0.8));

// sol
const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(80,80),
  new THREE.MeshStandardMaterial({color:0xF0E8D8,roughness:0.95})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// cube test
const cube=new THREE.Mesh(
  new THREE.BoxGeometry(1,1,1),
  new THREE.MeshStandardMaterial({color:0xFF6EB4})
);
cube.position.y=1;
cube.castShadow=true;
scene.add(cube);

// animation
const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);

  const dt=clock.getDelta();
  cube.rotation.y += 0.6 * dt;

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
