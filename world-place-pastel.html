<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Macadam World — Place Pastel</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0e0620;color:white;font-family:sans-serif}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;z-index:10}
canvas{display:block}
</style>
</head>
<body>
<div id="loading">⏳ Chargement de Place Pastel…</div>

<!-- 3D Engine -->
<script src="[unpkg.com](https://unpkg.com/three@0.121.1/build/three.min.js)"></script>
<script src="[unpkg.com](https://unpkg.com/three@0.121.1/examples/js/controls/OrbitControls.min.js)"></script>

<script>
/* === BASE === */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfeaff);
scene.fog = new THREE.FogExp2(0xcfeaff, 0.014);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0,5,14);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.maxPolarAngle = Math.PI/2.1;
controls.target.set(0,2,0);

/* === LUMIÈRES === */
scene.add(new THREE.HemisphereLight(0xffffff,0xaabbcc,1));
const sun = new THREE.DirectionalLight(0xfff8e8,1.2);
sun.position.set(10,25,10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

/* === SOL === */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(30,128),
  new THREE.MeshStandardMaterial({color:0xf3ebda,roughness:0.9})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

/* === FONTAINE === */
function createFountain(){
  const group=new THREE.Group();
  const matStone=new THREE.MeshStandardMaterial({color:0xddd0f5,roughness:0.6});
  const base=new THREE.Mesh(new THREE.CylinderGeometry(3,3,0.6,64),matStone);
  base.castShadow=base.receiveShadow=true;
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,3,32),matStone);
  shaft.position.y=1.8;
  const bowlMat=new THREE.MeshPhysicalMaterial({
    color:0x9ed9ff,roughness:0.1,metalness:0.3,transparent:true,opacity:0.7
  });
  const bowl=new THREE.Mesh(new THREE.TorusGeometry(1.2,0.12,24,48),bowlMat);
  bowl.rotation.x=Math.PI/2;
  bowl.position.y=3.05;
  const orb=new THREE.Mesh(new THREE.SphereGeometry(0.3,32,32),bowlMat);
  orb.position.y=3.7;
  group.add(base,shaft,bowl,orb);

  // Eau — pluie circulaire
  const dropCount=180;
  const pos=new Float32Array(dropCount*3);
  for(let i=0;i<dropCount;i++){
    const r=1.2+Math.random()*0.4;
    const a=Math.random()*Math.PI*2;
    pos[i*3]=Math.cos(a)*r;
    pos[i*3+1]=3+Math.random()*0.3;
    pos[i*3+2]=Math.sin(a)*r;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const mat=new THREE.PointsMaterial({color:0x99ccff,size:0.04,transparent:true,opacity:0.8});
  const pts=new THREE.Points(geo,mat);
  group.add(pts);
  group.tick=(dt)=>{
    const p=pts.geometry.attributes.position;
    for(let i=0;i<p.count;i++){
      let y=p.getY(i)-dt*1.8;
      if(y<0.3)y=3+Math.random()*0.3;
      p.setY(i,y);
    }
    p.needsUpdate=true;
  };
  return group;
}
const fountain=createFountain();
scene.add(fountain);

/* === BÂTIMENTS === */
function createBuilding(col,pos){
  const g=new THREE.Group();
  const body=new THREE.Mesh(
    new THREE.BoxGeometry(6,7,5),
    new THREE.MeshStandardMaterial({color:col,roughness:0.6})
  );
  body.position.y=3.5;
  const roof=new THREE.Mesh(
    new THREE.ConeGeometry(3.2,2.3,4),
    new THREE.MeshStandardMaterial({color:0xb8a8f0,roughness:0.4})
  );
  roof.position.y=7.6;
  body.castShadow=body.receiveShadow=roof.castShadow=true;
  g.add(body,roof);
  g.position.copy(pos);
  return g;
}
scene.add(
  createBuilding(0xa8e6cf,new THREE.Vector3(-10,0,-10)),
  createBuilding(0xffbfa8,new THREE.Vector3(10,0,-10)),
  createBuilding(0xd4c5f9,new THREE.Vector3(-14,0,-20)),
  createBuilding(0xb8e8d8,new THREE.Vector3(14,0,-20))
);

/* === AVATAR SIMPLE === */
const avatar=new THREE.Group();
const body=new THREE.Mesh(
  new THREE.CapsuleGeometry(0.3,1,16,16),
  new THREE.MeshStandardMaterial({color:0xff9ebb})
);
const head=new THREE.Mesh(
  new THREE.SphereGeometry(0.25,32,32),
  new THREE.MeshStandardMaterial({color:0xffe6cf})
);
head.position.y=0.9;
avatar.add(body,head);
avatar.position.set(0,0,4);
scene.add(avatar);

/* === ANIMATION === */
document.getElementById('loading').remove();
let last=performance.now();
function loop(t){
  requestAnimationFrame(loop);
  const dt=(t-last)/1000; last=t;
  fountain.tick(dt);
  avatar.rotation.y += dt*0.5;
  controls.update();
  renderer.render(scene,camera);
}
loop();

/* === RESIZE === */
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
