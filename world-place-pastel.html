<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Macadam World — Neon City</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--pink:#FF6EB4;--mint:#00ffcc;--lav:#B388FF;--sky:#5BC8F5;--yellow:#FFD747;}
html,body{width:100%;height:100%;overflow:hidden;background:#87CEEB;font-family:'Nunito',sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;}
#renderCanvas{width:100%;height:100%;position:fixed;inset:0;touch-action:none;outline:none;}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;}
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(180deg,rgba(5,8,20,.75) 0%,transparent 100%);}
.hud-logo{font-family:'Baloo 2',cursive;font-size:1.1rem;font-weight:800;color:white;text-shadow:0 0 12px rgba(0,200,255,.8);}
.hud-logo span{color:#5BC8F5;}
.hud-loc{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:5px 12px;}
.hud-loc span{font-size:.72rem;font-weight:800;color:white;}
.loc-dot{width:7px;height:7px;border-radius:50%;background:#FFD747;animation:ldp 2s infinite;}
@keyframes ldp{0%,100%{box-shadow:0 0 0 0 rgba(255,215,70,.8);}50%{box-shadow:0 0 0 5px rgba(255,215,70,0);}}
.hud-info{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:5px 12px 5px 5px;}
.hud-pic{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#FF6EB4,#5BC8F5);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:900;color:white;}
.hud-name{font-size:.72rem;font-weight:800;color:white;}
.hud-chat{position:absolute;bottom:175px;left:12px;max-width:280px;pointer-events:all;}
.chat-msgs{max-height:90px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;margin-bottom:5px;scrollbar-width:none;}
.chat-msgs::-webkit-scrollbar{display:none;}
.cmsg{background:rgba(255,255,255,.18);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);border-radius:9px;padding:4px 9px;font-size:.68rem;color:white;line-height:1.4;text-shadow:0 1px 3px rgba(0,0,0,.6);}
.cmsg .cn{font-weight:900;color:#FFD747;margin-right:4px;}
.chat-row{display:flex;gap:5px;}
.cinput{flex:1;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.35);border-radius:11px;padding:7px 11px;font-size:15px;font-weight:700;color:white;outline:none;font-family:'Nunito',sans-serif;}
.cinput::placeholder{color:rgba(255,255,255,.5);}
.cinput:focus{border-color:#FFD747;}
.csend{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#FF6EB4,#5BC8F5);border:none;color:white;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;pointer-events:all;}
#anim-panel{position:absolute;bottom:0;left:0;right:0;pointer-events:all;padding:6px 0 10px;background:linear-gradient(0deg,rgba(5,8,20,.95) 0%,rgba(5,8,20,.6) 100%);backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.1);}
#anim-scroll{display:flex;gap:7px;overflow-x:auto;padding:3px 12px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
#anim-scroll::-webkit-scrollbar{display:none;}
.anim-btn{flex-shrink:0;width:66px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.anim-icon{width:62px;height:62px;border-radius:13px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;transition:all .18s;}
.anim-icon svg{width:50px;height:50px;}
.anim-btn.active .anim-icon{background:rgba(255,215,70,.15);border-color:#FFD747;box-shadow:0 0 12px rgba(255,215,70,.4);}
.anim-btn:active .anim-icon{transform:scale(.9);}
.anim-label{font-size:.56rem;font-weight:800;color:rgba(255,255,255,.45);text-align:center;line-height:1.1;}
.anim-btn.active .anim-label{color:#FFD747;}
#joy-wrap{position:absolute;bottom:96px;right:18px;pointer-events:all;}
.joy-base{width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.2);backdrop-filter:blur(8px);position:relative;display:flex;align-items:center;justify-content:center;}
.joy-knob{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#FF6EB4,#5BC8F5);box-shadow:0 0 14px rgba(91,200,245,.6);position:absolute;}
#camjoy-wrap{position:absolute;bottom:96px;left:18px;pointer-events:all;}
.camjoy-knob{background:linear-gradient(135deg,#FFD747,#FF6EB4);box-shadow:0 0 14px rgba(255,215,70,.5);}
#jump-btn{position:absolute;bottom:210px;right:24px;width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#5BC8F5,#0088ff);border:none;color:white;font-size:1.3rem;pointer-events:all;cursor:pointer;box-shadow:0 0 16px rgba(91,200,245,.6);display:flex;align-items:center;justify-content:center;}
#superjump-btn{position:absolute;bottom:210px;left:24px;width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#FF6EB4,#ffaa00);border:none;color:white;font-size:1.2rem;pointer-events:all;cursor:pointer;box-shadow:0 0 16px rgba(255,110,180,.5);display:flex;align-items:center;justify-content:center;}
#toast{position:fixed;bottom:192px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(5,8,20,.9);border:1px solid rgba(255,215,70,.3);backdrop-filter:blur(12px);color:#FFD747;padding:7px 16px;border-radius:18px;font-size:.74rem;font-weight:800;opacity:0;transition:all .3s;z-index:50;pointer-events:none;white-space:nowrap;}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
#sbubble{position:fixed;z-index:20;background:rgba(5,8,20,.92);color:white;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:4px 10px;font-size:.7rem;font-weight:800;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.4);max-width:140px;text-align:center;transform:translateX(-50%);opacity:0;transition:opacity .25s;white-space:nowrap;}
#sbubble::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:rgba(255,255,255,.25);border-bottom:none;}
#loading{position:fixed;inset:0;z-index:200;background:#87CEEB;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .6s;}
#loading.out{opacity:0;pointer-events:none;}
.ld-logo{font-family:'Baloo 2',cursive;font-size:2.6rem;font-weight:800;color:#1a3a5c;text-shadow:0 2px 10px rgba(255,255,255,.5);}
.ld-logo span{color:#FF6EB4;}
.ld-bar{width:200px;height:4px;background:rgba(0,0,0,.15);border-radius:2px;overflow:hidden;}
.ld-fill{height:100%;width:0%;background:linear-gradient(90deg,#FF6EB4,#5BC8F5);border-radius:2px;transition:width .25s;}
.ld-txt{font-size:.74rem;color:rgba(26,58,92,.7);font-weight:700;}
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div id="loading">
  <div class="ld-logo">NEON<span>CITY</span></div>
  <div class="ld-bar"><div class="ld-fill" id="ld-fill"></div></div>
  <div class="ld-txt" id="ld-txt">Chargement du moteur…</div>
</div>
<div id="hud">
  <div class="hud-top">
    <div class="hud-logo">⬡ <span>Macadam</span> World</div>
    <div class="hud-loc"><div class="loc-dot"></div><span>Neon City</span></div>
    <div class="hud-info"><div class="hud-pic" id="hud-pic">?</div><span class="hud-name" id="hud-name">Joueur</span></div>
  </div>
  <div class="hud-chat">
    <div class="chat-msgs" id="chat-msgs"></div>
    <div class="chat-row">
      <input class="cinput" id="cinput" type="text" placeholder="Dis quelque chose…" maxlength="80" autocomplete="off"/>
      <button class="csend" id="csend">➤</button>
    </div>
  </div>
  <div id="camjoy-wrap">
    <div class="joy-base" id="camjoy-base">
      <div class="joy-knob camjoy-knob" id="camjoy-knob"></div>
    </div>
  </div>
  <div id="joy-wrap">
    <div class="joy-base" id="joy-base">
      <div class="joy-knob" id="joy-knob"></div>
    </div>
  </div>
  <button id="jump-btn">↑</button>
  <button id="superjump-btn">🚀</button>
  <div id="anim-panel"><div id="anim-scroll"></div></div>
</div>
<div id="sbubble"></div>
<div id="toast"></div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>

<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

<script>
// ===== PROFIL =====
function loadProfile(){
  try{
    const uid=localStorage.getItem('macadam_user_id')||('p_'+Math.random().toString(36).slice(2,8));
    localStorage.setItem('macadam_user_id',uid);
    const saved=JSON.parse(localStorage.getItem('macadam_avatar_'+uid)||'null');
    return{pseudo:saved?.pseudo||'Joueur'};
  }catch(e){return{pseudo:'Joueur'};}
}
const profile=loadProfile();
document.getElementById('hud-name').textContent=profile.pseudo;
document.getElementById('hud-pic').textContent=profile.pseudo.slice(0,2).toUpperCase();

// ===== LOADING BAR =====
let loadPct=0;
const ldFill=document.getElementById('ld-fill');
const ldTxt=document.getElementById('ld-txt');
const ldMsgs=['Chargement du moteur…','Construction des bâtiments…','Mise en place du soleil…','Presque prêt…'];
let ldIdx=0;
const ldInt=setInterval(()=>{
  loadPct+=Math.random()*8;
  if(loadPct>85){loadPct=85;clearInterval(ldInt);}
  ldFill.style.width=loadPct+'%';
  const idx=Math.min(Math.floor(loadPct/25),ldMsgs.length-1);
  if(idx>ldIdx){ldIdx=idx;ldTxt.textContent=ldMsgs[ldIdx];}
},200);

function finishLoading(){
  clearInterval(ldInt);ldFill.style.width='100%';ldTxt.textContent='Bienvenue à Neon City !';
  setTimeout(()=>{
    const ls=document.getElementById('loading');
    ls.classList.add('out');setTimeout(()=>ls.style.display='none',700);
  },400);
  addChat('☀️ Bienvenue dans Neon City en plein jour, '+profile.pseudo+' !','Système');
  addChat('💬 Joystick droit = marcher | gauche = caméra | ↑ = saut | 🚀 = super saut','Info');
}

// ===== BABYLON ENGINE =====
const canvas=document.getElementById('renderCanvas');
const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:false,powerPreference:'high-performance'});
engine.setHardwareScalingLevel(1/Math.min(window.devicePixelRatio,1.5));

const scene=new BABYLON.Scene(engine);

// ===== COULEUR CIEL JOUR =====
scene.clearColor=new BABYLON.Color4(0.529,0.808,0.922,1); // #87CEEB bleu ciel

// ===== BROUILLARD JOUR =====
scene.fogMode=BABYLON.Scene.FOGMODE_LINEAR;
scene.fogColor=new BABYLON.Color3(0.7,0.85,0.95);
scene.fogStart=90;scene.fogEnd=200;

// ===== CAMÉRA ARC (servira juste de fallback, on contrôle manuellement) =====
const camera=new BABYLON.FreeCamera('cam',new BABYLON.Vector3(0,5,15),scene);
camera.minZ=0.1;camera.maxZ=250;
// Ne pas attacher les contrôles — on gère manuellement

// ===== LUMIÈRES JOUR =====
// Hémisphérique (ciel bleu + sol brun chaud)
const hemi=new BABYLON.HemisphericLight('hemi',new BABYLON.Vector3(0,1,0),scene);
hemi.diffuse=new BABYLON.Color3(0.8,0.88,1.0);
hemi.groundColor=new BABYLON.Color3(0.55,0.45,0.3);
hemi.specular=new BABYLON.Color3(0.3,0.3,0.3);
hemi.intensity=1.1;

// Soleil directionnel
const sun=new BABYLON.DirectionalLight('sun',new BABYLON.Vector3(-0.6,-1,-0.4),scene);
sun.diffuse=new BABYLON.Color3(1.0,0.97,0.88);
sun.specular=new BABYLON.Color3(0.8,0.75,0.6);
sun.intensity=2.5;

// Ombres soleil
const shadowGen=new BABYLON.ShadowGenerator(2048,sun);
shadowGen.useBlurExponentialShadowMap=true;
shadowGen.blurKernel=16;
shadowGen.bias=0.002;

// Lumière de remplissage (ciel opposé)
const fill=new BABYLON.DirectionalLight('fill',new BABYLON.Vector3(0.4,0.5,0.6),scene);
fill.diffuse=new BABYLON.Color3(0.55,0.7,0.9);
fill.specular=new BABYLON.Color3(0,0,0);
fill.intensity=0.7;

// ===== HELPERS MATÉRIAUX =====
function mat(hex,rough=0.7,metal=0){
  const m=new BABYLON.StandardMaterial('m'+Math.random(),scene);
  m.diffuseColor=BABYLON.Color3.FromHexString(hex);
  if(metal>0.5){m.specularColor=new BABYLON.Color3(0.6,0.6,0.6);}
  else{m.specularColor=new BABYLON.Color3(rough*0.1,rough*0.1,rough*0.1);}
  return m;
}
function matEmit(hex,emitHex,emitInt=1){
  const m=new BABYLON.StandardMaterial('me'+Math.random(),scene);
  m.diffuseColor=BABYLON.Color3.FromHexString(hex);
  m.emissiveColor=BABYLON.Color3.FromHexString(emitHex).scale(emitInt);
  m.specularColor=new BABYLON.Color3(0.05,0.05,0.05);
  return m;
}

function addShadow(mesh){
  if(!mesh) return;
  shadowGen.addShadowCaster(mesh,true);
  mesh.receiveShadows=true;
}

// ===== BOX HELPER =====
function box(name,w,h,d,hexColor,opts={}){
  const m=BABYLON.MeshBuilder.CreateBox(name,{width:w,height:h,depth:d},scene);
  if(opts.emissive){m.material=matEmit(hexColor,opts.emissive,opts.emissInt||0.8);}
  else{m.material=mat(hexColor,opts.rough||0.7,opts.metal||0);}
  m.receiveShadows=true;
  if(!opts.noShadow) addShadow(m);
  return m;
}
function cyl(name,rt,rb,h,hex,opts={}){
  const m=BABYLON.MeshBuilder.CreateCylinder(name,{diameterTop:rt*2,diameterBottom:rb*2,height:h,tessellation:opts.tess||12},scene);
  if(opts.emissive){m.material=matEmit(hex,opts.emissive,opts.emissInt||0.8);}
  else{m.material=mat(hex,opts.rough||0.6);}
  m.receiveShadows=true;
  if(!opts.noShadow) addShadow(m);
  return m;
}
function sph(name,r,hex,opts={}){
  const m=BABYLON.MeshBuilder.CreateSphere(name,{diameter:r*2,segments:8},scene);
  if(opts.emissive){m.material=matEmit(hex,opts.emissive,opts.emissInt||1);}
  else{m.material=mat(hex,opts.rough||0.5);}
  m.receiveShadows=true;
  if(!opts.noShadow) addShadow(m);
  return m;
}
function disc(name,r,hex,opts={}){
  const m=BABYLON.MeshBuilder.CreateDisc(name,{radius:r,tessellation:20},scene);
  if(opts.emissive){m.material=matEmit(hex,opts.emissive,opts.emissInt||1);}
  else{m.material=mat(hex,0.9);}
  m.material.backFaceCulling=false;
  m.rotation.x=Math.PI/2;
  if(!opts.noShadow) m.receiveShadows=true;
  return m;
}

// ===== COLLIDERS =====
const colliders=[];
function addCollider(cx,cz,hw,hd,height=100){
  colliders.push({minX:cx-hw,maxX:cx+hw,minZ:cz-hd,maxZ:cz+hd,height});
}
const PLAYER_RADIUS=0.55;
function resolveCollision(newX,newZ,py){
  for(const c of colliders){
    if(py>=c.height) continue;
    const px=Math.max(c.minX,Math.min(c.maxX,newX));
    const pz=Math.max(c.minZ,Math.min(c.maxZ,newZ));
    const dx=newX-px,dz=newZ-pz;
    const dist=Math.sqrt(dx*dx+dz*dz);
    if(dist<PLAYER_RADIUS){
      if(dist<0.001){newX+=PLAYER_RADIUS;}
      else{const push=PLAYER_RADIUS-dist;newX+=(dx/dist)*push;newZ+=(dz/dist)*push;}
    }
  }
  return{x:newX,z:newZ};
}

// ===== SOL =====
const ground=BABYLON.MeshBuilder.CreateGround('ground',{width:180,height:180},scene);
ground.material=mat('#0e1318',0.97);
ground.receiveShadows=true;

function road(x,z,w,d,col='#1a1d26'){
  const r=BABYLON.MeshBuilder.CreateGround('road'+Math.random(),{width:w,height:d},scene);
  r.material=mat(col,0.9);r.position.set(x,0.01,z);r.receiveShadows=true;
}
road(0,0,8,160);road(0,0,160,8);
road(-30,0,8,120,'#17192a');road(30,0,8,120,'#17192a');
road(0,-30,120,8,'#17192a');road(0,30,120,8,'#17192a');

// Marquages au sol
const dashMat=matEmit('#ffffff','#ffffff',0.2);
for(let i=-70;i<70;i+=10){
  const d1=BABYLON.MeshBuilder.CreateGround('d'+i,{width:0.2,height:5},scene);
  d1.material=dashMat;d1.position.set(0,0.02,i);
  const d2=BABYLON.MeshBuilder.CreateGround('d2'+i,{width:5,height:0.2},scene);
  d2.material=dashMat;d2.position.set(i,0.02,0);
}

function sidewalk(x,z,w,d){
  const s=box('sw'+Math.random(),w,0.09,d,'#1e2130',{rough:0.9,noShadow:true});
  s.position.set(x,0.045,z);
}
sidewalk(0,0,160,5.5);sidewalk(0,0,5.5,160);
sidewalk(-30,0,5.5,100);sidewalk(30,0,5.5,100);
sidewalk(0,-30,100,5.5);sidewalk(0,30,100,5.5);

// ===== PARC CENTRAL =====
const parkGrass=BABYLON.MeshBuilder.CreateGround('park',{width:38,height:38},scene);
parkGrass.material=mat('#1a3a1a',0.95);parkGrass.position.set(0,0.015,0);parkGrass.receiveShadows=true;

// Allées du parc
[[0,0,2,38],[0,0,38,2],[-9,0,2,19],[9,0,2,19],[0,-9,19,2],[0,9,19,2]].forEach(p=>{
  const path=BABYLON.MeshBuilder.CreateGround('path'+Math.random(),{width:p[2],height:p[3]},scene);
  path.material=mat('#252838',0.9);path.position.set(p[0],0.02,p[1]);path.receiveShadows=true;
});

// Fontaine centrale
(function(){
  const base=cyl('fbase',3.2,3.5,0.7,'#2a3560',{tess:24});base.position.set(0,0.35,0);
  const water=cyl('fwater',2.8,2.8,0.08,'#1a6aa0',{tess:24,emissive:'#0077dd',emissInt:0.5,noShadow:true});
  water.material.alpha=0.85;water.position.set(0,0.72,0);
  const col2=cyl('fcol',0.2,0.24,2.5,'#3a4070',{tess:10});col2.position.set(0,1.95,0);
  const top2=cyl('ftop',1,0.7,0.2,'#3a4070',{tess:20});top2.position.set(0,3.3,0);
  const ball2=sph('fball',0.28,'#4488ff',{emissive:'#2266ff',emissInt:1.2});ball2.position.set(0,3.65,0);
  for(let a=0;a<6;a++){
    const angle=a/6*Math.PI*2;
    const jet=cyl('fjet'+a,0.04,0.04,1.8,'#aaddff',{tess:6,emissive:'#aaddff',emissInt:0.5});
    jet.position.set(Math.cos(angle)*0.6,3.3,Math.sin(angle)*0.6);
    jet.rotation.z=0.3;jet.rotation.y=angle;
  }
  addCollider(0,0,3.5,3.5,4);
})();

// Bancs
const benchPositions=[[-6,-6],[6,-6],[-6,6],[6,6],[-10,0],[10,0],[0,-10],[0,10],
                      [-6,-14],[6,-14],[-14,-6],[-14,6],[14,-6],[14,6],[-6,14],[6,14]];
benchPositions.forEach(p=>{
  const seat=box('seat'+p,2.2,0.12,0.55,'#1a3a5a',{rough:0.7,metal:0.3});seat.position.set(p[0],0.5,p[1]);
  const back=box('back'+p,2.2,0.5,0.1,'#1a3a5a',{rough:0.7,metal:0.3});back.position.set(p[0],0.76,p[1]-0.22);
  [-0.9,0.9].forEach(s=>{
    const leg=box('leg'+p+s,0.1,0.5,0.45,'#334466',{rough:0.5,metal:0.5});leg.position.set(p[0]+s,0.25,p[1]);
  });
  addCollider(p[0],p[1],1.1,0.4,0.65);
});

// Arbres parc
const treePark=[[-8,-8],[8,-8],[-8,8],[8,8],[-12,-12],[12,-12],[-12,12],[12,12],
                [-4,-13],[4,-13],[-13,-4],[-13,4],[13,-4],[13,4],[-4,13],[4,13]];
treePark.forEach((p,idx)=>{
  const h=2.8+Math.random()*1.5;
  const trunk=cyl('pktr'+idx,0.15,0.2,h,'#2a3a1a',{rough:0.9,tess:7});trunk.position.set(p[0],h/2,p[1]);
  const r=1.2+Math.random()*0.5;
  const lc=Math.random()<0.5?'#1a4020':'#1a3515';
  const leaf=sph('pkl'+idx,r,lc,{rough:0.8});leaf.position.set(p[0],h+r*0.7,p[1]);

function building(x,z,w,h,d,wallHex,glowHex){
  const b=box('bld'+x+'_'+z,w,h,d,wallHex,{rough:0.8,metal:0.1});
  b.position.set(x,h/2,z);

  // Bande néon bas
  const nb=box('bldnb'+x+z,w+0.1,0.2,d+0.1,glowHex,{emissive:glowHex,emissInt:1.2,noShadow:true});
  nb.position.set(x,0.4,z);
  // Bande néon haut
  const nt=box('bldnt'+x+z,w+0.1,0.2,d+0.1,glowHex,{emissive:glowHex,emissInt:1.2,noShadow:true});
  nt.position.set(x,h-0.05,z);

  // Fenêtres (plaquées sur façade)
  const cols=Math.max(1,Math.floor(w/2.2));
  const rows=Math.max(1,Math.floor(h/3.2));
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      if(Math.random()<0.65){
        const wc=Math.random()<0.5?glowHex:'#ffffcc';
        const win=box('win'+x+z+r+c,0.65,1.0,0.05,wc,{emissive:wc,emissInt:0.6+Math.random()*0.5,noShadow:true});
        win.position.set(x-w/2+0.8+c*(w-0.6)/(Math.max(cols-1,1)),1.5+r*3.2,z+d/2+0.03);
      }
    }
  }
  // Antenne
  const ant=box('ant'+x+z,0.18,2.5,0.18,'#334455',{rough:0.5,metal:0.3});ant.position.set(x,h+1.25,z);
  const antL=sph('antl'+x+z,0.18,'#ff2222',{emissive:'#ff0000',emissInt:2,noShadow:true});antL.position.set(x,h+2.7,z);

  addCollider(x,z,w/2+0.1,d/2+0.1,100);
}

    currentModel=result.meshes;
    const root=result.meshes[0];
    root.parent=avatarRoot;root.position.set(0,0,0);

    // Normaliser hauteur
    let bb=new BABYLON.BoundingInfo(new BABYLON.Vector3(-0.5,0,-0.5),new BABYLON.Vector3(0.5,1.75,0.5));
    root.refreshBoundingInfo();
    const size=root.getHierarchyBoundingVectors();
    const modelH=(size.max.y-size.min.y)||1.75;
    const scale=1.75/modelH;root.scaling.setAll(scale);
    root.position.y=-(size.min.y*scale);

    // Ombres
    result.meshes.forEach(m=>{if(m.geometry){m.receiveShadows=true;addShadow(m);}});

    // Animations
    if(result.animationGroups&&result.animationGroups.length>0){
      result.animationGroups.forEach(g=>g.stop());
      const ag=result.animationGroups[0];
      ag.loopAnimation=loop;ag.start(loop,1,ag.from,ag.to,false);
      currentAnim=ag;
      if(onDone) onDone(ag);
    }
  }).catch(()=>{avatarCap.isVisible=true;});
}

const joyBase=document.getElementById('joy-base'),joyKnob=document.getElementById('joy-knob');
const JR=40;const joy={active:false,x:0,y:0,id:null};
function getJC(){const r=joyBase.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
function updateJoy(cx,cy){const c=getJC();let dx=cx-c.x,dy=cy-c.y;const d=Math.sqrt(dx*dx+dy*dy);if(d>JR){dx=dx/d*JR;dy=dy/d*JR;}joy.x=dx/JR;joy.y=dy/JR;joyKnob.style.transform=`translate(${dx}px,${dy}px)`;}
joyBase.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];joy.active=true;joy.id=t.identifier;updateJoy(t.clientX,t.clientY);},{passive:false});
document.addEventListener('touchmove',e=>{if(!joy.active)return;for(const t of e.changedTouches)if(t.identifier===joy.id){e.preventDefault();updateJoy(t.clientX,t.clientY);}},{passive:false});
document.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===joy.id){joy.active=false;joy.x=0;joy.y=0;joyKnob.style.transform='translate(0,0)';}});

const JUMP_V_NORMAL=8;const JUMP_V_SUPER=19;const GRAVITY=26;
let jumpVel=0,isOnGround=true,jumpTapCount=0,jumpTapTimer=null;
function doJump(){
  if(!isOnGround) return;
  jumpTapCount++;clearTimeout(jumpTapTimer);
  if(jumpTapCount>=2){
    jumpTapCount=0;jumpVel=JUMP_V_SUPER;isOnGround=false;showToast('🚀 SUPER SAUT !');
  } else {
    jumpTapTimer=setTimeout(()=>{if(jumpTapCount===1&&isOnGround){jumpVel=JUMP_V_NORMAL;isOnGround=false;}jumpTapCount=0;},280);
  }
}

  const div=document.createElement('div');div.className='cmsg';
  div.innerHTML=`<span class="cn">${from}</span>${text}`;
  msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;
  while(msgs.children.length>20)msgs.removeChild(msgs.firstChild);
}
function sendChat(){const inp=document.getElementById('cinput');const msg=inp.value.trim();if(!msg)return;inp.value='';addChat(msg,profile.pseudo);showBubble(msg);}
document.getElementById('csend').addEventListener('click',sendChat);
document.getElementById('cinput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendChat();}});
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2500);}

// ===== BOUCLE PRINCIPALE =====
const SPEED=5.5,BOUNDARY=54;
const playerPos={x:0,y:0,z:6};
let playerRotY=0,cameraYaw=Math.PI;
const CAM_DIST=7,CAM_HEIGHT=2.4,CAM_LOOK_Y=1.1,CAM_LERP=4;
let holoAngle=0;
let lastTime=performance.now();

finishLoading();

engine.runRenderLoop(()=>{
  const now=performance.now();
  const dt=Math.min((now-lastTime)/1000,0.08);lastTime=now;

  // Rotation hologrammes
  holoAngle+=dt*0.6;
  holoMeshes.forEach((h,i)=>{h.rotation.y=holoAngle+i*Math.PI*0.4;});

  let mx=joy.x,mz=-joy.y;
  if(keys['ArrowUp']||keys['w']||keys['W'])mz=1;
  if(keys['ArrowDown']||keys['s']||keys['S'])mz=-1;
  if(keys['ArrowLeft']||keys['a']||keys['A'])mx=-1;
  if(keys['ArrowRight']||keys['d']||keys['D'])mx=1;
  if(keys[' ']&&isOnGround){doJump();}
  if(camJoy.active&&Math.abs(camJoy.x)>0.04)cameraYaw-=camJoy.x*2.2*dt;
  if(keys['q']||keys['Q'])cameraYaw+=1.8*dt;
  if(keys['e']||keys['E'])cameraYaw-=1.8*dt;

  const moving=Math.abs(mx)>0.05||Math.abs(mz)>0.05;
  if(moving&&emoteTimerGLB){clearTimeout(emoteTimerGLB);emoteTimerGLB=null;}
  if(isOnGround) setWalkSwap(moving);

  if(moving){
    const sinC=Math.sin(cameraYaw),cosC=Math.cos(cameraYaw);
    const dx=(sinC*(-mz)+cosC*mx)*SPEED*dt;
    const dz=(cosC*(-mz)-sinC*mx)*SPEED*dt;
    let newX=playerPos.x+dx,newZ=playerPos.z+dz;
    const r=resolveCollision(newX,newZ,playerPos.y);
    newX=r.x;newZ=r.z;
    playerPos.x=Math.max(-BOUNDARY,Math.min(BOUNDARY,newX));
    playerPos.z=Math.max(-BOUNDARY,Math.min(BOUNDARY,newZ));
    playerRotY=Math.atan2(dx,dz);
    const tY=playerRotY+Math.PI;let diff=tY-cameraYaw;
    while(diff>Math.PI)diff-=2*Math.PI;while(diff<-Math.PI)diff+=2*Math.PI;
    cameraYaw+=diff*Math.min(CAM_LERP*dt,1.0);
  }

  if(!isOnGround){
    jumpVel-=GRAVITY*dt;playerPos.y+=jumpVel*dt;
    if(playerPos.y<=0){playerPos.y=0;jumpVel=0;isOnGround=true;setWalkSwap(moving);}
  }

  avatarRoot.position.x=playerPos.x;avatarRoot.position.y=playerPos.y;avatarRoot.position.z=playerPos.z;
  avatarRoot.rotation.y=playerRotY;
  shadowBlob.position.x=playerPos.x;shadowBlob.position.z=playerPos.z;

  // Caméra
  const camX=playerPos.x+Math.sin(cameraYaw)*CAM_DIST;
  const camZ=playerPos.z+Math.cos(cameraYaw)*CAM_DIST;
  camera.position.set(camX,playerPos.y+CAM_HEIGHT,camZ);
  camera.setTarget(new BABYLON.Vector3(playerPos.x,playerPos.y+CAM_LOOK_Y,playerPos.z));

  updateBubblePos();
  scene.render();
});

window.addEventListener('resize',()=>engine.resize());
</script>
