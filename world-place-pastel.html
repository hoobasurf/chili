<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Macadam World — Tokyo</title>
<link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=M+PLUS+Rounded+1c:wght@700;800&display=swap)" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#b0c8e8;font-family:'M PLUS Rounded 1c',sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;outline:none;}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;}
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,transparent 100%);}
.hud-logo{font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:900;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5);}
.hud-logo em{color:#f5c842;}
.hud-info{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:4px 10px;}
.hud-pic{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#e85d26,#f5c842);display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:900;color:#fff;}
.hud-name{color:#fff;font-size:.7rem;font-weight:700;}
.hud-chat{position:absolute;bottom:168px;left:10px;max-width:260px;pointer-events:all;}
.chat-msgs{max-height:80px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin-bottom:4px;}
.cmsg{background:rgba(0,0,0,.45);backdrop-filter:blur(6px);border-radius:7px;padding:3px 8px;font-size:.65rem;color:#fff;}
.cmsg .cn{font-weight:900;color:#f5c842;margin-right:3px;}
.chat-row{display:flex;gap:4px;}
.cinput{flex:1;background:rgba(0,0,0,.4);border:1.5px solid rgba(255,255,255,.25);border-radius:9px;padding:6px 10px;font-size:14px;color:#fff;}
.csend{width:32px;height:32px;border-radius:8px;background:#e85d26;border:none;color:#fff;}
#joy-wrap{position:absolute;bottom:90px;right:16px;pointer-events:all;}
#camjoy-wrap{position:absolute;bottom:90px;left:16px;pointer-events:all;}
.joy-base{width:96px;height:96px;border-radius:50%;background:rgba(0,0,0,.25);border:1.5px solid rgba(255,255,255,.18);position:relative;display:flex;align-items:center;justify-content:center;}
.joy-knob{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.7);position:absolute;}
.camjoy-knob{background:rgba(245,200,66,.8);}
#jump-btn,#superjump-btn{position:absolute;bottom:200px;width:48px;height:48px;border-radius:50%;border:none;color:#fff;font-size:1.2rem;}
#jump-btn{right:22px;background:#2b6cb0;}
#superjump-btn{left:22px;background:#c05621;}
#toast{position:fixed;bottom:188px;left:50%;transform:translateX(-50%) translateY(14px);background:rgba(0,0,0,.82);color:#f5c842;padding:6px 14px;border-radius:14px;font-size:.7rem;opacity:0;transition:all .25s;}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
#loading{position:fixed;inset:0;z-index:200;background:#b0c8e8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
.ld-logo{font-family:'Zen Kaku Gothic New',sans-serif;font-size:2.2rem;font-weight:900;color:#1a2a40;}
.ld-logo em{color:#e85d26;}
.ld-bar{width:180px;height:3px;background:rgba(0,0,0,.12);border-radius:2px;overflow:hidden;}
.ld-fill{height:100%;width:0;background:linear-gradient(90deg,#e85d26,#f5c842);transition:width .2s;}
.ld-txt{font-size:.7rem;color:rgba(26,42,64,.65);}
</style>
</head>

<body>
<canvas id="c"></canvas>

<div id="loading">
  <div class="ld-logo">TOKYO<em>東京</em></div>
  <div class="ld-bar"><div class="ld-fill" id="ld-fill"></div></div>
  <div class="ld-txt" id="ld-txt">Chargement…</div>
</div>

<div id="hud">
  <div class="hud-top">
    <div class="hud-logo">⬡ <em>Macadam</em> World</div>
    <div class="hud-info"><div class="hud-pic" id="hud-pic">MJ</div><span class="hud-name" id="hud-name">Joueur</span></div>
  </div>
  <div class="hud-chat">
    <div class="chat-msgs" id="chat-msgs"></div>
    <div class="chat-row">
      <input class="cinput" id="cinput" placeholder="Dis quelque chose…">
      <button class="csend" id="csend">➤</button>
    </div>
  </div>
  <div id="camjoy-wrap"><div class="joy-base" id="camjoy-base"><div class="joy-knob camjoy-knob" id="camjoy-knob"></div></div></div>
  <div id="joy-wrap"><div class="joy-base" id="joy-base"><div class="joy-knob" id="joy-knob"></div></div></div>
  <button id="jump-btn">↑</button>
  <button id="superjump-btn">🚀</button>
</div>

<div id="toast"></div>

<script type="importmap">
{
  "imports": {
    "three": "[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js)",
    "three/addons/": "[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/)"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// loading
document.getElementById('ld-fill').style.width='100%';
setTimeout(()=>document.getElementById('loading').style.display='none',600);

// chat
function addChat(text,from){
  const div=document.createElement('div');
  div.className='cmsg';div.innerHTML='<span class="cn">'+from+'</span>'+text;
  const msgs=document.getElementById('chat-msgs');msgs.appendChild(div);
  msgs.scrollTop=msgs.scrollHeight;
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2000);}

// Three.js
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8ab4d4);
scene.add(new THREE.HemisphereLight(0xffffff,0x666666,1));
const camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,300);
camera.position.set(0,3,8);
const g=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:0x888888}));
g.rotation.x=-Math.PI/2;scene.add(g);

// avatar
const loader=new GLTFLoader();
const avatar=new THREE.Group();scene.add(avatar);
avatar.position.set(0,0,6);
let mixer=null,lastWalking=false;
function loadGLB(file,loop=true){
  loader.load('[raw.githubusercontent.com](https://raw.githubusercontent.com/hoobasurf/chili/main/)'+file,g=>{
    avatar.clear();const m=g.scene;avatar.add(m);
    const box=new THREE.Box3().setFromObject(m);const size=box.getSize(new THREE.Vector3());
    m.scale.setScalar(1.75/size.y);m.position.y=-box.min.y*(1.75/size.y);
    if(g.animations.length){mixer=new THREE.AnimationMixer(m);const a=mixer.clipAction(g.animations[0]);a.setLoop(loop?THREE.LoopRepeat:THREE.LoopOnce);a.play();}
  });
}
loadGLB('attend.glb');
function setWalk(w){if(w===lastWalking)return;lastWalking=w;loadGLB(w?'course.glb':'attend.glb',true);}

// joystick
const joyBase=document.getElementById('joy-base'),joyKnob=document.getElementById('joy-knob');
const JR=38;const joy={x:0,y:0,active:false,id:null};
function getJC(){const r=joyBase.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
function updateJoy(cx,cy){const c=getJC();let dx=cx-c.x,dy=cy-c.y;const d=Math.sqrt(dx*dx+dy*dy);if(d>JR){dx=dx/d*JR;dy=dy/d*JR;}joy.x=dx/JR;joy.y=dy/JR;joyKnob.style.transform=`translate(${dx}px,${dy}px)`;}
joyBase.addEventListener('touchstart',e=>{const t=e.changedTouches[0];joy.active=true;joy.id=t.identifier;updateJoy(t.clientX,t.clientY);},{passive:false});
document.addEventListener('touchmove',e=>{if(!joy.active)return;for(const t of e.changedTouches)if(t.identifier===joy.id){updateJoy(t.clientX,t.clientY);}});
document.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===joy.id){joy.active=false;joy.x=0;joy.y=0;joyKnob.style.transform='translate(0,0)';}});

// mouvement
const player={x:0,y:0,z:6,vy:0,onGround:true};
let yaw=Math.PI,rotY=0;const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta();
  if(mixer)mixer.update(dt);
  let mx=joy.x,mz=-joy.y;
  const moving=Math.abs(mx)>0.05||Math.abs(mz)>0.05;
  setWalk(moving);
  if(moving){
    const dx=Math.sin(yaw)*-mz+Math.cos(yaw)*mx;
    const dz=Math.cos(yaw)*-mz-Math.sin(yaw)*mx;
    player.x+=dx*dt*5;player.z+=dz*dt*5;
    rotY=Math.atan2(dx,dz);
  }
  avatar.position.set(player.x,player.y,player.z);
  avatar.rotation.y=rotY;
  camera.position.set(player.x+Math.sin(yaw)*7,2.4,player.z+Math.cos(yaw)*7);
  camera.lookAt(player.x,1.1,player.z);
  renderer.render(scene,camera);
}
animate();

// --- LOGGER D’ERREURS ---
window.onerror = (msg,url,line,col,error)=>{
  const box=document.createElement('div');
  box.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#d33;color:#fff;font:14px monospace;padding:6px;z-index:9999;white-space:pre-wrap;';
  box.textContent='⚠️ '+msg+(line?' (ligne '+line+')':'')+(error&&error.stack?'\n'+error.stack:'');
  document.body.appendChild(box);
  setTimeout(()=>box.remove(),10000);
};
window.addEventListener('unhandledrejection',ev=>{
  const box=document.createElement('div');
  box.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#e68b12;color:#fff;font:14px monospace;padding:6px;z-index:9999;white-space:pre-wrap;';
  box.textContent='🚨 Rejet: '+ev.reason;
  document.body.appendChild(box);
  setTimeout(()=>box.remove(),10000);
});
</script>
</body>
</html>
