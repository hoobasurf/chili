<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnostic 3D — Macadam</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0e0620;color:white;font-family:sans-serif}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;padding:20px}
canvas{display:block}
</style>
</head>
<body>
<div id="msg">⏳ Initialisation…</div>
<script>
function show(txt){document.getElementById('msg').innerHTML=txt;}
try{
  show('Chargement de Three.js…');
  const s=document.createElement('script');
  s.src='[unpkg.com](https://unpkg.com/three@0.121.1/build/three.min.js)';
  s.onload=start; s.onerror=()=>show('❌ Échec du chargement du script Three.js (bloqué ? réseau ?)');
  document.head.appendChild(s);
}catch(e){show('Erreur : '+e.message);}
function start(){
  try{
    if(typeof THREE==='undefined'){show('❌ Three.js absent : variable non trouvée');return;}
    const renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(innerWidth,innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene=new THREE.Scene();
    scene.background=new THREE.Color(0x99ccff);
    const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,100);
    camera.position.z=3;
    const light=new THREE.PointLight(0xffffff,1);
    light.position.set(2,2,3);
    scene.add(light);
    const cube=new THREE.Mesh(
      new THREE.BoxGeometry(1,1,1),
      new THREE.MeshPhongMaterial({color:0xff77aa})
    );
    scene.add(cube);
    show('');
    function loop(){
      cube.rotation.x+=0.01;cube.rotation.y+=0.013;
      renderer.render(scene,camera);
      requestAnimationFrame(loop);
    }
    loop();
  }catch(e){show('⚠️ Erreur pendant init :<br>'+e.message);}
}
</script>
</body>
</html>
