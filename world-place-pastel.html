<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test WebGL simple</title>
</head>
<body style="margin:0;background:#aac;color:#000;font-family:sans-serif;font-size:18px;display:flex;align-items:center;justify-content:center;height:100vh;">
<canvas id="glcanvas" width="200" height="200"></canvas>
<script>
const canvas=document.getElementById('glcanvas');
const gl=canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
if(!gl){
  document.body.innerHTML='❌ WebGL non pris en charge ou désactivé';
}else{
  document.body.innerHTML='✅ WebGL actif — ton navigateur peut afficher la 3D';
}
</script>
</body>
</html>
