<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Macadam World — Place Pastel</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--pink:#FF6EB4;--mint:#3DDBB8;--yellow:#FFD747;--lav:#B388FF;--sky:#5BC8F5;--dark:#12082A;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0618;font-family:'Nunito',sans-serif;user-select:none;-webkit-user-select:none;}
#canvas-container{position:fixed;inset:0;}
canvas{display:block;width:100%!important;height:100%!important;}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;}
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(180deg,rgba(18,8,42,.85) 0%,transparent 100%);}
.hud-logo{font-family:'Baloo 2',cursive;font-size:1.1rem;font-weight:800;color:white;text-shadow:0 2px 8px rgba(0,0,0,.5);}
.hud-logo span{color:var(--pink);}
.hud-location{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:5px 12px;}
.hud-location span{font-size:.75rem;font-weight:800;color:white;}
.loc-dot{width:7px;height:7px;border-radius:50%;background:var(--mint);flex-shrink:0;animation:pulsedot 2s infinite;}
@keyframes pulsedot{0%,100%{box-shadow:0 0 0 0 rgba(61,219,184,.6);}50%{box-shadow:0 0 0 5px rgba(61,219,184,0);}}
.hud-info{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:5px 12px 5px 6px;}
.hud-pic{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--lav));display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:900;color:white;border:2px solid rgba(255,255,255,.2);}
.hud-pseudo{font-size:.75rem;font-weight:800;color:white;}
.hud-chat{position:absolute;bottom:148px;left:12px;right:12px;max-width:300px;pointer-events:all;}
.chat-messages{max-height:110px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;margin-bottom:6px;scrollbar-width:none;}
.chat-messages::-webkit-scrollbar{display:none;}
.chat-msg{background:rgba(0,0,0,.22);border:none;border-radius:10px;padding:5px 10px;font-size:.7rem;color:rgba(255,255,255,.9);animation:fadeup .3s ease;line-height:1.4;}
@keyframes fadeup{from{opacity:0;transform:translateY(4px);}to{opacity:1;}}
.chat-msg .name{font-weight:900;color:var(--pink);margin-right:4px;}
.chat-input-wrap{display:flex;gap:6px;}
.chat-input{flex:1;background:rgba(0,0,0,.15);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px 12px;font-size:16px;font-weight:700;color:white;outline:none;font-family:'Nunito',sans-serif;}
.chat-input::placeholder{color:rgba(255,255,255,.2);}
.chat-input:focus{border-color:var(--pink);}
.chat-send{width:36px;height:36px;border-radius:10px;background:rgba(255,110,180,.55);border:none;color:white;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;pointer-events:all;flex-shrink:0;}
#joystick-zone{position:absolute;bottom:24px;right:24px;width:110px;height:110px;pointer-events:all;}
.joy-base{width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.14);backdrop-filter:blur(8px);position:relative;display:flex;align-items:center;justify-content:center;}
.joy-knob{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--lav));box-shadow:0 4px 16px rgba(255,110,180,.45);position:absolute;}
#cam-joystick-zone{position:absolute;top:0;bottom:0;left:0;width:44%;pointer-events:all;}
.cam-joy-base{width:100%;height:100%;position:relative;}
.cam-joy-knob{display:none;}
.cam-joy-label{display:none;}
#btn-emote{position:absolute;bottom:44px;right:148px;width:50px;height:50px;border-radius:50%;background:rgba(61,219,184,.12);border:2px solid var(--mint);color:var(--mint);font-size:1.2rem;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:all;backdrop-filter:blur(8px);}
#btn-emote:active{transform:scale(.9);}
.toast{position:fixed;bottom:170px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(18,8,42,.92);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(12px);color:white;padding:8px 18px;border-radius:20px;font-size:.78rem;font-weight:800;opacity:0;transition:all .3s;z-index:50;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#speech-bubble{position:fixed;z-index:20;background:white;color:#12082A;border-radius:12px;padding:5px 11px;font-size:.72rem;font-weight:800;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:150px;text-align:center;transform:translateX(-50%);opacity:0;transition:opacity .3s;white-space:nowrap;}
#speech-bubble::after{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:white;border-bottom:none;}
#loading-screen{position:fixed;inset:0;z-index:100;background:#0e0620;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .6s;}
#loading-screen.hidden{opacity:0;pointer-events:none;}
.load-logo{font-family:'Baloo 2',cursive;font-size:2.5rem;font-weight:800;color:white;}
.load-logo .c1{color:var(--pink);}.load-logo .c2{color:var(--yellow);}.load-logo .c3{color:var(--mint);}.load-logo .c4{color:var(--sky);}
.load-bar-wrap{width:200px;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;}
.load-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--pink),var(--lav));border-radius:2px;transition:width .25s;}
.load-txt{font-size:.76rem;color:rgba(255,255,255,.4);font-weight:700;}
</style>
</head>
<body>

<div id="canvas-container"></div>

<div id="loading-screen">
  <div class="load-logo">
    <span class="c1">M</span><span class="c2">A</span><span class="c3">C</span><span class="c4">A</span><span class="c1">D</span><span class="c2">A</span><span class="c3">M</span>
  </div>
  <div class="load-bar-wrap"><div class="load-bar" id="load-bar"></div></div>
  <div class="load-txt" id="load-txt">Chargement de Place Pastel…</div>
</div>

<div id="hud">
  <div class="hud-top">
    <div class="hud-logo">✦ <span>Macadam</span> World</div>
    <div class="hud-location"><div class="loc-dot"></div><span>Place Pastel</span></div>
    <div class="hud-info">
      <div class="hud-pic" id="hud-pic">?</div>
      <span class="hud-pseudo" id="hud-pseudo">Joueur</span>
    </div>
  </div>
  <div class="hud-chat">
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-wrap">
      <input class="chat-input" id="chat-input" type="text" placeholder="Dis quelque chose…" maxlength="80" autocomplete="off"/>
      <button class="chat-send" id="chat-send">➤</button>
    </div>
  </div>
  <div id="btn-emote">🌸</div>
  <div id="joystick-zone">
    <div class="joy-base" id="joy-base">
      <div class="joy-knob" id="joy-knob"></div>
    </div>
  </div>
  <div id="cam-joystick-zone">
    <div class="cam-joy-base" id="cam-joy-base">
      <div class="cam-joy-knob" id="cam-joy-knob"></div>
      <span class="cam-joy-label">📷 Caméra</span>
    </div>
  </div>
</div>

<div id="speech-bubble"></div>
<div class="toast" id="toast"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ===== PROFIL =====
function loadProfile() {
  try {
    const uid = localStorage.getItem('macadam_user_id') || ('p_' + Math.random().toString(36).slice(2,8));
    localStorage.setItem('macadam_user_id', uid);
    const saved = JSON.parse(localStorage.getItem('macadam_avatar_' + uid) || 'null');
    return { pseudo: saved?.pseudo || 'Joueur', glbUrl: saved?.glbUrl || null };
  } catch(e) { return { pseudo: 'Joueur', glbUrl: null }; }
}
const profile = loadProfile();
document.getElementById('hud-pseudo').textContent = profile.pseudo;
document.getElementById('hud-pic').textContent = profile.pseudo.slice(0,2).toUpperCase();

// ===== LOADING =====
let loadPct = 0;
const loadBar = document.getElementById('load-bar');
const loadTxt = document.getElementById('load-txt');
const loadMsgs = ['Chargement de Place Pastel…','Plantation des arbres…','Remplissage de la fontaine…','Presque prêt…'];
let loadMsgIdx = 0;
const loadInterval = setInterval(() => {
  loadPct += Math.random() * 14;
  if (loadPct > 90) { loadPct = 90; clearInterval(loadInterval); }
  loadBar.style.width = loadPct + '%';
  const idx = Math.min(Math.floor(loadPct / 25), loadMsgs.length - 1);
  if (idx > loadMsgIdx) { loadMsgIdx = idx; loadTxt.textContent = loadMsgs[loadMsgIdx]; }
}, 200);

function finishLoading() {
  clearInterval(loadInterval);
  loadBar.style.width = '100%';
  loadTxt.textContent = 'Bienvenue à Place Pastel !';
  setTimeout(() => {
    const ls = document.getElementById('loading-screen');
    ls.classList.add('hidden');
    setTimeout(() => ls.style.display = 'none', 700);
  }, 400);
  addChat('🌸 Bienvenue, ' + profile.pseudo + ' !', 'Macadam');
  addChat('💬 Joystick droit = marcher | Joystick gauche = caméra', 'Système');
}

// ===== RENDERER =====
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('canvas-container').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xC8E8FF);
scene.fog = new THREE.FogExp2(0xD0EDFF, 0.015);

const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 300);

// ===== LUMIÈRES =====
scene.add(new THREE.AmbientLight(0xfff0e8, 0.75));
const sun = new THREE.DirectionalLight(0xfff4d0, 2.5);
sun.position.set(20, 40, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 120;
sun.shadow.camera.left = sun.shadow.camera.bottom = -40;
sun.shadow.camera.right = sun.shadow.camera.top = 40;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xB8E8FF, 0x88C880, 0.9));
const fillLight = new THREE.DirectionalLight(0xe8f0ff, 0.6);
fillLight.position.set(-10, 15, -10);
scene.add(fillLight);

// ===== HELPERS =====
function mkBox(w,h,d,color){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color}));m.castShadow=true;m.receiveShadow=true;return m;}
function mkCyl(rt,rb,h,seg,color){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),new THREE.MeshStandardMaterial({color}));m.castShadow=true;m.receiveShadow=true;return m;}
function mkSph(r,color,emissive=false){const mat=new THREE.MeshStandardMaterial({color});if(emissive){mat.emissive=new THREE.Color(color);mat.emissiveIntensity=0.5;}const m=new THREE.Mesh(new THREE.SphereGeometry(r,12,12),mat);m.castShadow=true;m.receiveShadow=true;return m;}

// ===== SOL =====
const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:0xE8DDD0,roughness:0.92}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
for(let r=0;r<3;r++){
  const radii=[9,6,3.5],colors=[0xDDD0C0,0xEADDCC,0xF5EEE0];
  const ring=new THREE.Mesh(new THREE.CylinderGeometry(radii[r],radii[r],0.04+r*0.01,r===0?32:24),new THREE.MeshStandardMaterial({color:colors[r],roughness:0.75}));
  ring.position.y=0.01+r*0.01;ring.receiveShadow=true;scene.add(ring);
}
for(let i=0;i<8;i++){
  const angle=(i/8)*Math.PI*2;
  const ray=new THREE.Mesh(new THREE.PlaneGeometry(0.3,9),new THREE.MeshStandardMaterial({color:0xD0C4B4}));
  ray.rotation.x=-Math.PI/2;ray.rotation.z=angle;
  ray.position.set(Math.cos(angle)*4.5,0.035,Math.sin(angle)*4.5);
  ray.receiveShadow=true;scene.add(ray);
}
[0,Math.PI/2].forEach(ry=>{
  const a=new THREE.Mesh(new THREE.PlaneGeometry(40,1.6),new THREE.MeshStandardMaterial({color:0xD8CCBC}));
  a.rotation.x=-Math.PI/2;a.rotation.z=ry;a.position.y=0.04;a.receiveShadow=true;scene.add(a);
});

// ===== FONTAINE =====
(function(){
  const basin=mkCyl(2.5,2.8,0.62,24,0xD4C4F0);basin.position.y=0.31;scene.add(basin);
  const water=new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.2,0.06,24),new THREE.MeshStandardMaterial({color:0xA8D8FF,roughness:0.05,metalness:0.4,transparent:true,opacity:0.88}));water.position.y=0.6;scene.add(water);
  const col=mkCyl(0.18,0.22,2.2,12,0xC8B8E8);col.position.y=1.72;scene.add(col);
  const topBowl=mkCyl(0.85,0.6,0.18,20,0xD4C4F0);topBowl.position.y=2.92;scene.add(topBowl);
  const ball=new THREE.Mesh(new THREE.SphereGeometry(0.22,12,12),new THREE.MeshStandardMaterial({color:0xB8E8FF,roughness:0.1,metalness:0.5}));ball.position.y=3.22;scene.add(ball);
  const fl=new THREE.PointLight(0xA8D8FF,1.2,8);fl.position.y=1.5;scene.add(fl);
})();

// ===== BÂTIMENTS =====
function mkBuilding(px,pz,w,h,d,wallColor,roofColor,accentColor){
  const wall=mkBox(w,h,d,wallColor);wall.position.set(px,h/2,pz);scene.add(wall);
  const roof=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*0.72,h*0.44,4),new THREE.MeshStandardMaterial({color:roofColor}));
  roof.position.set(px,h+h*0.22,pz);roof.rotation.y=Math.PI/4;roof.castShadow=true;scene.add(roof);
  const aw=mkBox(w+1.6,0.14,1.9,accentColor);aw.position.set(px,h*0.46,pz+d/2+0.8);aw.rotation.x=0.16;scene.add(aw);
  [-w/2+0.5,w/2-0.5].forEach(sx=>{
    const sup=mkBox(0.1,0.8,0.1,accentColor);sup.position.set(px+sx,h*0.46-0.4,pz+d/2+0.1);scene.add(sup);
  });
  [[-w*0.24,h*0.58],[w*0.24,h*0.58],[0,h*0.75]].forEach(wp=>{
    const wframe=mkBox(1.1,1.4,0.1,0xffffff);wframe.position.set(px+wp[0],wp[1],pz+d/2+0.01);scene.add(wframe);
    const wglass=new THREE.Mesh(new THREE.BoxGeometry(0.85,1.1,0.06),new THREE.MeshStandardMaterial({color:0xA8D8FF,transparent:true,opacity:0.7}));
    wglass.position.set(px+wp[0],wp[1],pz+d/2+0.05);scene.add(wglass);
  });
  const door=mkBox(0.9,1.5,0.1,accentColor);door.position.set(px,0.75,pz+d/2+0.01);scene.add(door);
  const doorTop=new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.45,0.1,16,1,false,0,Math.PI),new THREE.MeshStandardMaterial({color:accentColor}));
  doorTop.rotation.z=Math.PI/2;doorTop.position.set(px,1.5,pz+d/2+0.01);scene.add(doorTop);
}
mkBuilding(-18,-14,8,9,6,0xA8E6CF,0x5BAF82,0xFF9EBB);
mkBuilding(18,-14,7,10,6,0xD4C5F9,0x9B7FD4,0xFFD6EC);
mkBuilding(-12,-23,5,7,5,0xFFCFB0,0xE8855A,0xB8E8D8);
mkBuilding(12,-23,6,9,5,0xB8E8D8,0x5BADAB,0xFFE0B2);
mkBuilding(-22,-4,6,8,5,0xFFE4B5,0xE8A020,0xFF9EBB);
mkBuilding(22,-4,6,8,5,0xF8C8E0,0xC86898,0xB8E8D8);
mkBuilding(0,-26,9,6,7,0xDEF0FF,0x8BB8E8,0xFFD747);

// ===== ARBRES =====
[[-6,-8,2.2,2],[6,-8,2.0,1.8],[-14,-5,2.5,2.2],[14,-5,2.2,2],
 [-8,5,1.9,1.7],[8,5,1.8,1.6],[-18,5,2.0,1.9],[18,5,2.0,1.9],
 [-4,12,1.7,1.5],[4,12,1.7,1.5]
].forEach(t=>{
  const[x,z,h,r]=t;
  const trunk=mkCyl(0.18,0.24,h,8,0x8B6914);trunk.position.set(x,h/2,z);scene.add(trunk);
  [[0,r,0],[r*-.7,r*.7,0],[r*.7,r*.7,0]].forEach((off,i)=>{
    const leaf=mkSph(r*(.55+i*.07),[0x5CC87A,0x48B868,0x7DD87A][i]);
    leaf.position.set(x+off[0],h+off[1],z+off[2]);scene.add(leaf);
  });
});

// ===== BANCS =====
[[5,0,0],[-5,0,0],[0,5,Math.PI/2],[0,-5,Math.PI/2]].forEach(b=>{
  const g=new THREE.Group();
  const seat=mkBox(2.5,0.15,0.62,0xC8A878);seat.position.y=0.5;g.add(seat);
  [-1,1].forEach(s=>{const leg=mkBox(0.14,0.5,0.5,0xA88858);leg.position.set(s,0.25,0);g.add(leg);});
  g.position.set(b[0],0,b[1]);g.rotation.y=b[2];scene.add(g);
});

// ===== LAMPADAIRES =====
[[4,4],[-4,4],[4,-4],[-4,-4],[10,1],[-10,1],[0,11]].forEach(p=>{
  const pole=mkCyl(0.07,0.09,5.2,8,0xC0A8F0);pole.position.set(p[0],2.6,p[1]);scene.add(pole);
  const lamp=mkSph(0.28,0xFFE87A,true);lamp.position.set(p[0],5.3,p[1]);scene.add(lamp);
  const pl=new THREE.PointLight(0xFFE87A,0.7,9);pl.position.set(p[0],5.3,p[1]);scene.add(pl);
});

// ===== FLEURS =====
[[3.5,0],[-3.5,0],[0,3.5],[0,-3.5],[5,3],[-5,3],[3,-5],[-3,-5],[7,-2],[-7,-2],[2,7],[-2,7]].forEach((p,i)=>{
  const colors=[0xFF9EBB,0xFFD6EC,0xC5B5FF,0xA8E6CF,0xFFE87A];
  const f=mkSph(0.18,colors[i%colors.length]);
  f.material.emissive=new THREE.Color(colors[i%colors.length]);f.material.emissiveIntensity=0.12;
  f.position.set(p[0],0.18,p[1]);scene.add(f);
  const stem=mkCyl(0.03,0.03,0.2,6,0x5CC87A);stem.position.set(p[0],0.08,p[1]);scene.add(stem);
});

// ===== NUAGES =====
const clouds=[];
[[18,14,-18,4],[-12,16,-22,5],[5,12,-30,3.5],[-25,15,-10,4.5],[30,18,-5,3]].forEach(c=>{
  const g=new THREE.Group();
  [[0,0,0,c[3]],[c[3]*1.1,.3,0,c[3]*.75],[-c[3]*.9,.2,0,c[3]*.7],[c[3]*.4,-.2,c[3]*.6,c[3]*.6]].forEach(p=>{
    const cloud=new THREE.Mesh(new THREE.SphereGeometry(p[3],8,8),new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:0.88}));
    cloud.position.set(p[0],p[1],p[2]);g.add(cloud);
  });
  g.position.set(c[0],c[1],c[2]);scene.add(g);
  clouds.push({mesh:g,speed:0.8+Math.random()*0.6});
});

// ===== AVATAR =====
const avatarGroup = new THREE.Group();
avatarGroup.position.set(0, 0, 6);
scene.add(avatarGroup);

// Référence aux bones Avaturn/RPM
const bones = {};
const BONE_NAMES = {
  hips:      ['mixamorigHips','Hips','pelvis'],
  spine:     ['mixamorigSpine','Spine','spine_01'],
  spine1:    ['mixamorigSpine1','Spine1','spine_02'],
  neck:      ['mixamorigNeck','Neck','neck_01'],
  head:      ['mixamorigHead','Head','head'],
  armR:      ['mixamorigRightArm','RightArm','upperarm_r'],
  foreArmR:  ['mixamorigRightForeArm','RightForeArm','lowerarm_r'],
  armL:      ['mixamorigLeftArm','LeftArm','upperarm_l'],
  foreArmL:  ['mixamorigLeftForeArm','LeftForeArm','lowerarm_l'],
  upLegR:    ['mixamorigRightUpLeg','RightUpLeg','thigh_r'],
  legR:      ['mixamorigRightLeg','RightLeg','calf_r'],
  upLegL:    ['mixamorigLeftUpLeg','LeftUpLeg','thigh_l'],
  legL:      ['mixamorigLeftLeg','LeftLeg','calf_l'],
};

function findBones(model) {
  model.traverse(n => {
    if (!n.isBone && n.type !== 'Bone') return;
    for (const [key, names] of Object.entries(BONE_NAMES)) {
      if (!bones[key] && names.some(nm => n.name === nm || n.name.endsWith(nm))) {
        bones[key] = n;
      }
    }
  });
  const found = Object.keys(bones).join(', ');
  console.log('Bones trouvés:', found || 'AUCUN');
}

const boneRestRot = {};
function saveRestPose() {
  for (const [key, bone] of Object.entries(bones)) {
    boneRestRot[key] = bone.rotation.clone();
  }
}

let walkTime = 0;

function animateBones(dt, walking) {
  if (Object.keys(bones).length === 0) return;
  walkTime += dt * (walking ? 7.0 : 1.2);
  const sw = Math.sin(walkTime);
  const speed = walking ? 1.0 : 0.08;
  if (bones.hips) {
    bones.hips.rotation.z = (boneRestRot.hips?.z || 0) + sw * 0.06 * speed;
    if (walking) bones.hips.position.y = (boneRestRot.hips?.y || 0) + Math.abs(sw) * 0.04;
  }
  if (bones.spine) bones.spine.rotation.z = (boneRestRot.spine?.z || 0) + sw * 0.04 * speed;
  if (bones.spine1) bones.spine1.rotation.z = (boneRestRot.spine1?.z || 0) - sw * 0.03 * speed;
  if (bones.head) bones.head.rotation.x = (boneRestRot.head?.x || 0) + Math.sin(walkTime * 0.3) * 0.02;
  if (bones.upLegR) bones.upLegR.rotation.x = (boneRestRot.upLegR?.x || 0) + sw * 0.55 * speed;
  if (bones.upLegL) bones.upLegL.rotation.x = (boneRestRot.upLegL?.x || 0) - sw * 0.55 * speed;
  if (bones.legR) bones.legR.rotation.x = (boneRestRot.legR?.x || 0) + (walking ? Math.max(0, sw)*0.4 : 0.05);
  if (bones.legL) bones.legL.rotation.x = (boneRestRot.legL?.x || 0) + (walking ? Math.max(0,-sw)*0.4 : 0.05);
}

const gltfLoader = new GLTFLoader();

function loadAvatar(meshUrl) {
  gltfLoader.load(meshUrl, gltf => {
    const model = gltf.scene;
    model.traverse(n => {
      if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; }
    });
    const bb = new THREE.Box3().setFromObject(model);
    const size = new THREE.Vector3(); bb.getSize(size);
    if (size.y > 0) model.scale.setScalar(1.75 / size.y);
    const bb2 = new THREE.Box3().setFromObject(model);
    model.position.y = -bb2.min.y;
    avatarGroup.add(model);
    findBones(model);
    saveRestPose();
    if (gltf.animations?.length && Object.keys(bones).length === 0) {
      const mixer = new THREE.AnimationMixer(model);
      mixer.clipAction(gltf.animations[0]).play();
    }
    showToast('✨ Avatar chargé !');
  }, undefined, err => {
    console.warn('GLB avatar error:', err);
    makeFallbackAvatar();
  });
}

// ===== OMBRE BLOB AU SOL =====
// Suit le personnage dynamiquement dans la boucle
const shadowBlob = new THREE.Mesh(
  new THREE.CircleGeometry(0.42, 20),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.18, depthWrite: false })
);
shadowBlob.rotation.x = -Math.PI / 2;
shadowBlob.position.y = 0.011; // juste au-dessus du sol
scene.add(shadowBlob);

function makeFallbackAvatar() {
  // ─── Corps complet avec anatomie correcte ───
  // Hauteur totale : ~1.72m, pieds à y=0, tête à y=1.72
  // Structure :
  //   Tête         y=1.55 (centre)
  //   Cou          y=1.35
  //   Torse        y=0.98  (centre torse = 0.66..1.30)
  //   Hanches      y=0.62  (boîte courte)
  //   Jambes       partent de y=0.55 vers le bas, fins à y=0
  //   Bras         épaule y=1.22, tombants

  const g = new THREE.Group();

  // — Torse —
  const body = mkBox(0.46, 0.64, 0.26, 0xFF9EBB);
  body.position.y = 0.97; // centre du torse : bas=0.65, haut=1.29
  g.add(body);

  // — Hanches (pelvis) — partie clé qui manquait !
  const hips = mkBox(0.50, 0.26, 0.28, 0xD4B8F0);
  hips.position.y = 0.55; // centre : 0.42..0.68
  g.add(hips);

  // — Tête —
  const head = mkSph(0.24, 0xFFDFC4);
  head.position.y = 1.60;
  g.add(head);

  // — Cheveux —
  const hair = mkSph(0.255, 0x3D1800);
  hair.position.set(0, 1.72, -0.03);
  g.add(hair);

  // — Yeux —
  [[0.09, 1.63, 0.22], [-0.09, 1.63, 0.22]].forEach(p => {
    const e = mkSph(0.04, 0x1A1A2E); e.position.set(...p); g.add(e);
  });

  // — Cou —
  const neck = mkCyl(0.09, 0.09, 0.18, 8, 0xFFDFC4);
  neck.position.y = 1.38;
  g.add(neck);

  // ─── Jambes ───
  // Cuisse (thigh) : de y=0.55 à y=0.27 → centre=0.41, hauteur=0.28
  // Tibia (shin)   : de y=0.27 à y=0.06 → centre=0.165, hauteur=0.22
  // Pied           : sphère y≈0.05
  const legMat = new THREE.MeshStandardMaterial({ color: 0xD4C5F9 });
  const footMat = new THREE.MeshStandardMaterial({ color: 0xAA88FF });

  // Jambe droite
  const legRGroup = new THREE.Group();
  legRGroup.position.set(0.14, 0.55, 0); // pivot à la hanche droite
  const thighR = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.09, 0.30, 8), legMat);
  thighR.position.y = -0.15; thighR.castShadow = true; thighR.receiveShadow = true;
  legRGroup.add(thighR);
  // Genou + tibia (groupe pivotant pour animation)
  const kneeRGroup = new THREE.Group();
  kneeRGroup.position.y = -0.30;
  const shinR = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.07, 0.26, 8), legMat);
  shinR.position.y = -0.13; shinR.castShadow = true; shinR.receiveShadow = true;
  kneeRGroup.add(shinR);
  const footR = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, 0.20), footMat);
  footR.position.set(0, -0.27, 0.05); footR.castShadow = true; footR.receiveShadow = true;
  kneeRGroup.add(footR);
  legRGroup.add(kneeRGroup);
  g.add(legRGroup);

  // Jambe gauche
  const legLGroup = new THREE.Group();
  legLGroup.position.set(-0.14, 0.55, 0);
  const thighL = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.09, 0.30, 8), legMat);
  thighL.position.y = -0.15; thighL.castShadow = true; thighL.receiveShadow = true;
  legLGroup.add(thighL);
  const kneeLGroup = new THREE.Group();
  kneeLGroup.position.y = -0.30;
  const shinL = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.07, 0.26, 8), legMat);
  shinL.position.y = -0.13; shinL.castShadow = true; shinL.receiveShadow = true;
  kneeLGroup.add(shinL);
  const footL = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, 0.20), footMat);
  footL.position.set(0, -0.27, 0.05); footL.castShadow = true; footL.receiveShadow = true;
  kneeLGroup.add(footL);
  legLGroup.add(kneeLGroup);
  g.add(legLGroup);

  // ─── Bras ───
  const armMat = new THREE.MeshStandardMaterial({ color: 0xFF9EBB });
  const handMat = new THREE.MeshStandardMaterial({ color: 0xFFDFC4 });

  // Bras droit (tombant naturellement, léger angle)
  const armRGroup = new THREE.Group();
  armRGroup.position.set(0.30, 1.22, 0);
  armRGroup.rotation.z = 0.22;
  const upperArmR = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.065, 0.38, 8), armMat);
  upperArmR.position.y = -0.19; upperArmR.castShadow = true;
  armRGroup.add(upperArmR);
  const elbowRGroup = new THREE.Group();
  elbowRGroup.position.y = -0.38;
  const foreArmR = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.055, 0.34, 8), armMat);
  foreArmR.position.y = -0.17; foreArmR.castShadow = true;
  elbowRGroup.add(foreArmR);
  const handR2 = new THREE.Mesh(new THREE.SphereGeometry(0.075, 8, 8), handMat);
  handR2.position.y = -0.36; handR2.castShadow = true;
  elbowRGroup.add(handR2);
  armRGroup.add(elbowRGroup);
  g.add(armRGroup);

  // Bras gauche
  const armLGroup = new THREE.Group();
  armLGroup.position.set(-0.30, 1.22, 0);
  armLGroup.rotation.z = -0.22;
  const upperArmL = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.065, 0.38, 8), armMat);
  upperArmL.position.y = -0.19; upperArmL.castShadow = true;
  armLGroup.add(upperArmL);
  const elbowLGroup = new THREE.Group();
  elbowLGroup.position.y = -0.38;
  const foreArmL = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.055, 0.34, 8), armMat);
  foreArmL.position.y = -0.17; foreArmL.castShadow = true;
  elbowLGroup.add(foreArmL);
  const handL2 = new THREE.Mesh(new THREE.SphereGeometry(0.075, 8, 8), handMat);
  handL2.position.y = -0.36; handL2.castShadow = true;
  elbowLGroup.add(handL2);
  armLGroup.add(elbowLGroup);
  g.add(armLGroup);

  avatarGroup.add(g);

  // Stocke refs pour animation
  bones._fallback = {
    legRGroup, legLGroup,
    kneeRGroup, kneeLGroup,
    armRGroup, armLGroup,
    elbowRGroup, elbowLGroup,
    hipsObj: hips,
    isFallback: true
  };
}

if (profile.glbUrl) {
  loadAvatar(profile.glbUrl);
} else {
  makeFallbackAvatar();
}

// ===== MOUVEMENT =====
const SPEED = 4.5, BOUNDARY = 24;
const playerPos = new THREE.Vector3(0, 0, 6);
let playerRotY = 0;
let cameraYaw = Math.PI;

const joyBase = document.getElementById('joy-base');
const joyKnob = document.getElementById('joy-knob');
const JR = 42;
const joy = { active:false, x:0, y:0, id:null };
function getJoyCenter(){ const r=joyBase.getBoundingClientRect(); return {x:r.left+r.width/2,y:r.top+r.height/2}; }
function updateJoy(cx,cy){
  const c=getJoyCenter(); let dx=cx-c.x, dy=cy-c.y;
  const d=Math.sqrt(dx*dx+dy*dy); if(d>JR){dx=dx/d*JR;dy=dy/d*JR;}
  joy.x=dx/JR; joy.y=dy/JR;
  joyKnob.style.transform=`translate(${dx}px,${dy}px)`;
}
joyBase.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];joy.active=true;joy.id=t.identifier;updateJoy(t.clientX,t.clientY);},{passive:false});
document.addEventListener('touchmove',e=>{if(!joy.active)return;for(const t of e.changedTouches)if(t.identifier===joy.id){e.preventDefault();updateJoy(t.clientX,t.clientY);}},{passive:false});
document.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===joy.id){joy.active=false;joy.x=0;joy.y=0;joyKnob.style.transform='translate(0,0)';}});

const camZone = document.getElementById('cam-joystick-zone');
const camJoy = { active:false, x:0, startX:0, id:null };
camZone.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.changedTouches[0];
  camJoy.active=true; camJoy.id=t.identifier; camJoy.startX=t.clientX; camJoy.x=0;
},{passive:false});
document.addEventListener('touchmove',e=>{
  if(!camJoy.active)return;
  for(const t of e.changedTouches){
    if(t.identifier===camJoy.id){
      e.preventDefault();
      camJoy.x=(t.clientX-camJoy.startX)/80;
    }
  }
},{passive:false});
document.addEventListener('touchend',e=>{
  for(const t of e.changedTouches) if(t.identifier===camJoy.id){camJoy.active=false;camJoy.x=0;}
});

let mDrag={active:false,lastX:0};
renderer.domElement.addEventListener('mousedown',e=>{mDrag.active=true;mDrag.lastX=e.clientX;});
document.addEventListener('mousemove',e=>{if(!mDrag.active)return;cameraYaw-=(e.clientX-mDrag.lastX)*0.005;mDrag.lastX=e.clientX;});
document.addEventListener('mouseup',()=>mDrag.active=false);

const keys={};
document.addEventListener('keydown',e=>keys[e.key]=true);
document.addEventListener('keyup',e=>keys[e.key]=false);

// ===== BULLE =====
const bubbleEl=document.getElementById('speech-bubble');
let bubbleTimer=null;
function showBubble(text){bubbleEl.textContent=text;bubbleEl.style.opacity='1';clearTimeout(bubbleTimer);bubbleTimer=setTimeout(()=>bubbleEl.style.opacity='0',4000);}
function updateBubblePos(){
  if(bubbleEl.style.opacity==='0')return;
  const pos=new THREE.Vector3(playerPos.x,playerPos.y+2.3,playerPos.z).project(camera);
  bubbleEl.style.left=((pos.x+1)/2*window.innerWidth)+'px';
  bubbleEl.style.top=((1-pos.y)/2*window.innerHeight-44)+'px';
}

// ===== CHAT =====
function addChat(text,from){
  const msgs=document.getElementById('chat-messages');
  const div=document.createElement('div');div.className='chat-msg';
  div.innerHTML=`<span class="name">${from}</span>${text}`;
  msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;
  while(msgs.children.length>20)msgs.removeChild(msgs.firstChild);
}
function sendChat(){const inp=document.getElementById('chat-input');const msg=inp.value.trim();if(!msg)return;inp.value='';addChat(msg,profile.pseudo);showBubble(msg);}
document.getElementById('chat-send').addEventListener('click',sendChat);
document.getElementById('chat-input').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendChat();}});

const emotes=['🌸','💫','✨','🎉','👋','💕','🌈','🦋'];
let emoteIdx=0;
document.getElementById('btn-emote').addEventListener('click',()=>{
  const em=emotes[emoteIdx++%emotes.length];addChat(em,profile.pseudo);showBubble(em);showToast(em);
});

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

// ===== BOUCLE =====
const clock = new THREE.Clock();
const CAM_DIST=5.5, CAM_HEIGHT=2.8, CAM_LOOK_Y=1.2, CAM_LERP=3.5;

finishLoading();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);

  clouds.forEach(c=>{ c.mesh.position.x-=c.speed*dt; if(c.mesh.position.x<-35)c.mesh.position.x=35; });

  let mx=joy.x, mz=joy.y;
  if(keys['ArrowUp']||keys['w']||keys['W']) mz=-1;
  if(keys['ArrowDown']||keys['s']||keys['S']) mz=1;
  if(keys['ArrowLeft']||keys['a']||keys['A']) mx=-1;
  if(keys['ArrowRight']||keys['d']||keys['D']) mx=1;
  if(camJoy.active&&Math.abs(camJoy.x)>0.02) cameraYaw-=camJoy.x*3.0*dt;
  if(keys['q']||keys['Q']) cameraYaw+=1.8*dt;
  if(keys['e']||keys['E']) cameraYaw-=1.8*dt;

  const moving = Math.abs(mx)>0.05||Math.abs(mz)>0.05;

  if(moving){
    const sinC=Math.sin(cameraYaw), cosC=Math.cos(cameraYaw);
    const dx=(sinC*mz+cosC*mx)*SPEED*dt;
    const dz=(cosC*mz-sinC*mx)*SPEED*dt;
    playerPos.x=Math.max(-BOUNDARY,Math.min(BOUNDARY,playerPos.x+dx));
    playerPos.z=Math.max(-BOUNDARY,Math.min(BOUNDARY,playerPos.z+dz));
    playerRotY=Math.atan2(dx,dz);
    const targetYaw=playerRotY+Math.PI;
    let diff=targetYaw-cameraYaw;
    while(diff>Math.PI)diff-=2*Math.PI;
    while(diff<-Math.PI)diff+=2*Math.PI;
    cameraYaw+=diff*Math.min(CAM_LERP*dt,1.0);
  }

  // Animation bones GLB
  if(Object.keys(bones).length > 0 && !bones._fallback){
    animateBones(dt, moving);
  } else if(bones._fallback){
    // Animation fallback géométrique avec jambes complètes
    walkTime += dt*(moving ? 7.0 : 1.2);
    const sw = Math.sin(walkTime);
    const spd = moving ? 1.0 : 0.06;
    const fb = bones._fallback;

    // Hanches légère oscillation
    if(fb.hipsObj) fb.hipsObj.rotation.z = sw * 0.06 * spd;

    // Jambes : pivot depuis la hanche
    fb.legRGroup.rotation.x = sw * 0.55 * spd;
    fb.legLGroup.rotation.x = -sw * 0.55 * spd;

    // Genoux (pli naturel)
    fb.kneeRGroup.rotation.x = moving ? Math.max(0, sw) * 0.35 : 0.05;
    fb.kneeLGroup.rotation.x = moving ? Math.max(0, -sw) * 0.35 : 0.05;

    // Bras balancent en opposition aux jambes
    fb.armRGroup.rotation.x = -sw * 0.40 * spd;
    fb.armLGroup.rotation.x = sw * 0.40 * spd;

    // Léger balancement coudes
    fb.elbowRGroup.rotation.x = moving ? Math.abs(sw) * 0.18 : 0;
    fb.elbowLGroup.rotation.x = moving ? Math.abs(sw) * 0.18 : 0;
  }

  avatarGroup.position.set(playerPos.x, playerPos.y, playerPos.z);
  avatarGroup.rotation.y = playerRotY;

  // ─── Ombre blob suit le personnage ───
  shadowBlob.position.x = playerPos.x;
  shadowBlob.position.z = playerPos.z;
  // Légère réduction de l'ombre quand les pieds bougent
  const shadowScale = moving ? 0.92 + Math.abs(Math.sin(walkTime)) * 0.12 : 1.0;
  shadowBlob.scale.set(shadowScale, shadowScale, 1);

  camera.position.set(
    playerPos.x+Math.sin(cameraYaw)*CAM_DIST,
    playerPos.y+CAM_HEIGHT,
    playerPos.z+Math.cos(cameraYaw)*CAM_DIST
  );
  camera.lookAt(playerPos.x, playerPos.y+CAM_LOOK_Y, playerPos.z);

  updateBubblePos();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
