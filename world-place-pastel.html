<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Macadam World — Place Pastel (Three.js)</title>
<style>
html,body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #0e0620;
  height: 100vh;
  font-family: 'Nunito', sans-serif;
  color: white;
}
#loading {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #0e0620;
  font-weight: 800;
  letter-spacing: 0.5px;
  z-index: 10;
}
canvas { display: block; }
</style>
</head>
<body>
<div id="loading">⏳ Chargement de Place Pastel…</div>

<script type="module">
import * as THREE from '[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/three@0.167/build/three.module.js)';
import { OrbitControls } from '[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/three@0.167/examples/jsm/controls/OrbitControls.js)';
import { GLTFLoader } from '[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/three@0.167/examples/jsm/loaders/GLTFLoader.js)';
import { EffectComposer } from '[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/three@0.167/examples/jsm/postprocessing/EffectComposer.js)';
import { RenderPass } from '[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/three@0.167/examples/jsm/postprocessing/RenderPass.js)';
import { UnrealBloomPass } from '[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/three@0.167/examples/jsm/postprocessing/UnrealBloomPass.js)';

/* === RENDERER === */
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false,
  logarithmicDepthBuffer: false // compatible iOS
});
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1;
document.body.appendChild(renderer.domElement);

/* === SCENE / CAMERA === */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfeaff);
scene.fog = new THREE.FogExp2(0xcfeaff, 0.015);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 6, 16);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.maxPolarAngle = Math.PI / 2.1;
controls.target.set(0, 2.5, 0);

/* === LUMIÈRES === */
const hemi = new THREE.HemisphereLight(0xffffff, 0xaabbcc, 1.0);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff8e8, 1.2);
sun.position.set(10, 30, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.camera.top = 20;
sun.shadow.camera.bottom = -20;
sun.shadow.camera.left = -20;
sun.shadow.camera.right = 20;
scene.add(sun);

/* === SOL === */
const groundGeo = new THREE.CircleGeometry(30, 128);
const groundMat = new THREE.MeshStandardMaterial({ color: 0xf3ebda, roughness: 0.95 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* === FONTAINE === */
function createFountain() {
  const group = new THREE.Group();
  const matStone = new THREE.MeshStandardMaterial({ color: 0xddd0f5, roughness: 0.6 });
  const base = new THREE.Mesh(new THREE.CylinderGeometry(3, 3.3, 0.6, 64), matStone);
  base.castShadow = base.receiveShadow = true;
  const bowlMat = new THREE.MeshPhysicalMaterial({
    color: 0x9ed9ff,
    roughness: 0.1,
    metalness: 0.3,
    transmission: 0.7,
    thickness: 0.3,
  });
  const topBowl = new THREE.Mesh(new THREE.TorusGeometry(1.2, 0.12, 24, 64), bowlMat);
  topBowl.rotation.x = Math.PI / 2;
  topBowl.position.y = 3.2;
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 3, 32), matStone);
  shaft.position.y = 1.8;
  const orb = new THREE.Mesh(new THREE.SphereGeometry(0.3, 32, 32), bowlMat);
  orb.position.y = 3.8;
  group.add(base, topBowl, shaft, orb);
  // particules d’eau
  const drops = 150;
  const pos = new Float32Array(drops * 3);
  for (let i = 0; i < drops; i++) {
    const r = 1.1 + Math.random() * 0.3;
    const a = Math.random() * Math.PI * 2;
    pos[i * 3] = Math.cos(a) * r;
    pos[i * 3 + 1] = 3 + Math.random() * 0.3;
    pos[i * 3 + 2] = Math.sin(a) * r;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({ color: 0x99ccff, size: 0.04, transparent: true, opacity: 0.8 });
  const pts = new THREE.Points(geo, mat);
  group.add(pts);
  group.tick = (dt) => {
    const p = pts.geometry.attributes.position;
    for (let i = 0; i < p.count; i++) {
      let y = p.getY(i) - dt * 2;
      if (y < 0.3) y = 3 + Math.random() * 0.3;
      p.setY(i, y);
    }
    p.needsUpdate = true;
  };
  return group;
}
const fountain = createFountain();
scene.add(fountain);

/* === BÂTIMENTS === */
function createBuilding(color, x, z) {
  const b = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(6, 7, 5), new THREE.MeshStandardMaterial({ color }));
  body.position.y = 3.5;
  const roof = new THREE.Mesh(new THREE.ConeGeometry(3.4, 2.3, 4), new THREE.MeshStandardMaterial({ color: 0xb8a8f0 }));
  roof.position.y = 7.7;
  body.castShadow = body.receiveShadow = true;
  roof.castShadow = true;
  b.add(body, roof);
  b.position.set(x, 0, z);
  return b;
}
scene.add(createBuilding(0xa8e6cf, -10, -10));
scene.add(createBuilding(0xffbfa8, 10, -10));
scene.add(createBuilding(0xd4c5f9, -14, -20));
scene.add(createBuilding(0xb8e8d8, 14, -20));

/* === AVATAR === */
const avatar = new THREE.Group();
scene.add(avatar);
const loader = new GLTFLoader();
let mixer = null;

try {
  const uid = localStorage.getItem('macadam_user_id') || 'player1';
  const saved = JSON.parse(localStorage.getItem('macadam_avatar_' + uid) || 'null');
  const glbUrl = saved?.glbUrl;
  if (glbUrl) {
    loader.load(glbUrl, (g) => {
      g.scene.traverse((o) => { o.castShadow = true; o.receiveShadow = true; });
      avatar.add(g.scene);
      mixer = new THREE.AnimationMixer(g.scene);
      if (g.animations.length) {
        const action = mixer.clipAction(g.animations[0]);
        action.play();
      }
      document.getElementById('loading').style.display = 'none';
    });
  } else {
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 1, 16, 32), new THREE.MeshStandardMaterial({ color: 0xff9ebb }));
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 32, 32), new THREE.MeshStandardMaterial({ color: 0xffe6cf }));
    head.position.y = 1;
    avatar.add(body, head);
    document.getElementById('loading').style.display = 'none';
  }
} catch (e) {
  console.warn(e);
  document.getElementById('loading').style.display = 'none';
}

/* === POSTPROCESS BLOOM === */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.6, 0.5, 0));

/* === ANIMATION LOOP === */
let last = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = (t - last) / 1000;
  last = t;
  mixer?.update(dt);
  fountain.tick?.(dt);
  controls.update();
  composer.render();
}
loop();

/* === RESIZE === */
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
