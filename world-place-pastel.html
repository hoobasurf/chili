<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macadam World — Place Pastel (Three.js)</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#0e0620;height:100vh;font-family:sans-serif}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e0620;color:#fff;font-weight:700;z-index:10}
canvas{display:block}
</style>
</head>
<body>
<div id="loading">⏳ Chargement de Place Pastel…</div>
<script type="module">
import * as THREE from '[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/three@0.167/build/three.module.js)';
import { GLTFLoader } from '[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/three@0.167/examples/jsm/loaders/GLTFLoader.js)';
import { OrbitControls } from '[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/three@0.167/examples/jsm/controls/OrbitControls.js)';
import { EffectComposer } from '[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/three@0.167/examples/jsm/postprocessing/EffectComposer.js)';
import { RenderPass } from '[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/three@0.167/examples/jsm/postprocessing/RenderPass.js)';
import { UnrealBloomPass } from '[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/three@0.167/examples/jsm/postprocessing/UnrealBloomPass.js)';

/* ---------- RENDERER ---------- */
const renderer = new THREE.WebGLRenderer({antialias:true,alpha:false,logarithmicDepthBuffer:true});
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

/* ---------- SCENE / CAMERA ---------- */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xcfeaff, 0.015);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0,5,14);
const controls = new OrbitControls(camera, renderer.domElement);
controls.maxPolarAngle = Math.PI/2.1;
controls.target.set(0,2,0);

/* ---------- LUMIÈRE ---------- */
const hemi = new THREE.HemisphereLight(0xffffff,0x99bbdd,0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff8e8,1.2);
sun.position.set(12,25,8);
sun.castShadow = true;
sun.shadow.mapSize.set(4096,4096);
sun.shadow.camera.top = 15;
sun.shadow.camera.bottom = -10;
sun.shadow.camera.left = -15;
sun.shadow.camera.right = 15;
scene.add(sun);

/* ---------- SOL & PLACE ---------- */
const groundGeo = new THREE.CircleGeometry(25,128);
const groundMat = new THREE.MeshStandardMaterial({color:0xf2e6d4,roughness:0.95});
const ground = new THREE.Mesh(groundGeo,groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

/* ---------- FONTAINE ---------- */
function createFountain(){
  const group = new THREE.Group();
  const matStone = new THREE.MeshStandardMaterial({color:0xddd0f5,roughness:0.6,metalness:0.1});
  const base1 = new THREE.CylinderGeometry(3.5,3.8,0.6,64);
  const base2 = new THREE.CylinderGeometry(2.5,3.0,0.4,64);
  const base3 = new THREE.CylinderGeometry(1.4,1.6,0.3,64);
  const shaft = new THREE.CylinderGeometry(0.4,0.4,3,32);
  const mesh1=new THREE.Mesh(base1,matStone);mesh1.castShadow=mesh1.receiveShadow=true;mesh1.position.y=0.3;
  const mesh2=new THREE.Mesh(base2,matStone);mesh2.castShadow=mesh2.receiveShadow=true;mesh2.position.y=1;
  const mesh3=new THREE.Mesh(base3,matStone);mesh3.position.y=1.7;
  const mshaft=new THREE.Mesh(shaft,matStone);mshaft.position.y=3;
  const bowlMat=new THREE.MeshPhysicalMaterial({color:0x9ed9ff,metalness:0.4,roughness:0.1,transmission:0.8,thickness:0.3});
  const bowl=new THREE.Mesh(new THREE.TorusGeometry(0.9,0.12,24,64),bowlMat);bowl.rotation.x=Math.PI/2;bowl.position.y=3;
  const sphere=new THREE.Mesh(new THREE.SphereGeometry(0.3,32,32),bowlMat);sphere.position.y=3.6;
  group.add(mesh1,mesh2,mesh3,mshaft,bowl,sphere);

  // particules d’eau
  const dropsGeom=new THREE.BufferGeometry();
  const drops=300, positions=new Float32Array(drops*3);
  for(let i=0;i<drops;i++){
    const r=1.5+Math.random()*1.0;
    const a=Math.random()*Math.PI*2;
    positions[i*3]=Math.cos(a)*r;
    positions[i*3+1]=2.8+Math.random()*0.2;
    positions[i*3+2]=Math.sin(a)*r;
  }
  dropsGeom.setAttribute('position',new THREE.BufferAttribute(positions,3));
  const dropsMat=new THREE.PointsMaterial({color:0x99CCFF,size:0.03,transparent:true,opacity:0.8});
  const pts=new THREE.Points(dropsGeom,dropsMat);
  group.add(pts);
  group.tick=dt=>{
    const pos=pts.geometry.attributes.position;
    for(let i=0;i<pos.count;i++){
      let y=pos.getY(i)-dt*2*(0.8+Math.random()*0.5);
      if(y<0.4) y=2.8+Math.random()*0.2;
      pos.setY(i,y);
    }
    pos.needsUpdate=true;
  };
  return group;
}
const fountain=createFountain();
scene.add(fountain);

/* ---------- BÂTIMENT SIMPLE EXEMPLE ---------- */
function createBuilding(color,pos){
  const root=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color,roughness:0.6});
  const body=new THREE.Mesh(new THREE.BoxGeometry(6,7,5),mat);
  body.position.y=3.5;body.castShadow=body.receiveShadow=true;
  const roof=new THREE.Mesh(new THREE.ConeGeometry(3.3,2.2,4),new THREE.MeshStandardMaterial({color:0xb89cf0,roughness:0.4}));
  roof.position.y=8.2;
  root.add(body,roof);root.position.copy(pos);
  return root;
}
const buildings=[
  createBuilding(0xa8e6cf,new THREE.Vector3(-10,0,-10)),
  createBuilding(0xd4c5f9,new THREE.Vector3(10,0,-10)),
  createBuilding(0xffbfa8,new THREE.Vector3(-14,0,-20)),
  createBuilding(0xb8e8d8,new THREE.Vector3(14,0,-20)),
];
buildings.forEach(b=>scene.add(b));

/* ---------- AVATAR (GLB OU FALLBACK) ---------- */
const avatarGroup=new THREE.Group();scene.add(avatarGroup);
const loader=new GLTFLoader();
let mixer=null;
const saved=JSON.parse(localStorage.getItem('macadam_avatar_'+localStorage.getItem('macadam_user_id'))||'{}');
const urlGLB=saved.glbUrl;
if(urlGLB){
  loader.load(urlGLB,g=>{
    g.scene.traverse(o=>{o.castShadow=true;o.receiveShadow=true});
    avatarGroup.add(g.scene);
    mixer=new THREE.AnimationMixer(g.scene);
    if(g.animations.length>0){
      const action=mixer.clipAction(g.animations[0]);
      action.play();
    }
    document.getElementById('loading').style.display='none';
  });
}else{
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.3,1.0,16,24),new THREE.MeshStandardMaterial({color:0xff9ebb}));
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.25,32,32),new THREE.MeshStandardMaterial({color:0xffe6cf}));
  head.position.y=0.9;
  avatarGroup.add(body,head);
  document.getElementById('loading').style.display='none';
}

/* ---------- EFFETS ---------- */
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.65,0.6,0.0));

/* ---------- ANIMATION LOOP ---------- */
let last=0;
function animate(t){
  requestAnimationFrame(animate);
  const dt=(t-last)/1000; last=t;
  fountain.tick?.(dt);
  mixer?.update(dt);
  controls.update();
  composer.render();
}
animate();

/* ---------- RÉAJUSTEMENT ---------- */
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
