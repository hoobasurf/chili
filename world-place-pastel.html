<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Three.js — Macadam World</title>
<style>
html,body{
  margin:0;padding:0;height:100%;overflow:hidden;
  background:#0e0620;color:white;font-family:sans-serif;
}
#loading{
  position:fixed;inset:0;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:1rem;
}
</style>
</head>
<body>
<div id="loading">⏳ Chargement du test 3D…</div>

<script type="module">
import * as THREE from '[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/three@0.167/build/three.module.js)';
import { OrbitControls } from '[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/three@0.167/examples/jsm/controls/OrbitControls.js)';
import { EffectComposer } from '[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/three@0.167/examples/jsm/postprocessing/EffectComposer.js)';
import { RenderPass } from '[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/three@0.167/examples/jsm/postprocessing/RenderPass.js)';
import { UnrealBloomPass } from '[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/three@0.167/examples/jsm/postprocessing/UnrealBloomPass.js)';

/* --- Initialisation --- */
const renderer = new THREE.WebGLRenderer({antialias:true,logarithmicDepthBuffer:false});
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfeaff);
scene.fog = new THREE.FogExp2(0xcfeaff,0.015);

const camera = new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,200);
camera.position.set(3,2,5);
const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.target.set(0,1,0);

/* --- Lumières --- */
scene.add(new THREE.HemisphereLight(0xffffff,0x6688aa,1));
const sun = new THREE.DirectionalLight(0xfff8e8,1);
sun.position.set(5,10,5);
sun.castShadow = true;
scene.add(sun);

/* --- Sol & Cube --- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(10,10),
  new THREE.MeshStandardMaterial({color:0xf0e8dc,roughness:0.9})
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

const cube = new THREE.Mesh(
  new THREE.BoxGeometry(1,1,1),
  new THREE.MeshStandardMaterial({color:0xff9ebb,metalness:0.2,roughness:0.6})
);
cube.position.y = 0.5;
cube.castShadow = true;
scene.add(cube);

/* --- Effet Bloom --- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.6,0.5,0));

/* --- Animation --- */
document.getElementById('loading').style.display='none';
let last=0;
function loop(t){
  requestAnimationFrame(loop);
  const dt=(t-last)/1000; last=t;
  cube.rotation.y += dt*0.8;
  controls.update();
  composer.render();
}
loop();

/* --- Resize --- */
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
