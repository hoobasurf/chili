<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Macadam World — Tokyo</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--gold:#f5c842;--orange:#e85d26;--green:#2ecc71;}
html,body{width:100%;height:100%;overflow:hidden;background:#b0c8e8;font-family:'M PLUS Rounded 1c',sans-serif;user-select:none;-webkit-user-select:none;}
#canvas-container{position:fixed;inset:0;}
canvas{display:block;width:100%!important;height:100%!important;}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;}
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,transparent 100%);}
.hud-logo{font-family:'Zen Kaku Gothic New',sans-serif;font-size:.9rem;font-weight:900;color:#fff;letter-spacing:.05em;}
.hud-logo em{color:var(--gold);font-style:normal;}
.hud-loc{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.38);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:4px 10px;}
.hud-loc span{font-size:.65rem;font-weight:700;color:#fff;}
.loc-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);}
.hud-info{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.38);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:4px 10px 4px 4px;}
.hud-pic{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--gold));display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:900;color:#fff;}
.hud-name{font-size:.65rem;font-weight:700;color:#fff;}
.hud-chat{position:absolute;bottom:170px;left:12px;width:220px;pointer-events:all;}
.chat-messages{max-height:75px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;margin-bottom:4px;scrollbar-width:none;}
.chat-messages::-webkit-scrollbar{display:none;}
.chat-msg{background:rgba(0,0,0,.5);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:4px 10px;font-size:.62rem;color:#fff;line-height:1.3;}
.chat-msg .name{font-weight:900;color:var(--gold);margin-right:4px;}
.chat-input-wrap{display:flex;gap:5px;}
.chat-input{flex:1;background:rgba(0,0,0,.5);border:1.5px solid rgba(255,255,255,.2);border-radius:20px;padding:7px 13px;font-size:14px;font-weight:700;color:#fff;outline:none;font-family:'M PLUS Rounded 1c',sans-serif;}
.chat-input::placeholder{color:rgba(255,255,255,.35);}
.chat-input:focus{border-color:var(--gold);}
.chat-send{width:36px;height:36px;border-radius:50%;background:var(--orange);border:none;color:#fff;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;pointer-events:all;flex-shrink:0;}
#anim-panel{position:absolute;bottom:0;left:0;right:0;pointer-events:all;padding:4px 0 8px;background:linear-gradient(0deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,.5) 100%);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.08);height:80px;}
#anim-scroll{display:flex;gap:5px;overflow-x:auto;padding:2px 10px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
#anim-scroll::-webkit-scrollbar{display:none;}
.anim-btn{flex-shrink:0;width:56px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.anim-icon{width:54px;height:54px;border-radius:10px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;transition:all .15s;}
.anim-icon svg{width:44px;height:44px;}
.anim-btn.active .anim-icon{background:rgba(245,200,66,.12);border-color:var(--gold);}
.anim-btn:active .anim-icon{transform:scale(.88);}
.anim-label{font-size:.48rem;font-weight:700;color:rgba(255,255,255,.4);text-align:center;}
.anim-btn.active .anim-label{color:var(--gold);}
#joystick-zone{position:absolute;bottom:90px;right:12px;width:96px;height:96px;pointer-events:all;}
#cam-joystick-zone{position:absolute;bottom:90px;left:12px;width:96px;height:96px;pointer-events:all;}
.joy-base{width:96px;height:96px;border-radius:50%;background:rgba(0,0,0,.22);border:1.5px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);position:relative;display:flex;align-items:center;justify-content:center;}
.joy-knob{width:38px;height:38px;border-radius:50%;position:absolute;box-shadow:0 2px 10px rgba(0,0,0,.4);}
#jump-btn{position:absolute;bottom:138px;right:52px;width:46px;height:46px;border-radius:50%;background:#2b6cb0;border:none;color:#fff;font-size:1.2rem;pointer-events:all;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;z-index:12;}
#super-jump-btn{position:absolute;bottom:138px;left:52px;width:46px;height:46px;border-radius:50%;background:var(--orange);border:none;color:#fff;font-size:.95rem;pointer-events:all;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;z-index:12;}
#zone-indicator{position:absolute;top:44px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:4px 14px;pointer-events:none;}
#zone-indicator span{font-size:.65rem;font-weight:700;color:#fff;}
.toast{position:fixed;bottom:188px;left:50%;transform:translateX(-50%) translateY(14px);background:rgba(0,0,0,.88);color:var(--gold);padding:6px 14px;border-radius:16px;font-size:.68rem;font-weight:700;opacity:0;transition:all .25s;z-index:50;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#loading-screen{position:fixed;inset:0;z-index:200;background:#b0c8e8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s;}
#loading-screen.hidden{opacity:0;pointer-events:none;}
.load-logo{font-family:'Zen Kaku Gothic New',sans-serif;font-size:2.2rem;font-weight:900;color:#1a2a40;letter-spacing:.06em;}
.load-logo em{color:var(--orange);font-style:normal;}
.load-kanji{font-size:.9rem;color:rgba(26,42,64,.6);letter-spacing:.25em;}
.load-bar-wrap{width:180px;height:3px;background:rgba(0,0,0,.12);border-radius:2px;overflow:hidden;}
.load-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--orange),var(--gold));border-radius:2px;transition:width .2s;}
.load-txt{font-size:.68rem;color:rgba(26,42,64,.6);font-weight:700;}
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="loading-screen">
  <div class="load-logo">TOKYO<em>東京</em></div>
  <div class="load-kanji">MACADAM WORLD</div>
  <div class="load-bar-wrap"><div class="load-bar" id="load-bar"></div></div>
  <div class="load-txt" id="load-txt">Génération du monde…</div>
</div>
<div id="hud">
  <div class="hud-top">
    <div class="hud-logo">⬡ <em>Macadam</em> World</div>
    <div class="hud-loc"><div class="loc-dot"></div><span id="zone-name">東京 Shinjuku</span></div>
    <div class="hud-info"><div class="hud-pic" id="hud-pic">?</div><span class="hud-name" id="hud-pseudo">Joueur</span></div>
  </div>
  <div class="hud-chat">
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-wrap">
      <input class="chat-input" id="chat-input" type="text" placeholder="Dis quelque chose…" maxlength="80" autocomplete="off"/>
      <button class="chat-send" id="chat-send">▶</button>
    </div>
  </div>
  <div id="cam-joystick-zone"><div class="joy-base" id="cam-joy-base"><div class="joy-knob" id="cam-joy-knob" style="background:linear-gradient(135deg,#f5c842,#e85d26);"></div></div></div>
  <button id="super-jump-btn">🚀</button>
  <button id="jump-btn">↑</button>
  <div id="joystick-zone"><div class="joy-base" id="joy-base"><div class="joy-knob" id="joy-knob" style="background:linear-gradient(135deg,#dddddd,#aaaaaa);"></div></div></div>
  <div id="anim-panel"><div id="anim-scroll"></div></div>
</div>
<div class="toast" id="toast"></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const BASE='https://raw.githubusercontent.com/hoobasurf/chili/main/';
const WALK_FILE='course.glb';
const IDLE_FILE='attend.glb';

const ANIMS=[
  {label:'Attend',file:'attend.glb',svg:'idle'},{label:'Course',file:'course.glb',svg:'run'},
  {label:'Marche',file:'marche%20discrete.glb',svg:'walk'},{label:'Danse 1',file:'danse1.glb',svg:'dance1'},
  {label:'Danse 2',file:'danse2.glb',svg:'dance2'},{label:'Danse 3',file:'danse3.glb',svg:'dance3'},
  {label:'Coup poing',file:'coup%20de%20poing.glb',svg:'punch'},{label:'Saut',file:'saut%20guerrier.glb',svg:'jump'},
  {label:'King Kong',file:'king%20kong.glb',svg:'victory'},{label:'Salto',file:'salto%20avant.glb',svg:'flip'},
  {label:'Foot',file:'foot.glb',svg:'kick'},{label:'Esquive',file:'esquive.glb',svg:'dodge'},
  {label:'Pompe',file:'pompe.glb',svg:'crouch'},{label:'Maestro',file:'maestro.glb',svg:'wave'},
  {label:'Costaud',file:'costaud.glb',svg:'flex'},{label:'Enerver',file:'enerver.glb',svg:'punch'},
];
const C='#f5c842';
const SVG={
  idle:`<circle cx="28" cy="9" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><line x1="28" y1="15" x2="28" y2="46" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="28" y1="24" x2="16" y2="36" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="28" y1="24" x2="40" y2="36" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="26" y1="46" x2="20" y2="66" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="30" y1="46" x2="36" y2="66" stroke="${C}" stroke-width="3" stroke-linecap="round"/>`,
  run:`<circle cx="32" cy="7" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><path d="M31 13 Q28 26 26 42" stroke="${C}" stroke-width="3" fill="none" stroke-linecap="round"/><line x1="29" y1="19" x2="10" y2="22" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="29" y1="19" x2="48" y2="14" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="26" y1="42" x2="10" y2="56" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="26" y1="42" x2="44" y2="64" stroke="${C}" stroke-width="3" stroke-linecap="round"/>`,
  walk:`<circle cx="28" cy="8" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><path d="M28 14 Q26 28 25 44" stroke="${C}" stroke-width="3" fill="none" stroke-linecap="round"/><line x1="26" y1="22" x2="12" y2="30" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="26" y1="22" x2="40" y2="18" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="25" y1="44" x2="12" y2="62" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="25" y1="44" x2="38" y2="58" stroke="${C}" stroke-width="3" stroke-linecap="round"/>`,
  dance1:`<circle cx="28" cy="9" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><path d="M28 15 Q32 28 30 44" stroke="${C}" stroke-width="3" fill="none" stroke-linecap="round"/><line x1="29" y1="20" x2="8" y2="12" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="29" y1="20" x2="48" y2="26" stroke="${C}" stroke-width="3" stroke-linecap="round"/>`,
  dance2:`<circle cx="28" cy="9" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><path d="M28 15 Q24 28 26 44" stroke="${C}" stroke-width="3" fill="none" stroke-linecap="round"/><line x1="27" y1="22" x2="46" y2="18" stroke="${C}" stroke-width="3" stroke-linecap="round"/>`,
  dance3:`<circle cx="28" cy="9" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><line x1="28" y1="15" x2="28" y2="44" stroke="${C}" stroke-width="3" stroke-linecap="round"/><path d="M28 20 Q14 10 8 18" stroke="${C}" stroke-width="3" fill="none" stroke-linecap="round"/>`,
  punch:`<circle cx="26" cy="9" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><line x1="26" y1="15" x2="24" y2="44" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="25" y1="22" x2="52" y2="16" stroke="${C}" stroke-width="3.5" stroke-linecap="round"/>`,
  kick:`<circle cx="28" cy="9" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><line x1="28" y1="15" x2="26" y2="42" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="26" y1="42" x2="54" y2="34" stroke="${C}" stroke-width="3.5" stroke-linecap="round"/>`,
  jump:`<circle cx="28" cy="6" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><line x1="28" y1="12" x2="28" y2="38" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="28" y1="18" x2="12" y2="12" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="28" y1="18" x2="44" y2="12" stroke="${C}" stroke-width="3" stroke-linecap="round"/>`,
  victory:`<circle cx="28" cy="9" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><line x1="28" y1="15" x2="28" y2="46" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="28" y1="22" x2="10" y2="6" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="28" y1="22" x2="46" y2="6" stroke="${C}" stroke-width="3" stroke-linecap="round"/>`,
  flip:`<circle cx="38" cy="12" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><path d="M35 16 Q24 20 20 32 Q16 44 24 52 Q32 60 40 54" stroke="${C}" stroke-width="3" fill="none" stroke-linecap="round"/>`,
  dodge:`<circle cx="38" cy="13" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><path d="M36 19 Q28 32 24 46" stroke="${C}" stroke-width="3" fill="none" stroke-linecap="round"/>`,
  crouch:`<circle cx="28" cy="16" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><line x1="28" y1="22" x2="28" y2="38" stroke="${C}" stroke-width="3" stroke-linecap="round"/>`,
  wave:`<circle cx="28" cy="9" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><line x1="28" y1="15" x2="28" y2="48" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="28" y1="20" x2="48" y2="6" stroke="${C}" stroke-width="3" stroke-linecap="round"/>`,
  flex:`<circle cx="28" cy="8" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><line x1="28" y1="14" x2="28" y2="44" stroke="${C}" stroke-width="3" stroke-linecap="round"/><path d="M28 22 Q18 14 8 20" stroke="${C}" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="6" cy="20" r="5" stroke="${C}" stroke-width="2" fill="none"/>`,
};

// ── PROFIL ────────────────────────────────────────────────
function loadProfile(){
  try{const uid=localStorage.getItem('macadam_user_id')||('p_'+Math.random().toString(36).slice(2,8));localStorage.setItem('macadam_user_id',uid);const s=JSON.parse(localStorage.getItem('macadam_avatar_'+uid)||'null');return{pseudo:s?.pseudo||'Joueur'};}catch(e){return{pseudo:'Joueur'};}
}
const profile=loadProfile();
document.getElementById('hud-pseudo').textContent=profile.pseudo;
document.getElementById('hud-pic').textContent=profile.pseudo.slice(0,2).toUpperCase();

// ── LOADING ───────────────────────────────────────────────
let ldPct=0;
const ldBar=document.getElementById('load-bar'),ldTxt=document.getElementById('load-txt');
const ldMsgs=['Génération des rues…','Construction des quartiers…','Pose du béton…','Égout en cours…','Presque prêt…'];
let ldIdx=0;
const ldInt=setInterval(()=>{
  ldPct+=Math.random()*6;if(ldPct>84){ldPct=84;clearInterval(ldInt);}
  ldBar.style.width=ldPct+'%';
  const idx=Math.min(Math.floor(ldPct/20),ldMsgs.length-1);
  if(idx>ldIdx){ldIdx=idx;ldTxt.textContent=ldMsgs[ldIdx];}
},220);
function finishLoading(){
  clearInterval(ldInt);ldBar.style.width='100%';ldTxt.textContent='Bienvenue à Tokyo !';
  setTimeout(()=>{const l=document.getElementById('loading-screen');l.classList.add('hidden');setTimeout(()=>l.style.display='none',600);},400);
  addChat('☀️ Bienvenue à Tokyo, '+profile.pseudo+' !','Système');
  addChat('🐀 Cherche la bouche d\'égout pour explorer les souterrains !','Info');
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
function addChat(text,from){
  const msgs=document.getElementById('chat-messages');
  const d=document.createElement('div');d.className='chat-msg';
  d.innerHTML=`<span class="name">${from}</span>${text}`;
  msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;
  while(msgs.children.length>20)msgs.removeChild(msgs.firstChild);
}
function sendChat(){const inp=document.getElementById('chat-input');const m=inp.value.trim();if(!m)return;inp.value='';addChat(m,profile.pseudo);}
document.getElementById('chat-send').addEventListener('click',sendChat);
document.getElementById('chat-input').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendChat();}});

// ── THREE RENDERER ────────────────────────────────────────
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById('canvas-container').appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8ab4d4);
scene.fog=new THREE.Fog(0x9ec2dc,100,280);
const camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,350);
window.addEventListener('resize',()=>{renderer.setSize(window.innerWidth,window.innerHeight);camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();});

// ── LUMIÈRES ──────────────────────────────────────────────
scene.add(new THREE.HemisphereLight(0x87CEEB,0xc8b89a,1.1));
const sun=new THREE.DirectionalLight(0xfff5e0,2.2);
sun.position.set(60,120,40);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-120;sun.shadow.camera.bottom=-120;
sun.shadow.camera.right=120;sun.shadow.camera.top=120;
sun.shadow.camera.far=350;sun.shadow.bias=-0.001;
scene.add(sun);
const fillLight=new THREE.DirectionalLight(0xc8d8f0,0.55);fillLight.position.set(-30,50,-50);scene.add(fillLight);

// ── TEXTURES PROCÉDURALES ─────────────────────────────────
function procTex(fn,size=256){
  const cv=document.createElement('canvas');cv.width=cv.height=size;
  const ctx=cv.getContext('2d');fn(ctx,size);
  const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}

const asphaltTex=procTex((ctx,s)=>{
  ctx.fillStyle='#282828';ctx.fillRect(0,0,s,s);
  for(let i=0;i<3000;i++){const g=18+Math.random()*28|0;ctx.fillStyle=`rgb(${g},${g},${g})`;ctx.fillRect(Math.random()*s|0,Math.random()*s|0,1+(Math.random()*1.5|0),1);}
  ctx.strokeStyle='rgba(0,0,0,0.6)';ctx.lineWidth=0.7;
  for(let c=0;c<12;c++){ctx.beginPath();let x=Math.random()*s,y=Math.random()*s;ctx.moveTo(x,y);for(let i=0;i<6;i++){x+=Math.random()*25-12;y+=Math.random()*25-12;ctx.lineTo(x,y);}ctx.stroke();}
});
asphaltTex.repeat.set(10,10);

const concreteTex=procTex((ctx,s)=>{
  ctx.fillStyle='#989088';ctx.fillRect(0,0,s,s);
  for(let i=0;i<3000;i++){const g=128+Math.random()*22|0;ctx.fillStyle=`rgba(${g},${g-4},${g-8},0.55)`;ctx.fillRect(Math.random()*s|0,Math.random()*s|0,1,1);}
  ctx.strokeStyle='rgba(108,103,96,0.5)';ctx.lineWidth=1;
  for(let x=0;x<s;x+=64){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,s);ctx.stroke();}
  for(let y=0;y<s;y+=64){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(s,y);ctx.stroke();}
});
concreteTex.repeat.set(6,6);

const grassTex=procTex((ctx,s)=>{
  ctx.fillStyle='#3d6830';ctx.fillRect(0,0,s,s);
  for(let i=0;i<5000;i++){const g=88+Math.random()*40|0;ctx.fillStyle=`rgb(${22+Math.random()*22|0},${g},${16+Math.random()*18|0})`;ctx.fillRect(Math.random()*s|0,Math.random()*s|0,1+(Math.random()*1.5|0),1+(Math.random()*3|0));}
});
grassTex.repeat.set(8,8);

// Sol jardin / terre

function makeBrick(br,jo){
  return procTex((ctx,s)=>{
    ctx.fillStyle=jo;ctx.fillRect(0,0,s,s);
    const BW=40,BH=18;
    for(let row=0;row*BH<s+BH;row++){
      const off=(row%2)*BW/2;
      for(let col=-1;col*BW<s+BW;col++){
        const rr=parseInt(br.slice(1,3),16)+(Math.random()*24-12|0);
        const rg=parseInt(br.slice(3,5),16)+(Math.random()*20-10|0);
        const rb2=parseInt(br.slice(5,7),16)+(Math.random()*16-8|0);
        ctx.fillStyle=`rgb(${Math.max(20,Math.min(240,rr))},${Math.max(15,Math.min(200,rg))},${Math.max(15,Math.min(180,rb2))})`;
        ctx.fillRect(col*BW+off+2,row*BH+2,BW-4,BH-4);
      }
    }
  },256);
}

const colliders=[];
function addCol(cx,cz,hw,hd,mH=200){colliders.push({minX:cx-hw,maxX:cx+hw,minZ:cz-hd,maxZ:cz+hd,mH});}
const PR=0.55;
function resCol(nx,nz,py,cols){
  for(const c of cols){
    if(py>=(c.mH||200))continue;
    const px=Math.max(c.minX,Math.min(c.maxX,nx)),pz=Math.max(c.minZ,Math.min(c.maxZ,nz));
    const dx=nx-px,dz=nz-pz,d=Math.sqrt(dx*dx+dz*dz);
    if(d<PR){if(d<0.001){nx+=PR;}else{const p=PR-d;nx+=(dx/d)*p;nz+=(dz/d)*p;}}
  }
  return{x:nx,z:nz};
}

function building(x,z,w,h,d,style=0){
  const wM=style===0
    ?new THREE.MeshStandardMaterial({map:bArr[Math.abs(x+z)%4],roughness:0.85,color:0xcccccc})
    :new THREE.MeshStandardMaterial({map:concBuild,roughness:0.82,metalness:0.05,color:style===1?0xccc8c0:0xbec0c4});
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),wM);b.castShadow=true;b.receiveShadow=true;b.position.set(x,h/2,z);scene.add(b);
  const rM=new THREE.Mesh(new THREE.BoxGeometry(w+0.2,0.45,d+0.2),matRoof);rM.position.set(x,h+0.22,z);scene.add(rM);
  const wCols=Math.max(1,Math.floor(w/2.8)),wRows=Math.max(1,Math.floor(h/3.8));
  const wm1=new THREE.MeshStandardMaterial({map:[winA,winB,winC][Math.abs(x+z)%3],roughness:0.2,metalness:0.6,color:0xaaccee});
  for(let r=0;r<wRows;r++)for(let c=0;c<wCols;c++){
    const wx=-w/2+0.9+c*(w-0.8)/(Math.max(wCols-1,1)),wy=1.5+r*3.6;
    const win1=new THREE.Mesh(new THREE.BoxGeometry(0.85,1.3,0.07),wm1);win1.position.set(x+wx,wy,z+d/2+0.05);scene.add(win1);
    const win2=new THREE.Mesh(new THREE.BoxGeometry(0.85,1.3,0.07),wm1);win2.position.set(x+wx,wy,z-d/2-0.05);scene.add(win2);
  }
  const sM=new THREE.MeshStandardMaterial({map:signTex[Math.abs(Math.round(x*z))%signTex.length],roughness:0.6});
  const sw=Math.min(w*0.55,4.5),sh=sw*1.35;
  const sign=new THREE.Mesh(new THREE.BoxGeometry(sw,sh,0.12),sM);sign.position.set(x,h*0.33,z+d/2+0.1);scene.add(sign);
  const antM=new THREE.MeshStandardMaterial({color:0x5a6070,roughness:0.5,metalness:0.6});
  const ant=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.08,3.5,6),antM);ant.castShadow=true;ant.position.set(x+w/4,h+2.15,z+d/4);scene.add(ant);
  addCol(x,z,w/2+0.15,d/2+0.15);
}

function shopRow(cx,cz,count,dir='x'){
  for(let i=0;i<count;i++){
    const off=(i-(count-1)/2)*7;
    const sx=dir==='x'?cx+off:cx;
    const sz=dir==='x'?cz:cz+off;
    const h=3.8+Math.random()*2;

    const b=new THREE.Mesh(new THREE.BoxGeometry(6.5,h,5),sm);b.castShadow=true;b.receiveShadow=true;b.position.set(sx,h/2,sz);scene.add(b);
    const signM=new THREE.MeshStandardMaterial({map:signTex[(i+Math.abs(sz)|0)%signTex.length],roughness:0.6});

}

// Construction des tunnels d'égout
// Un tunnel = sol + plafond + 2 murs + eau + tuyaux + lumières
function sewerTunnel(x,z,w,d,horizontal=true){
  const cx=x,cz=z;
  // Sol
  const floor=new THREE.Mesh(new THREE.BoxGeometry(horizontal?d:w,0.3,horizontal?w:d),sewerFloorMat);
  floor.position.set(cx,SW_Y-0.15,cz);scene.add(floor);
  // Plafond
  const ceil=new THREE.Mesh(new THREE.BoxGeometry(horizontal?d:w,0.35,horizontal?w:d),sewerCeilMat);
  ceil.position.set(cx,SW_Y+SW_H+0.17,cz);scene.add(ceil);
  // Murs latéraux
  const side=horizontal?w:d;const length=horizontal?d:w;
  const wallL=new THREE.Mesh(new THREE.BoxGeometry(length,SW_H,0.35),sewerWallMat);
  wallL.position.set(cx,SW_Y+SW_H/2,cz-(side/2+0.17));scene.add(wallL);
  const wallR=new THREE.Mesh(new THREE.BoxGeometry(length,SW_H,0.35),sewerWallMat);
  wallR.position.set(cx,SW_Y+SW_H/2,cz+(side/2+0.17));scene.add(wallR);
  if(!horizontal){
    wallL.rotation.y=Math.PI/2;wallR.rotation.y=Math.PI/2;
  }
  // Eau au centre (canal)
  const water=new THREE.Mesh(new THREE.BoxGeometry(horizontal?d-0.1:w*0.45,0.12,horizontal?w*0.45:d-0.1),sewerWaterMat);
  water.position.set(cx,SW_Y+0.1,cz);scene.add(water);
  // Bordures canal (béton)
  const borderMat=new THREE.MeshStandardMaterial({map:sewerFloorTex,roughness:0.95,color:0x668855});
  const bord1=new THREE.Mesh(new THREE.BoxGeometry(horizontal?d:0.6,0.15,horizontal?0.6:d),borderMat);bord1.position.set(cx,SW_Y+0.07,cz-(horizontal?w*0.22:0));scene.add(bord1);
  const bord2=new THREE.Mesh(new THREE.BoxGeometry(horizontal?d:0.6,0.15,horizontal?0.6:d),borderMat);bord2.position.set(cx,SW_Y+0.07,cz+(horizontal?w*0.22:0));scene.add(bord2);

  // TUYAUX le long du plafond
  const pipeDir=horizontal?d:w;
  for(let pi=0;pi<3;pi++){
    const pR=0.18+pi*0.08;
    const pipeM=new THREE.MeshStandardMaterial({map:pipeTex,roughness:0.72,metalness:0.45,color:0xbbbbaa});
    const pipe=new THREE.Mesh(new THREE.CylinderGeometry(pR,pR,pipeDir,8),pipeM);
    pipe.rotation.z=horizontal?Math.PI/2:0;
    if(!horizontal)pipe.rotation.y=Math.PI/2;
    const pipeOffset=(pi-1)*(side*0.28);
    pipe.position.set(horizontal?cx:cx+pipeOffset,SW_Y+SW_H-pR-0.1,horizontal?cz+pipeOffset:cz);
    scene.add(pipe);
    // Anneaux de jonction tuyaux
    for(let seg=0;seg<Math.floor(pipeDir/10);seg++){
      const ring=new THREE.Mesh(new THREE.TorusGeometry(pR+0.04,0.05,6,10),new THREE.MeshStandardMaterial({color:0x5a4030,roughness:0.6,metalness:0.6}));
      ring.rotation.x=horizontal?0:Math.PI/2;
      ring.position.set(horizontal?cx-pipeDir/2+seg*10:cx+pipeOffset,SW_Y+SW_H-pR-0.1,horizontal?cz+pipeOffset:cz-pipeDir/2+seg*10);
      scene.add(ring);
    }
  }
  // Tuyaux verticaux aux murs (conduits)
  for(let side2=0;side2<2;side2++){
    const vertPipe=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,SW_H,8),new THREE.MeshStandardMaterial({map:pipeTex,roughness:0.72,metalness:0.5,color:0x889966}));
    const vx=horizontal?cx+pipeDir/4*(side2===0?1:-1):cx;
    const vz=horizontal?cz:cz+pipeDir/4*(side2===0?1:-1);
    const wallOff=(horizontal?w:d)/2+0.05;
    vertPipe.position.set(horizontal?vx:vx-(side2===0?wallOff:-wallOff),SW_Y+SW_H/2,horizontal?vz-(side2===0?w/2+0.05:-w/2-0.05):vz);
    scene.add(vertPipe);
  }
  // Lumières tous les 15m
  const numLights=Math.max(1,Math.floor((horizontal?d:w)/15));
  for(let li=0;li<numLights;li++){
    const lt=horizontal?cx-d/2+(li+0.5)*(d/numLights):cx;
    const ltz=horizontal?cz:cz-w/2+(li+0.5)*(w/numLights);
    sewerLight(lt,ltz,li%2===0?0x40ff20:0xff8800,1.2);
    // Luminaire (boîte lumineuse)
    const lumMat=new THREE.MeshStandardMaterial({color:li%2===0?0x40ff20:0xff8800,roughness:0.2,emissive:new THREE.Color(li%2===0?0x104010:0x441100),emissiveIntensity:1.2});
    const lum=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.12,0.25),lumMat);lum.position.set(lt,SW_Y+SW_H-0.08,ltz);scene.add(lum);
  }

  // Colliders (murs du tunnel)
  if(horizontal){
    addSewerCol(cx,cz-(side/2+0.35),d,0.35);
    addSewerCol(cx,cz+(side/2+0.35),d,0.35);
  }else{
    addSewerCol(cx-(side/2+0.35),cz,0.35,d);
    addSewerCol(cx+(side/2+0.35),cz,0.35,d);
  }
}

}

const avatarGroup=new THREE.Group();avatarGroup.position.set(0,0,8);scene.add(avatarGroup);
let avatarMixer=null,emoteTimer=null,lastWalking=false;
const gltfLoader=new GLTFLoader();const glbCache={};
function loadGLB(url,cb){if(glbCache[url]){cb(glbCache[url]);return;}gltfLoader.load(url,gltf=>{glbCache[url]=gltf;cb(gltf);},undefined,()=>{});}
function swapAvatar(file,loop,onDone){
  const url=BASE+file;
  loadGLB(url,gltf=>{
    while(avatarGroup.children.length)avatarGroup.remove(avatarGroup.children[0]);
    if(avatarMixer){avatarMixer.stopAllAction();avatarMixer=null;}
    const model=gltf.scene;model.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true;}});
    const bb=new THREE.Box3().setFromObject(model);const sz=new THREE.Vector3();bb.getSize(sz);
    if(sz.y>0)model.scale.setScalar(1.75/sz.y);
    const bb2=new THREE.Box3().setFromObject(model);model.position.y=-bb2.min.y;
    avatarGroup.add(model);
    if(gltf.animations&&gltf.animations.length){
      avatarMixer=new THREE.AnimationMixer(model);
      const action=avatarMixer.clipAction(gltf.animations[0]);
      action.setLoop(loop?THREE.LoopRepeat:THREE.LoopOnce,loop?Infinity:1);action.clampWhenFinished=!loop;action.play();
      if(onDone)onDone(gltf.animations[0].duration);
    }
  });
}

// ── JOYSTICKS ─────────────────────────────────────────────
const joyBase=document.getElementById('joy-base'),joyKnob=document.getElementById('joy-knob');
const JR=40;const joy={active:false,x:0,y:0,id:null};
function getJC(){const r=joyBase.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
function updateJoy(cx,cy){const c=getJC();let dx=cx-c.x,dy=cy-c.y;const d=Math.sqrt(dx*dx+dy*dy);if(d>JR){dx=dx/d*JR;dy=dy/d*JR;}joy.x=dx/JR;joy.y=dy/JR;joyKnob.style.transform=`translate(${dx}px,${dy}px)`;}
joyBase.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];joy.active=true;joy.id=t.identifier;updateJoy(t.clientX,t.clientY);},{passive:false});
document.addEventListener('touchmove',e=>{if(!joy.active)return;for(const t of e.changedTouches)if(t.identifier===joy.id){e.preventDefault();updateJoy(t.clientX,t.clientY);}},{passive:false});
document.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===joy.id){joy.active=false;joy.x=0;joy.y=0;joyKnob.style.transform='translate(0,0)';}});
const camBase=document.getElementById('cam-joy-base'),camKnob=document.getElementById('cam-joy-knob');
const camJoy={active:false,x:0,id:null};
function getCamC(){const r=camBase.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
function updateCamJoy(cx,cy){const c=getCamC();let dx=cx-c.x,dy=cy-c.y;const d=Math.sqrt(dx*dx+dy*dy);if(d>JR){dx=dx/d*JR;dy=dy/d*JR;}camJoy.x=dx/JR;camKnob.style.transform=`translate(${dx}px,${dy}px)`;}
camBase.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];camJoy.active=true;camJoy.id=t.identifier;updateCamJoy(t.clientX,t.clientY);},{passive:false});
document.addEventListener('touchmove',e=>{if(!camJoy.active)return;for(const t of e.changedTouches)if(t.identifier===camJoy.id){e.preventDefault();updateCamJoy(t.clientX,t.clientY);}},{passive:false});
document.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===camJoy.id){camJoy.active=false;camJoy.x=0;camKnob.style.transform='translate(0,0)';}});
let mDrag={active:false,lastX:0};
renderer.domElement.addEventListener('mousedown',e=>{mDrag.active=true;mDrag.lastX=e.clientX;});
document.addEventListener('mousemove',e=>{if(!mDrag.active)return;cameraYaw-=(e.clientX-mDrag.lastX)*0.005;mDrag.lastX=e.clientX;});
document.addEventListener('mouseup',()=>mDrag.active=false);
const keys={};

// ── SAUT ──────────────────────────────────────────────────
const JVN=9,JVS=20,GR=28;
let jumpVel=0,onGround=true,jtc=0,jtt=null;
let hasJetpack=false,jetpackFuel=100;
let jpCollected=false;

function doJump(){
  if(!onGround)return;jtc++;clearTimeout(jtt);
  if(jtc>=2){jtc=0;jumpVel=JVS;onGround=false;showToast('🚀 SUPER SAUT !');}
  else{jtt=setTimeout(()=>{if(jtc===1&&onGround){jumpVel=JVN;onGround=false;}jtc=0;},280);}
}
document.getElementById('jump-btn').addEventListener('touchstart',e=>{e.preventDefault();doJump();},{passive:false});
document.getElementById('jump-btn').addEventListener('click',doJump);
document.getElementById('super-jump-btn').addEventListener('touchstart',e=>{e.preventDefault();if(hasJetpack&&jetpackFuel>0&&!isInSewer){jumpVel=Math.max(jumpVel,15);onGround=false;}else{if(!onGround)return;jtc=0;clearTimeout(jtt);jumpVel=JVS;onGround=false;showToast('🚀 SUPER SAUT !');}},{passive:false});
document.getElementById('super-jump-btn').addEventListener('click',()=>{if(!onGround)return;jtc=0;clearTimeout(jtt);jumpVel=JVS;onGround=false;showToast('🚀 SUPER SAUT !');});

// ── ÉTAT ──────────────────────────────────────────────────
let isInSewer=false;
let sewerCoinsCount=0;

function enterSewer(){
  if(isInSewer)return;isInSewer=true;
  document.getElementById('zone-name').textContent='🐀 Égout Souterrain';
  // Fog spécial égout
  scene.fog=new THREE.Fog(0x0a120a,8,28);
  scene.background=new THREE.Color(0x080f06);
  showToast('⬇️ Dans les égouts ! Trouve le 🚀 JetPack !');
  addChat('💀 Égout ! Lumière verte = direction, orange = danger !','Souterrain');
}
function exitSewer(){
  if(!isInSewer)return;isInSewer=false;
  document.getElementById('zone-name').textContent='東京 Shinjuku';
  scene.fog=new THREE.Fog(0x9ec2dc,100,280);
  scene.background=new THREE.Color(0x8ab4d4);
  showToast('⬆️ Retour à la surface !');
}

// ── BOUCLE PRINCIPALE ─────────────────────────────────────
const SPEED=6,BOUND=130;
const pp=new THREE.Vector3(0,0,8);
let pRot=0,cameraYaw=Math.PI;
const CD=8,CH=2.6,CLY=1.2,CL=4;
const clock=new THREE.Clock();
let time=0;

function updateBubble(){}

finishLoading();

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.08);
  time+=dt;
  if(avatarMixer)avatarMixer.update(dt);

  // Animations JetPack + coins
  if(!jpCollected&&jpGrp){jpGrp.rotation.y=time;jpGrp.position.y=SW_Y+1.5+0.25*Math.sin(time*2);}
  sewerCoins.forEach(c=>{if(!c.collected){c.mesh.rotation.z=time*2.5;c.mesh.position.y=SW_Y+1.2+0.08*Math.sin(time*3+c.mesh.position.x);}});
  // Pulsation lumières égout
  sewerLights.forEach((l,i)=>{l.intensity=1.1+0.4*Math.sin(time*1.5+i*0.7);});
  jpLight2.intensity=2+Math.sin(time*3)*0.8;

  // Input
  let mx=joy.x,mz=-joy.y;
  if(keys['ArrowUp']||keys['w']||keys['W'])mz=1;
  if(keys['ArrowDown']||keys['s']||keys['S'])mz=-1;
  if(keys['ArrowLeft']||keys['a']||keys['A'])mx=-1;
  if(keys['ArrowRight']||keys['d']||keys['D'])mx=1;
  if(keys[' ']&&onGround)doJump();
  if(camJoy.active&&Math.abs(camJoy.x)>0.04)cameraYaw-=camJoy.x*2.2*dt;
  if(keys['q']||keys['Q'])cameraYaw+=1.8*dt;
  if(keys['e']||keys['E'])cameraYaw-=1.8*dt;
  // JetPack
  if((keys['o']||keys['O'])&&hasJetpack&&jetpackFuel>0){jumpVel=Math.max(jumpVel,15);onGround=false;jetpackFuel=Math.max(0,jetpackFuel-30*dt);}
  else if(hasJetpack&&jetpackFuel<100){jetpackFuel=Math.min(100,jetpackFuel+12*dt);}

  const moving=Math.abs(mx)>0.05||Math.abs(mz)>0.05;
  if(moving&&emoteTimer){clearTimeout(emoteTimer);emoteTimer=null;}

  // Mouvement surface
  if(!isInSewer){
    if(onGround)setWalkSwap(moving);
    if(moving){
      const sc=Math.sin(cameraYaw),cc=Math.cos(cameraYaw);
      const dx=(sc*(-mz)+cc*mx)*SPEED*dt,dz=(cc*(-mz)-sc*mx)*SPEED*dt;
      let nx=pp.x+dx,nz=pp.z+dz;
      const res=resCol(nx,nz,pp.y,colliders);nx=res.x;nz=res.z;
      pp.x=Math.max(-BOUND,Math.min(BOUND,nx));pp.z=Math.max(-BOUND,Math.min(BOUND,nz));
      pRot=Math.atan2(dx,dz);
      const tY=pRot+Math.PI;let diff=tY-cameraYaw;
      while(diff>Math.PI)diff-=2*Math.PI;while(diff<-Math.PI)diff+=2*Math.PI;
      cameraYaw+=diff*Math.min(CL*dt,1.0);
    }
    if(!onGround){jumpVel-=GR*dt;pp.y+=jumpVel*dt;if(pp.y<=0){pp.y=0;jumpVel=0;onGround=true;setWalkSwap(moving);}}

    // Entrée égout
    const de=Math.sqrt((pp.x-SW_ENTRY_X)**2+(pp.z-SW_ENTRY_Z)**2);
    if(de<2.5&&onGround){enterSewer();pp.y=SW_Y+0.15;pp.z=SW_ENTRY_Z+22;}
  }

  // Mouvement égout
  if(isInSewer){
    setWalkSwap(moving);
    if(moving){
      const sc=Math.sin(cameraYaw),cc=Math.cos(cameraYaw);
      const dx=(sc*(-mz)+cc*mx)*SPEED*0.65*dt,dz=(cc*(-mz)-sc*mx)*SPEED*0.65*dt;
      let nx=pp.x+dx,nz=pp.z+dz;
      const res=resCol(nx,nz,pp.y,sewerColliders);nx=res.x;nz=res.z;
      pp.x=Math.max(-BOUND,Math.min(BOUND,nx));pp.z=Math.max(-BOUND,Math.min(BOUND,nz));
      pRot=Math.atan2(dx,dz);
      const tY=pRot+Math.PI;let diff=tY-cameraYaw;
      while(diff>Math.PI)diff-=2*Math.PI;while(diff<-Math.PI)diff+=2*Math.PI;
      cameraYaw+=diff*Math.min(CL*dt,1.0);
    }
    pp.y=SW_Y+0.1;onGround=true;jumpVel=0;

    // Collecte coins
    sewerCoins.forEach(c=>{
      if(!c.collected){
        const d=Math.sqrt((pp.x-c.mesh.position.x)**2+(pp.z-c.mesh.position.z)**2);
        if(d<1.8){c.collected=true;c.mesh.visible=false;sewerCoinsCount++;showToast(`💚 Capsule ${sewerCoinsCount}/10 !`);addChat(`Capsule ${sewerCoinsCount}/10 !`,'Égout');}
      }
    });

    // Collecte JetPack
    if(!jpCollected&&jpGrp){
      const dj=Math.sqrt((pp.x-jpGrp.position.x)**2+(pp.z-jpGrp.position.z)**2);
      if(dj<2.5){jpCollected=true;hasJetpack=true;jpGrp.visible=false;showToast('🚀🚀 JETPACK ! Appuie O pour voler !');addChat('🚀 JetPack équipé !','Système');}
    }

    // Sortie égout
    const de2=Math.sqrt((pp.x-SW_ENTRY_X)**2+(pp.z-(SW_ENTRY_Z+22))**2);
    if(de2<2.5){exitSewer();pp.y=0.5;}
  }

  // Avatar + caméra
  avatarGroup.position.set(pp.x,pp.y,pp.z);
  avatarGroup.rotation.y=pRot;
  blob.position.x=pp.x;blob.position.z=pp.z;
  blob.position.y=isInSewer?SW_Y+0.02:0.012;

  const camD=isInSewer?4:CD;
  const camH2=isInSewer?2:CH;
  const camLY=isInSewer?0.9:CLY;
  camera.position.set(pp.x+Math.sin(cameraYaw)*camD,pp.y+camH2,pp.z+Math.cos(cameraYaw)*camD);
  camera.lookAt(pp.x,pp.y+camLY,pp.z);

  renderer.render(scene,camera);
}
animate();
