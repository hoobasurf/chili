<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Macadam World — Tokyo</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--g:#f5c842;--o:#e85d26;--gl:rgba(8,12,24,0.55);--gb:rgba(255,255,255,0.13);--gs:rgba(8,12,24,0.82);}
html,body{width:100%;height:100%;overflow:hidden;background:#0a1428;font-family:'M PLUS Rounded 1c',sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;}

/* CANVAS */
#cc{position:fixed;inset:0;z-index:0;}
#cc canvas{display:block;width:100%!important;height:100%!important;}

/* HUD — par-dessus canvas, pointer-events none par défaut */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;}

/* TOP BAR */
.htop{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:linear-gradient(180deg,rgba(0,0,0,.6) 0%,transparent 100%);}
.hlogo{font-family:‘Zen Kaku Gothic New’,sans-serif;font-size:.85rem;font-weight:900;color:#fff;}
.hlogo em{color:var(–g);font-style:normal;}
.hloc{display:flex;align-items:center;gap:4px;background:var(–gl);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(–gb);border-radius:14px;padding:3px 10px;}
.hloc span{font-size:.62rem;font-weight:700;color:#fff;}
.ldot{width:5px;height:5px;border-radius:50%;background:var(–g);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hinfo{display:flex;align-items:center;gap:5px;background:var(–gl);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(–gb);border-radius:14px;padding:3px 10px 3px 4px;}
.hpic{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(–o),var(–g));display:flex;align-items:center;justify-content:center;font-size:.55rem;font-weight:900;color:#fff;}
.hname{font-size:.6rem;font-weight:700;color:#fff;}

/* MINIMAP */
#mm{position:absolute;top:52px;left:10px;width:110px;height:110px;border-radius:10px;background:var(–gl);border:1px solid var(–gb);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow:hidden;pointer-events:all;cursor:pointer;transition:all .3s;z-index:15;}
#mm.exp{width:280px;height:280px;border-radius:14px;}
#mm canvas{width:100%;height:100%;}
.mml{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:.42rem;font-weight:700;color:rgba(255,255,255,.45);}

/* MISSION TOGGLE */
#mtog{position:absolute;top:52px;right:10px;width:36px;height:36px;border-radius:50%;background:var(–gl);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid rgba(245,200,66,.5);display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:900;color:var(–g);cursor:pointer;pointer-events:all;z-index:20;}
#mbadge{position:absolute;top:-3px;right:-3px;width:14px;height:14px;border-radius:50%;background:var(–o);font-size:.45rem;font-weight:900;color:#fff;display:flex;align-items:center;justify-content:center;}
#mside{position:absolute;top:52px;right:10px;width:190px;max-height:60vh;background:var(–gl);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(–gb);border-radius:12px;overflow:hidden;pointer-events:all;z-index:19;transform:translateX(210px);transition:transform .28s ease;display:flex;flex-direction:column;}
#mside.open{transform:translateX(0);}
.mhdr{padding:7px 10px;border-bottom:1px solid var(–gb);display:flex;align-items:center;justify-content:space-between;}
.mhdr span{font-size:.68rem;font-weight:900;color:var(–g);}
.mclx{font-size:.8rem;color:rgba(255,255,255,.5);cursor:pointer;padding:2px 5px;}
.mlist{overflow-y:auto;flex:1;scrollbar-width:none;}
.mlist::-webkit-scrollbar{display:none;}
.mitem{padding:6px 10px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.04);transition:background .12s;}
.mitem:hover,.mitem.am{background:rgba(245,200,66,.09);}
.mitl{font-size:.6rem;font-weight:700;color:#fff;}
.midc{font-size:.5rem;color:rgba(255,255,255,.42);margin-top:1px;}
.badge{display:inline-block;font-size:.42rem;font-weight:900;padding:1px 5px;border-radius:5px;margin-bottom:1px;}
.bn{background:var(–o);color:#fff;}.bd{background:#2ecc71;color:#fff;}

/* =====================================================
BOTTOM CONTROLS — disposition fixe sans chevauchement
Zone de 170px de haut divisée en couches :
Layer 1 (bottom 0-80px)   : anim panel
Layer 2 (bottom 80-176px) : joysticks + boutons saut
Layer 3 (bottom 176-220px): chat
===================================================== */

/* ANIM PANEL */
#ap{
position:absolute;
bottom:0;left:0;right:0;
height:80px;
background:var(–gl);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
border-top:1px solid var(–gb);
pointer-events:all;
z-index:11;
}
#asc{display:flex;gap:4px;overflow-x:auto;padding:4px 8px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;height:100%;}
#asc::-webkit-scrollbar{display:none;}
.abtn{flex-shrink:0;width:52px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.aico{width:50px;height:50px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid var(–gb);display:flex;align-items:center;justify-content:center;transition:all .12s;}
.aico svg{width:40px;height:40px;}
.abtn.active .aico{background:rgba(245,200,66,.1);border-color:var(–g);}
.abtn:active .aico{transform:scale(.86);}
.albl{font-size:.44rem;font-weight:700;color:rgba(255,255,255,.38);text-align:center;white-space:nowrap;}
.abtn.active .albl{color:var(–g);}

/* JOYSTICK GAUCHE (caméra) — bas gauche, au-dessus du panel */
#cjz{
position:absolute;
bottom:88px;   /* juste au-dessus du panel (80px) + 8px marge */
left:10px;
width:90px;height:90px;
pointer-events:all;
z-index:12;
}
/* JOYSTICK DROIT (mouvement) — bas droit */
#jz{
position:absolute;
bottom:88px;
right:10px;
width:90px;height:90px;
pointer-events:all;
z-index:12;
}
.jbase{width:90px;height:90px;border-radius:50%;background:var(–gl);border:1.5px solid var(–gb);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);position:relative;display:flex;align-items:center;justify-content:center;}
.jknob{width:34px;height:34px;border-radius:50%;position:absolute;box-shadow:0 2px 8px rgba(0,0,0,.5);}

/* BOUTON SUPER-JUMP — au-dessus du joystick gauche */
#sjb{
position:absolute;
bottom:188px;  /* 88 + 90 + 10 */
left:28px;     /* centré sur le joystick gauche (10 + 45 - 21 = 34, ~28) */
width:42px;height:42px;
border-radius:50%;
background:rgba(232,93,38,.85);
backdrop-filter:blur(6px);
border:1.5px solid rgba(255,120,60,.4);
color:#fff;font-size:.9rem;
pointer-events:all;cursor:pointer;
display:flex;align-items:center;justify-content:center;
-webkit-tap-highlight-color:transparent;
z-index:12;
box-shadow:0 2px 10px rgba(232,93,38,.4);
}
/* BOUTON JUMP — au-dessus du joystick droit */
#jb{
position:absolute;
bottom:188px;
right:28px;
width:42px;height:42px;
border-radius:50%;
background:rgba(43,108,176,.85);
backdrop-filter:blur(6px);
border:1.5px solid rgba(80,140,220,.4);
color:#fff;font-size:1.1rem;
pointer-events:all;cursor:pointer;
display:flex;align-items:center;justify-content:center;
-webkit-tap-highlight-color:transparent;
z-index:12;
box-shadow:0 2px 10px rgba(43,108,176,.4);
}

/* CHAT — centré entre joysticks, au-dessus des joysticks */
.hchat{
position:absolute;
bottom:188px;   /* même hauteur que les boutons saut */
left:120px;     /* après le joystick gauche (10+90+20) */
right:120px;    /* avant le joystick droit */
pointer-events:all;
z-index:11;
}
.cmsgs{max-height:64px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin-bottom:3px;scrollbar-width:none;}
.cmsgs::-webkit-scrollbar{display:none;}
.cmsg{background:var(–gl);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(–gb);border-radius:12px;padding:3px 9px;font-size:.58rem;color:#fff;line-height:1.3;}
.cmsg .cn{font-weight:900;color:var(–g);margin-right:3px;}
.cinwrap{display:flex;gap:4px;}
.cin{flex:1;background:var(–gl);border:1.5px solid var(–gb);border-radius:18px;padding:6px 10px;font-size:13px;font-weight:700;color:#fff;outline:none;font-family:‘M PLUS Rounded 1c’,sans-serif;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-width:0;}
.cin::placeholder{color:rgba(255,255,255,.3);}
.cin:focus{border-color:var(–g);}
.csend{width:32px;height:32px;flex-shrink:0;border-radius:50%;background:var(–o);border:none;color:#fff;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;}

/* TOAST */
.toast{position:fixed;bottom:290px;left:50%;transform:translateX(-50%) translateY(12px);background:var(–gs);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(–g);padding:5px 14px;border:1px solid rgba(245,200,66,.3);border-radius:14px;font-size:.65rem;font-weight:700;opacity:0;transition:all .22s;z-index:50;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* HINT interaction */
#vh{position:fixed;bottom:290px;left:50%;transform:translateX(-50%);background:var(–gs);backdrop-filter:blur(14px);border:1px solid var(–gb);border-radius:10px;padding:4px 14px;font-size:.64rem;font-weight:700;color:#fff;display:none;z-index:30;pointer-events:none;white-space:nowrap;}

/* LOADING */
#ls{position:fixed;inset:0;z-index:200;background:linear-gradient(135deg,#080e1e,#0f1e38);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s;}
#ls.hidden{opacity:0;pointer-events:none;}
.llogo{font-family:‘Zen Kaku Gothic New’,sans-serif;font-size:2.5rem;font-weight:900;color:#fff;letter-spacing:.06em;text-shadow:0 0 36px rgba(245,200,66,.45);}
.llogo em{color:var(–g);font-style:normal;}
.lsub{font-size:.75rem;color:rgba(255,255,255,.38);letter-spacing:.28em;font-weight:700;}
.lbw{width:180px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;}
.lb{height:100%;width:0%;background:linear-gradient(90deg,var(–o),var(–g));border-radius:2px;transition:width .18s;}
.lt{font-size:.64rem;color:rgba(255,255,255,.45);font-weight:700;}

/* ERREUR */
#errmsg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(180,20,20,.9);color:#fff;padding:16px 20px;border-radius:14px;font-size:.75rem;font-weight:700;text-align:center;z-index:300;display:none;max-width:280px;line-height:1.5;}

/* POPUP MISSION */
#mpop{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.85);background:var(–gs);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1.5px solid rgba(245,200,66,.38);border-radius:16px;padding:16px 20px;z-index:100;pointer-events:all;min-width:220px;max-width:290px;opacity:0;transition:all .28s;display:none;}
#mpop.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
.mpt{font-family:‘Zen Kaku Gothic New’,sans-serif;font-size:.95rem;font-weight:900;color:var(–g);margin-bottom:5px;}
.mpd{font-size:.68rem;color:rgba(255,255,255,.78);line-height:1.45;margin-bottom:7px;}
.mptp{font-size:.62rem;color:rgba(100,200,255,.78);margin-bottom:10px;cursor:pointer;text-decoration:underline;}
.mpbtn{background:var(–o);color:#fff;border:none;border-radius:18px;padding:6px 16px;font-size:.68rem;font-weight:700;cursor:pointer;font-family:‘M PLUS Rounded 1c’,sans-serif;margin-right:6px;}
.mpcl{background:rgba(255,255,255,.1);color:#fff;border:none;border-radius:18px;padding:6px 12px;font-size:.68rem;font-weight:700;cursor:pointer;font-family:‘M PLUS Rounded 1c’,sans-serif;}
</style>

</head>
<body>

<div id="cc"></div>
<div id="errmsg" id="errmsg"></div>

<div id="ls">
  <div class="llogo">TOKYO <em>東京</em></div>
  <div class="lsub">MACADAM WORLD</div>
  <div class="lbw"><div class="lb" id="lb"></div></div>
  <div class="lt" id="lt">Chargement de Three.js…</div>
</div>

<div id="hud">
  <div class="htop">
    <div class="hlogo">⬡ <em>Macadam</em> World</div>
    <div class="hloc"><div class="ldot"></div><span id="zn">東京 Shinjuku</span></div>
    <div class="hinfo"><div class="hpic" id="hpic">?</div><span class="hname" id="hps">Joueur</span></div>
  </div>

  <div id="mm"><canvas id="mmc" width="280" height="280"></canvas><div class="mml" id="mml">▲ NORD — tap agrandir</div></div>

  <div id="mtog" style="pointer-events:all;">!<div id="mbadge">0</div></div>
  <div id="mside">
    <div class="mhdr"><span>🎯 MISSIONS</span><span class="mclx" id="mclx">✕</span></div>
    <div class="mlist" id="mlist"></div>
  </div>

  <!-- Chat centré entre les deux joysticks -->

  <div class="hchat">
    <div class="cmsgs" id="cmsgs"></div>
    <div class="cinwrap">
      <input class="cin" id="cin" type="text" placeholder="Message…" maxlength="80" autocomplete="off"/>
      <button class="csend" id="csnd">▶</button>
    </div>
  </div>

  <!-- Joystick gauche = caméra -->

  <div id="cjz">
    <div class="jbase" id="cjb">
      <div class="jknob" id="cjk" style="background:linear-gradient(135deg,#f5c842,#e85d26);"></div>
    </div>
  </div>

<button id="sjb">🚀</button>
<button id="jb">↑</button>

  <!-- Joystick droit = mouvement -->

  <div id="jz">
    <div class="jbase" id="jbase">
      <div class="jknob" id="jknob" style="background:linear-gradient(135deg,#ddd,#aaa);"></div>
    </div>
  </div>

  <div id="ap"><div id="asc"></div></div>
</div>

<div class="toast" id="toast"></div>
<div id="vh"></div>

<div id="mpop">
  <div class="mpt" id="mpt2"></div>
  <div class="mpd" id="mpd2"></div>
  <div class="mptp" id="mptp2"></div>
  <button class="mpbtn" id="mpok2">Accepter !</button>
  <button class="mpcl" id="mpcl3">Fermer</button>
</div>

<!-- THREE.js : essayer unpkg, puis jsDelivr -->

<script>
function loadScript(src, cb, errCb) {
  var s = document.createElement('script');
  s.src = src;
  s.onload = cb;
  s.onerror = errCb;
  document.head.appendChild(s);
}

function showErr(msg) {
  var e = document.getElementById('errmsg');
  e.textContent = msg;
  e.style.display = 'block';
  document.getElementById('lt').textContent = '❌ ' + msg;
}

// Charger THREE puis GLTFLoader avec fallbacks
var threeLoaded = false;
function loadGLTF(cb) {
  loadScript(
    'https://unpkg.com/three@0.134.0/examples/js/loaders/GLTFLoader.js',
    cb,
    function() {
      loadScript(
        'https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/GLTFLoader.js',
        cb,
        function() {
          // Pas de loader, on crée un stub
          THREE.GLTFLoader = function(){};
          THREE.GLTFLoader.prototype.load = function(u,ok,p,err){ if(err) err(new Error('no loader')); };
          cb();
        }
      );
    }
  );
}

function onThreeReady() {
  if(threeLoaded) return;
  threeLoaded = true;
  if(typeof THREE === 'undefined') { showErr('THREE.js introuvable. Vérifiez votre connexion internet.'); return; }
  // Vérifier WebGL
  try {
    var testCanvas = document.createElement('canvas');
    var gl = testCanvas.getContext('webgl') || testCanvas.getContext('experimental-webgl');
    if(!gl) { showErr('WebGL non supporté sur cet appareil/navigateur.'); return; }
  } catch(e) { showErr('Erreur WebGL : ' + e.message); return; }
  document.getElementById('lt').textContent = 'Chargement GLTFLoader…';
  loadGLTF(function() {
    document.getElementById('lt').textContent = 'Génération du monde…';
    setTimeout(startGame, 100);
  });
}

loadScript(
  'https://unpkg.com/three@0.134.0/build/three.min.js',
  onThreeReady,
  function() {
    loadScript(
      'https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js',
      onThreeReady,
      function() { showErr('Impossible de charger Three.js. Vérifiez internet.'); }
    );
  }
);

// Safety timeout
setTimeout(function() {
  if(!threeLoaded) showErr('Timeout chargement. Rechargez la page.');
}, 12000);
</script>

<script>
function startGame() {
  if(window._gs) return; window._gs = true;

  const BASE = 'https://raw.githubusercontent.com/hoobasurf/chili/main/';
  const WALK = 'course.glb', IDLE = 'attend.glb';

  // ===== MISSIONS =====
  const MS = [
    {id:'m1',t:'Explorateur',d:'Explore 4 quartiers',done:false,p:0,tot:4,tp:{x:0,z:0}},
    {id:'m2',t:'Égout',d:'Descends dans les souterrains',done:false,p:0,tot:1,tp:{x:15,z:15}},
    {id:'m3',t:'Central Park',d:'Atteins le parc',done:false,p:0,tot:1,tp:{x:20,z:-60}},
    {id:'m4',t:'Tour Eiffel',d:'Touche la tour',done:false,p:0,tot:1,tp:{x:-100,z:100}},
    {id:'m5',t:'Métro',d:'Monte dans le métro',done:false,p:0,tot:1,tp:{x:0,z:-40}},
    {id:'m6',t:'Marin',d:'Monte sur un bateau',done:false,p:0,tot:1,tp:{x:60,z:-160}},
  ];
  let actM = null;
  function renderMS() {
    const list = document.getElementById('mlist'); list.innerHTML = ''; let pend = 0;
    MS.forEach(m => {
      if(!m.done) pend++;
      const d = document.createElement('div'); d.className = 'mitem' + (actM===m.id?' am':'');
      d.innerHTML = `<span class="badge b${m.done?'d':'n'}">${m.done?'✓':'!'}</span><div class="mitl">${m.t}</div><div class="midc">${m.done?'Terminée ✓':`${m.p}/${m.tot} — ${m.d}`}</div>`;
      d.onclick = () => showMP(m); list.appendChild(d);
    });
    document.getElementById('mbadge').textContent = pend;
  }
  function showMP(m) {
    document.getElementById('mpt2').textContent = m.t;
    document.getElementById('mpd2').textContent = m.d + (m.done?' (Terminée !)':'');
    document.getElementById('mptp2').textContent = '📍 Téléporter ici';
    document.getElementById('mptp2').onclick = () => { ps.x=m.tp.x; ps.z=m.tp.z; ps.y=2; ps.vy=0; closeMP(); showToast('🚀 '+m.t); };
    document.getElementById('mpok2').onclick = () => { actM=m.id; renderMS(); closeMP(); showToast('Mission: '+m.t); };
    document.getElementById('mpcl3').onclick = closeMP;
    const p = document.getElementById('mpop'); p.style.display='block'; requestAnimationFrame(()=>p.classList.add('show'));
  }
  function closeMP() { const p=document.getElementById('mpop'); p.classList.remove('show'); setTimeout(()=>p.style.display='none',280); }
  renderMS();
  document.getElementById('mtog').onclick = () => document.getElementById('mside').classList.toggle('open');
  document.getElementById('mclx').onclick = () => document.getElementById('mside').classList.remove('open');

  // ===== PROFILE =====
  let pseudo = 'Joueur';
  try { const uid=localStorage.getItem('mw_uid')||('p_'+Math.random().toString(36).slice(2,7)); localStorage.setItem('mw_uid',uid); const s=JSON.parse(localStorage.getItem('mw_av_'+uid)||'null'); if(s?.pseudo) pseudo=s.pseudo; } catch(e) {}
  document.getElementById('hps').textContent = pseudo;
  document.getElementById('hpic').textContent = pseudo.slice(0,2).toUpperCase();

  // ===== LOADING =====
  let lp=0, ld=false;
  const lbar=document.getElementById('lb'), ltxt=document.getElementById('lt');
  const lmsgs=['Génération des rues…','Construction bâtiments…','Véhicules en route…','Presque prêt…'];
  let li=0;
  const lint = setInterval(()=>{ lp+=Math.random()*5; if(lp>88){lp=88;clearInterval(lint);} lbar.style.width=lp+'%'; const idx=Math.min(Math.floor(lp/25),3); if(idx>li){li=idx;ltxt.textContent=lmsgs[li];} }, 220);
  function finishLoad() { if(ld)return; ld=true; clearInterval(lint); lbar.style.width='100%'; ltxt.textContent='Bienvenue !'; setTimeout(()=>{ const l=document.getElementById('ls'); l.classList.add('hidden'); setTimeout(()=>l.style.display='none',600); },600); addChat('☀️ Bienvenue, '+pseudo+' !','Système'); addChat('🎮 Joystick G=Caméra | D=Mouvement | E=Interagir','Info'); }
  setTimeout(()=>finishLoad(), 2200);

  function showToast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2800); }
  function addChat(txt,from){ const c=document.getElementById('cmsgs'); const d=document.createElement('div'); d.className='cmsg'; d.innerHTML=`<span class="cn">${from}</span>${txt}`; c.appendChild(d); c.scrollTop=c.scrollHeight; while(c.children.length>12)c.removeChild(c.firstChild); }
  function sendChat(){ const i=document.getElementById('cin'); const m=i.value.trim(); if(!m)return; i.value=''; addChat(m,pseudo); }

    if(metro.grp&&!ps.sewer){const mp=metro.grp.position,dm=Math.sqrt((ps.x-mp.x)**2+(ps.z-mp.z)**2);if(dm<7&&!ps.onMetro&&ps.y>7){showHint('[ E ] Monter dans le métro');if(keys['KeyE']){ps.onMetro=true;showToast('🚇 Dans le métro !');chkM('m5');}}else if(ps.onMetro){showHint('[ E ] Descendre du métro');if(keys['KeyE']){ps.onMetro=false;ps.y=metro.grp.position.y-4;ps.vy=-1;showToast('🚇 Descendu');}}}

    // Bateaux
    if(!ps.sewer&&!ps.onMetro){let nb=null;boats.forEach((b,i)=>{const bp=b.grp.position,d=Math.sqrt((ps.x-bp.x)**2+(ps.z-bp.z)**2);if(d<11)nb=i;});if(nb!==null&&ps.onBoat===null){showHint('[ E ] Monter sur le bateau');if(keys['KeyE']){ps.onBoat=nb;showToast('⛵ Sur le bateau !');chkM('m6');}}else if(ps.onBoat!==null){const b=boats[ps.onBoat];ps.x=b.grp.position.x;ps.z=b.grp.position.z;ps.y=b.grp.position.y+3;showHint('[ E ] Descendre');if(keys['KeyE']){ps.onBoat=null;ps.y=1;ps.vy=1;showToast('⛵ Descendu');}}}

    updZone();
    if(moved&&ps.onG&&ps.cur==='idle'){ps.cur='walk';document.querySelectorAll('.abtn').forEach((b,i)=>b.classList.toggle('active',i===1));playAnim(WALK);}
    if(!moved&&ps.onG&&ps.cur==='walk'){ps.cur='idle';document.querySelectorAll('.abtn').forEach((b,i)=>b.classList.toggle('active',i===0));playAnim(IDLE);}
  }

  function updZone(){const x=ps.x,z=ps.z;let zone='東京 Shinjuku';if(x>40&&z<0)zone='東京 Shibuya';else if(x<-40&&z>0)zone='東京 Akihabara';else if(x>40&&z>40)zone='東京 Harajuku';else if(x>0&&z<-60)zone='🌳 Central Park';else if(z<-120)zone='⛵ Port de Tokyo';else if(x<-80&&z>80)zone='🗼 Tour Eiffel';if(zone!==lastZ){lastZ=zone;document.getElementById('zn').textContent=zone;if(zone==='🌳 Central Park')chkM('m3');if(zone==='🗼 Tour Eiffel')chkM('m4');advM('m1');}}
  function chkM(id){const m=MS.find(m=>m.id===id);if(m&&!m.done){m.done=true;m.p=m.tot;renderMS();showToast('🏆 '+m.t+' ✓');}}
  function advM(id){const m=MS.find(m=>m.id===id);if(m&&!m.done){m.p=Math.min(m.p+1,m.tot);if(m.p>=m.tot)chkM(id);else renderMS();}}

  function updCam(){
    const tp=new THREE.Vector3(ps.x,ps.y+1.5,ps.z);
    const cd=ps.sewer?4:ps.onMetro?6:cs.dist;
    const cp=new THREE.Vector3(tp.x-Math.sin(cs.yaw)*Math.cos(cs.pitch)*cd,tp.y+Math.sin(cs.pitch)*cd,tp.z-Math.cos(cs.yaw)*Math.cos(cs.pitch)*cd);
    camera.position.lerp(cp,.1); camera.lookAt(tp);
  }

  // ===== LOOP =====
  let frame=0;
  function animate(){
    requestAnimationFrame(animate);
    const dt=Math.min(clock.getDelta(),.05);
    frame++;
    updPlayer(dt); updCars(dt); updMetro(dt); updBoats(dt);
    if(frame%2===0) updNPCs(dt);
    updPV(); updCam(); tickHint();
    if(mixer) mixer.update(dt);
    if(frame%4===0) drawMM();
    renderer.render(scene,camera);
  }
  animate();
}
</script>
