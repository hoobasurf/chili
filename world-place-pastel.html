<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test 3D — Macadam</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0e0620;color:white;font-family:sans-serif}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;}
canvas{display:block}
</style>
</head>
<body>
<div id="loading">⏳ Chargement du test 3D…</div>
<script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/three@0.167/build/three.min.js)"></script>
<script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/three@0.167/examples/js/controls/OrbitControls.min.js)"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xcfeaff);
scene.fog=new THREE.FogExp2(0xcfeaff,0.014);

const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,100);
camera.position.set(3,2,5);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1;
document.body.appendChild(renderer.domElement);

const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.target.set(0,0.6,0);

const hemi=new THREE.HemisphereLight(0xffffff,0x88aacc,1);
scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff8e8,1);
sun.position.set(5,8,5);
sun.castShadow=true;
scene.add(sun);

const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(10,10),
  new THREE.MeshStandardMaterial({color:0xf0e8dc,roughness:0.9})
);
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

const cube=new THREE.Mesh(
  new THREE.BoxGeometry(1,1,1),
  new THREE.MeshStandardMaterial({color:0xff9ebb,metalness:0.2,roughness:0.6})
);
cube.position.y=0.5;cube.castShadow=true;scene.add(cube);

document.getElementById("loading").remove();

function animate(time){
  requestAnimationFrame(animate);
  cube.rotation.y=time*0.001;
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
