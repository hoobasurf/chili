<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Macadam World — Tokyo</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --gold:#f5c842;--orange:#e85d26;--green:#2ecc71;--blue:#1a8fdc;
  --glass:rgba(8,14,28,0.55);--glass-border:rgba(255,255,255,0.13);
  --glass-light:rgba(255,255,255,0.07);
}
html,body{width:100%;height:100%;overflow:hidden;background:#0a1428;font-family:'M PLUS Rounded 1c',sans-serif;user-select:none;-webkit-user-select:none;}
#canvas-container{position:fixed;inset:0;}

/* ── HUD GLASSMORPHISM ── */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;}

.glass-panel{
  background:var(--glass);
  backdrop-filter:blur(14px) saturate(1.4);
  -webkit-backdrop-filter:blur(14px) saturate(1.4);
  border:1px solid var(--glass-border);
}

.hud-top{
  position:absolute;top:0;left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;
  background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,transparent 100%);
}
.hud-logo{font-family:'Zen Kaku Gothic New',sans-serif;font-size:.9rem;font-weight:900;color:#fff;letter-spacing:.05em;}
.hud-logo em{color:var(--gold);font-style:normal;}

.hud-loc{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:16px;}
.hud-loc span{font-size:.65rem;font-weight:700;color:#fff;}
.loc-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(.7);}}

.hud-info{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:16px;}
.hud-pic{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--gold));display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:900;color:#fff;border:1.5px solid rgba(255,255,255,.3);}
.hud-name{font-size:.65rem;font-weight:700;color:#fff;}

/* ── MINIMAP ── */
#minimap{
  position:absolute;top:52px;left:10px;
  width:130px;height:130px;border-radius:14px;
  overflow:hidden;pointer-events:all;cursor:pointer;
  transition:all .3s cubic-bezier(.4,0,.2,1);
}
#minimap.expanded{width:280px;height:280px;border-radius:18px;top:52px;left:10px;}
#minimap-canvas{width:100%;height:100%;display:block;}
.minimap-label{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:.42rem;font-weight:700;color:rgba(255,255,255,.45);letter-spacing:.12em;}
.minimap-expand-hint{position:absolute;top:4px;right:6px;font-size:.42rem;color:rgba(255,255,255,.3);font-weight:700;}
#teleport-btns{position:absolute;bottom:28px;left:0;right:0;display:none;flex-direction:column;gap:3px;padding:0 8px;}
#minimap.expanded #teleport-btns{display:flex;}
.tp-btn{background:rgba(245,200,66,.18);border:1px solid rgba(245,200,66,.35);border-radius:8px;padding:3px 6px;font-size:.48rem;font-weight:700;color:var(--gold);cursor:pointer;text-align:center;}
.tp-btn:hover{background:rgba(245,200,66,.3);}

/* ── MISSION SIDEBAR ── */
#mission-toggle{
  position:absolute;top:50%;right:0;transform:translateY(-50%);
  width:34px;height:56px;border-radius:12px 0 0 12px;
  background:linear-gradient(135deg,var(--orange),#c04a1a);
  border:1px solid rgba(255,255,255,.2);border-right:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;pointer-events:all;
  box-shadow:-3px 0 18px rgba(232,93,38,.4);
  z-index:20;transition:right .35s cubic-bezier(.4,0,.2,1);
  font-size:1.1rem;font-weight:900;color:#fff;
  flex-direction:column;gap:2px;
}
#mission-toggle .excl{font-size:1.3rem;line-height:1;}
#mission-toggle .badge-count{font-size:.48rem;background:var(--gold);color:#1a0a00;border-radius:6px;padding:1px 4px;font-weight:900;}

#mission-sidebar{
  position:absolute;top:0;right:-270px;bottom:0;width:270px;
  transition:right .35s cubic-bezier(.4,0,.2,1);
  pointer-events:all;
  display:flex;flex-direction:column;
  background:var(--glass);
  backdrop-filter:blur(18px) saturate(1.5);
  -webkit-backdrop-filter:blur(18px) saturate(1.5);
  border-left:1px solid var(--glass-border);
  z-index:19;
}
#mission-sidebar.open{right:0;}
#mission-sidebar.open ~ #mission-toggle{right:270px;}

.sidebar-header{
  padding:44px 14px 10px;
  border-bottom:1px solid var(--glass-border);
  display:flex;align-items:center;gap:8px;
}
.sidebar-header span{font-family:'Zen Kaku Gothic New',sans-serif;font-size:.95rem;font-weight:900;color:var(--gold);}
.mission-scroll{flex:1;overflow-y:auto;padding:8px 0;scrollbar-width:thin;scrollbar-color:rgba(245,200,66,.2) transparent;}
.mission-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05);transition:background .15s;}
.mission-item:hover{background:rgba(245,200,66,.07);}
.mission-item.active-m{background:rgba(245,200,66,.1);}
.m-badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:5px;font-size:.52rem;font-weight:900;margin-bottom:3px;}
.badge-new{background:var(--orange);color:#fff;}
.badge-active{background:var(--gold);color:#1a1000;}
.badge-done{background:#2ecc71;color:#fff;}
.m-title{font-size:.68rem;font-weight:900;color:#fff;}
.m-desc{font-size:.55rem;color:rgba(255,255,255,.45);margin-top:2px;line-height:1.4;}
.m-progress{display:flex;align-items:center;gap:5px;margin-top:4px;}
.m-bar{flex:1;height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;}
.m-bar-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--gold));border-radius:2px;transition:width .4s;}
.m-pct{font-size:.48rem;color:rgba(255,255,255,.35);font-weight:700;}
.m-tp-btn{margin-top:5px;background:rgba(26,143,220,.2);border:1px solid rgba(26,143,220,.35);border-radius:6px;padding:3px 8px;font-size:.52rem;color:#5bc4ff;cursor:pointer;font-family:'M PLUS Rounded 1c',sans-serif;}
.m-tp-btn:hover{background:rgba(26,143,220,.35);}

/* ── CHAT ── */
.hud-chat{position:absolute;bottom:170px;left:12px;width:220px;pointer-events:all;}
.chat-messages{max-height:80px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;margin-bottom:5px;scrollbar-width:none;}
.chat-msg{background:rgba(0,0,0,.38);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:4px 10px;font-size:.6rem;color:#fff;line-height:1.35;}
.chat-msg .cn{font-weight:900;color:var(--gold);margin-right:4px;}
.chat-input-wrap{display:flex;gap:5px;}
.chat-input{flex:1;background:rgba(0,0,0,.42);border:1.5px solid rgba(255,255,255,.15);border-radius:20px;padding:7px 13px;font-size:14px;font-weight:700;color:#fff;outline:none;font-family:'M PLUS Rounded 1c',sans-serif;}
.chat-input::placeholder{color:rgba(255,255,255,.3);}
.chat-input:focus{border-color:var(--gold);}
.chat-send{width:36px;height:36px;border-radius:50%;background:var(--orange);border:none;color:#fff;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;pointer-events:all;flex-shrink:0;}

/* ── ANIM PANEL ── */
#anim-panel{
  position:absolute;bottom:0;left:0;right:0;pointer-events:all;
  padding:5px 0 10px;
  background:linear-gradient(0deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.38) 100%);
  backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.06);
  height:80px;
}
#anim-scroll{display:flex;gap:5px;overflow-x:auto;padding:2px 10px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
#anim-scroll::-webkit-scrollbar{display:none;}
.anim-btn{flex-shrink:0;width:54px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.anim-icon{width:52px;height:52px;border-radius:10px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;transition:all .15s;}
.anim-icon svg{width:42px;height:42px;}
.anim-btn.active .anim-icon{background:rgba(245,200,66,.14);border-color:var(--gold);}
.anim-btn:active .anim-icon{transform:scale(.87);}
.anim-label{font-size:.46rem;font-weight:700;color:rgba(255,255,255,.38);text-align:center;}
.anim-btn.active .anim-label{color:var(--gold);}

/* ── JOYSTICKS ── */
#joystick-zone{position:absolute;bottom:90px;right:12px;width:96px;height:96px;pointer-events:all;}
#cam-joystick-zone{position:absolute;bottom:90px;left:12px;width:96px;height:96px;pointer-events:all;}
.joy-base{width:96px;height:96px;border-radius:50%;background:rgba(0,0,0,.25);border:1.5px solid rgba(255,255,255,.15);backdrop-filter:blur(8px);position:relative;display:flex;align-items:center;justify-content:center;}
.joy-knob{width:36px;height:36px;border-radius:50%;position:absolute;box-shadow:0 2px 10px rgba(0,0,0,.5);}
#jump-btn{position:absolute;bottom:140px;right:56px;width:44px;height:44px;border-radius:50%;background:rgba(43,108,176,.8);border:1.5px solid rgba(100,180,255,.3);color:#fff;font-size:1.1rem;pointer-events:all;cursor:pointer;box-shadow:0 2px 14px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;z-index:12;backdrop-filter:blur(8px);}
#super-jump-btn{position:absolute;bottom:140px;left:56px;width:44px;height:44px;border-radius:50%;background:rgba(232,93,38,.8);border:1.5px solid rgba(255,160,100,.3);color:#fff;font-size:.9rem;pointer-events:all;cursor:pointer;box-shadow:0 2px 14px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;z-index:12;backdrop-filter:blur(8px);}

/* ── INTERACTION HINT ── */
#interact-hint{
  position:fixed;bottom:188px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.75);backdrop-filter:blur(10px);
  color:var(--gold);padding:6px 16px;border-radius:20px;
  font-size:.68rem;font-weight:700;opacity:0;transition:opacity .25s;z-index:50;
  pointer-events:none;white-space:nowrap;border:1px solid rgba(245,200,66,.25);
}
#interact-hint.show{opacity:1;}

/* ── TOAST ── */
.toast{position:fixed;bottom:195px;left:50%;transform:translateX(-50%) translateY(10px);background:rgba(0,0,0,.82);backdrop-filter:blur(12px);color:var(--gold);padding:7px 16px;border-radius:20px;font-size:.68rem;font-weight:700;opacity:0;transition:all .25s;z-index:50;pointer-events:none;white-space:nowrap;border:1px solid rgba(245,200,66,.2);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── LOADING ── */
#loading-screen{position:fixed;inset:0;z-index:200;background:linear-gradient(135deg,#0a1428 0%,#1a2840 50%,#0d1e35 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .6s;}
#loading-screen.hidden{opacity:0;pointer-events:none;}
.load-logo{font-family:'Zen Kaku Gothic New',sans-serif;font-size:2.6rem;font-weight:900;color:#fff;letter-spacing:.06em;text-shadow:0 0 40px rgba(245,200,66,.5);}
.load-logo em{color:var(--gold);font-style:normal;}
.load-sub{font-size:.8rem;color:rgba(255,255,255,.4);letter-spacing:.3em;font-weight:700;}
.load-bar-wrap{width:200px;height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;}
.load-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--orange),var(--gold));border-radius:2px;transition:width .25s;}
.load-txt{font-size:.66rem;color:rgba(255,255,255,.45);font-weight:700;}
.load-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px;}
.load-feat{font-size:.52rem;color:rgba(255,255,255,.25);text-align:center;}
.load-feat span{display:block;font-size:1rem;margin-bottom:2px;}

/* ── MISSION POPUP ── */
#mission-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.85);background:var(--glass);backdrop-filter:blur(20px);border:1.5px solid rgba(245,200,66,.35);border-radius:18px;padding:20px 24px;z-index:100;pointer-events:all;min-width:250px;opacity:0;transition:all .3s;display:none;}
#mission-popup.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
.mp-title{font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:900;color:var(--gold);margin-bottom:8px;}
.mp-desc{font-size:.72rem;color:rgba(255,255,255,.8);line-height:1.6;margin-bottom:14px;}
.mp-actions{display:flex;gap:8px;}
.mp-btn{background:var(--orange);color:#fff;border:none;border-radius:20px;padding:7px 18px;font-size:.72rem;font-weight:700;cursor:pointer;font-family:'M PLUS Rounded 1c',sans-serif;}
.mp-btn-sec{background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:7px 14px;font-size:.72rem;font-weight:700;cursor:pointer;font-family:'M PLUS Rounded 1c',sans-serif;}
</style>
</head>
<body>
<div id="canvas-container"></div>

<div id="loading-screen">
  <div class="load-logo">TOKYO <em>東京</em></div>
  <div class="load-sub">MACADAM WORLD</div>
  <div class="load-bar-wrap"><div class="load-bar" id="load-bar"></div></div>
  <div class="load-txt" id="load-txt">Génération de la ville…</div>
  <div class="load-grid">
    <div class="load-feat"><span>🏙️</span>Gratte-ciels</div>
    <div class="load-feat"><span>🚇</span>Métro</div>
    <div class="load-feat"><span>⛵</span>Port</div>
    <div class="load-feat"><span>🚔</span>Police</div>
    <div class="load-feat"><span>🗼</span>Tour Eiffel</div>
    <div class="load-feat"><span>🌳</span>Parcs</div>
  </div>
</div>

<div id="hud">
  <div class="hud-top">
    <div class="hud-logo">⬡ <em>Macadam</em> World</div>
    <div class="hud-loc glass-panel"><div class="loc-dot"></div><span id="zone-name">東京 Shinjuku</span></div>
    <div class="hud-info glass-panel"><div class="hud-pic" id="hud-pic">?</div><span class="hud-name" id="hud-pseudo">Joueur</span></div>
  </div>

  <!-- MINIMAP -->
  <div id="minimap" class="glass-panel">
    <canvas id="minimap-canvas" width="260" height="260"></canvas>
    <div class="minimap-label">▲ NORD</div>
    <div class="minimap-expand-hint">↔</div>
    <div id="teleport-btns"></div>
  </div>

  <!-- MISSION SIDEBAR -->
  <div id="mission-sidebar">
    <div class="sidebar-header">
      <span>🎯 MISSIONS</span>
    </div>
    <div class="mission-scroll" id="mission-list"></div>
  </div>
  <div id="mission-toggle" onclick="toggleMissions()">
    <div class="excl">!</div>
    <div class="badge-count" id="mission-badge">0</div>
  </div>

  <!-- CHAT -->
  <div class="hud-chat">
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-wrap">
      <input class="chat-input" id="chat-input" type="text" placeholder="Dis quelque chose…" maxlength="80" autocomplete="off"/>
      <button class="chat-send" id="chat-send">▶</button>
    </div>
  </div>

  <div id="cam-joystick-zone"><div class="joy-base" id="cam-joy-base"><div class="joy-knob" id="cam-joy-knob" style="background:linear-gradient(135deg,#f5c842,#e85d26);"></div></div></div>
  <button id="super-jump-btn">🚀</button>
  <button id="jump-btn">↑</button>
  <div id="joystick-zone"><div class="joy-base" id="joy-base"><div class="joy-knob" id="joy-knob" style="background:linear-gradient(135deg,#ddd,#aaa);"></div></div></div>
  <div id="anim-panel"><div id="anim-scroll"></div></div>
</div>

<div id="interact-hint"></div>
<div class="toast" id="toast"></div>
<div id="mission-popup">
  <div class="mp-title" id="mp-title"></div>
  <div class="mp-desc" id="mp-desc"></div>
  <div class="mp-actions">
    <button class="mp-btn" id="mp-accept">Activer !</button>
    <button class="mp-btn-sec" id="mp-tp" style="display:none">📍 Aller</button>
    <button class="mp-btn-sec" onclick="closeMissionPopup()">Fermer</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const GLTFLoader = THREE.GLTFLoader;
const BASE = 'https://raw.githubusercontent.com/hoobasurf/chili/main/';
const WALK_FILE = 'course.glb';
const IDLE_FILE = 'attend.glb';

// ── MISSIONS ──────────────────────────────────────────────
const MISSIONS = [
  {id:'m1',title:'Tour Eiffel',desc:'Atteins le sommet de la Tour Eiffel',badge:'new',done:false,progress:0,total:1,tp:{x:80,z:-80}},
  {id:'m2',title:'Souterrain',desc:'Descends dans les égouts via la bouche d\'égout',badge:'new',done:false,progress:0,total:1,tp:{x:15,z:15}},
  {id:'m3',title:'Central Park',desc:'Trouve la fontaine du parc',badge:'new',done:false,progress:0,total:1,tp:{x:20,z:-60}},
  {id:'m4',title:'Port de Tokyo',desc:'Monte sur un bateau au port',badge:'new',done:false,progress:0,total:1,tp:{x:110,z:110}},
  {id:'m5',title:'Explorateur',desc:'Visite 4 quartiers différents de la ville',badge:'new',done:false,progress:0,total:4},
  {id:'m6',title:'Métro Express',desc:'Atteins la station de métro sur les rails',badge:'new',done:false,progress:0,total:1,tp:{x:-60,z:-100}},
  {id:'m7',title:'Gratte-ciel',desc:'Monte au sommet d\'un immeuble de verre',badge:'new',done:false,progress:0,total:1},
  {id:'m8',title:'Pompiers',desc:'Trouve la caserne de pompiers',badge:'new',done:false,progress:0,total:1,tp:{x:-80,z:60}},
];
let activeMission = null;
let missionSidebarOpen = false;

function toggleMissions(){
  missionSidebarOpen = !missionSidebarOpen;
  document.getElementById('mission-sidebar').classList.toggle('open',missionSidebarOpen);
}
function renderMissions(){
  const list = document.getElementById('mission-list');
  list.innerHTML = '';
  let activeCount = MISSIONS.filter(m=>!m.done).length;
  document.getElementById('mission-badge').textContent = activeCount;
  MISSIONS.forEach(m=>{
    const d = document.createElement('div');
    d.className='mission-item'+(activeMission===m.id?' active-m':'');
    const pct = m.total>0?Math.round(m.progress/m.total*100):0;
    d.innerHTML=`
      <div class="m-badge badge-${m.done?'done':m.badge}">${m.done?'✓':m.badge==='active'?'►':'!'}</div>
      <div class="m-title">${m.title}</div>
      <div class="m-desc">${m.done?'Terminée ✓':`${m.desc}`}</div>
      ${!m.done?`<div class="m-progress"><div class="m-bar"><div class="m-bar-fill" style="width:${pct}%"></div></div><div class="m-pct">${m.progress}/${m.total}</div></div>`:''}
      ${m.tp&&!m.done?`<button class="m-tp-btn" data-id="${m.id}">📍 Téléporter</button>`:''}
    `;
    d.addEventListener('click',()=>showMissionPopup(m));
    list.appendChild(d);
  });
  // Teleport buttons
  list.querySelectorAll('.m-tp-btn').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const m=MISSIONS.find(x=>x.id===btn.dataset.id);
      if(m&&m.tp) teleportTo(m.tp.x,m.tp.z);
    });
  });
}
function showMissionPopup(m){
  const popup=document.getElementById('mission-popup');
  document.getElementById('mp-title').textContent=m.title;
  document.getElementById('mp-desc').textContent=m.desc+(m.done?' (Terminée !)':'');
  const tpBtn=document.getElementById('mp-tp');
  tpBtn.style.display=m.tp&&!m.done?'block':'none';
  tpBtn.onclick=()=>{if(m.tp)teleportTo(m.tp.x,m.tp.z);closeMissionPopup();};
  popup.style.display='block';
  requestAnimationFrame(()=>popup.classList.add('show'));
  document.getElementById('mp-accept').onclick=()=>{
    activeMission=m.id; m.badge='active';
    renderMissions(); closeMissionPopup();
    showToast('Mission activée : '+m.title);
  };
}
function closeMissionPopup(){
  const p=document.getElementById('mission-popup');
  p.classList.remove('show');setTimeout(()=>p.style.display='none',300);
}
function teleportTo(x,z){
  playerState.x=x; playerState.z=z; playerState.y=0; playerState.vy=0;
  showToast('📍 Téléporté !');
}
function checkMission(id){
  const m=MISSIONS.find(m=>m.id===id);
  if(m&&!m.done){m.done=true;m.badge='done';m.progress=m.total;renderMissions();showToast('🏆 Mission : '+m.title+' !');}
}
function advanceMission(id){
  const m=MISSIONS.find(m=>m.id===id);

// Brique rouge authentique
function makeBrickTex(r,g,b,dark=false){
  return procTex((ctx,s)=>{
    ctx.fillStyle=`rgb(${r-25},${g-20},${b-15})`;ctx.fillRect(0,0,s,s);
    const BW=36,BH=14;
    for(let row=0;row*BH<s+BH;row++){
      const off=(row%2)*BW/2;
      for(let col=-1;col*BW<s+BW;col++){
        const dv=Math.random()*28-14|0;
        const fr=Math.max(30,Math.min(225,r+dv)),fg=Math.max(20,Math.min(180,g+dv)),fb=Math.max(10,Math.min(160,b+dv));
        ctx.fillStyle=`rgb(${fr},${fg},${fb})`;
        ctx.fillRect(col*BW+off+1.5,row*BH+1.5,BW-3,BH-3);
        // Texture de surface brique
        for(let k=0;k<3;k++){const sv=fr-10+Math.random()*20|0;ctx.fillStyle=`rgba(${sv},${sv-8},${sv-12},0.3)`;ctx.fillRect(col*BW+off+2+Math.random()*(BW-4),row*BH+2+Math.random()*(BH-3),1,1);}
}
    }
    // Joints
    ctx.strokeStyle=`rgba(${r-40},${g-35},${b-30},0.6)`;ctx.lineWidth=1.2;
    for(let row=0;row*BH<s+BH;row++){const off=(row%2)*BW/2;for(let col=-1;col*BW<s+BW;col++){ctx.strokeRect(col*BW+off+1,row*BH+1,BW-2,BH-2);}}
  },512);
}

const woodTex=procTex((ctx,s)=>{
  ctx.fillStyle='#6a4228';ctx.fillRect(0,0,s,s);
  const planks=8,pw=s/planks;
  for(let p=0;p<planks;p++){
    const rv=Math.random()*20-10|0;
    const r=100+rv,g=65+rv,b=38+rv;
    ctx.fillStyle=`rgb(${r},${g},${b})`;
    ctx.fillRect(p*pw+0.5,0,pw-1,s);
    // Veines bois
    ctx.strokeStyle=`rgba(${r-20},${g-15},${b-10},0.5)`;ctx.lineWidth=0.7;
    for(let v=0;v<5;v++){ctx.beginPath();const y=Math.random()*s;ctx.moveTo(p*pw+1,y);ctx.bezierCurveTo(p*pw+pw/3,y+Math.random()*10-5,p*pw+pw*0.7,y+Math.random()*10-5,p*pw+pw-1,y);ctx.stroke();}
    // Nœuds
    if(Math.random()<0.3){const kx=p*pw+pw/2,ky=Math.random()*s;const kg=ctx.createRadialGradient(kx,ky,0,kx,ky,pw*0.3);kg.addColorStop(0,`rgba(${r-30},${g-25},${b-18},0.7)`);kg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=kg;ctx.fillRect(0,0,s,s);}
  }
},256);

const glassBuildTex=procTex((ctx,s)=>{
  ctx.fillStyle='#0a1a2e';ctx.fillRect(0,0,s,s);
  const cols=6,rows=10,pw=s/cols,ph=s/rows;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){

  for(let c=0;c<=cols;c++){ctx.beginPath();ctx.moveTo(c*pw,0);ctx.lineTo(c*pw,s);ctx.stroke();}

const colliders=[];
const climbables=[];
const PR=0.55;
function addCol(cx,cz,hw,hd,mH=200){colliders.push({minX:cx-hw,maxX:cx+hw,minZ:cz-hd,maxZ:cz+hd,mH});}
function addClimb(cx,cz,hw,hd,topY){climbables.push({minX:cx-hw,maxX:cx+hw,minZ:cz-hd,maxZ:cz+hd,topY});}
function resolveCollisions(nx,nz,py,cols){
  for(const c of cols){
    if(py>=(c.mH||200))continue;
    const px=Math.max(c.minX,Math.min(c.maxX,nx));
    const pz=Math.max(c.minZ,Math.min(c.maxZ,nz));
    const dx=nx-px,dz=nz-pz,d=Math.sqrt(dx*dx+dz*dz);
    if(d<PR){if(d<0.001){nx+=PR;}else{const p=PR-d;nx+=(dx/d)*p;nz+=(dz/d)*p;}}
  }
  return{x:nx,z:nz};
}
function getClimbableFloor(px,pz,currentY){
  let maxTop=-Infinity;let found=false;
  for(const c of climbables){
    if(px>c.minX&&px<c.maxX&&pz>c.minZ&&pz<c.maxZ){
      if(c.topY>maxTop&&c.topY<=currentY+2.5){maxTop=c.topY;found=true;}
    }
  }
  return found?maxTop:null;
}

function makeLampPost(x,z,style=0){

  if(style===0){
    // Bras courbé
    const arm=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.08,0.08),matLamp);arm.position.set(1.0,7.55,0);g.add(arm);
    const head=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.22,0.32),matLamp);head.position.set(2.05,7.44,0);g.add(head);
    const bulb=new THREE.Mesh(new THREE.BoxGeometry(0.55,0.09,0.26),matLampGlow);bulb.position.set(2.05,7.3,0);g.add(bulb);
    const light=new THREE.PointLight(0xfffce0,0.6,15);light.position.set(2.05,7.2,0);g.add(light);
  } else {
    // Japonais double

function makeBuilding(x,z,w,h,d,style=0){
  const wallMats=[matBrickRed,matBrickBrown,matBrickGray,matBrickOrange,matConcrete,matWood];
  const wallMat=wallMats[style%wallMats.length];
  const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),wallMat);
  body.castShadow=true;body.receiveShadow=true;body.position.set(x,h/2,z);scene.add(body);
  // Toit tuiles
  if(style<3){const roof=new THREE.Mesh(new THREE.BoxGeometry(w+0.3,0.5,d+0.3),matRoofTiles);roof.position.set(x,h+0.25,z);scene.add(roof);}
  else{const roof=new THREE.Mesh(new THREE.BoxGeometry(w+0.2,0.4,d+0.2),matConcrete);roof.position.set(x,h+0.2,z);scene.add(roof);}
  // Fenêtres
  const wCols=Math.max(1,Math.floor(w/3.5));const wRows=Math.max(1,Math.floor(h/3.5));
  for(let r=0;r<wRows;r++)for(let c=0;c<wCols;c++){

    if(d>8){const ws=new THREE.Mesh(new THREE.BoxGeometry(0.08,1.5,1.1),matGlassWindow);ws.position.set(x+w/2+0.05,wy,z+(r%2===0?d/4:-d/4));scene.add(ws);}
  }
  // Enseigne
  const signMat=new THREE.MeshStandardMaterial({map:signTextures[Math.abs(Math.round(x*0.4+z*0.6))%8],roughness:0.6});
  const sw=Math.min(w*0.55,4),sh=sw*1.1;

}

// ── MÉTRO SUR RAILS ──────────────────────────────────────
function makeMetroBridge(fromX,fromZ,toX,toZ,y=20){
  const dx=toX-fromX,dz=toZ-fromZ;
  const len=Math.sqrt(dx*dx+dz*dz);
  const ang=Math.atan2(dx,dz);
  // Poutres
  const deckMat=new THREE.MeshStandardMaterial({color:0x4a5a6a,roughness:0.6,metalness:0.75});
  const deck=new THREE.Mesh(new THREE.BoxGeometry(6,0.6,len),deckMat);
  deck.position.set((fromX+toX)/2,y,(fromZ+toZ)/2);deck.rotation.y=ang;deck.castShadow=true;scene.add(deck);
  addClimb((fromX+toX)/2,(fromZ+toZ)/2,3.5,len/2+0.5,y+0.6);
  // Rails
  [-1.1,1.1].forEach(ox=>{
    const rail=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.1,len),matSteel);
    const localAngle=ang;
    rail.position.set((fromX+toX)/2+Math.cos(ang+Math.PI/2)*ox,y+0.45,(fromZ+toZ)/2+Math.sin(ang+Math.PI/2)*ox);
    rail.rotation.y=ang;scene.add(rail);
  });
  // Poteaux
  const cols=Math.floor(len/20);
  for(let i=0;i<=cols;i++){
    const t=i/cols;
    const px=fromX+dx*t,pz=fromZ+dz*t;
    const pillar=new THREE.Mesh(new THREE.BoxGeometry(1.2,y,1.2),matConcrete);pillar.position.set(px,y/2,pz);pillar.castShadow=true;scene.add(pillar);
    addCol(px,pz,0.7,0.7);
  }
}

function fillBlock(bx,bz,type){
  switch(type){
    case 'park': fillPark(bx,bz); break;
    case 'eiffel': makeTourEiffel(bx,bz); break;
    case 'skyscraper':{
      const h=40+Math.random()*40;
      const colors=[0x1a3a6a,0x1a5a4a,0x4a1a6a,0x2a4a2a,0x5a3a1a,0x1a4a5a];
      makeSkyscraper(bx,bz,18+Math.random()*6,h,18+Math.random()*6,colors[Math.floor(Math.random()*colors.length)]);
      break;}
    case 'hospital': makeHospital(bx,bz); break;
    case 'police': makePolice(bx,bz); break;
    case 'firestation': makeFireStation(bx,bz); break;
    case 'houses':{
      for(let i=0;i<4;i++) makeHouse(bx+(i%2===0?-8:8),bz+(i<2?-7:7),Math.random()*Math.PI*0.5);
      break;}
    case 'buildings':{
      const h=8+Math.random()*18;const w=22+Math.random()*8;const d=22+Math.random()*8;
      makeBuilding(bx,bz,Math.min(w,32),h,Math.min(d,32),Math.floor(Math.random()*4));
      break;}
    case 'shops':{
      const nb=3;
      for(let i=0;i<nb;i++){
        const sx=bx-10+i*10;
        for(let j=0;j<2;j++){
          const sz=bz-7+j*14;
          makeBuilding(sx,sz,8,3.5+Math.random()*2,7,Math.floor(Math.random()*3));
        }
      }
      break;}
    case 'mixed':{
      makeBuilding(bx,bz-5,20,10+Math.random()*8,14,Math.floor(Math.random()*4));
      makeBuilding(bx-10,bz+8,8,4+Math.random()*3,7,Math.floor(Math.random()*3));
      makeBuilding(bx+10,bz+8,8,4+Math.random()*3,7,Math.floor(Math.random()*3));
      break;}
    case 'garden': fillGarden(bx,bz); break;
  }
  // Toujours quelques arbres autour
  if(Math.random()<0.5){for(let i=0;i<3;i++) makeTree(bx+(Math.random()-0.5)*30,bz+(Math.random()-0.5)*30,i);}
}

const loader=new GLTFLoader();

const camState={dist:7,yaw:Math.PI,pitch:0.38,targetYaw:Math.PI,targetPitch:0.38,manualControl:false,manualTimer:0};

function loadAnim(file,cb){if(animCache[file]){cb(animCache[file]);return;}loader.load(BASE+file,(glb)=>{animCache[file]=glb;cb(glb);},()=>{},(e)=>console.warn('GLB fail',file));}
function playAnim(file){
  loadAnim(file,(glb)=>{
    if(!playerModel){playerModel=glb.scene;playerModel.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true;}});scene.add(playerModel);finishLoading();}
    playerMixer=new THREE.AnimationMixer(playerModel);
    if(currentAction)currentAction.stop();
    if(glb.animations.length>0){currentAction=playerMixer.clipAction(glb.animations[0]);currentAction.play();}
  });
}
function updatePlayerVisuals(){if(!playerModel)return;playerModel.position.set(playerState.x,playerState.y,playerState.z);playerModel.rotation.y=playerState.angle;}

const joyState={x:0,z:0,active:false,id:-1};
const camJoyState={x:0,y:0,active:false,id:-1};
const joyBase=document.getElementById('joy-base'),joyKnob=document.getElementById('joy-knob');
const camJoyBase=document.getElementById('cam-joy-base'),camJoyKnob=document.getElementById('cam-joy-knob');
const JR=42;
function joyInput(e,base,knob,state,isCam){
  e.preventDefault();
  for(let i=0;i<e.changedTouches.length;i++){
    const t=e.changedTouches[i];
    if(e.type==='touchstart'){const r=base.getBoundingClientRect();const cx2=r.left+r.width/2,cy=r.top+r.height/2;const dx=t.clientX-cx2,dy=t.clientY-cy;if(Math.sqrt(dx*dx+dy*dy)<r.width/2){state.active=true;state.id=t.identifier;}}
    if(state.active&&t.identifier===state.id){
      const r=base.getBoundingClientRect();const cx2=r.left+r.width/2,cy=r.top+r.height/2;let dx=t.clientX-cx2,dy=t.clientY-cy;const dist=Math.sqrt(dx*dx+dy*dy);if(dist>JR){dx*=JR/dist;dy*=JR/dist;}
      knob.style.transform=`translate(${dx}px,${dy}px)`;
      if(isCam){state.x=dx/JR;state.y=dy/JR;}else{state.x=dx/JR;state.z=dy/JR;}
    }
    if((e.type==='touchend'||e.type==='touchcancel')&&t.identifier===state.id){state.active=false;state.id=-1;state.x=0;state.z=0;state.y=0;knob.style.transform='translate(0,0)';}
  }
}
['touchstart','touchmove','touchend','touchcancel'].forEach(ev=>{
  joyBase.addEventListener(ev,e=>joyInput(e,joyBase,joyKnob,joyState,false),{passive:false});
  camJoyBase.addEventListener(ev,e=>joyInput(e,camJoyBase,camJoyKnob,camJoyState,true),{passive:false});
});

const mmCanvas=document.getElementById('minimap-canvas');
const mmCtx=mmCanvas.getContext('2d');
function drawMinimap(){
  const MM=260,SCALE=MM/340;
  mmCtx.fillStyle='#070e1a';mmCtx.fillRect(0,0,MM,MM);
  const cx=MM/2-playerState.x*SCALE,cz=MM/2-playerState.z*SCALE;
  // Eau
  mmCtx.fillStyle='#0a2a5a';mmCtx.fillRect(cx+80*SCALE,cz+70*SCALE,MM*0.6,MM*0.45);
  // Routes
  [-120,-80,-40,0,40,80,120].forEach(ax=>{
    mmCtx.fillStyle='#1a2030';
    mmCtx.fillRect(0,cz+ax*SCALE-3,MM,6);
    mmCtx.fillRect(cx+ax*SCALE-3,0,6,MM);
  });
  // Parcs
  mmCtx.fillStyle='#0a3a0a';mmCtx.fillRect(cx+20*SCALE-6,cz-60*SCALE-6,12,12);
  // Tour Eiffel
  mmCtx.fillStyle='#3a4a1a';mmCtx.beginPath();mmCtx.moveTo(cx+80*SCALE,cz-80*SCALE);mmCtx.lineTo(cx+83*SCALE,cz-72*SCALE);mmCtx.lineTo(cx+77*SCALE,cz-72*SCALE);mmCtx.fill();
  // Joueur
  mmCtx.save();mmCtx.translate(MM/2,MM/2);mmCtx.rotate(playerState.angle);
  mmCtx.fillStyle='#f5c842';mmCtx.beginPath();mmCtx.moveTo(0,-7);mmCtx.lineTo(-4,4);mmCtx.lineTo(4,4);mmCtx.fill();
  mmCtx.restore();
  // NPCs
  mmCtx.fillStyle='#4488ff';npcs.slice(0,16).forEach(n=>{const nx=cx+n.group.position.x*SCALE,nz=cz+n.group.position.z*SCALE;if(nx>0&&nx<MM&&nz>0&&nz<MM){mmCtx.beginPath();mmCtx.arc(nx,nz,1.8,0,Math.PI*2);mmCtx.fill();}});
  // Voitures
  mmCtx.fillStyle='#ff5533';movingCars.forEach(c=>{const vx=cx+c.group.position.x*SCALE,vz=cz+c.group.position.z*SCALE;if(vx>0&&vx<MM&&vz>0&&vz<MM)mmCtx.fillRect(vx-2,vz-2,4,4);});
  // Bouche égout
  mmCtx.fillStyle='#44cc22';mmCtx.beginPath();mmCtx.arc(cx+sewerHole.x*SCALE,cz+sewerHole.z*SCALE,3.5,0,Math.PI*2);mmCtx.fill();
  // Missions actives
  MISSIONS.filter(m=>m.tp&&!m.done).forEach(m=>{const mx=cx+m.tp.x*SCALE,mz=cz+m.tp.z*SCALE;if(mx>0&&mx<MM&&mz>0&&mz<MM){mmCtx.fillStyle='#ff8800';mmCtx.beginPath();mmCtx.arc(mx,mz,4,0,Math.PI*2);mmCtx.fill();mmCtx.fillStyle='#fff';mmCtx.font='bold 6px sans-serif';mmCtx.textAlign='center';mmCtx.fillText('!',mx,mz+2);}});
}

// ── BOUCLE DE JEU ─────────────────────────────────────────
const clock=new THREE.Clock();
const GRAVITY=20,PLAYER_SPEED=9,PLAYER_RUN_SPEED=16,NPC_WANDER=16;
let sewerTransitioning=false,lastZone='',visitedZones=new Set();
let eiffelMission=false,portMission=false;

function getFloorY(inSewer){return inSewer?SEWER_Y:0;}

function updateMovingCars(dt){
  movingCars.forEach(car=>{
    car.t+=(car.speed*dt)/car.len;
    if(car.t>1)car.t-=1;
    const s=car.route[0],e=car.route[car.route.length-1];
    car.group.position.x=s.x+(e.x-s.x)*car.t;
    car.group.position.z=s.z+(e.z-s.z)*car.t;
    car.wheels.forEach(w=>w.rotation.x+=car.speed*dt*2.2);
  });
}

function updateNPCs(dt){
  npcs.forEach(npc=>{
    if(npc.group.position.y<-0.3)return;
    npc.turnTimer-=dt;
    if(npc.turnTimer<0){npc.turnTimer=1.2+Math.random()*2.8;const a=Math.random()*Math.PI*2;const sp=0.4+Math.random()*1.1;npc.vx=Math.cos(a)*sp*0.016;npc.vz=Math.sin(a)*sp*0.016;}
    const nx=npc.group.position.x+npc.vx,nz=npc.group.position.z+npc.vz;
    const dx=nx-npc.startX,dz=nz-npc.startZ;
    if(Math.sqrt(dx*dx+dz*dz)>NPC_WANDER){npc.vx=-npc.vx;npc.vz=-npc.vz;}else{npc.group.position.x=nx;npc.group.position.z=nz;}
    npc.group.rotation.y=Math.atan2(npc.vx,npc.vz);
    npc.phase+=dt*4.5;const sw=Math.sin(npc.phase)*0.28;
    npc.legL.rotation.x=sw;npc.legR.rotation.x=-sw;npc.armL.rotation.x=-sw*0.7;npc.armR.rotation.x=sw*0.7;
  });
}

function updateBoats(dt){
  seaWaveT+=dt;
  boats.forEach(b=>{b.group.position.y=Math.sin(seaWaveT*0.8+b.bobOffset)*0.12;b.group.rotation.z=Math.sin(seaWaveT*0.5+b.bobOffset)*0.015;});
}

function updatePlayer(dt){
  let dx=0,dz=0;
  const run=keys['ShiftLeft']||keys['ShiftRight'];
  const spd=run?PLAYER_RUN_SPEED:PLAYER_SPEED;

  if(joyState.active){dx+=joyState.x;dz+=joyState.z;} // CORRIGÉ : pas de négation sur Z
  if(keys['ArrowUp']||keys['KeyW'])dz-=1;
  if(keys['ArrowDown']||keys['KeyS'])dz+=1;
  if(keys['ArrowLeft']||keys['KeyA'])dx-=1;
  if(keys['ArrowRight']||keys['KeyD'])dx+=1;
  if(keys['Space']&&playerState.onGround){playerState.vy=8.5;playerState.onGround=false;}

  // Joystick caméra — contrôle manuel
  if(camJoyState.active&&(Math.abs(camJoyState.x)>0.1||Math.abs(camJoyState.y)>0.1)){
    camState.targetYaw+=camJoyState.x*dt*2.5;
    camState.targetPitch=Math.max(0.08,Math.min(0.88,camState.targetPitch+camJoyState.y*dt*1.5));
    camState.manualControl=true;camState.manualTimer=3;
  }
  if(camState.manualControl){camState.manualTimer-=dt;if(camState.manualTimer<=0)camState.manualControl=false;}

  // ── DIRECTION RELATIVE CAM ── (CORRIGÉ : avant = devant le perso)
  const len=Math.sqrt(dx*dx+dz*dz);
  let moved=false;
  if(len>0.01){
    const nx=dx/len,nz=dz/len;
    // Transformer par la caméra yaw
    const cos=Math.cos(camState.yaw),sin=Math.sin(camState.yaw);
    // Forward cam = -Z world quand yaw=0
    const wx=nx*sin+nz*cos; // droite + avant
    const wz=nx*cos-nz*sin; // ou l'inverse selon convention
    // Convention Three.js : cam regarde vers -Z, yaw tourne autour Y
    // Mouvement: forward = sin(yaw),0,-cos(yaw) donc:
    const fwdX=Math.sin(camState.yaw),fwdZ=-Math.cos(camState.yaw);
    const rgtX=Math.cos(camState.yaw),rgtZ=Math.sin(camState.yaw);
    const mwx=fwdX*(-dz/len)+rgtX*(dx/len);
    const mwz=fwdZ*(-dz/len)+rgtZ*(dx/len);
    const mlen=Math.sqrt(mwx*mwx+mwz*mwz);
    const mnx=mwx/mlen,mnz=mwz/mlen;
    const speed=spd*Math.min(len,1)*dt;
    let npx=playerState.x+mnx*speed;
    let npz=playerState.z+mnz*speed;
    const cols=playerState.inSewer?sewerColliders:colliders;
    const r=resolveCollisions(npx,npz,playerState.y,cols);
    playerState.x=r.x;playerState.z=r.z;
    playerState.angle=Math.atan2(mnx,mnz);
    // Caméra suit automatiquement quand on se déplace (si pas de contrôle manuel)
    if(!camState.manualControl){camState.targetYaw+=(playerState.angle+Math.PI-camState.targetYaw)*dt*2.5;}
    moved=true;
  }

  // Gravité + sol climbable
  const baseFloorY=getFloorY(playerState.inSewer);
  playerState.vy-=GRAVITY*dt;
  playerState.y+=playerState.vy*dt;
  // Vérif climbable
  const climbY=getClimbableFloor(playerState.x,playerState.z,playerState.y+2);
  const floorY=climbY!==null?Math.max(baseFloorY,climbY):baseFloorY;
  if(playerState.y<=floorY){playerState.y=floorY;playerState.vy=0;playerState.onGround=true;}else if(playerState.y>floorY+0.1){playerState.onGround=false;}

  // Caméra smooth
  camState.yaw+=(camState.targetYaw-camState.yaw)*0.12;
  camState.pitch+=(camState.targetPitch-camState.pitch)*0.1;

  // Transition égout
  const distToHole=Math.sqrt((playerState.x-sewerHole.x)**2+(playerState.z-sewerHole.z)**2);
  if(distToHole<2.2&&!playerState.inSewer){showHint('[ E ] Descendre dans l\'égout');}
  else if(distToHole<2.2&&playerState.inSewer){showHint('[ E ] Remonter en surface');}
  else{hideHint();}
  if(!sewerTransitioning){
    if(!playerState.inSewer&&distToHole<2.2&&keys['KeyE']){sewerTransitioning=true;setTimeout(()=>{playerState.inSewer=true;playerState.y=SEWER_Y;playerState.vy=0;playerState.x=sewerHole.x;playerState.z=sewerHole.z;sewerTransitioning=false;scene.fog=new THREE.Fog(0x061006,6,35);scene.background=new THREE.Color(0x040c04);document.getElementById('zone-name').textContent='🐀 Souterrain';addChat('🐀 Tu es dans les égouts !','Système');checkMission('m2');},800);}
    if(playerState.inSewer&&distToHole<2.5&&keys['KeyE']){sewerTransitioning=true;setTimeout(()=>{playerState.inSewer=false;playerState.y=0.3;playerState.vy=3;playerState.x=sewerHole.x;playerState.z=sewerHole.z;sewerTransitioning=false;scene.fog=new THREE.Fog(0x7ab0d8,150,380);scene.background=new THREE.Color(0x6a9fd8);document.getElementById('zone-name').textContent='東京 Shinjuku';},600);}
  }

  // Missions de position
  const px=playerState.x,pz=playerState.z,py=playerState.y;
  // Tour Eiffel
  if(!eiffelMission&&Math.abs(px-80)<15&&Math.abs(pz+80)<15&&py>50){eiffelMission=true;checkMission('m1');}
  // Port
  if(!portMission&&px>85&&pz>80&&py<3){portMission=true;checkMission('m4');}
  // Skyscraper
  if(py>35){checkMission('m7');}
  // Metro
  if(!playerState.inSewer&&Math.abs(px+60)<10&&Math.abs(pz+100)<10){checkMission('m6');}
  // Pompiers
  if(Math.abs(px+80)<15&&Math.abs(pz-60)<15){checkMission('m8');}
  // Central Park
  if(Math.abs(px-20)<20&&Math.abs(pz+60)<20&&!playerState.inSewer){checkMission('m3');}

  // Zone
  updateZone();

  // Anim auto
  if(moved&&playerState.onGround&&(playerState.currentAnim==='idle')){playAnim(WALK_FILE);playerState.currentAnim='walk';document.querySelectorAll('.anim-btn').forEach((b,i)=>{b.classList.toggle('active',i===1);});}
  if(!moved&&playerState.onGround&&playerState.currentAnim==='walk'){playAnim(IDLE_FILE);playerState.currentAnim='idle';document.querySelectorAll('.anim-btn').forEach((b,i)=>{b.classList.toggle('active',i===0);});}
}

function updateZone(){
  const x=playerState.x,z=playerState.z;
  let zone='東京 Shinjuku';
  if(x>40&&z<0)zone='東京 Shibuya';
  else if(x<-40&&z>0)zone='東京 Akihabara';
  else if(x>40&&z>40)zone='⛵ Port de Tokyo';
  else if(x>60&&z<-60)zone='🗼 Tour Eiffel';
  else if(x<-40&&z<-40)zone='🚇 Quartier Métro';
  else if(Math.abs(x-20)<20&&Math.abs(z+60)<20)zone='🌳 Central Park';
  if(zone!==lastZone){
    lastZone=zone;document.getElementById('zone-name').textContent=zone;
    if(!visitedZones.has(zone)){visitedZones.add(zone);advanceMission('m5');}
  }
}

function updateCamera(){
  const tp=new THREE.Vector3(playerState.x,playerState.y+1.6,playerState.z);
  const cd=playerState.inSewer?4:camState.dist;
  const cp=new THREE.Vector3(
    tp.x-Math.sin(camState.yaw)*Math.cos(camState.pitch)*cd,
    tp.y+Math.sin(camState.pitch)*cd,
    tp.z-Math.cos(camState.yaw)*Math.cos(camState.pitch)*cd
  );
  camera.position.lerp(cp,0.1);
  camera.lookAt(tp);
}

// Métro animation
function updateMetro(dt){
  metroT+=dt;
  const totalLen=Math.abs(toZ-fromZ);
  const t=(metroT*8/totalLen)%1;
  const cz2=fromZ+(toZ-fromZ)*t;
  // Wagon 1 (ligne -60 Z)
  metroCars.forEach((mc,i)=>{
    const lt=(t+i*0.5)%1;
    const mz=fromZ+(toZ-fromZ)*lt;
    mc.group.position.z=mz;
    mc.group.position.x=-60;
    mc.group.position.y=20.3;
  });
}

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  updatePlayer(dt);
  updateMovingCars(dt);
  updateNPCs(dt);
  updateBoats(dt);
  updatePlayerVisuals();
  updateCamera();
  if(playerMixer)playerMixer.update(dt);
  drawMinimap();
  renderer.render(scene,camera);
}

// Spawn wagons
makeMetroCar(fromX,fromZ,0);makeMetroCar(fromX,fromZ+30,0);
// Failsafe : démarre après 4 secondes même si le GLB échoue
setTimeout(()=>{
  const ls=document.getElementById('loading-screen');
  if(!ls.classList.contains('hidden')) finishLoading();
}, 4000);

animate();

</script>
