<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test 3D Safari iPhone</title>
<style>
html,body{
  margin:0;padding:0;overflow:hidden;height:100%;
  background:#0e0620;color:white;font-family:sans-serif;
}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800}
canvas{display:block}
</style>
</head>
<body>
<div id="msg">⏳ Chargement du test 3D…</div>

<!-- On charge directement un build compatible anciens navigateurs -->
<script src="[unpkg.com](https://unpkg.com/three@0.121.1/build/three.min.js)"></script>
<script>
try {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x99ccff);
  const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 100);
  camera.position.z = 3;

  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  const light = new THREE.PointLight(0xffffff,1);
  light.position.set(3,3,3);
  scene.add(light);

  const cube = new THREE.Mesh(
    new THREE.BoxGeometry(1,1,1),
    new THREE.MeshPhongMaterial({color:0xff77aa})
  );
  scene.add(cube);

  document.getElementById('msg').remove();

  function loop() {
    cube.rotation.x += 0.01;
    cube.rotation.y += 0.013;
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  loop();

  window.addEventListener('resize',()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

} catch(e) {
  document.getElementById('msg').textContent = '❌ WebGL non supporté : ' + e.message;
}
</script>
</body>
</html>
