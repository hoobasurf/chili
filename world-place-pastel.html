<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Macadam World — Tokyo</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--gold:#f5c842;--orange:#e85d26;--green:#2ecc71;--red:#e74c3c;--blue:#3498db;--purple:#9b59b6;}
html,body{width:100%;height:100%;overflow:hidden;background:#b0c8e8;font-family:'M PLUS Rounded 1c',sans-serif;user-select:none;-webkit-user-select:none;}
#canvas-container{position:fixed;inset:0;}
canvas{display:block;width:100%!important;height:100%!important;}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;}
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,transparent 100%);}
.hud-logo{font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:900;color:#fff;letter-spacing:.05em;text-shadow:0 1px 6px rgba(0,0,0,.5);}
.hud-logo em{color:var(--gold);font-style:normal;}
.hud-loc{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:4px 10px;}
.hud-loc span{font-size:.68rem;font-weight:700;color:#fff;}
.loc-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);}
.hud-info{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:4px 10px 4px 4px;}
.hud-pic{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--gold));display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:900;color:#fff;}
.hud-name{font-size:.68rem;font-weight:700;color:#fff;}
#mission-hud{position:absolute;top:64px;right:14px;min-width:220px;max-width:260px;pointer-events:none;}
.mission-card{background:rgba(0,0,0,.7);backdrop-filter:blur(10px);border:1.5px solid rgba(245,200,66,.4);border-radius:12px;padding:10px 14px;margin-bottom:7px;transition:all .3s;}
.mission-card.done{border-color:var(--green);opacity:.6;}
.mission-card.active{border-color:var(--gold);box-shadow:0 0 14px rgba(245,200,66,.25);}
.mission-title{font-size:.72rem;font-weight:900;color:var(--gold);margin-bottom:3px;}
.mission-desc{font-size:.6rem;color:rgba(255,255,255,.75);line-height:1.35;}
.mission-progress{margin-top:5px;height:3px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden;}
.mission-bar{height:100%;background:var(--gold);border-radius:2px;transition:width .4s;}
.mission-badge{display:inline-block;background:var(--green);color:#fff;font-size:.55rem;font-weight:900;padding:1px 6px;border-radius:8px;margin-left:6px;}
#shrink-overlay{position:fixed;inset:0;z-index:30;pointer-events:none;transition:all .5s;border:0px solid rgba(100,200,255,.8);box-shadow:inset 0 0 0px rgba(100,200,255,.4);}
#shrink-overlay.active{border-width:12px;box-shadow:inset 0 0 60px rgba(100,200,255,.4);}
#sewer-overlay{position:fixed;inset:0;z-index:25;background:radial-gradient(ellipse at center,rgba(20,40,10,.0) 0%,rgba(10,20,5,.0) 100%);pointer-events:none;transition:all .8s;}
#sewer-overlay.active{background:radial-gradient(ellipse at center,rgba(20,60,10,.7) 0%,rgba(0,0,0,.95) 100%);}
/* METRO HUD */
#metro-hud{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:50;background:rgba(0,0,0,.92);border:2px solid #f5c842;border-radius:18px;padding:20px 30px;min-width:280px;text-align:center;display:none;}
#metro-hud.show{display:block;}
.metro-title{font-family:'Zen Kaku Gothic New',sans-serif;font-size:1.1rem;font-weight:900;color:#f5c842;margin-bottom:12px;}
.metro-stations{display:flex;flex-direction:column;gap:8px;}
.metro-station-btn{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);border-radius:10px;padding:10px 16px;color:#fff;font-size:.8rem;font-weight:700;cursor:pointer;pointer-events:all;transition:all .2s;font-family:'M PLUS Rounded 1c',sans-serif;}
.metro-station-btn:hover,.metro-station-btn:active{background:rgba(245,200,66,.2);border-color:#f5c842;color:#f5c842;}
.metro-close{margin-top:12px;background:rgba(231,76,60,.2);border:1.5px solid var(--red);border-radius:10px;padding:8px 20px;color:var(--red);font-size:.75rem;font-weight:700;cursor:pointer;pointer-events:all;font-family:'M PLUS Rounded 1c',sans-serif;}
/* BOAT HUD */
#boat-hud{position:fixed;bottom:200px;left:50%;transform:translateX(-50%);z-index:40;background:rgba(0,0,0,.8);border:1.5px solid #3498db;border-radius:14px;padding:8px 18px;display:none;pointer-events:all;}
#boat-hud.show{display:flex;align-items:center;gap:12px;}
.boat-info{font-size:.72rem;font-weight:700;color:#3498db;}
.boat-exit-btn{background:rgba(231,76,60,.25);border:1.5px solid var(--red);border-radius:9px;padding:5px 12px;color:var(--red);font-size:.7rem;font-weight:700;cursor:pointer;font-family:'M PLUS Rounded 1c',sans-serif;}
.hud-chat{position:absolute;bottom:180px;left:12px;max-width:270px;pointer-events:all;}
.chat-messages{max-height:80px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;margin-bottom:5px;scrollbar-width:none;}
.chat-messages::-webkit-scrollbar{display:none;}
.chat-msg{background:rgba(0,0,0,.5);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:4px 9px;font-size:.68rem;color:#fff;line-height:1.35;}
.chat-msg .name{font-weight:900;color:var(--gold);margin-right:4px;}
.chat-input-wrap{display:flex;gap:5px;}
.chat-input{flex:1;background:rgba(0,0,0,.45);border:1.5px solid rgba(255,255,255,.25);border-radius:10px;padding:7px 11px;font-size:16px;font-weight:700;color:#fff;outline:none;font-family:'M PLUS Rounded 1c',sans-serif;}
.chat-input::placeholder{color:rgba(255,255,255,.35);}
.chat-input:focus{border-color:var(--gold);}
.chat-send{width:34px;height:34px;border-radius:9px;background:var(--orange);border:none;color:#fff;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;pointer-events:all;}
#anim-panel{position:absolute;bottom:0;left:0;right:0;pointer-events:all;padding:5px 0 9px;background:linear-gradient(0deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.55) 100%);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.08);}
#anim-scroll{display:flex;gap:6px;overflow-x:auto;padding:3px 12px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
#anim-scroll::-webkit-scrollbar{display:none;}
.anim-btn{flex-shrink:0;width:62px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.anim-icon{width:60px;height:60px;border-radius:11px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;transition:all .15s;}
.anim-icon svg{width:48px;height:48px;}
.anim-btn.active .anim-icon{background:rgba(245,200,66,.12);border-color:var(--gold);box-shadow:0 0 10px rgba(245,200,66,.3);}
.anim-btn:active .anim-icon{transform:scale(.9);}
.anim-label{font-size:.52rem;font-weight:700;color:rgba(255,255,255,.4);text-align:center;line-height:1.1;}
.anim-btn.active .anim-label{color:var(--gold);}
#joystick-zone{position:absolute;bottom:106px;right:16px;width:100px;height:100px;pointer-events:all;}
#cam-joystick-zone{position:absolute;bottom:106px;left:16px;width:100px;height:100px;pointer-events:all;}
.joy-base{width:100px;height:100px;border-radius:50%;background:rgba(0,0,0,.2);border:1.5px solid rgba(255,255,255,.2);backdrop-filter:blur(6px);position:relative;display:flex;align-items:center;justify-content:center;}
.joy-knob{width:40px;height:40px;border-radius:50%;position:absolute;box-shadow:0 2px 10px rgba(0,0,0,.4);}
#jump-btn{position:absolute;bottom:220px;right:22px;width:52px;height:52px;border-radius:50%;background:#2b6cb0;border:none;color:#fff;font-size:1.3rem;pointer-events:all;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}
#super-jump-btn{position:absolute;bottom:220px;left:22px;width:52px;height:52px;border-radius:50%;background:var(--orange);border:none;color:#fff;font-size:1.1rem;pointer-events:all;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}
.toast{position:fixed;bottom:200px;left:50%;transform:translateX(-50%) translateY(14px);background:rgba(0,0,0,.85);color:var(--gold);padding:7px 15px;border-radius:16px;font-size:.72rem;font-weight:700;opacity:0;transition:all .25s;z-index:50;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.mission{background:rgba(20,80,40,.95);color:var(--green);border:1px solid var(--green);}
.toast.secret{background:rgba(10,30,80,.95);color:#88ccff;border:1px solid #88ccff;}
.toast.boat{background:rgba(10,40,80,.95);color:#3498db;border:1px solid #3498db;}
#speech-bubble{position:fixed;z-index:20;background:rgba(0,0,0,.85);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:9px;padding:4px 10px;font-size:.68rem;font-weight:700;pointer-events:none;max-width:140px;text-align:center;transform:translateX(-50%);opacity:0;transition:opacity .25s;white-space:nowrap;}
#speech-bubble::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:rgba(255,255,255,.2);border-bottom:none;}
#loading-screen{position:fixed;inset:0;z-index:200;background:#b0c8e8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s;}
#loading-screen.hidden{opacity:0;pointer-events:none;}
.load-logo{font-family:'Zen Kaku Gothic New',sans-serif;font-size:2.2rem;font-weight:900;color:#1a2a40;letter-spacing:.06em;}
.load-logo em{color:var(--orange);font-style:normal;}
.load-kanji{font-size:.9rem;color:rgba(26,42,64,.6);letter-spacing:.25em;}
.load-bar-wrap{width:180px;height:3px;background:rgba(0,0,0,.12);border-radius:2px;overflow:hidden;}
.load-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--orange),var(--gold));border-radius:2px;transition:width .2s;}
.load-txt{font-size:.68rem;color:rgba(26,42,64,.6);font-weight:700;}
#markers{position:fixed;inset:0;z-index:15;pointer-events:none;}
.marker{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;opacity:0;transition:opacity .3s;}
.marker.visible{opacity:1;}
.marker-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;animation:markerBounce 1.2s ease-in-out infinite;}
.marker-label{font-size:.55rem;font-weight:900;color:#fff;background:rgba(0,0,0,.7);padding:1px 6px;border-radius:8px;white-space:nowrap;}
@keyframes markerBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
/* INTERACT PROMPT */
#interact-prompt{position:fixed;top:50%;left:50%;transform:translate(-50%,60px);z-index:45;background:rgba(0,0,0,.8);border:1.5px solid var(--gold);border-radius:12px;padding:8px 18px;font-size:.75rem;font-weight:700;color:var(--gold);pointer-events:all;cursor:pointer;display:none;-webkit-tap-highlight-color:transparent;}
#interact-prompt.show{display:block;}
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="sewer-overlay"></div>
<div id="shrink-overlay"></div>

<div id="loading-screen">
  <div class="load-logo">TOKYO<em>東京</em></div>
  <div class="load-kanji">MACADAM WORLD</div>
  <div class="load-bar-wrap"><div class="load-bar" id="load-bar"></div></div>
  <div class="load-txt" id="load-txt">Chargement…</div>
</div>

<div id="metro-hud">
  <div class="metro-title">🚇 Métro de Tokyo</div>
  <div class="metro-stations" id="metro-stations"></div>
  <button class="metro-close" id="metro-close">✕ Fermer</button>
</div>

<div id="boat-hud">
  <span class="boat-info" id="boat-info">⚓ En mer — Vitesse: 0</span>
  <button class="boat-exit-btn" id="boat-exit">Quitter le bateau</button>
</div>

<div id="interact-prompt" id="interact-prompt">⬆ Appuyer pour interagir</div>

<div id="hud">
  <div class="hud-top">
    <div class="hud-logo">⬡ <em>Macadam</em> World</div>
    <div class="hud-loc"><div class="loc-dot"></div><span id="zone-label">東京 Shinjuku</span></div>
    <div class="hud-info"><div class="hud-pic" id="hud-pic">?</div><span class="hud-name" id="hud-pseudo">Joueur</span></div>
  </div>
  <div id="mission-hud"></div>
  <div class="hud-chat">
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-wrap">
      <input class="chat-input" id="chat-input" type="text" placeholder="Dis quelque chose…" maxlength="80" autocomplete="off"/>
      <button class="chat-send" id="chat-send">➤</button>
    </div>
  </div>
  <div id="cam-joystick-zone">
    <div class="joy-base" id="cam-joy-base">
      <div class="joy-knob" id="cam-joy-knob" style="background:linear-gradient(135deg,#f5c842,#e85d26);"></div>
    </div>
  </div>
  <div id="joystick-zone">
    <div class="joy-base" id="joy-base">
      <div class="joy-knob" id="joy-knob" style="background:linear-gradient(135deg,#dddddd,#aaaaaa);"></div>
    </div>
  </div>
  <button id="jump-btn">↑</button>
  <button id="super-jump-btn">🚀</button>
  <div id="anim-panel"><div id="anim-scroll"></div></div>
</div>

<div id="markers"></div>
<div id="speech-bubble"></div>
<div class="toast" id="toast"></div>
<div id="interact-prompt">⬆ Appuyer pour interagir</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ── LOADER GLB — déclaré en premier car utilisé partout ──
const gltfLoader=new GLTFLoader();
const glbCache={};

const BASE='https://raw.githubusercontent.com/hoobasurf/chili/main/';
const WALK_FILE='course.glb',IDLE_FILE='attend.glb';

// ── PROFIL ─────────────────────────────────────────────────────
function loadProfile(){
  try{const uid=localStorage.getItem('macadam_user_id')||('p_'+Math.random().toString(36).slice(2,8));localStorage.setItem('macadam_user_id',uid);const saved=JSON.parse(localStorage.getItem('macadam_avatar_'+uid)||'null');return{pseudo:saved?.pseudo||'Joueur'};}
  catch(e){return{pseudo:'Joueur'};}
}
const profile=loadProfile();
document.getElementById('hud-pseudo').textContent=profile.pseudo;
document.getElementById('hud-pic').textContent=profile.pseudo.slice(0,2).toUpperCase();

// ── LOADING ─────────────────────────────────────────────────────
let loadPct=0;
const loadBar=document.getElementById('load-bar'),loadTxt=document.getElementById('load-txt');
const ldMsgs=['Chargement des textures…','Construction de Tokyo…','Pose du béton…','Construction du métro…','Mise à flot des bateaux…','Tour Eiffel en cours…','Presque prêt…'];
let ldIdx=0;
const ldInt=setInterval(()=>{loadPct+=Math.random()*5;if(loadPct>85){loadPct=85;clearInterval(ldInt);}loadBar.style.width=loadPct+'%';const idx=Math.min(Math.floor(loadPct/14),ldMsgs.length-1);if(idx>ldIdx){ldIdx=idx;loadTxt.textContent=ldMsgs[ldIdx];}},180);
function finishLoading(){
  clearInterval(ldInt);loadBar.style.width='100%';loadTxt.textContent='Bienvenue à Tokyo !';
  setTimeout(()=>{const l=document.getElementById('loading-screen');l.classList.add('hidden');setTimeout(()=>l.style.display='none',600);},400);
  addChat('☀️ Bienvenue à Tokyo, '+profile.pseudo+' !','Système');
  addChat('🗼 Tour Eiffel • 🚇 Métro • ⛵ Port • 🏎 Alfa • 🗽 Statue','Info');
  swapAvatar(IDLE_FILE,true,null);
}

// ── UI HELPERS ───────────────────────────────────────────────
let toastTimer=null;
function showToast(msg,type=''){
  const t=document.getElementById('toast');t.textContent=msg;
  t.className='toast '+(type||'');t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3200);
}
const bubbleEl=document.getElementById('speech-bubble');let bubTimer=null;
function showBubble(t){bubbleEl.textContent=t;bubbleEl.style.opacity='1';clearTimeout(bubTimer);bubTimer=setTimeout(()=>bubbleEl.style.opacity='0',4500);}
function addChat(text,from){
  const msgs=document.getElementById('chat-messages');const d=document.createElement('div');d.className='chat-msg';
  d.innerHTML=`<span class="name">${from}</span>${text}`;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;
  while(msgs.children.length>20)msgs.removeChild(msgs.firstChild);
}
function sendChat(){const inp=document.getElementById('chat-input');const m=inp.value.trim();if(!m)return;inp.value='';addChat(m,profile.pseudo);showBubble(m);}
document.getElementById('chat-send').addEventListener('click',sendChat);
document.getElementById('chat-input').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendChat();}});

// ── THREE RENDERER ────────────────────────────────────────────
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById('canvas-container').appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x7ab4d4);
scene.fog=new THREE.FogExp2(0x9ec2dc,0.0032);
const camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,600);
window.addEventListener('resize',()=>{renderer.setSize(window.innerWidth,window.innerHeight);camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();});

// ── LUMIÈRES ──────────────────────────────────────────────────
scene.add(new THREE.HemisphereLight(0x87CEEB,0xc8b89a,1.1));
const sun=new THREE.DirectionalLight(0xfff5e0,2.4);sun.position.set(80,150,60);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-200;sun.shadow.camera.bottom=-200;
sun.shadow.camera.right=200;sun.shadow.camera.top=200;sun.shadow.camera.far=500;sun.shadow.bias=-0.001;scene.add(sun);
const fillLight=new THREE.DirectionalLight(0xc8d8f0,0.55);fillLight.position.set(-50,80,-80);scene.add(fillLight);

// ── TEXTURES ──────────────────────────────────────────────────
function procTex(fn,size=256){
  const cv=document.createElement('canvas');cv.width=cv.height=size;const ctx=cv.getContext('2d');fn(ctx,size);
  const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
const asphaltTex=procTex((ctx,s)=>{ctx.fillStyle='#282828';ctx.fillRect(0,0,s,s);for(let i=0;i<2500;i++){const g=20+Math.random()*25|0;ctx.fillStyle=`rgb(${g},${g},${g})`;ctx.fillRect(Math.random()*s|0,Math.random()*s|0,1+(Math.random()*1.5|0),1);}});
asphaltTex.repeat.set(12,12);
const concreteTex=procTex((ctx,s)=>{ctx.fillStyle='#989088';ctx.fillRect(0,0,s,s);for(let i=0;i<3000;i++){const g=130+Math.random()*20|0;ctx.fillStyle=`rgba(${g},${g-4},${g-8},0.6)`;ctx.fillRect(Math.random()*s|0,Math.random()*s|0,1,1);}ctx.strokeStyle='rgba(110,105,98,0.5)';ctx.lineWidth=1;for(let x=0;x<s;x+=64){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,s);ctx.stroke();}for(let y=0;y<s;y+=64){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(s,y);ctx.stroke();}});
concreteTex.repeat.set(8,8);
const grassTex=procTex((ctx,s)=>{ctx.fillStyle='#4a7838';ctx.fillRect(0,0,s,s);for(let i=0;i<4000;i++){const g=95+Math.random()*30|0;ctx.fillStyle=`rgb(${25+Math.random()*25|0},${g},${18+Math.random()*18|0})`;ctx.fillRect(Math.random()*s|0,Math.random()*s|0,1+(Math.random()*2|0),1+(Math.random()*3|0));}});
grassTex.repeat.set(14,14);
const waterTex=procTex((ctx,s)=>{ctx.fillStyle='#0a3a5a';ctx.fillRect(0,0,s,s);for(let i=0;i<1500;i++){const op=0.1+Math.random()*0.25;ctx.fillStyle=`rgba(100,180,220,${op})`;ctx.fillRect(Math.random()*s|0,Math.random()*s|0,1+(Math.random()*6|0),1);}},512);
waterTex.repeat.set(8,8);

const colliders=[];
function addCol(cx,cz,hw,hd,mH=200){colliders.push({minX:cx-hw,maxX:cx+hw,minZ:cz-hd,maxZ:cz+hd,mH});}
const PR=0.55;
function resCol(nx,nz,py){
  for(const c of colliders){
    if(py>=c.mH)continue;
    const px=Math.max(c.minX,Math.min(c.maxX,nx)),pz=Math.max(c.minZ,Math.min(c.maxZ,nz));
    const dx=nx-px,dz=nz-pz,d=Math.sqrt(dx*dx+dz*dz);
    if(d<PR){if(d<0.001){nx+=PR;}else{const p=PR-d;nx+=(dx/d)*p;nz+=(dz/d)*p;}}
  }
  return{x:nx,z:nz};
}

const drivingCars=[];
CAR_ROUTES.forEach((route,i)=>{
  const car=makeCar(route.paint,route.carType);scene.add(car);
  // Position initiale décalée
  const startOffset=(i*37)%(route.max-route.min>0?route.max-route.min:route.min-route.max);
  let sx,sz,rot;
  if(route.axis==='x'){
    sx=route.min+startOffset*(route.dir>0?1:-1);
    sz=route.fixedZ+(route.lane?-2.2:2.2)*(route.dir);
    rot=route.dir>0?Math.PI/2:-Math.PI/2;
  }else{
    sx=route.fixedX+(route.lane?2.2:-2.2)*(route.dir);
    sz=route.min+startOffset*(route.dir>0?1:-1);
    rot=route.dir>0?0:Math.PI;
  }
  car.position.set(sx,0,sz);car.rotation.y=rot;
  drivingCars.push({mesh:car,route,pos:startOffset,rot,wheels:car.children.filter(c=>c.geometry?.type==='CylinderGeometry'&&Math.abs(c.position.x)>0.5)});
});

function updateCars(dt){
  drivingCars.forEach(dc=>{
    const r=dc.route;const s=r.speed*dt;
    const lo=r.axis==='x'?dc.mesh.position.x:dc.mesh.position.z;
    const rng=Math.abs(r.max-r.min);
    let nlo=lo+r.dir*s;
    if(r.dir>0&&nlo>r.max)nlo=r.min;
    if(r.dir<0&&nlo<r.max)nlo=r.min;
    if(r.axis==='x'){dc.mesh.position.x=nlo;dc.mesh.position.z=r.fixedZ+(r.lane?-2.2:2.2);}
    else{dc.mesh.position.z=nlo;dc.mesh.position.x=r.fixedX+(r.lane?2.2:-2.2);}
    // Rotation des roues
    dc.wheels.forEach(w=>{if(Math.abs(w.position.z)>0.8)w.rotation.x+=r.dir*s*2.5;});
  });
}

function loadSceneGLB(file, px, py, pz, scale, rotY, onLoaded){
  gltfLoader.load(BASE+file, gltf=>{
    const model=gltf.scene;
    model.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true;}});
    // Normaliser la taille si scale fourni
    if(scale==='auto'){
      const bb=new THREE.Box3().setFromObject(model);
      const sz=new THREE.Vector3();bb.getSize(sz);
      const maxDim=Math.max(sz.x,sz.y,sz.z);
      if(maxDim>0)model.scale.setScalar(1/maxDim);
    } else if(typeof scale==='number'){
      model.scale.setScalar(scale);
    }
    const bb2=new THREE.Box3().setFromObject(model);
    const minY=bb2.min.y;
    model.position.set(px, py-minY, pz);
    if(rotY)model.rotation.y=rotY;
    scene.add(model);
    if(onLoaded)onLoaded(model,bb2);
  }, undefined, err=>console.warn('GLB load error:',file,err));
}

function updateMetroTrain(dt){
  if(metroTrain.mixer)metroTrain.mixer.update(dt);
  if(metroTrain.waitTimer>0){metroTrain.waitTimer-=dt;return;}
  const from=METRO_TRACK[metroTrain.trackIdx];
  const to=METRO_TRACK[(metroTrain.trackIdx+1)%METRO_TRACK.length];
  const dx=to.x-from.x,dz=to.z-from.z;
  const segLen=Math.sqrt(dx*dx+dz*dz);
  metroTrain.progress+=metroTrain.speed*dt;
  if(metroTrain.progress>=segLen){
    metroTrain.trackIdx=(metroTrain.trackIdx+1)%(METRO_TRACK.length-1);
    metroTrain.progress=0;
    const np=METRO_TRACK[metroTrain.trackIdx];
    const foundSt=METRO_STATIONS.find(s=>Math.abs(s.x-np.x)<2&&Math.abs(s.z-np.z)<2);
    if(foundSt){metroTrain.waitTimer=4;metroTrain.atStation=foundSt.id;addChat('🚇 Train en gare de '+foundSt.name,'Métro');}
    return;
  }
  const t=metroTrain.progress/segLen;
  const nx=from.x+dx*t,nz=from.z+dz*t;
  metroTrain.group.position.set(nx,METRO_ELEV+0.6,nz);
  metroTrain.group.rotation.y=Math.atan2(dx,dz);
}

  loadCarGLB(route.file, model=>{
    const g=new THREE.Group();
    g.add(model);
    scene.add(g);
    // Position initiale décalée pour éviter regroupement
    const range=Math.abs(route.max-route.min);
    const offset=(i*41)%range;
    let sx,sz,rot;
    const laneOff=route.lane?-2.2:2.2;
    if(route.axis==='x'){
      sx=route.min+offset*(route.dir>0?1:-1);
      sz=route.fixedZ+laneOff*route.dir;
      rot=route.dir>0?Math.PI/2:-Math.PI/2;
    }else{
      sx=route.fixedX+laneOff*route.dir;
      sz=route.min+offset*(route.dir>0?1:-1);
      rot=route.dir>0?0:Math.PI;
    }
    g.position.set(sx,0,sz);g.rotation.y=rot;
    glbCars.push({mesh:g,route,pos:offset});
  });
});

function updateGLBCars(dt){
  glbCars.forEach(dc=>{
    const r=dc.route;const s=r.speed*dt;
    const lo=r.axis==='x'?dc.mesh.position.x:dc.mesh.position.z;
    let nlo=lo+r.dir*s;
    if(r.dir>0&&nlo>r.max)nlo=r.min;
    if(r.dir<0&&nlo<r.max)nlo=r.min;
    const laneOff=r.lane?-2.2:2.2;
    if(r.axis==='x'){dc.mesh.position.x=nlo;dc.mesh.position.z=r.fixedZ+laneOff*r.dir;}
    else{dc.mesh.position.z=nlo;dc.mesh.position.x=r.fixedX+laneOff*r.dir;}
  });
}

function updateBoat(dt){
  if(!inBoat)return;
  const mx2=joy.x,mz2=-joy.y;
  if(Math.abs(mz2)>0.05)boatVel+=mz2*8*dt;
  else boatVel*=0.92;
  boatVel=Math.max(-MAX_BOAT_SPEED*0.5,Math.min(MAX_BOAT_SPEED,boatVel));
  if(camJoy.active&&Math.abs(camJoy.x)>0.04)boatRot-=camJoy.x*1.2*dt;
  if(Math.abs(mx2)>0.05)boatRot-=mx2*1.0*dt;
  boatX+=Math.sin(boatRot)*boatVel*dt;
  boatZ+=Math.cos(boatRot)*boatVel*dt;
  // Limiter en mer
  boatX=Math.max(100,Math.min(300,boatX));
  boatZ=Math.max(-200,Math.min(100,boatZ));
  playerBoat.position.set(boatX,-1.5+Math.sin(time*0.8)*0.18,boatZ);
  playerBoat.rotation.y=boatRot;
  pp.x=boatX;pp.z=boatZ;pp.y=4;
  cameraYaw=boatRot;
  const speedKnot=Math.abs(boatVel).toFixed(1);
  document.getElementById('boat-info').textContent=`⚓ Vitesse: ${speedKnot} nœuds`;
}

const avatarGroup=new THREE.Group();avatarGroup.position.set(0,0,8);scene.add(avatarGroup);
let avatarMixer=null,emoteTimer=null,lastWalking=false;
function loadGLB(url,cb){if(glbCache[url]){cb(glbCache[url]);return;}gltfLoader.load(url,gltf=>{glbCache[url]=gltf;cb(gltf);},undefined,()=>{});}
function swapAvatar(file,loop,onDone){
  const url=BASE+file;
  loadGLB(url,gltf=>{
    while(avatarGroup.children.length)avatarGroup.remove(avatarGroup.children[0]);
    if(avatarMixer){avatarMixer.stopAllAction();avatarMixer=null;}
    const model=gltf.scene;model.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true;}});
    const bb=new THREE.Box3().setFromObject(model);const sz=new THREE.Vector3();bb.getSize(sz);
    if(sz.y>0)model.scale.setScalar(1.75/sz.y);
    const bb2=new THREE.Box3().setFromObject(model);model.position.y=-bb2.min.y;
    avatarGroup.add(model);
    if(gltf.animations&&gltf.animations.length){
      avatarMixer=new THREE.AnimationMixer(model);
      const action=avatarMixer.clipAction(gltf.animations[0]);
      action.setLoop(loop?THREE.LoopRepeat:THREE.LoopOnce,loop?Infinity:1);
      action.clampWhenFinished=!loop;action.play();
      if(onDone)onDone(gltf.animations[0].duration);
    }
  });
}
loadGLB(BASE+IDLE_FILE,()=>{});loadGLB(BASE+WALK_FILE,()=>{});

  {label:'Salto',file:'salto%20avant.glb'},{label:'Costaud',file:'costaud.glb'},
];
const animScroll=document.getElementById('anim-scroll');let activeBtn=null;
ANIMS.forEach((anim,i)=>{
  const btn=document.createElement('div');btn.className='anim-btn';if(i===0)btn.classList.add('active');
  const C='#f5c842';
  const svg=`<svg viewBox="0 0 56 72" xmlns="http://www.w3.org/2000/svg"><circle cx="28" cy="9" r="6" fill="none" stroke="${C}" stroke-width="2.5"/><line x1="28" y1="15" x2="28" y2="46" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="28" y1="24" x2="16" y2="36" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="28" y1="24" x2="40" y2="36" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="26" y1="46" x2="20" y2="66" stroke="${C}" stroke-width="3" stroke-linecap="round"/><line x1="30" y1="46" x2="36" y2="66" stroke="${C}" stroke-width="3" stroke-linecap="round"/></svg>`;
  btn.innerHTML=`<div class="anim-icon">${svg}</div><span class="anim-label">${anim.label}</span>`;
  btn.addEventListener('click',()=>{
    if(activeBtn)activeBtn.classList.remove('active');btn.classList.add('active');activeBtn=btn;
    if(anim.file===IDLE_FILE){clearTimeout(emoteTimer);emoteTimer=null;lastWalking=false;swapAvatar(IDLE_FILE,true,null);}
    else if(anim.file===WALK_FILE){clearTimeout(emoteTimer);emoteTimer=null;lastWalking=true;swapAvatar(WALK_FILE,true,null);}
    else{lastWalking=false;playEmote(anim.file,anim.label);}
  });
  animScroll.appendChild(btn);if(i===0)activeBtn=btn;
});

// ─────────────────────────────────────────────────────────
// JOYSTICKS
// ─────────────────────────────────────────────────────────
const joyBase=document.getElementById('joy-base'),joyKnob=document.getElementById('joy-knob');
const JR=40;const joy={active:false,x:0,y:0,id:null};
function getJC(){const r=joyBase.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
function updateJoy(cx,cy){const c=getJC();let dx=cx-c.x,dy=cy-c.y;const d=Math.sqrt(dx*dx+dy*dy);if(d>JR){dx=dx/d*JR;dy=dy/d*JR;}joy.x=dx/JR;joy.y=dy/JR;joyKnob.style.transform=`translate(${dx}px,${dy}px)`;}
joyBase.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];joy.active=true;joy.id=t.identifier;updateJoy(t.clientX,t.clientY);},{passive:false});
document.addEventListener('touchmove',e=>{if(!joy.active)return;for(const t of e.changedTouches)if(t.identifier===joy.id){e.preventDefault();updateJoy(t.clientX,t.clientY);}},{passive:false});
document.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===joy.id){joy.active=false;joy.x=0;joy.y=0;joyKnob.style.transform='translate(0,0)';}});
const camBase=document.getElementById('cam-joy-base'),camKnob=document.getElementById('cam-joy-knob');
const camJoy={active:false,x:0,id:null};
function getCamC(){const r=camBase.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
function updateCamJoy(cx,cy){const c=getCamC();let dx=cx-c.x,dy=cy-c.y;const d=Math.sqrt(dx*dx+dy*dy);if(d>JR){dx=dx/d*JR;dy=dy/d*JR;}camJoy.x=dx/JR;camKnob.style.transform=`translate(${dx}px,${dy}px)`;}
camBase.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];camJoy.active=true;camJoy.id=t.identifier;updateCamJoy(t.clientX,t.clientY);},{passive:false});
document.addEventListener('touchmove',e=>{if(!camJoy.active)return;for(const t of e.changedTouches)if(t.identifier===camJoy.id){e.preventDefault();updateCamJoy(t.clientX,t.clientY);}},{passive:false});
document.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===camJoy.id){camJoy.active=false;camJoy.x=0;camKnob.style.transform='translate(0,0)';}});
let mDrag={active:false,lastX:0};
renderer.domElement.addEventListener('mousedown',e=>{mDrag.active=true;mDrag.lastX=e.clientX;});
document.addEventListener('mousemove',e=>{if(!mDrag.active)return;cameraYaw-=(e.clientX-mDrag.lastX)*0.005;mDrag.lastX=e.clientX;});
document.addEventListener('mouseup',()=>mDrag.active=false);
const keys={};
document.addEventListener('keydown',e=>keys[e.key]=true);
document.addEventListener('keyup',e=>keys[e.key]=false);

const JVN=9,JVS=20,GR=28;
let jumpVel=0,onGround=true,jtc=0,jtt=null;
function doJump(){if(!onGround)return;jtc++;clearTimeout(jtt);if(jtc>=2){jtc=0;jumpVel=JVS;onGround=false;showToast('🚀 SUPER SAUT !');}else{jtt=setTimeout(()=>{if(jtc===1&&onGround){jumpVel=JVN;onGround=false;}jtc=0;},280);}}
document.getElementById('jump-btn').addEventListener('touchstart',e=>{e.preventDefault();doJump();},{passive:false});
document.getElementById('jump-btn').addEventListener('click',doJump);
document.getElementById('super-jump-btn').addEventListener('touchstart',e=>{e.preventDefault();if(!onGround)return;jtc=0;clearTimeout(jtt);jumpVel=JVS;onGround=false;showToast('🚀 SUPER SAUT !');},{passive:false});
document.getElementById('super-jump-btn').addEventListener('click',()=>{if(!onGround)return;jtc=0;clearTimeout(jtt);jumpVel=JVS;onGround=false;showToast('🚀 SUPER SAUT !');});

// ─────────────────────────────────────────────────────────
// MÉTRO — UI
// ─────────────────────────────────────────────────────────
let inMetro=false,metroStationsVisited=new Set(),metroMenuOpen=false;
function openMetroMenu(fromStation){
  metroMenuOpen=true;document.getElementById('metro-hud').classList.add('show');
  const stDiv=document.getElementById('metro-stations');stDiv.innerHTML='';
  METRO_STATIONS.filter(s=>s.id!==fromStation).forEach(st=>{
    const btn=document.createElement('button');btn.className='metro-station-btn';
    btn.textContent=st.name+(st.id===metroTrain.atStation?' ← Train ici':'');
    btn.onclick=()=>rideMetroTo(st);
    stDiv.appendChild(btn);
  });
}
document.getElementById('metro-close').addEventListener('click',()=>{metroMenuOpen=false;document.getElementById('metro-hud').classList.remove('show');});
function rideMetroTo(targetStation){
  metroMenuOpen=false;document.getElementById('metro-hud').classList.remove('show');
  inMetro=true;
  // Animer le train vers la destination
  addChat('🚇 Départ vers '+targetStation.name+'…','Métro');
  showToast('🚇 En route vers '+targetStation.name,'boat');
  // Téléporter après délai (simulation trajet)
  setTimeout(()=>{
    inMetro=false;
    pp.x=targetStation.x;pp.z=targetStation.z+3;pp.y=METRO_ELEV+0.6;
    document.getElementById('zone-label').textContent=targetStation.label;
    showToast('✅ Arrivée à '+targetStation.name,'mission');
    addChat('🚉 Arrivée à '+targetStation.name+' !','Métro');
    metroStationsVisited.add(targetStation.id);
    updateMissionProgress('metro',metroStationsVisited.size);
    if(metroStationsVisited.size>=3)completeMission('metro','Tu as visité 3 stations de métro à Tokyo !');
  },3500);
}

// INTERACT PROMPT
const interactPrompt=document.getElementById('interact-prompt');
let interactAction=null;
function setInteractPrompt(text,action){
  interactPrompt.textContent=text;interactPrompt.classList.add('show');interactAction=action;
}
function clearInteractPrompt(){interactPrompt.classList.remove('show');interactAction=null;}
interactPrompt.addEventListener('click',()=>{if(interactAction){interactAction();}});
interactPrompt.addEventListener('touchstart',e=>{e.preventDefault();if(interactAction){interactAction();}},{passive:false});
document.addEventListener('keydown',e=>{if((e.key==='f'||e.key==='F'||e.key==='Enter')&&interactAction){interactAction();}});

// ─────────────────────────────────────────────────────────
// ÉTATS RUNTIME
// ─────────────────────────────────────────────────────────
let isShrunk=false,shrunkTimer=null;
let isInSewer=false,sewerFloorY=-6;
let isOnLadder=false,ladderTopY=0,ladderLX=0,ladderLZ=0;
let sewerCoinsCollected=0;
function enterShrink(){if(isShrunk)return;isShrunk=true;document.getElementById('shrink-overlay').classList.add('active');document.getElementById('zone-label').textContent='🔬 Zone Micro';showToast('🔬 Tu as rétrécis !','secret');completeMission('wall','Tu as traversé le mur magique !');clearTimeout(shrunkTimer);shrunkTimer=setTimeout(()=>exitShrink(),15000);}
function exitShrink(){if(!isShrunk)return;isShrunk=false;document.getElementById('shrink-overlay').classList.remove('active');document.getElementById('zone-label').textContent='東京 Shinjuku';}
function enterSewer(){if(isInSewer)return;isInSewer=true;document.getElementById('sewer-overlay').classList.add('active');document.getElementById('zone-label').textContent='🐀 Égouts de Tokyo';addChat('💀 Dans les égouts ! Collecte les 5 capsules !','Égouts');}
function exitSewer(){if(!isInSewer)return;isInSewer=false;document.getElementById('sewer-overlay').classList.remove('active');document.getElementById('zone-label').textContent='東京 Shinjuku';}

// MARKERS
const markersDiv=document.getElementById('markers');
const markerDefs=[
  {id:'m1',icon:'🪜',label:'Grimpe!',color:'#f5c842'},{id:'m2',icon:'💧',label:'Secret',color:'#4488ff'},
  {id:'m3',icon:'🔮',label:'Magie',color:'#88ccff'},{id:'m4',icon:'🐀',label:'Égouts',color:'#80ff40'},
  {id:'m5',icon:'🚇',label:'Métro',color:'#2266cc'},{id:'m6',icon:'⛵',label:'Bateau',color:'#3498db'},
  {id:'m7',icon:'🗼',label:'Tour Eiffel',color:'#f5c000'},
];
const markerEls={};
markerDefs.forEach(d=>{
  const el=document.createElement('div');el.className='marker';el.id='marker-'+d.id;
  el.innerHTML=`<div class="marker-icon" style="background:rgba(0,0,0,.7);border:2px solid ${d.color}">${d.icon}</div><span class="marker-label" style="color:${d.color}">${d.label}</span>`;
  markersDiv.appendChild(el);markerEls[d.id]=el;
});
const MARKER_WORLD={m1:new THREE.Vector3(44.5,1,-18.4),m2:new THREE.Vector3(-45,1.5,45),m3:new THREE.Vector3(60,1.5,-80),m4:new THREE.Vector3(-90,1.5,-70),m5:new THREE.Vector3(-60,METRO_ELEV,-30),m6:new THREE.Vector3(135,4,-30),m7:new THREE.Vector3(0,50,-150)};
function updateMarkers(){
  Object.entries(MARKER_WORLD).forEach(([id,pos3])=>{
    const el=markerEls[id];if(!el)return;
    const v=pos3.clone().project(camera);
    const behind=(v.z>1);const x=(v.x+1)/2*window.innerWidth;const y=(1-v.y)/2*window.innerHeight;
    const dist3=pos3.distanceTo(pp);
    if(!behind&&dist3<120&&dist3>3){el.classList.add('visible');el.style.left=x+'px';el.style.top=y+'px';}
    else el.classList.remove('visible');
  });
}

// ── OMBRE ─────────────────────────────────────────────────
const blob=new THREE.Mesh(new THREE.CircleGeometry(0.5,16),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:0.22,depthWrite:false}));
blob.rotation.x=-Math.PI/2;blob.position.y=0.012;scene.add(blob);

// ─────────────────────────────────────────────────────────
// BOUCLE PRINCIPALE
// ─────────────────────────────────────────────────────────
const SPEED=6,BOUND=WORLD-4;
const pp=new THREE.Vector3(0,0,8);
let pRot=0,cameraYaw=Math.PI;
const CD=8,CH=2.6,CLY=1.2,CL=4;
const clock=new THREE.Clock();
let time=0;

finishLoading();
renderMissions();

// Oscillation eau
const waterAnimTex=waterTex;

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.08);
  time+=dt;
  if(avatarMixer)avatarMixer.update(dt);

  // Eau animée
  waterAnimTex.offset.x=time*0.01;waterAnimTex.offset.y=time*0.008;
  waterMat.opacity=0.82+0.04*Math.sin(time*0.5);

  // Bateaux amarrés : léger tangage
  mooredBoats.forEach((b,i)=>{b.mesh.rotation.z=Math.sin(time*0.6+i)*0.03;b.mesh.position.y=-1.5+Math.sin(time*0.7+i)*0.12;});

  // Animations procédurales missions
  if(puddleZones.length){const pz=puddleZones[0];pz.ring1.material.opacity=0.2+0.2*Math.sin(time*2);pz.ring2.material.opacity=0.2+0.3*Math.sin(time*2.5+1);pz.ring1.scale.setScalar(1+0.06*Math.sin(time*1.5));pz.ring2.scale.setScalar(1+0.08*Math.sin(time*2+0.5));pz.arrow.rotation.y=time*2;pz.arrow.position.y=1.2+0.2*Math.sin(time*2);}
  if(missionZones.length){const sz=missionZones[0];sz.arrow.rotation.y=time*1.5;sz.arrow.position.y=1.5+0.25*Math.sin(time*1.8);sz.sewerCoins.forEach(c=>{if(!c.collected){c.mesh.rotation.z=time*2;c.mesh.position.y=-4+0.1*Math.sin(time*3+c.mesh.position.x);}});}
  if(wallPassZones.length&&!wallPassZones[0].treasureCollected){wallPassZones[0].treasure.rotation.y=time;}

  // Clignotement antennes
  scene.children.forEach(obj=>{if(obj.userData.blink){obj.material.emissiveIntensity=0.5+0.5*Math.sin(time*4+obj.userData.t||0);}});

  // Métro
  updateMetroTrain(dt);

  // Voitures GLB
  updateGLBCars(dt);
  // Voitures procédurales
  updateCars(dt);

  // Bateau pilotable
  if(inBoat){updateBoat(dt);setWalkSwap(false);}

  // INPUT CLAVIER
  let mx=joy.x,mz=-joy.y;
  if(keys['ArrowUp']  ||keys['w']||keys['W'])mz= 1;
  if(keys['ArrowDown']||keys['s']||keys['S'])mz=-1;
  if(keys['ArrowLeft']||keys['a']||keys['A'])mx=-1;
  if(keys['ArrowRight']||keys['d']||keys['D'])mx= 1;
  if(keys[' ']&&onGround&&!inBoat)doJump();
  if(camJoy.active&&Math.abs(camJoy.x)>0.04&&!inBoat)cameraYaw-=camJoy.x*2.2*dt;
  if(keys['q']||keys['Q'])cameraYaw+=1.8*dt;
  if(keys['e']||keys['E'])cameraYaw-=1.8*dt;

  const moving=Math.abs(mx)>0.05||Math.abs(mz)>0.05;
  if(moving&&emoteTimer){clearTimeout(emoteTimer);emoteTimer=null;}

  // DÉTECTION INTERACTIONS PROXIMITÉ
  if(!inBoat&&!inMetro&&!metroMenuOpen){
    // Bateau à monter
    const dBoat=Math.sqrt((pp.x-boatX)**2+(pp.z-boatZ)**2);
    // Station de métro proche
    const nearStation=METRO_STATIONS.find(s=>Math.sqrt((pp.x-s.x)**2+(pp.z-s.z)**2)<5);
    const nearBoatEntry=dBoat<8&&pp.y<3&&!inBoat;

    if(nearStation&&Math.abs(pp.y-METRO_ELEV)<3&&pp.y>METRO_ELEV-2){
      setInteractPrompt('🚇 Prendre le métro à '+nearStation.name,()=>{openMetroMenu(nearStation.id);clearInteractPrompt();});
    } else if(nearBoatEntry){
      setInteractPrompt('⛵ Monter sur le bateau',()=>{
        inBoat=true;boatX=playerBoat.position.x;boatZ=playerBoat.position.z;boatVel=0;
        document.getElementById('boat-hud').classList.add('show');clearInteractPrompt();
        showToast('⛵ Tu pilotes le bateau !','boat');addChat('⚓ Larguer les amarres !','Port');
        completeMission('boat','Tu as pris le contrôle du bateau dans la baie de Tokyo !');
      });
    } else clearInteractPrompt();
  }

  // ── PHYSIQUE ÉCHELLE ─────────────────────────────────
  if(!inBoat){
    const lz=ladderZones[0];
    const distLadder=Math.sqrt((pp.x-lz.x)**2+(pp.z-lz.z)**2);
    if(distLadder<1.5&&!isOnLadder&&mz>0.3){isOnLadder=true;ladderLX=lz.x;ladderLZ=lz.z;ladderTopY=lz.topY;showToast('🪜 Monte avec ↑');}
    if(isOnLadder){
      pp.x=ladderLX;pp.z=ladderLZ;onGround=false;jumpVel=0;
      if(mz>0.2)pp.y=Math.min(pp.y+4*dt,ladderTopY+0.2);
      else if(mz<-0.2)pp.y=Math.max(pp.y-4*dt,0);
      if(pp.y<=0.1){isOnLadder=false;pp.y=0;onGround=true;}
      if(pp.y>=ladderTopY-0.5){isOnLadder=false;onGround=true;pp.x=lz.platX;pp.z=lz.platZ;pp.y=ladderTopY+0.2;completeMission('ladder','Tu as grimpé jusqu\'au sommet du gratte-ciel !');updateMissionProgress('ladder',1);}
      setWalkSwap(false);
    } else if(!isInSewer&&!inBoat){
      if(moving){
        const sc=Math.sin(cameraYaw),cc=Math.cos(cameraYaw);
        const spd=isShrunk?SPEED*0.4:SPEED;
        const dx=(sc*(-mz)+cc*mx)*spd*dt,dz=(cc*(-mz)-sc*mx)*spd*dt;
        let nx=pp.x+dx,nz=pp.z+dz;
        if(!isShrunk){const res=resCol(nx,nz,pp.y);nx=res.x;nz=res.z;}
        pp.x=Math.max(-BOUND,Math.min(BOUND,nx));pp.z=Math.max(-BOUND,Math.min(BOUND,nz));
        pRot=Math.atan2(dx,dz);
        const tY=pRot+Math.PI;let diff=tY-cameraYaw;
        while(diff>Math.PI)diff-=2*Math.PI;while(diff<-Math.PI)diff+=2*Math.PI;
        cameraYaw+=diff*Math.min(CL*dt,1.0);
      }
      if(!onGround){jumpVel-=GR*dt;pp.y+=jumpVel*dt;if(pp.y<=0){pp.y=0;jumpVel=0;onGround=true;}}
      if(onGround&&!isOnLadder)setWalkSwap(moving);
    } else if(isInSewer){
      if(moving){
        const sc=Math.sin(cameraYaw),cc=Math.cos(cameraYaw);
        const dx=(sc*(-mz)+cc*mx)*SPEED*0.7*dt,dz=(cc*(-mz)-sc*mx)*SPEED*0.7*dt;
        pp.x=Math.max(-BOUND,Math.min(BOUND,pp.x+dx));pp.z=Math.max(-BOUND,Math.min(BOUND,pp.z+dz));
        pRot=Math.atan2(dx,dz);
        const tY=pRot+Math.PI;let diff=tY-cameraYaw;
        while(diff>Math.PI)diff-=2*Math.PI;while(diff<-Math.PI)diff+=2*Math.PI;
        cameraYaw+=diff*Math.min(CL*dt,1.0);
      }
      pp.y=sewerFloorY+0.1;onGround=true;jumpVel=0;setWalkSwap(moving);
      // Collecte capsules
      const sz2=missionZones[0];
      sz2.sewerCoins.forEach(c=>{if(!c.collected){const d2=Math.sqrt((pp.x-c.mesh.position.x)**2+(pp.z-c.mesh.position.z)**2);if(d2<1.2){c.collected=true;c.mesh.visible=false;sewerCoinsCollected++;showToast(`💚 Capsule ${sewerCoinsCollected}/5 !`,'mission');updateMissionProgress('sewer',sewerCoinsCollected);if(sewerCoinsCollected>=5)completeMission('sewer','Toutes les capsules collectées dans les égouts !');}}});
      if(Math.sqrt((pp.x-(-90))**2+(pp.z-(-70))**2)<2.5)exitSewer();
    }

    // DÉTECTION ZONES
    if(puddleZones.length){const pud=puddleZones[0];const dPud=Math.sqrt((pp.x-pud.x)**2+(pp.z-pud.z)**2);if(dPud<pud.r&&!isInSewer&&onGround&&!missions.find(x=>x.id==='puddle')?.done){missions.find(x=>x.id==='puddle').done=true;missions.find(x=>x.id==='puddle').progress=1;enterSewer();pp.x=-90;pp.z=-70;pp.y=sewerFloorY+0.1;showToast('🌊 Aspiré !','secret');renderMissions();}}
    if(wallPassZones.length){const wp=wallPassZones[0];const inZone=Math.abs(pp.x-wp.x)<wp.halfW+1&&Math.abs(pp.z-wp.z)<wp.halfD+0.8;if(inZone&&!isShrunk)enterShrink();if(!wp.treasureCollected){const dT=Math.sqrt((pp.x-(wp.x-8))**2+(pp.z-wp.z)**2);if(dT<1.5&&isShrunk){wp.treasureCollected=true;wp.treasure.visible=false;showToast('💎 Trésor secret !','mission');}}if(isShrunk&&Math.abs(pp.x-wp.x)>20)exitShrink();}
    if(missionZones.length){const sz2=missionZones[0];const dSewer=Math.sqrt((pp.x-sz2.entryX)**2+(pp.z-sz2.entryZ)**2);if(dSewer<2&&!isInSewer&&onGround){enterSewer();pp.y=sewerFloorY+0.1;}}
    if(sewerZones.length&&isInSewer){const sv=sewerZones[0];const dExit=Math.sqrt((pp.x-sv.exitX)**2+(pp.z-sv.exitZ)**2);if(dExit<2){exitSewer();pp.y=0.1;}if(!sv.coinCollected){const dCoin=Math.sqrt((pp.x-sv.coin.position.x)**2+(pp.z-sv.coin.position.z)**2);if(dCoin<1.5){sv.coinCollected=true;sv.coin.visible=false;showToast('🪙 Pièce secrète du tunnel !','mission');}}}
  }

  // POSITION AVATAR
  const scale=isShrunk?0.35:1;
  avatarGroup.scale.setScalar(scale);
  if(!inBoat){avatarGroup.position.set(pp.x,pp.y,pp.z);avatarGroup.rotation.y=pRot;}
  else{avatarGroup.position.set(boatX,5,boatZ);avatarGroup.rotation.y=boatRot;}
  blob.position.x=pp.x;blob.position.z=pp.z;blob.position.y=isInSewer?sewerFloorY+0.02:0.012;

  // CAMÉRA
  let camDist=inBoat?20:isShrunk?3:isInSewer?4:CD;
  let camH=inBoat?10:isShrunk?1:isInSewer?1.5:CH;
  let camLookY=inBoat?4:isShrunk?0.5:isInSewer?0.5:CLY;
  camera.position.set(pp.x+Math.sin(cameraYaw)*camDist,pp.y+camH,pp.z+Math.cos(cameraYaw)*camDist);
  camera.lookAt(pp.x,pp.y+camLookY,pp.z);

  // BULLE
  if(bubbleEl.style.opacity!=='0'){const v=new THREE.Vector3(pp.x,pp.y+2.3,pp.z).project(camera);bubbleEl.style.left=((v.x+1)/2*window.innerWidth)+'px';bubbleEl.style.top=((1-v.y)/2*window.innerHeight-44)+'px';}

  updateMarkers();
  renderer.render(scene,camera);
}
animate();
</script>
